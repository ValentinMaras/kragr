    _L`§Momentenlinien im Grundsystem`, _L`!M<sub>0</sub>: Parabeln mit Stich q · l² / 8${F1||F2?tt(' und Dreiecke F · l / 4 (Einzellast in Feldmitte)'):''} · M<sub>1</sub>: Dreieck mit dem Wert 1 über B`,
    _L`§Formänderungswerte mit der Koppeltafel (EI · δ)`, `EI · δ<sub>10</sub> = ∫ M<sub>0</sub> · M<sub>1</sub> dx = ${t10.join(' + ')} = ${f(R.d10,3)}`,
    _L`!Parabel × Dreieck (Spitze am Ende): ⅓ · l · i · k${F1||F2?tt(' · Dreieck (Spitze Mitte) × Dreieck (Spitze am Ende): ¼ · l · i · k'):''}`,
    `EI · δ<sub>11</sub> = ∫ M<sub>1</sub>² dx = ⅓ · ${f(l1)} · 1 · 1 + ⅓ · ${f(l2)} · 1 · 1 = ${f(R.d11,4)}`,
    _L`§Verträglichkeit: kein Knick über B`, `!δ<sub>10</sub> + X<sub>1</sub> · δ<sub>11</sub> = 0`, `X<sub>1</sub> = −δ<sub>10</sub> / δ<sub>11</sub> = −${f(R.d10,3)} / ${f(R.d11,4)} = ${f(R.X1)} kNm`,
    _L`!M<sub>B</sub> = ${f(R.X1)} kNm (Zug oben)`,
    _L`§Auflagerkräfte (Einfeldträger + Stützmoment)`, `A = (q<sub>1</sub> · l<sub>1</sub>)/2${F1?' + F<sub>1</sub>/2':''} + M<sub>B</sub>/l<sub>1</sub> = ${f(q1*l1/2+F1/2)} + (${f(R.X1)}) / ${f(l1)} = ${f(R.A)} kN`,
    `C = (q<sub>2</sub> · l<sub>2</sub>)/2${F2?' + F<sub>2</sub>/2':''} + M<sub>B</sub>/l<sub>2</sub> = ${f(q2*l2/2+F2/2)} + (${f(R.X1)}) / ${f(l2)} = ${f(R.C)} kN`,
    `B = ΣF − A − C = ${f(q1*l1+q2*l2+F1+F2)} − ${f(R.A)} − ${R.C<0?'('+f(R.C)+')':f(R.C)} = ${f(R.B)} kN`,
    `§Feldmomente`, _L`!Feld 1: max M = ${f(R.m1)} kNm bei x = ${f(R.x1)} m von A · Feld 2: max M = ${f(R.m2)} kNm bei x = ${f(R.x2)} m von C`]);
}

// ── Einflusslinien am Einfeldträger ──
function skEL(L,x0){
  const x1=40, W=320, X=x=>x1+x/L*W, t=x0/L; let o='';
  o+=beam(x1,x1+W,30)+supPin(x1,31)+supRoll(x1+W,31)+ln(X(x0),20,X(x0),40,SK.load,1,'stroke-dasharray="3 2"')+tl(X(x0),16,'x₀','middle',SK.load);
  const row=(y,pts,lab,vals)=>{ o+=`<path d="M ${R1(pts[0][0])} ${y} ${pts.map(p=>'L '+R1(p[0])+' '+R1(p[1])).join(' ')} L ${R1(pts[pts.length-1][0])} ${y} Z" fill="${SK.acc}" fill-opacity="0.12" stroke="none"/>`+pl(pts,SK.acc,1.3)+ln(x1,y,x1+W,y,SK.ink,0.7)+it(x1-8,y+4,lab,'end',SK.ink,12);
    vals.forEach(([x,yy,s,a])=>{ o+=tl(x,yy,s,a||'middle',SK.acc); }); };
  const k=34;
  row(66,[[X(0),66+k],[X(L),66]],'η<tspan font-size="8" dy="2">A</tspan>',[[X(0)+4,66+k-4,'1','start']]);
  row(150,[[X(0),150],[X(x0),150-t*k],[X(x0),150+(1-t)*k],[X(L),150]],'η<tspan font-size="8" dy="2">Q</tspan>',[[X(x0)+4,150+(1-t)*k+12,dS(1-t,2),'start'],[X(x0)-4,150-t*k-4,'−'+dS(t,2),'end']]);
  const em=x0*(L-x0)/L, km=k/Math.max(L/4,1e-9);
  row(206,[[X(0),206],[X(x0),206+em*km],[X(L),206]],'η<tspan font-size="8" dy="2">M</tspan>',[[X(x0),206+em*km+13,dS(em,3)+' m']]);
  return sv(400,262,tt('Einflusslinien A, Q(x₀), M(x₀) am Einfeldträger'), o);
}
function updateEL(){
  const out=document.getElementById('el-out'); if(!out) return;
  const L=num('el-L'), x0=num('el-x'), F=num('el-F')||0, q=num('el-q')||0, f=dS;
  if(!(L>0&&x0>=0&&x0<=L&&F>=0&&q>=0)){ out.innerHTML=tt('Bitte L > 0, 0 ≤ x₀ ≤ L und Lasten ≥ 0 eingeben.'); return; }
  const t=x0/L, em=x0*(L-x0)/L, Qp=F*(1-t)+q*(L-x0)**2/(2*L), Qn=-(F*t+q*x0*x0/(2*L)), Mm=F*em+q*em*L/2;
  out.innerHTML = ablauf(_L`Einfeldträger L = ${f(L)} m, Schnitt bei x₀ = ${f(x0)} m`, [
    _L`§Ordinaten der Einflusslinien`, _L`!A: Gerade von 1 (über A) bis 0 (über B) · Q(x₀): Sprung um 1 bei x₀ · M(x₀): Dreieck mit der Spitze unter x₀`,
    `η<sub>M,max</sub> = x₀ · (L − x₀) / L = ${f(x0)} · ${f(L-x0)} / ${f(L)} = ${f(em,3)} m`,
    `η<sub>Q</sub> = +(1 − x₀/L) = ${f(1-t,3)} rechts · −x₀/L = −${f(t,3)} links`,
    _L`§Größtes Moment M(x₀)`, _L`!Einzellast genau über x₀, Gleichlast über die ganze Länge (Fläche der Einflusslinie = η<sub>M,max</sub> · L / 2)`,
    `max M(x₀) = F · η<sub>M,max</sub> + q · η<sub>M,max</sub> · L / 2 = ${f(F)} · ${f(em,3)} + ${f(q)} · ${f(em,3)} · ${f(L)} / 2 = ${f(Mm)} kNm`,
    _L`§Größte Querkräfte Q(x₀)`, _L`!positiv: F knapp rechts von x₀, q nur rechts von x₀ · negativ: F knapp links, q nur links`,
    `max Q(x₀) = F · (1 − x₀/L) + q · (L − x₀)² / (2L) = ${f(Qp)} kN`, `min Q(x₀) = −F · x₀/L − q · x₀² / (2L) = ${f(Qn)} kN`,
    _L`!Bei Volllast wäre Q(x₀) = q · (L/2 − x₀)${F?tt(' (ohne F)'):''} = ${f(q*(L/2-x0))} kN — Teilbelastung ist hier ungünstiger`]);
  const fg=document.getElementById('el-fig'); if(fg) fg.innerHTML=fig(skEL(L,x0),tt('Eine Einzellast „1“ wandert über den Träger: Die Ordinate zeigt den Wert der Größe, wenn die Last dort steht.'));
}

// LASTANNAHMEN (ref v0.3.17): Schneeverwehung am Höhensprung, Windbereiche (Wände, Flachdach), Lastweiterleitung
// ══════════════════════════════════════════════════
const dL = (v,n=2) => deNum(Math.abs(v)<1e-12?0:v,n).replace(/^-/,'−');
// ── Schnee: Höhensprung (DIN EN 1991-1-3, 5.3.6) ──
const SN_MUW_MAX = 4.0, SN_MU2_MAX = 2.4, SN_GAMMA = 2.0;   // μ_w ≤ 4,0 (EN); NA: 0,8 ≤ μ2 = μ_s + μ_w ≤ 2,4
function hoehensprung(sk, h, b1, b2, aO){
  const muwRaw=(b1+b2)/(2*h), muwG=SN_GAMMA*h/sk, muw=Math.max(0.8, Math.min(muwRaw, muwG, SN_MUW_MAX));
  const mus = aO>15 ? 0.5*schneeMu1(aO) : 0, mu2=Math.max(0.8, Math.min(mus+muw, SN_MU2_MAX)), lsRaw=2*h, ls=Math.min(Math.max(lsRaw,5),15);
  return { muwRaw, muwG, muw, mus, mu2, lsRaw, ls, s1:0.8*sk, s2:mu2*sk, mu2b: b2<ls ? 0.8+(mu2-0.8)*(1-b2/ls) : null };
}
function skHoehensprung(R){
  const x0=30, xs=170, x1=400, yb=150, hU=60, k=40/Math.max(R.mu2,1);
  let o=poly([[x0,yb],[xs,yb],[xs,yb-hU-60],[x0,yb-hU-60]],SK.fill)+poly([[xs,yb],[x1,yb],[x1,yb-hU],[xs,yb-hU]],SK.fill);
  o+=tl((x0+xs)/2,yb-hU-30,tt('oberes Dach b₁'),'middle')+tl((xs+x1)/2+30,yb-20,tt('unteres Dach b₂'),'middle');
  const yr=yb-hU, lsPx=Math.min(R.ls/15*170+40, x1-xs-10);
  const P=[[xs,yr],[xs,yr-R.mu2*k],[xs+lsPx,yr-0.8*k],[x1,yr-0.8*k],[x1,yr]];
  o+=poly(P,'rgba(84,104,173,0.15)',SK.acc,1.2)+tl(xs+4,yr-R.mu2*k-4,`μ₂ = ${dL(R.mu2,2)}`,'start',SK.acc)+tl(x1-4,yr-0.8*k-4,'μ₁ = 0,8','end',SK.acc);
  o+=dimL(xs,yb-hU-60,xs,yr,'h',14)+dimL(xs,yr+14,xs+lsPx,yr+14,'l<tspan font-size="9" dy="3">s</tspan>',0);
  return sv(420,170,tt('Schneeverwehung am Höhensprung'), o);
}
function updateHS(){
  const out=document.getElementById('hs-out'); if(!out) return;
  const zone=valOf('hs-zone'), A=num('hs-A'), h=num('hs-h'), b1=num('hs-b1'), b2=num('hs-b2'), aO=num('hs-a')||0, f=dL;
  if(!(A>=0&&h>0&&b1>0&&b2>0&&aO>=0&&aO<90)){ out.innerHTML=tt('Bitte Höhen und Breiten > 0 eingeben.'); return; }
  const sk=schneeSk(zone,A), R=hoehensprung(sk,h,b1,b2,aO);
  out.innerHTML = ablauf(_L`Höhensprung h = ${f(h)} m, Zone ${zone}`, [
    _L`§Schneelast auf dem Boden`, _L`s<sub>k</sub> = ${f(sk,3)} kN/m² (Zone ${zone}, A = ${f(A,0)} m)`,
    `§Verwehungsanteil μ<sub>w</sub>`, `μ<sub>w</sub> = (b<sub>1</sub> + b<sub>2</sub>) / (2 · h) = (${f(b1)} + ${f(b2)}) / (2 · ${f(h)}) = ${f(R.muwRaw,3)}`,
    _L`!Grenze aus der Schneehöhe: μ<sub>w</sub> ≤ γ · h / s<sub>k</sub> = 2,0 · ${f(h)} / ${f(sk,3)} = ${f(R.muwG,3)} · Grenzen 0,8 ≤ μ<sub>w</sub> ≤ ${f(SN_MUW_MAX,1)} → μ<sub>w</sub> = ${f(R.muw,3)}`,
    _L`§Abrutschen vom oberen Dach μ<sub>s</sub>`, aO>15 ? `μ<sub>s</sub> = 0,5 · μ<sub>1</sub>(α = ${f(aO,0)}°) = 0,5 · ${f(schneeMu1(aO),3)} = ${f(R.mus,3)}` : _L`!oberes Dach α = ${f(aO,0)}° ≤ 15° → μ<sub>s</sub> = 0`,
    _L`§Formbeiwert am Höhensprung`, _L`μ<sub>2</sub> = μ<sub>s</sub> + μ<sub>w</sub> = ${f(R.mus,3)} + ${f(R.muw,3)} = ${f(R.mus+R.muw,3)} → NA: 0,8 ≤ μ<sub>2</sub> ≤ 2,4 → μ<sub>2</sub> = ${f(R.mu2,3)}`,
    _L`l<sub>s</sub> = 2 · h = ${f(R.lsRaw)} m → mit 5 m ≤ l<sub>s</sub> ≤ 15 m: ${f(R.ls)} m`,

    _L`s<sub>1</sub> = μ<sub>1</sub> · s<sub>k</sub> = 0,8 · ${f(sk,3)} = ${f(R.s1,3)} kN/m² ab l<sub>s</sub>, dazwischen linear`,
    ...(R.mu2b!==null?[_L`!unteres Dach kürzer als l<sub>s</sub>: am Dachrand μ = ${f(R.mu2b,3)} (Keil abgeschnitten)`]:[])]);
  const fg=document.getElementById('hs-fig'); if(fg) fg.innerHTML=fig(skHoehensprung(R),tt('Am Höhensprung sammelt sich Schnee aus Verwehung und vom oberen Dach abrutschendem Schnee.'));
}

// ── Wind: Bereiche nach EN 1991-1-4, 7.2 ──
const CPE_WAND = { // h/d: [A, B, C, D, E] je [cpe10, cpe1]
  5:[[-1.2,-1.4],[-0.8,-1.1],[-0.5,-0.5],[0.8,1.0],[-0.7,-0.7]], 1:[[-1.2,-1.4],[-0.8,-1.1],[-0.5,-0.5],[0.8,1.0],[-0.5,-0.5]], 0.25:[[-1.2,-1.4],[-0.8,-1.1],[-0.5,-0.5],[0.7,1.0],[-0.3,-0.3]] };
const CPE_FLACH = { F:[-1.8,-2.5], G:[-1.2,-2.0], H:[-0.7,-1.2], I:[0.2,0.2], Ineg:[-0.6,-0.6] };   // Bereich I nach DIN EN 1991-1-4/NA: +0,2 und −0,6 (EN: ±0,2)
const cpeA = (c10,c1,A) => A<=1 ? c1 : A>=10 ? c10 : c1-(c1-c10)*Math.log10(A);
function cpeWand(hd, i, A){ const L=[0.25,1,5], hdc=Math.min(Math.max(hd,0.25),5); let lo=0.25, hi=1; if(hdc>1){ lo=1; hi=5; }
  const t=(hdc-lo)/(hi-lo), v=k=>CPE_WAND[lo][i][k]+(CPE_WAND[hi][i][k]-CPE_WAND[lo][i][k])*t; return cpeA(v(0),v(1),A); }
function windZonen(b, d, h){
  const e=Math.min(b,2*h), W={ A: Math.min(e/5,d), B: Math.max(0,Math.min(e,d)-e/5), C: Math.max(0,d-e) };
  const D={ F_b:e/4, F_t:e/10, G_b:b-e/2, H_t:Math.max(0,Math.min(e/2,d)-e/10), I_t:Math.max(0,d-e/2) };
  return { e, W, D };
}
function skWindZonen(b,d,h,Z){
  const k=Math.min(240/b,150/d), x0=110, y0=58, X=x=>x0+x*k, Y=y=>y0+y*k, e=Z.e; let o='';
  // Dachdraufsicht, Wind von links (Wand der Breite b ist die linke Kante → im Bild senkrecht)
  // Hier: Wind von oben auf die Kante der Länge b (waagerecht), Tiefe d nach unten
  o+=poly([[X(0),Y(0)],[X(b),Y(0)],[X(b),Y(d)],[X(0),Y(d)]],'#fff');
  const zr=(x1,y1,x2,y2,c,lab)=>{ if(x2-x1<=1e-9||y2-y1<=1e-9) return ''; return `<rect x="${R1(X(x1))}" y="${R1(Y(y1))}" width="${R1((x2-x1)*k)}" height="${R1((y2-y1)*k)}" fill="${c}" stroke="${SK.ink}" stroke-width="0.6"/>`+tl(X((x1+x2)/2),Y((y1+y2)/2)+3,lab,'middle',SK.ink); };
  const t1=Math.min(e/10,d), t2=Math.min(e/2,d);
  o+=zr(0,0,e/4,t1,'#fecaca','F')+zr(b-e/4,0,b,t1,'#fecaca','F')+zr(e/4,0,b-e/4,t1,'#fed7aa','G')+zr(0,t1,b,t2,'#fef3c7','H')+zr(0,t2,b,d,'#ecfccb','I');
  for(let i=0;i<5;i++) o+=`<line x1="${R1(X(b*(0.15+0.17*i)))}" y1="${R1(Y(0)-30)}" x2="${R1(X(b*(0.15+0.17*i)))}" y2="${R1(Y(0)-6)}" stroke="${SK.load}" stroke-width="1.3" marker-end="url(#ska)"/>`;
  o+=tl(X(0)-6,Y(0)-18,tt('Wind'),'end',SK.load);
  // Seitenwand links: A, B, C entlang d
  const wx=X(0)-34; const wz=(y1,y2,c,lab)=> y2-y1<=1e-9?'' : `<rect x="${R1(wx)}" y="${R1(Y(y1))}" width="16" height="${R1((y2-y1)*k)}" fill="${c}" stroke="${SK.ink}" stroke-width="0.6"/>`+tl(wx-4,Y((y1+y2)/2)+3,lab,'end',SK.ink);
  const a1=Math.min(e/5,d), a2=Math.min(e,d); o+=wz(0,a1,'#fecaca','A')+wz(a1,a2,'#fed7aa','B')+wz(a2,d,'#ecfccb','C');
  o+=tl(wx+8,Y(d)+14,tt('Seitenwand'),'middle',SK.dim)+tl(X(b/2),Y(0)-34,'D (Luv)','middle',SK.dim)+tl(X(b/2),Y(d)+14,'E (Lee)','middle',SK.dim);
  o+=dimL(X(0),Y(d)+22,X(b),Y(d)+22,'b',0)+dimL(X(b)+18,Y(0),X(b)+18,Y(d),'d',0);
  return sv(420,Math.round(Y(d)+44),tt('Windbereiche: Draufsicht Flachdach und Seitenwand'), o);
}
function updateWB(){

    + textTable([tt('Flachdach'), ...cf.map(c=>c[0])], [['c<sub>pe</sub>', ...cf.map(c=>c[0]==='I'?'+0,20 / −0,60':f(c[1],2))], ['w<sub>e</sub> [kN/m²]', ...cf.map(c=>c[0]==='I'?'+'+f(0.2*q,3)+' / '+f(-0.6*q,3):f(c[1]*q,3))]])
    + _L`<div class="legend">Wände A–E nach Tab. 7.1, Flachdach mit scharfkantigem Traufbereich nach Tab. 7.2. Zusätzlich Innendruck c<sub>pi</sub> = +0,2 oder −0,3 ungünstig überlagern.</div>`;
  const fg=document.getElementById('wb-fig'); if(fg) fg.innerHTML=fig(skWindZonen(b,d,h,Z),tt('Am Luv-Rand und an den Ecken ist der Sog am größten (F, A). Die Bereichsgrößen hängen von e = min(b; 2h) ab.'));

// ── Lastweiterleitung: Innenwand unter Zweifelddecken ──
function lastAbtrag(I){
  const { l1, l2, n } = I, k = (l1+l2)/2;
  const MB=-(l1**3+l2**3)/(8*(l1+l2)), fB=(l1+l2)/2-MB/l1-MB/l2;        // Auflagerkraft Mittelwand je 1 kN/m² (Durchlaufwirkung)
  const fak = I.dlt ? fB : k;
  const Ng=n*I.g*fak+I.gD*fak+n*I.gW, Nq=n*I.q*fak, Ns=I.s*fak;
  const Nd_q=1.35*Ng+1.5*Nq+1.5*0.5*Ns, Nd_s=1.35*Ng+1.5*Ns+1.5*0.7*Nq;
  return { k, MB, fB, fak, Ng, Nq, Ns, Nd_q, Nd_s, Nd:Math.max(Nd_q,Nd_s) };
}
function skLastabtrag(n){
  const x0=60, x1=380, xm=200, hS=34, yb=40+(n+1)*hS; let o='';
  for(let i=0;i<=n;i++){ const y=40+i*hS; o+=`<rect x="${x0}" y="${y}" width="${x1-x0}" height="6" fill="${SK.db||'#cbd5e1'}" stroke="${SK.ink}" stroke-width="0.8"/>`;

// Datentabelle. Zeile antippen = markieren (hilft beim Ablesen breiter Tabellen).
function dataTable(data){
  let head = '<tr>' + data.cols.map(c=>`<th>${c}</th>`).join('') + '</tr>';
  if(data.units){
    head += '<tr>' + data.units.map(u=>`<th style="font-weight:400;color:var(--text3);font-size:10px">${u}</th>`).join('') + '</tr>';
  }
  const body = data.rows.map(r=>'<tr>' + r.map(c=>`<td>${typeof c==='number' ? String(c).replace('.',',') : c}</td>`).join('') + '</tr>').join('');
  return _L`<div class="data-table-wrap"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="table-hint">Zeile antippen zum Markieren${data.cols.length>5 ? ' · waagerecht scrollbar' : ''}</div>`;
}
// Einfache Texttabelle (Formeln, Grenzwerte)
function textTable(cols, rows){
  // Lange Texte in den hinteren Spalten → umbrechen und linksbündig statt waagerecht scrollen
  const plain = c => String(c).replace(/<[^>]*>/g,'');
  const wrap = rows.some(r => r.slice(1).some(c => plain(c).length > 26));
  return `<div class="data-table-wrap"><table class="data text-cols${wrap?' text-table':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`
    + (cols.length>=5 && !wrap ? '<div class="table-hint">waagerecht scrollbar</div>' : '');
}

      <div class="norm-note">

  // ── GZG → Schwingungen ───────────────────────────
  // v0.1.1: Die Frequenzbereiche waren vertauscht. Unter 8 Hz ist eine Sonderuntersuchung nötig,
  //         die Kriterien Steifigkeit und Schwinggeschwindigkeit gelten für f1 > 8 Hz.
  'holzbau/gzg/schwingung': () => `
    <div class="card">
      <div class="card-title">Schwingungsnachweis für Wohnungsdecken — EN 1995-1-1, 7.3.3</div>
      <div class="section-note">
        Holzdecken sind leicht und relativ weich. Schwingungen durch gehende
        Personen können den Komfort stören. Entscheidend ist zuerst die Eigenfrequenz:
      </div>
      ${textTable(['Eigenfrequenz','Vorgehen'], [
        ['f₁ > 8 Hz','Nachweis mit Steifigkeits- und Geschwindigkeitskriterium (Punkte 2 und 3)'],
        ['f₁ ≤ 8 Hz','Sonderuntersuchung nötig (Kriterien unten nicht anwendbar)'],
      ])}
      <div class="norm-note">
        Der deutsche NA regelt den Schwingungsnachweis abweichend (eigene Frequenzgrenzen
        und Kriterien). Für Nachweise in Deutschland den NA heranziehen.
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Eigenfrequenz</div>
      <div class="formula-box">
        f<sub>1</sub> = (π / 2ℓ²) · √( (EI)<sub>ℓ</sub> / m )&nbsp;&nbsp;[Hz]
        <div class="comment">(EI)<sub>ℓ</sub> — Biegesteifigkeit in Spannrichtung je Meter Breite [Nm²/m]<br>
        m — Masse je Flächeneinheit [kg/m²] · ℓ — Spannweite [m]<br>
        Gilt für die frei drehbar gelagerte Einfelddecke.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. Steifigkeitskriterium (f₁ > 8 Hz)</div>
      <div class="section-note">
        Die größte Durchbiegung unter einer Einzellast F = 1 kN wird begrenzt:
      </div>
      <div class="formula-box">
        w / F ≤ a&nbsp;&nbsp;[mm/kN]
        <div class="comment">Grenzwert a je nach gewünschtem Schwingverhalten (EN 1995-1-1, Bild 7.2).</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">3. Schwinggeschwindigkeit (f₁ > 8 Hz)</div>
      <div class="section-note">
        Die Antwort der Decke auf einen Fußtritt-Impuls (1 Ns) wird begrenzt:
      </div>
      <div class="formula-box">
        v ≤ b<sup>(f₁·ζ − 1)</sup>&nbsp;&nbsp;[m/(Ns²)]
        <div class="comment">b folgt aus a (EN 1995-1-1, Bild 7.2) · ζ — modaler Dämpfungsgrad (üblich 0,01)</div>
      </div>
    </div>
  `,

  // ── GZT → Knicken ────────────────────────────────
  'holzbau/gzt/knicken': () => `
    <div class="card">
      <div class="card-title">Knicknachweis für Druckstäbe — EN 1995-1-1, 6.3.2</div>
      <div class="section-note">
        Schlanke Druckstäbe versagen durch Ausknicken, bevor die Druckfestigkeit
        erreicht ist. Der Nachweis erfolgt mit dem Knickbeiwert k<sub>c</sub>.
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Schlankheit</div>
      <div class="formula-box">
        λ = ℓ<sub>ef</sub> / i&nbsp;&nbsp;&nbsp; mit&nbsp; i = √(I / A)<br><br>
        bezogene Schlankheit:<br>
        λ<sub>rel</sub> = (λ / π) · √( f<sub>c,0,k</sub> / E<sub>0,05</sub> )
        <div class="comment">ℓ<sub>ef</sub> — Knicklänge (abhängig von der Lagerung, siehe unten)<br>
        i — Trägheitsradius des Querschnitts</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. Knickbeiwert k_c</div>
      <div class="formula-box">
        k = 0,5 · (1 + β<sub>c</sub>·(λ<sub>rel</sub> − 0,3) + λ<sub>rel</sub>²)<br><br>
        k<sub>c</sub> = 1 / (k + √(k² − λ<sub>rel</sub>²))
        <div class="comment">β<sub>c</sub> = 0,2 für Vollholz · 0,1 für BSH und LVL<br>
        Bei λ<sub>rel</sub> ≤ 0,3 ist kein Knicknachweis nötig (k<sub>c</sub> = 1).</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">3. Nachweis</div>

  'baustatik/arbeitssatz/pvk': () => _L`

  'baustatik/balkentafeln/einflusslinien': () => _L`
    <div class="card">
      <div class="card-title">Einflusslinien — wandernde Lasten</div>
      <div class="section-note">Eine Einflusslinie zeigt, wie groß eine bestimmte Größe (Auflagerkraft, Querkraft oder Moment an <b>einer festen Stelle</b> x₀) wird, wenn eine Einzellast „1“ an der Stelle x steht. Sie beantwortet die Frage: Wo muss die Verkehrslast stehen, damit die Größe am größten wird?</div>

        Einfeldträger:&nbsp; η<sub>A</sub> = 1 − x/L&nbsp;&nbsp;&nbsp; η<sub>M</sub>(x₀) = Dreieck mit max x₀ · (L − x₀) / L&nbsp;&nbsp;&nbsp; η<sub>Q</sub>(x₀) springt bei x₀ um 1
        <div class="comment">Kinematische Konstruktion (Müller-Breslau): Die Einflusslinie ist die Biegelinie, wenn man an der gesuchten Stelle die Bindung löst (Gelenk für M, Querkraftgelenk für Q) und dort eine Verschiebung bzw. Verdrehung „1“ aufbringt.</div>
      </div>
      <div class="info-banner">Die Gleichlast nur dort ansetzen, wo die Einflusslinie das gewünschte Vorzeichen hat. Für die Querkraft in Feldmitte ist eine halbseitige Belastung ungünstiger als die Volllast.</div>

      <div id="el-fig"></div>
    </div>
  `,

  'baustatik/arbeitssatz/kraftgroessen': () => _L`

  'mauerwerk/bemessung/knicklaenge': () => _L`

  'bauphysik/waerme/grundlagen': () => _L`

        Wärmedurchgangswiderstand:&nbsp; R<sub>T</sub> = R<sub>si</sub> + Σ d<sub>i</sub>/λ<sub>i</sub> + R<sub>se</sub>&nbsp;&nbsp;&nbsp; U = 1 / R<sub>T</sub>&nbsp;&nbsp; [W/(m²K)]<br>
        Wärmestromdichte:&nbsp; q = U · (θ<sub>i</sub> − θ<sub>e</sub>)&nbsp;&nbsp;&nbsp; Temperatursprung je Schicht:&nbsp; Δθ<sub>j</sub> = q · R<sub>j</sub><br>
        Transmissionswärmeverlust:&nbsp; H<sub>T</sub> = Σ U<sub>i</sub> · A<sub>i</sub> + ΔU<sub>WB</sub> · ΣA&nbsp;&nbsp; [W/K]
        <div class="comment">λ — Wärmeleitfähigkeit (Bemessungswert) · R<sub>si</sub>, R<sub>se</sub> — Wärmeübergangswiderstände innen und außen (Luftschicht an der Oberfläche)</div>
      </div>

    </div>

      <div class="card-title">Baustoffkennwerte</div>

      <div class="legend">Bemessungswerte nach DIN 4108-4 bzw. DIN EN ISO 10456 (Anhaltswerte). Dämmstoffe: λ aus der Wärmeleitstufe (WLS 035 → λ = 0,035). Im Projekt gelten die Werte der Zulassung bzw. Leistungserklärung. μ ist die Wasserdampf-Diffusionswiderstandszahl (s<sub>d</sub> = μ · d).</div>

  'bauphysik/schall/grundlagen': () => _L`

        Schalldämmmaß:&nbsp; R = L<sub>1</sub> − L<sub>2</sub> + 10 · lg(S / A)&nbsp;&nbsp;&nbsp; R′ (mit Apostroph): im Bau, mit Flankenübertragung
        <div class="comment">Luftschall: Wände und Decken sollen ein großes R′<sub>w</sub> haben. Trittschall: der Pegel L′<sub>n,w</sub> unter der Decke soll klein sein.</div>

        <div class="comment">L<sub>a</sub> — maßgeblicher Außenlärmpegel aus Straßen-, Schienen- und Gewerbelärm. R′<sub>w,ges</sub> gilt für die ganze Fassade aus Wand, Fenster und Rollladenkasten.</div>

    </div>
  `,

  'bauphysik/schall/trittschall': () => _L`

        '!I<sub>w</sub> = t<sub>f</sub> · b³ · (h − t<sub>f</sub>)² / 24',

  'mathematik/geometrie/trigonometrie': () => _L`

      <div class="sk-row">${fig(skRechtwinklig())}${fig(skEinheitskreis())}</div>
      <div class="formula-box">
        sin α = a / c&nbsp;&nbsp;&nbsp; cos α = b / c&nbsp;&nbsp;&nbsp; tan α = a / b<br>

      </div>
      ${textTable(['α','0°','30°','45°','60°','90°'], [

      <div class="card-title">Beliebiges Dreieck</div>
      <div class="formula-box">

  'wasserbau/hydrodynamik/rohr': () => _L`

  'stahlbeton/bemessung/biegung': () => _L`
    <div class="card">
      <div class="card-title">Prinzip der Biegebemessung</div>
      ${figBiegung()}
      <div class="section-note">Der Beton nimmt den Druck, der Betonstahl den Zug. Gesucht ist die Bewehrung, bei der das
        innere Kräftepaar F<sub>cd</sub> · z dem Moment standhält. Ohne Normalkraft gilt M<sub>Eds</sub> = M<sub>Ed</sub>.</div>
    </div>
    <div class="card">
      <div class="card-title">Bemessung mit dem ω-Verfahren (Rechteck, ohne Druckbewehrung)</div>
      <div class="formula-box">
        1.&nbsp; μ<sub>Eds</sub> = M<sub>Eds</sub> / (b · d² · f<sub>cd</sub>)<br>
        2.&nbsp; ω, ξ, ζ aus der Tabelle (μ<sub>Eds</sub> ≤ μ<sub>lim</sub> = 0,296)<br>
        3.&nbsp; A<sub>s1</sub> = ω · b · d · f<sub>cd</sub> / f<sub>yd</sub>&nbsp;&nbsp;(+ N<sub>Ed</sub> / f<sub>yd</sub> bei Normalkraft)
        <div class="comment">d — statische Nutzhöhe (Abstand Druckrand bis Schwerpunkt der Zugbewehrung) · ξ = x/d · ζ = z/d<br>
        μ<sub>lim</sub> gehört zu ξ = 0,45: Bis dahin verformt sich der Querschnitt duktil, darüber Druckbewehrung oder größerer Querschnitt.</div>
      </div>
      ${textTable(['μ_Eds','ω','ξ','ζ','ε_c [‰]','ε_s [‰]'], (()=>{ const r=[]; for(let i=1;i<=29;i++){ const st=biegeAusMu(i/100); r.push([deNum(i/100,2), deNum(st.omega,4), deNum(st.xi,3), deNum(st.zeta,3), deNum(-st.ec,2), deNum(st.es,1)]); } return r; })())}
      <div class="legend">Berechnet mit dem Parabel-Rechteck-Diagramm (C12/15 bis C50/60), B500 mit horizontalem Ast, ε<sub>s</sub> ≤ 25 ‰.
        Tabellen mit ansteigendem Stahlast liefern bei großem μ etwas kleinere ω (sichere Seite hier).</div>
    </div>
    <div class="card">
      <div class="card-title">Druckbewehrung (μ<sub>Eds</sub> > μ<sub>lim</sub>)</div>
      <div class="section-note">Reicht die Betondruckzone nicht, hält man die Nulllinie bei ξ = 0,45 fest und legt das restliche Moment
        Δμ auf ein Stahl-Kräftepaar aus Druckbewehrung A<sub>s2</sub> (oben) und zusätzlicher Zugbewehrung (unten) mit dem Hebelarm d − d₂.</div>
      <div class="formula-box">
        Δμ = μ<sub>Eds</sub> − μ<sub>lim</sub>&nbsp;&nbsp;(μ<sub>lim</sub> = 0,296, ω<sub>lim</sub> = 0,364)<br>
        A<sub>s1</sub> = (ω<sub>lim</sub> + Δμ / (1 − d₂/d)) · b·d·f<sub>cd</sub> / f<sub>yd</sub><br>
        A<sub>s2</sub> = Δμ / (1 − d₂/d) · b·d·f<sub>cd</sub> / σ<sub>s2</sub>&nbsp;&nbsp;mit&nbsp; ε<sub>s2</sub> = 3,5 ‰ · (ξ − d₂/d) / ξ
        <div class="comment">σ<sub>s2</sub> = f<sub>yd</sub>, solange d₂/d ≤ 0,17 (ε<sub>s2</sub> ≥ 2,17 ‰). Druckstäbe mit Bügeln gegen Ausknicken sichern (Abstand ≤ 12·Ø).</div>
      </div>
    </div>

      <div class="card-title">Biegebemessung Rechteckquerschnitt</div>

        ${field(tt('Breite b [cm]'), inp('bg-b', 30, 'updateBiegung()'))}

        ${field('M<sub>Ed</sub> [kNm]', inp('bg-M', 250, 'updateBiegung()'))}
        ${field(tt('Randabstand Druckbewehrung d₂ [cm]'), inp('bg-d2', 5, 'updateBiegung()'))}

        A<sub>s,min</sub> = f<sub>ctm</sub> · W<sub>c</sub> / (f<sub>yk</sub> · 0,9·d) mit W<sub>c</sub> = b·h²/6. Höchstbewehrung: A<sub>s</sub> ≤ 0,08·A<sub>c</sub> (auch im Stoßbereich).</div>
    </div>

  'stahlbeton/bemessung/querkraft': () => _L`

    </div>
    <div class="card">
      <div class="card-title">Guter und mäßiger Verbund</div>
      <div class="section-note">
        <b>Guter Verbund</b>: Stäbe mit 45° … 90° zur Waagerechten und waagerechte Stäbe in Bauteilen bis 300 mm Höhe
        sowie in dickeren Bauteilen in der unteren Hälfte bzw. mehr als 300 mm unter der Oberseite.<br>
        <b>Mäßiger Verbund</b>: alle anderen — typisch die obere Bewehrung dicker Decken und Balken, weil sich unter den Stäben
        beim Betonieren Wasser und Luft sammeln.
      </div>
    </div>
    <div class="card">
      <div class="card-title">Bemessungswert der Verankerungslänge</div>
      <div class="formula-box">
        l<sub>bd</sub> = α<sub>1</sub> · α<sub>2</sub> · α<sub>3</sub> · α<sub>4</sub> · α<sub>5</sub> · l<sub>b,rqd</sub> · (A<sub>s,erf</sub> / A<sub>s,vorh</sub>) ≥ l<sub>b,min</sub><br>
        l<sub>b,min</sub> = max { 0,3 · l<sub>b,rqd</sub> ;&nbsp; 10·Ø ;&nbsp; 100 mm }&nbsp;&nbsp;(Zugstab)
        <div class="comment">α<sub>1</sub> = 0,7 für Haken, Winkelhaken und Schlaufen (Betondeckung senkrecht zur Krümmungsebene ≥ 3·Ø), sonst 1,0 ·
        α<sub>2</sub> … α<sub>5</sub> vereinfacht 1,0 (sichere Seite)</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Verankerungslänge berechnen</div>
      <div class="calc-grid">
        ${field(tt('Beton'), betonSel('va-c', 'C25/30', 'updateVerankerung()'))}
        ${field('Ø [mm]', inp('va-ds', 16, 'updateVerankerung()'))}
        ${field(tt('Verbund'), sel('va-v', [['gut','gut'],['maessig',tt('mäßig')]], 'gut', 'updateVerankerung()'))}
        ${field('σ<sub>sd</sub> [N/mm²]', inp('va-s', 435, 'updateVerankerung()'))}
      </div>
      <div class="calc-out" id="va-out"></div>
    </div>
  `,

  'stahlbeton/gzg/schlankheit': () => _L`
    <div class="card">
      <div class="card-title">Begrenzung der Biegeschlankheit — DIN EN 1992-1-1/NA, 7.4.2</div>

        die Schlankheit l/d begrenzen. Das ist der schnellste Weg zur erforderlichen Deckendicke.</div>
      <div class="formula-box">
        allgemein:&nbsp; l / d ≤ K · 35<br>
        mit leichten Trennwänden (Schadensgefahr):&nbsp; l / d ≤ K² · 150 / l&nbsp;&nbsp;(l in m)
        <div class="comment">l — Stützweite (bei Kragträgern die Kraglänge) · d — statische Nutzhöhe</div>
      </div>

  'stahlbeton/bemessung/plattenbalken': () => _L`
    <div class="card">
      <div class="card-title">Mitwirkende Plattenbreite — EN 1992-1-1, 5.3.2.1</div>
      <div class="section-note">Bei Balken, die mit einer Decke verbunden sind, wirkt ein Teil der Platte als Druckgurt mit.
        Wie breit, hängt vom Abstand der Momentennullpunkte l<sub>0</sub> ab.</div>
      <div class="formula-box">
        b<sub>eff</sub> = Σ b<sub>eff,i</sub> + b<sub>w</sub> ≤ b<br>
        b<sub>eff,i</sub> = 0,2·b<sub>i</sub> + 0,1·l<sub>0</sub> ≤ 0,2·l<sub>0</sub>&nbsp; und&nbsp; ≤ b<sub>i</sub>
        <div class="comment">b<sub>w</sub> — Stegbreite · b<sub>i</sub> — halber lichter Abstand zum Nachbarsteg (bzw. Plattenüberstand am Rand)</div>
      </div>
      ${fig(skPlattenbalken())}
      ${textTable([tt('Bereich'),'l_0'], [
        [tt('Einfeldträger'),'l'],
        [tt('Endfeld eines Durchlaufträgers'),'0,85·l₁'],
        [tt('Innenfeld'),'0,70·l₂'],
        [tt('über der Innenstütze'),'0,15·(l₁ + l₂)'],
        [tt('Kragarm (an der Stütze)'),'0,15·l₂ + l₃'],
      ])}
      <div class="legend">Gilt für Durchlaufträger mit ähnlichen Stützweiten (Verhältnis benachbarter Felder 2/3 … 1,5) und Kragarm ≤ halbes Nachbarfeld.</div>
    </div>
    <div class="card">
      <div class="card-title">Bemessung für positive Momente (Platte gedrückt)</div>
      <div class="section-note">
        <b>Fall 1 — Nulllinie in der Platte</b> (x ≤ h<sub>f</sub>): Der Querschnitt wirkt wie ein Rechteck der Breite b<sub>eff</sub>.
        Bemessung mit dem ω-Verfahren, μ<sub>Eds</sub> mit b<sub>eff</sub>.<br>
        <b>Fall 2 — Nulllinie im Steg</b> (x > h<sub>f</sub>): Bei breiten Gurten (b<sub>eff</sub>/b<sub>w</sub> ≥ 5) darf man die Druckkraft
        in Plattenmitte annehmen und den Steg vernachlässigen:
      </div>
      <div class="formula-box">
        A<sub>s</sub> = M<sub>Eds</sub> / ((d − h<sub>f</sub>/2) · f<sub>yd</sub>)&nbsp;&nbsp; mit Kontrolle&nbsp; σ<sub>cd</sub> = M<sub>Eds</sub> / ((d − h<sub>f</sub>/2) · b<sub>eff</sub> · h<sub>f</sub>) ≤ f<sub>cd</sub>
      </div>
      <div class="info-banner">Bei negativen Momenten (über der Stütze) liegt die Platte in der Zugzone: Dann rechnet man ein Rechteck mit der
        Stegbreite b<sub>w</sub> und verteilt die Zugbewehrung über die mitwirkende Breite.</div>

      <div class="card-title">Plattenbalken berechnen</div>

        ${field(tt('Stegbreite b<sub>w</sub> [cm]'), inp('pb-bw', 30, 'updatePlattenbalken()'))}
        ${field(tt('Plattenüberstand b₁ [cm]'), inp('pb-b1', 135, 'updatePlattenbalken()'))}
        ${field(tt('Plattenüberstand b₂ [cm]'), inp('pb-b2', 135, 'updatePlattenbalken()'))}
        ${field(tt('Plattendicke h<sub>f</sub> [cm]'), inp('pb-hf', 18, 'updatePlattenbalken()'))}
        ${field(tt('Gesamthöhe h [cm]'), inp('pb-h', 60, 'updatePlattenbalken()'))}
        ${field(tt('Randabstand d₁ [cm]'), inp('pb-d1', 6, 'updatePlattenbalken()'))}
        ${field(tt('Stützweite l [m]'), inp('pb-l', 7.5, 'updatePlattenbalken()'))}
        ${field(tt('Bereich'), sel('pb-l0', [['1',tt('Einfeldträger (l₀ = l)')],['0.85',tt('Endfeld (0,85·l)')],['0.7',tt('Innenfeld (0,70·l)')]], '1', 'updatePlattenbalken()'))}
        ${field(tt('Beton'), betonSel('pb-c', 'C30/37', 'updatePlattenbalken()'))}
        ${field('M<sub>Ed</sub> [kNm]', inp('pb-M', 450, 'updatePlattenbalken()'))}
      </div>
      <div class="calc-out" id="pb-out"></div>
    </div>
  `,

  'stahlbeton/bemessung/durchstanzen': () => _L`
    <div class="card">
      <div class="card-title">Was ist Durchstanzen?</div>
      <div class="section-note">Bei Flachdecken ohne Unterzüge konzentriert sich die Stützenlast auf eine kleine Fläche. Versagt die Decke,
        stanzt die Stütze einen kegelförmigen Bruchkörper aus der Platte — schlagartig und ohne Vorankündigung. Nachgewiesen wird
        die Schubspannung in einem <b>kritischen Rundschnitt u<sub>1</sub></b> im Abstand 2,0·d vom Stützenrand.</div>
      <div class="formula-box">
        v<sub>Ed</sub> = β · V<sub>Ed</sub> / (u<sub>1</sub> · d)&nbsp;&nbsp; mit&nbsp; d = (d<sub>x</sub> + d<sub>y</sub>) / 2<br>
        Rechteckstütze c<sub>x</sub> × c<sub>y</sub>:&nbsp; u<sub>1</sub> = 2·(c<sub>x</sub> + c<sub>y</sub>) + 2·π·2d&nbsp;&nbsp;·&nbsp;&nbsp;Rundstütze D:&nbsp; u<sub>1</sub> = π·(D + 4d)
      </div>
      ${fig(skRundschnitt(),tt('Draufsicht Innenstütze: u<sub>1</sub> verläuft im Abstand 2d um die Stütze, an den Ecken als Viertelkreis.'))}
      ${textTable([tt('Lage der Stütze'),'β (vereinfacht, DE NA)'], DS_BETA.map(([b,t])=>[t, deNum(+b,2)]))}
      <div class="legend">β erfasst die ungleichmäßige Schubverteilung aus Momenten. Die vereinfachten Werte gelten für unverschiebliche Systeme
        mit Stützweitenverhältnis 0,8 ≤ l₁/l₂ ≤ 1,25. Bei Rand- und Eckstützen wird u<sub>1</sub> nur über die Plattenseite geführt
        (Rand: halber Kreisbogen π·2d, Ecke: Viertelkreis π·d).</div>
    </div>
    <div class="card">
      <div class="card-title">Widerstand ohne Durchstanzbewehrung — DIN EN 1992-1-1/NA, 6.4.4</div>
      <div class="formula-box">
        v<sub>Rd,c</sub> = C<sub>Rd,c</sub> · k · (100 · ρ<sub>l</sub> · f<sub>ck</sub>)<sup>1/3</sup> + 0,1·σ<sub>cp</sub> ≥ v<sub>min</sub> + 0,1·σ<sub>cp</sub>
        <div class="comment">Flachdecke: C<sub>Rd,c</sub> = 0,18/γ<sub>c</sub> · Innenstütze mit u<sub>0</sub>/d < 4: C<sub>Rd,c</sub> = 0,18/γ<sub>c</sub> · (0,1·u<sub>0</sub>/d + 0,6)<br>
        Fundamente und Bodenplatten: C<sub>Rd,c</sub> = 0,15/γ<sub>c</sub> (Bodenpressung innerhalb des Rundschnitts darf abgezogen werden)<br>
        k = 1 + √(200/d) ≤ 2,0 · ρ<sub>l</sub> = √(ρ<sub>lx</sub>·ρ<sub>ly</sub>) ≤ min(0,02; 0,5·f<sub>cd</sub>/f<sub>yd</sub>) · v<sub>min</sub> wie bei der Querkraft</div>
      </div>
      ${textTable([tt('Ergebnis'),tt('Folge')], [
        ['v_Ed ≤ v_Rd,c',tt('keine Durchstanzbewehrung nötig')],
        ['v_Rd,c < v_Ed ≤ 1,4·v_Rd,c',tt('Durchstanzbewehrung (Bügel oder Dübelleisten mit Zulassung)')],
        ['v_Ed > 1,4·v_Rd,c',tt('nicht ausführbar: Decke dicker, Stütze größer oder Stützenkopf')],
      ])}
    </div>
    <div class="card">
      <div class="card-title">Durchstanznachweis Flachdecke</div>
      <div class="calc-grid">
        ${field(tt('Stützenform'), sel('ds-form', [['rechteck',tt('Rechteck')],['rund','rund']], 'rechteck', 'updateDurchstanzen()'))}
        ${field(tt('Lage'), sel('ds-beta', DS_LAGE.map(([b,t])=>[b, t+' (β = '+deNum(+b,2)+')']), '1.10', 'updateDurchstanzen()'))}
        ${field(tt('c<sub>x</sub> bzw. D [cm]'), inp('ds-cx', 40, 'updateDurchstanzen()'))}
        <div class="ds-rect">${field('c<sub>y</sub> [cm]', inp('ds-cy', 40, 'updateDurchstanzen()'))}</div>
        ${field('d<sub>x</sub> [cm]', inp('ds-dx', 21, 'updateDurchstanzen()'))}
        ${field('d<sub>y</sub> [cm]', inp('ds-dy', 19.5, 'updateDurchstanzen()'))}
        ${field('ρ<sub>lx</sub> [%]', inp('ds-rx', 0.8, 'updateDurchstanzen()'))}
        ${field('ρ<sub>ly</sub> [%]', inp('ds-ry', 0.8, 'updateDurchstanzen()'))}
        ${field(tt('Beton'), betonSel('ds-c', 'C30/37', 'updateDurchstanzen()'))}
        ${field('V<sub>Ed</sub> [kN]', inp('ds-V', 600, 'updateDurchstanzen()'))}
      </div>
      <div class="calc-out" id="ds-out"></div>
      <div class="norm-note">ρ<sub>l</sub> ist die Biegezugbewehrung (oben) im Bereich Stützenbreite + 3·d je Seite.
        Randstütze: freier Rand parallel zu c<sub>y</sub>, u<sub>1</sub> = 2·c<sub>x</sub> + c<sub>y</sub> + π·2d · Eckstütze: u<sub>1</sub> = c<sub>x</sub> + c<sub>y</sub> + π·d
        (Abstand zum Plattenrand ≈ 0). Mindestmomente nach NA 6.4.5 und Durchstanzbewehrung selbst sind hier nicht enthalten.</div>
    </div>
  `,

  'stahlbeton/stuetzen/schlankheit': () => _L`
    <div class="card">
      <div class="card-title">Ersatzlänge und Schlankheit</div>
      <div class="formula-box">
        l<sub>0</sub> = β · l&nbsp;&nbsp;·&nbsp;&nbsp;λ = l<sub>0</sub> / i&nbsp;&nbsp;mit&nbsp; i = √(I/A) = h/√12 ≈ 0,289·h (Rechteck)
        <div class="comment">h — Seitenlänge in Richtung der Ausbiegung</div>
      </div>
      ${textTable([tt('Lagerung (Eulerfall)'),'β'], [
        [tt('Kragstütze: unten eingespannt, oben frei'),'2,0'],
        ['beidseitig gelenkig','1,0'],
        [tt('unten eingespannt, oben gelenkig'),'0,7'],
        ['beidseitig eingespannt (unverschieblich)','0,5'],
      ])}
      <div class="legend">Ausgesteifte Geschossstützen werden meist mit β = 1,0 auf der sicheren Seite angesetzt.</div>
    </div>
    <div class="card">
      <div class="card-title">Wann ist eine Stütze schlank? — DIN EN 1992-1-1/NA, 5.8.3.1</div>
      <div class="formula-box">
        λ<sub>lim</sub> = 25&nbsp; für |n| ≥ 0,41&nbsp;&nbsp;·&nbsp;&nbsp;λ<sub>lim</sub> = 16 / √|n|&nbsp; für |n| < 0,41&nbsp;&nbsp; mit&nbsp; n = N<sub>Ed</sub> / (A<sub>c</sub> · f<sub>cd</sub>)
        <div class="comment">λ ≤ λ<sub>lim</sub>: Auswirkungen nach Theorie II. Ordnung dürfen vernachlässigt werden.</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Lastausmitten (Verfahren mit Nennkrümmung)</div>
      <div class="formula-box">
        M<sub>Ed</sub> = N<sub>Ed</sub> · (e<sub>0</sub> + e<sub>i</sub> + e<sub>2</sub>)<br>
        e<sub>0</sub> = M<sub>0Ed</sub> / N<sub>Ed</sub> ≥ max(h/30; 20 mm)<br>
        e<sub>i</sub> = θ<sub>i</sub> · l<sub>0</sub>/2&nbsp; mit&nbsp; θ<sub>i</sub> = α<sub>h</sub>/200,&nbsp; α<sub>h</sub> = 2/√l,&nbsp; 2/3 ≤ α<sub>h</sub> ≤ 1&nbsp; (l in m)<br>
        e<sub>2</sub> = K<sub>1</sub> · (1/r) · l<sub>0</sub>² / 10&nbsp; mit&nbsp; 1/r = ε<sub>yd</sub> / (0,45·d)
        <div class="comment">K<sub>1</sub> = λ/10 − 2,5 für 25 ≤ λ ≤ 35, K<sub>1</sub> = 1 für λ > 35 · 1/r auf der sicheren Seite mit K<sub>r</sub> = 1 und ohne Kriechen (K<sub>φ</sub> = 1)<br>
        Bei veränderlichem Moment entlang der Stütze: e<sub>0</sub> = 0,6·e<sub>01</sub> + 0,4·e<sub>02</sub> ≥ 0,4·e<sub>02</sub> (|e<sub>02</sub>| ≥ |e<sub>01</sub>|)</div>
      </div>
      <div class="info-banner">Kriechen vergrößert die Krümmung. Für Stützen mit hohem Dauerlastanteil und λ > 50 ist K<sub>φ</sub> = 1 + β·φ<sub>ef</sub> zu berücksichtigen.</div>
      <a class="applink" href="#/stahlbeton/stuetzen/bemessung">→ Stütze bemessen</a>
    </div>
  `,

  'stahlbeton/stuetzen/bemessung': () => _L`
    <div class="card">
      <div class="card-title">Querschnittsbemessung bei Biegung mit Längsdruck</div>
      <div class="section-note">Stützen werden meist symmetrisch bewehrt (A<sub>s1</sub> = A<sub>s2</sub>), weil das Moment je nach Lastfall
        die Richtung wechselt. Die Bemessung sucht die Dehnungsebene, bei der die innere Normalkraft N<sub>Ed</sub> entspricht, und

      <div class="formula-box">
        ν<sub>Ed</sub> = N<sub>Ed</sub> / (b·h·f<sub>cd</sub>)&nbsp;&nbsp;·&nbsp;&nbsp;μ<sub>Ed</sub> = M<sub>Ed</sub> / (b·h²·f<sub>cd</sub>)&nbsp;&nbsp;→&nbsp;&nbsp;ω<sub>tot</sub> aus dem Diagramm<br>
        A<sub>s,tot</sub> = ω<sub>tot</sub> · b·h · f<sub>cd</sub> / f<sub>yd</sub>
      </div>

        ${field(tt('Beton'), betonSel('st-c', 'C30/37', 'updateStuetze()'))}

        [tt('Bügeldurchmesser'),tt('≥ 6 mm und ≥ ¼ · größter Längsstab-Ø (Matten ≥ 5 mm)')],
        [tt('Bügelabstand'),tt('≤ min(12 · kleinster Längsstab-Ø; kleinste Seitenlänge; 300 mm)')],

      ])}
    </div>
  `,

  'stahlbeton/gzg/rissbreite': () => _L`
    <div class="card">
      <div class="card-title">Warum Risse begrenzen?</div>
      <div class="section-note">Stahlbeton reißt planmäßig: Erst im gerissenen Zustand trägt der Stahl die Zugkraft. Zu breite Risse lassen aber
        Wasser und Chloride an die Bewehrung und sehen schlecht aus. Begrenzt wird die rechnerische Rissbreite w<sub>k</sub>.</div>
      ${textTable([tt('Expositionsklasse'),tt('w_max (Stahlbeton)'),tt('Einwirkungskombination')], [
        ['X0, XC1','0,4 mm',tt('quasi-ständig')],
        ['XC2, XC3, XC4','0,3 mm',tt('quasi-ständig')],
        ['XD1, XD2, XS1, XS2, XS3','0,3 mm',tt('quasi-ständig')],
        ['XD3',tt('0,3 mm + besondere Maßnahmen (z. B. Beschichtung)'),tt('quasi-ständig')],
      ])}
      <div class="legend">Nach DIN EN 1992-1-1/NA, Tab. 7.1DE. Bei X0/XC1 dient die Begrenzung nur dem Aussehen.</div>
    </div>
    <div class="card">
      <div class="card-title">Mindestbewehrung für Zwang — 7.3.2</div>
      <div class="formula-box">
        A<sub>s,min</sub> · σ<sub>s</sub> = k<sub>c</sub> · k · f<sub>ct,eff</sub> · A<sub>ct</sub>

        σ<sub>s</sub> aus dem Grenzdurchmesser: σ<sub>s</sub> = √(w<sub>k</sub> · 3,48·10⁶ / Ø*<sub>s</sub>)&nbsp; mit Ø*<sub>s</sub> = Ø<sub>s</sub> · 2,9 / f<sub>ct,eff</sub></div>

        Für Lastbeanspruchung: Ø<sub>s</sub> = Ø*<sub>s</sub> · σ<sub>s</sub>·A<sub>s</sub> / (4·(h − d)·b·2,9) ≥ Ø*<sub>s</sub> · f<sub>ct,eff</sub>/2,9 ·

        <div class="comment">ρ<sub>p,eff</sub> = A<sub>s</sub> / (b · h<sub>c,ef</sub>) mit h<sub>c,ef</sub> = min{2,5·(h − d); (h − x)/3; h/2} · k<sub>t</sub> = 0,4 (Langzeit) · α<sub>e</sub> = E<sub>s</sub>/E<sub>cm</sub></div>
      </div>
    </div>
    <div class="card">

      </div>

// NAVIGATION (über die Adresse #/fach/kapitel/thema)
// ══════════════════════════════════════════════════
let navState = { fach:null, kapitel:null, thema:null };
let searchQuery = '';

function parseHash(){
  const [f,k,t] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
  const F = FAECHER[f];
  const K = F && F.kapitel[k];
  const T = K && K.themen[t];
  return { fach: F ? f : null, kapitel: K ? k : null, thema: T ? t : null };
}
// Für Aufrufe aus altem Code / Konsole
function navTo(f,k,t){ location.hash = hrefOf(f,k,t); }
function goHome(){ location.hash = '#/'; }

function render(){
  navState = parseHash();
  renderBreadcrumb();
  const main = document.getElementById('main');
  if(!navState.fach)         main.innerHTML = viewFaecher();
  else if(!navState.kapitel) main.innerHTML = viewKapitel();
  else if(!navState.thema)   main.innerHTML = viewThemen();
  else                       main.innerHTML = viewThema();
  const key = [navState.fach, navState.kapitel, navState.thema].join('/');
  if(AFTER[key]) AFTER[key]();
  trRef(main); if(_trObs){ _trObs.disconnect(); _trObs.observe(main, {childList:true, subtree:true, characterData:true}); }
  if(!navState.fach && searchQuery) runSearch(searchQuery, false);
  document.title = pageTitle();
  renderSidebar(); renderToc(); toggleSideMenu(false);
  trRef(document.getElementById('sidebar')); trRef(document.getElementById('toc'));
}
function pageTitle(){
  const {fach,kapitel,thema} = navState;
  if(thema) return FAECHER[fach].kapitel[kapitel].themen[thema].title + ' — kragr';
  if(kapitel) return FAECHER[fach].kapitel[kapitel].title + ' — kragr';
  if(fach) return FAECHER[fach].title + ' — kragr';
  return kmod('ref')+' — kragr';
}

function renderBreadcrumb(){
  const {fach,kapitel,thema} = navState;
  const bc = document.getElementById('breadcrumb');
  const link = (href, txt, current) => current ? `<span class="crumb current" aria-current="page">${txt}</span>` : `<a class="crumb" href="${href}">${txt}</a>`;
  let html = link('index.html', 'statiq', false) + `<span class="crumb-sep">›</span>` + link('#/', 'ref', !fach);
  if(fach){
    html += `<span class="crumb-sep">›</span>` + link(hrefOf(fach), FAECHER[fach].title, !kapitel);
  }
  if(kapitel){
    html += `<span class="crumb-sep">›</span>` + link(hrefOf(fach,kapitel), FAECHER[fach].kapitel[kapitel].title, !thema);
  }
  if(thema){
    html += `<span class="crumb-sep">›</span>` + link('', FAECHER[fach].kapitel[kapitel].themen[thema].title, true);
  }
  bc.innerHTML = html;
}

const footnote = extra => _L`<div class="footnote">kragr · ${kmod('ref')} v${REF_VERSION}${extra ? ' — '+extra : ''}</div>`.replace('</div>', ` · <a class="fehler-link" href="#" onclick="this.href=mulyFehlerHref('ref',REF_VERSION,location.hash)">${tt('Fehler gefunden? Bitte melden.')}</a></div>`);

// ── Start: Fächer + Suche ──────────────────────────
function viewFaecher(){
  let tiles = '';
  for(const [key, f] of Object.entries(FAECHER)){
    tiles += `<a class="tile" href="${hrefOf(key)}">
      <span class="tile-tag">${f.tag}</span>
      <div class="tile-title">${f.title}</div>
      <div class="tile-sub">${f.sub}</div>
    </a>`;
  }
  FAECHER_SOON.forEach(s=>{
    tiles += `<div class="tile soon" aria-disabled="true">
      <span class="tile-tag">${s.tag}</span>
      <div class="tile-title">${s.title}</div>
      <div class="tile-sub">${tx('soon')}</div>
    </div>`;
  });
  return `
    <div class="search home-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="search" placeholder="${tx('searchPh')}" value="${escapeHtml(searchQuery)}"
        oninput="runSearch(this.value)" aria-label="${tx('searchAria')}" autocomplete="off">
    </div>
    <div id="search-results"></div>
    <div class="home-hint">Links ein Fach aufklappen oder oben nach einem Begriff suchen.</div>
    <div class="tile-grid home-tiles">${tiles}</div>
    ${footnote(tt('Nachschlagewerk'))}
  `;
}

// ── Kapitel eines Fachs ────────────────────────────
function viewKapitel(){
  const f = FAECHER[navState.fach];
  let items = '';
  for(const [key, k] of Object.entries(f.kapitel)){
    items += `<a class="nav-list-item" href="${hrefOf(navState.fach,key)}">
      <span class="nav-list-label">${k.title}</span>
      <span class="nav-list-meta"><span class="nav-list-arrow">›</span></span>
    </a>`;
  }
  return `
    <div class="page-head">
      <div class="page-title">${f.title}</div>
      <div class="page-sub">${f.sub}</div>
    </div>
    <div class="nav-list">${items}</div>
    ${footnote()}
  `;
}

// ── Themen eines Kapitels ──────────────────────────
function viewThemen(){
  const k = FAECHER[navState.fach].kapitel[navState.kapitel];
  let items = '';
  for(const [key, t] of Object.entries(k.themen)){
    items += `<a class="nav-list-item" href="${hrefOf(navState.fach,navState.kapitel,key)}">
      <span class="nav-list-label">${t.title}</span>
      <span class="nav-list-arrow">›</span>
    </a>`;
  }
  return `
    <div class="page-head">
      <div class="page-title">${k.title}</div>
    </div>
    <div class="nav-list">${items}</div>
    ${footnote()}
  `;
}

// ── Thema: Inhalt + Weiter/Zurück im Kapitel ───────
function viewThema(){
  const {fach,kapitel,thema} = navState;
  const key = fach + '/' + kapitel + '/' + thema;
  const builder = CONTENT[key];
  const K = FAECHER[fach].kapitel[kapitel];
  const t = K.themen[thema];
  const keys = Object.keys(K.themen), i = keys.indexOf(thema);
  const body = (refUntr(fach) ? `<div class="lang-notice" role="note" style="margin:0 0 14px">${tx('notYet')}</div>` : '') + (builder ? builder() : `<div class="card"><div class="section-note">${tx('contentSoon')}</div></div>`);
  const prev = i>0 ? `<a class="nav-list-item" href="${hrefOf(fach,kapitel,keys[i-1])}"><span class="nav-list-arrow">‹</span><span class="nav-list-label" style="flex:1">${K.themen[keys[i-1]].title}</span></a>` : '';
  const next = i<keys.length-1 ? `<a class="nav-list-item" href="${hrefOf(fach,kapitel,keys[i+1])}"><span class="nav-list-label">${K.themen[keys[i+1]].title}</span><span class="nav-list-arrow">›</span></a>` : '';
  return _L`
    <button class="menu-toggle" onclick="event.stopPropagation(); toggleSideMenu()">☰ Alle Themen</button>
    <div class="page-head">
      <div class="page-title">${t.title}</div>
      <div class="page-sub">${FAECHER[fach].title} · ${K.title}</div>
    </div>
    ${body}
    <div class="topic-pager">${i>0?_L`<a href="${hrefOf(fach,kapitel,keys[i-1])}"><small>‹ zurück</small><b>${K.themen[keys[i-1]].title}</b></a>`:'<span></span>'}${i<keys.length-1?`<a class="nx" href="${hrefOf(fach,kapitel,keys[i+1])}"><small>weiter ›</small><b>${K.themen[keys[i+1]].title}</b></a>`:''}</div>
    ${(prev||next) ? `<div class="nav-list legacy-pager" style="display:none">${prev}${next}</div>` : ''}
    ${footnote()}
  `;
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[_\s]+/g,' ');
function buildIndex(){
  SEARCH_INDEX = [];
  const div = document.createElement('div');
  for(const [fk,F] of Object.entries(FAECHER))
    for(const [kk,K] of Object.entries(F.kapitel))
      for(const [tk,T] of Object.entries(K.themen)){
        const b = CONTENT[`${fk}/${kk}/${tk}`];
        div.innerHTML = b ? b() : '';
        trRef(div); div.querySelectorAll('select, svg').forEach(e=>e.remove());
        const extra = SEARCH_EXTRA[`${fk}/${kk}/${tk}`];
        const text = (div.textContent + (extra ? ' ' + extra() : '')).replace(/\s+/g,' ').trim();
        SEARCH_INDEX.push({href:hrefOf(fk,kk,tk), path:`${F.title} › ${K.title}`, title:T.title, text,
                           hay:norm(T.title+' '+K.title+' '+text)});
      }
}
function runSearch(q, keepFocus=true){
  searchQuery = q;
  const out = document.getElementById('search-results');
  if(!out) return;
  const terms = norm(q).trim().split(' ').filter(t=>t.length>=2);
  if(!terms.length){ out.innerHTML=''; return; }
  if(!SEARCH_INDEX) buildIndex();
  // Suche nach einer Profilreihe → Profiltabelle gleich auf diese Reihe stellen
  const pr = terms.find(t=>['ipe','hea','heb','hem'].includes(t));
  if(pr) profileFilter = pr.toUpperCase();
  const hits = SEARCH_INDEX
    .map(e=>({e, score: terms.every(t=>e.hay.includes(t)) ? terms.reduce((s,t)=>s+(norm(e.title).includes(t)?3:1),0) : 0}))
    .filter(h=>h.score>0).sort((a,b)=>b.score-a.score);
  if(!hits.length){ out.innerHTML = _L`<div class="search-empty">Keine Treffer für „${escapeHtml(q)}“.</div>`; return; }
  out.innerHTML = `<div class="search-results">${hits.slice(0,12).map(({e})=>{
    // Ausschnitt um den ersten Treffer im Text
    const nt = norm(e.text), pos = Math.max(0, nt.indexOf(terms[0]));
    let snip = e.text.slice(Math.max(0,pos-50), pos+90);
    snip = (pos>50?'… ':'') + escapeHtml(snip) + (pos+90<e.text.length?' …':'');
    terms.forEach(t=>{
      const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
      snip = snip.replace(re,'<mark>$1</mark>');
    });
    return `<a class="search-hit" href="${e.href}"><div class="search-hit-path">${e.path}</div>
      <div class="search-hit-title">${e.title}</div><div class="search-hit-snip">${snip}</div></a>`;
  }).join('')}</div>`;
}

// Rechenschritt-Zeile in Einzelzeilen zerlegen: jede Gleichheit (=), jeder Vergleich (≤ ≥ < >) und jede Folgerung (→) beginnt eine neue Zeile,
// das Gleichheitszeichen steht untereinander. Getrennt wird nur auf oberster Ebene (nicht in Klammern oder HTML-Tags).
function eqSplit(s, seps){
  const out=[]; let depth=0, cur='', i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='<' && /[a-zA-Z\/!]/.test(s[i+1]||'')){ const j=s.indexOf('>', i); if(j<0){ cur+=s.slice(i); break; } cur+=s.slice(i,j+1); i=j+1; continue; }
    if(c==='&'){ const m=/^&[a-z#0-9]+;/i.exec(s.slice(i)); if(m){ cur+=m[0]; i+=m[0].length; continue; } }
    if(c==='('||c==='['||c==='{') depth++; else if((c===')'||c===']'||c==='}') && depth>0) depth--;
    if(depth===0){ const sp=seps.find(x=>s.startsWith(x,i)); if(sp){ out.push([cur, sp.trim()]); cur=''; i+=sp.length; continue; } }
    cur+=c; i++;
  }
  out.push([cur, null]); return out;   // [Text, Trennzeichen danach]
}
const EQ_CMP = [' ≤ ',' ≥ ',' < ',' > ',' &lt; ',' &gt; '];
function eqLine(line){
  if(/<(svg|table|div|ul|ol|br)\b/i.test(line)) return null;
  const plain=line.replace(/<[^>]+>/g,'');
  const nEq=(plain.match(/ = /g)||[]).length, nCmp=EQ_CMP.filter(c=>plain.includes(c.replace('&lt;','<').replace('&gt;','>'))).length, nTo=(plain.match(/ → /g)||[]).length;
  if(nEq+nCmp+nTo<2 && plain.length<70) return null;
  if(nEq===0) return null;
  // Aussagen: an „ → “ und an „ · “ trennen, wenn beide Seiten eigene Gleichungen sind
  let stm=[]; eqSplit(line,[' → ']).forEach(([t],k)=>stm.push({t, pre:k?'→':''}));
  stm = stm.flatMap(st=>{ const parts=eqSplit(st.t,[' · ']).map(p=>p[0]);
    const isEq=p=>{ const pl=p.replace(/<[^>]+>/g,'').trim(), i=pl.indexOf(' = '); return i>0 && i<30 && /^[^\d\s(−\-+]/.test(pl); };
    if(parts.length>1 && parts.every(isEq)) return parts.map((t,k)=>({t, pre:k?'':st.pre}));
    return [st]; });
  // nur echte Rechenketten zerlegen: eine Aussage mit mindestens zwei Gleichheits-/Vergleichszeichen,
  // deren Zwischenglieder keine Wörter oder Doppelpunkte enthalten („F = 10 kN bei x = 2 m“ bleibt eine Zeile)
  const plainOf = t => t.replace(/<[^>]+>/g,'').replace(/&[a-z#0-9]+;/gi,' ');
  const UNIT = /\b(kNm|kN|mm|cm|m|N|MPa|kPa|kg|rad|Hz|mm²|cm²|cm³|cm⁴|m²|m³)\b/g;
  const isChain = st => { const segs=eqSplit(st.t,[' = ',...EQ_CMP]); if(segs.length<3) return false;
    return segs.slice(1,-1).every(([t])=>{ const pl0=plainOf(t), pl=plainOf(t.replace(/<(sub|sup)>.*?<\/\1>/g,'')).replace(UNIT,''), tail=plainOf(t.replace(/<(sub|sup)>.*?<\/\1>/g,'')).split(' · ').slice(1).pop(); return !/: /.test(pl) && !(tail!==undefined && /^[A-Za-zΑ-ωα-ωΣΔ][\w,'′]*$/.test(tail.trim())) && !/(^|[\s(])[A-Za-zÄÖÜäöüß]{3,}(?=[\s,.)]|$)/.test(pl.replace(/(max|min|cos|sin|tan|cot|exp|ln|log|sqrt)\s*\(/g,'(')); }); };
  if(!stm.some(isChain)) return null;
  const rows=[];
  // Vorspann bis „: “ (z. B. „Querschnitt 120 × 240 mm: A = …“) als eigene Zeile
  if(stm[0]){ const pp=eqSplit(stm[0].t,[': ']); if(pp.length>1 && !/ = /.test(pp[0][0].replace(/<[^>]+>/g,''))){ rows.push(['', pp[0][0]+':', 'cont']); stm[0].t=pp.slice(1).map(p=>p[0]).join(': '); } }
  stm.forEach(st=>{
    const segs=eqSplit(st.t,[' = ',...EQ_CMP]);
    if(segs.length===1){ rows.push(['', (st.pre?st.pre+' ':'')+segs[0][0], 'cont']); return; }
    let op=null;
    segs.forEach(([t,sep],k)=>{
      if(k===0){ rows.push([(st.pre?st.pre+' ':'')+t, null, 'lhs']); }
      else rows[rows.length-1][1]===null ? rows[rows.length-1][1]=op+' '+t : rows.push(['', op+' '+t, 'rhs']);
      op=sep;
    });
  });
  // lange Satzanfänge links (Fließtext statt Formelzeichen): Zeile unverändert lassen
  if(rows.some(([l,r,k])=>k==='lhs' && l.replace(/<[^>]+>/g,'').replace(/^→ /,'').length>24)) return null;
  // eine leere rechte Seite (Text ohne Gleichung) als ganze Zeile
  return `<div class="eq">${rows.map(([l,r,k])=> r===null ? `<div class="eq-w">${l}</div>` : k==='cont' ? `<div class="eq-w">${r}</div>` : `<div class="eq-l">${l}</div><div class="eq-r">${r}</div>`).join('')}</div>`;
}
// Nachweisablauf: S = ['§Schrittüberschrift', 'Formelzeile', …] — Formelketten werden zeilenweise gesetzt
function ablauf(title, S){
  let out='', n=0, open=false;
  for(const s of S){
    if(s.startsWith('§')){ if(open) out+='</div></div>'; n++; out+=`<div class="st"><div class="st-h"><span class="st-n">${n}</span><span>${s.slice(1)}</span></div><div class="st-f">`; open=true; }
    else if(s.startsWith('!')){ out+=`<div class="st-note">${s.slice(1)}</div>`; }
    else { const e=eqLine(s); out += e || `<div>${s}</div>`; }
  }
  return `<div class="ablauf">${title?`<div class="ablauf-t">${title}</div>`:''}<div class="steps">${out}${open?'</div></div>':''}</div></div>`;
}

function tableFind(id, q){ const box=document.getElementById(id); if(!box) return; const t=norm(q).trim(); let n=0;
