(function(){
  var K={ de:{calc:'Schnittkräfte', size:'Bemessung', ref:'Wissen', proj:'Rechenblätter'}, en:{calc:'Internal forces', size:'Design', ref:'Reference', proj:'Calculation sheets'},

  window.KMOD=K; window.kmodLang=lang;

const ALLG_DATA = {"stahlbeton/allgemein/geschichte": [{"t": "Vom römischen Beton zum Stahlbeton","b": [["tl",[["um 125 n. Chr.","Pantheon in Rom: unbewehrte Kuppel aus römischem Beton (opus caementitium) mit rund 43 m Spannweite."],["1824","Joseph Aspdin erhält in England ein Patent auf Portlandzement."],["1855","Joseph-Louis Lambot zeigt auf der Weltausstellung in Paris ein Boot aus eisenbewehrtem Zementmörtel."],["1867","Der Gärtner Joseph Monier lässt Pflanzkübel aus Beton mit Eiseneinlagen patentieren."],["1886","Gustav Adolf Wayss bringt das Monier-System nach Deutschland, Matthias Koenen veröffentlicht die erste Bemessungsregel."],["1892","François Hennebique patentiert ein System aus Stützen, Balken und Platten mit Bügeln."],["1902","Emil Mörsch veröffentlicht „Der Eisenbetonbau“ – die Grundlage der Bemessung mit dem Fachwerkmodell."],["1928","Eugène Freyssinet meldet den Spannbeton zum Patent an."],["heute","Beton ist der weltweit meistverwendete Baustoff."]],"Jahr","Ereignis"],["p","Bis in die Mitte des 20. Jahrhunderts sprach man von Eisenbeton, danach setzte sich der Name Stahlbeton durch."]]}],"stahlbeton/allgemein/verbund": [{"t": "Warum Beton und Stahl zusammenpassen","b": [["li",["Beton trägt Druck gut, Zug aber nur gering: Die Zugfestigkeit liegt bei rund einem Zehntel der Druckfestigkeit, unter Zug reißt er.","Der Betonstahl übernimmt die Zugkräfte (f<sub>yk</sub> = 500 N/mm²). Erst zusammen entsteht ein Bauteil, das Biegung tragen kann.","Verbund: Die Rippen des Betonstahls verzahnen sich mit dem Beton, so wird die Kraft zwischen beiden übertragen.","Nahezu gleiche Wärmedehnung (rund 10·10⁻⁶ je Kelvin): Bei Temperaturänderungen entstehen kaum Spannungen zwischen Stahl und Beton.","Korrosionsschutz: Das alkalische Porenwasser (pH etwa 12,5 bis 13,5) bildet auf dem Stahl eine schützende Passivschicht.","Karbonatisierung: CO₂ aus der Luft senkt den pH-Wert von außen nach innen. Erreicht diese Front den Stahl, kann er rosten – deshalb gibt es die Mindestbetondeckung.","Brandschutz: Beton brennt nicht und schützt den Stahl über die Betondeckung vor zu hoher Temperatur."]],["link","#/stahlbeton/dauerhaftigkeit/deckung","→ Expositionsklassen und Betondeckung"]]},{"t": "Eigenschaften im Überblick","b": [["tab",["Eigenschaft","Beton","Betonstahl B500"],[["Rohdichte","2400 kg/m³","7850 kg/m³"],["Elastizitätsmodul","rund 27 000 bis 44 000 N/mm² (C12/15 bis C100/115)","200 000 N/mm²"],["Druckfestigkeit","f<sub>ck</sub> = 12 … 100 N/mm²","–"],["Zugfestigkeit","f<sub>ctm</sub> = 1,6 … 5,2 N/mm²","f<sub>yk</sub> = 500 N/mm²"],["Verhalten","spröde, reißt unter Zug","duktil, fließt vor dem Bruch"]]],["link","#/stahlbeton/baustoffe/beton","→ Festigkeitsklassen des Betons"],["link","#/stahlbeton/baustoffe/betonstahl","→ Betonstahl B500"]]}],"stahlbeton/betontechnologie/ausgangsstoffe": [{"t": "Zement","b": [["p","Zement ist ein hydraulisches Bindemittel: Er erhärtet mit Wasser, an der Luft und unter Wasser. Grundstoff ist Portlandzementklinker, gebrannt bei rund 1450 °C aus Kalkstein und Ton."],["tab",["Zementart (DIN EN 197-1)","Zusammensetzung und typische Anwendung"],[["CEM I","Portlandzement: fast nur Klinker, schnelle Festigkeitsentwicklung"],["CEM II","Portlandkompositzement: Klinker mit Hüttensand, Kalkstein, Flugasche o. Ä.; der Regelfall im Hochbau"],["CEM III","Hochofenzement: viel Hüttensand, wenig Hydratationswärme, gut für massige Bauteile"],["CEM IV","Puzzolanzement"],["CEM V","Kompositzement"]]],["p","Festigkeitsklassen 32,5, 42,5 und 52,5 geben die Mindestdruckfestigkeit des Normmörtels nach 28 Tagen in N/mm² an. Der Zusatz R steht für hohe, N für normale und L für niedrige Anfangsfestigkeit."]]},{"t": "Gesteinskörnung und Wasser","b": [["li",["Die Gesteinskörnung macht rund 70 bis 80 % des Betonvolumens aus und bildet das tragende Gerüst.","Eine gut abgestufte Sieblinie füllt die Hohlräume mit wenig Zementleim.","Das Größtkorn (z. B. 16 oder 32 mm) richtet sich nach Bauteildicke und Bewehrungsabstand.","Kies ist rund, Splitt gebrochen; Leichtzuschläge wie Blähton ergeben Leichtbeton.","Zugabewasser muss frei von schädlichen Stoffen sein; Trinkwasser ist immer geeignet."]]]},{"t": "Zusatzmittel und Zusatzstoffe","b": [["p","Zusatzmittel werden in kleinen Mengen zugegeben und verändern die Eigenschaften chemisch oder physikalisch. Zusatzstoffe werden in größeren Mengen zugegeben und zählen zum Feinstoff."],["tab",["Kurzzeichen","Wirkung"],[["FM / BV","Fließmittel bzw. Betonverflüssiger: besser verarbeitbar bei gleichem Wassergehalt"],["LP","Luftporenbildner: feine Luftporen für hohen Frost- und Tausalzwiderstand"],["VZ / BE","Verzögerer bzw. Beschleuniger: Erstarren später oder früher"],["Zusatzstoffe","Flugasche, Silikastaub, Gesteinsmehl: dichteres Gefüge, weniger Zement"]]]]}],"stahlbeton/betontechnologie/hydratation": [{"t": "Wie Beton erhärtet","b": [["p","Zement reagiert mit Wasser zu Calciumsilikathydraten. Ihre feinen Kristalle verfilzen sich und verkleben die Gesteinskörner. Dabei wird Wärme frei (Hydratationswärme)."],["p","In dicken Bauteilen wird der Kern wärmer als der Rand. Der Unterschied kann Risse erzeugen – dagegen helfen Zemente mit wenig Hydratationswärme (z. B. CEM III) und eine Kühlung oder Abdeckung."]]},{"t": "Der w/z-Wert","b": [["f","w/z = m<sub>w</sub> / m<sub>z</sub>","Masse des wirksamen Wassers geteilt durch die Masse des Zements"],["li",["Für die vollständige Hydratation braucht Zement rund 40 % seiner Masse an Wasser: etwa 25 % werden chemisch gebunden, etwa 15 % bleiben in den Gelporen.","Mehr Wasser macht den Frischbeton weicher, bleibt aber als Kapillarporen zurück: Festigkeit, Dichtigkeit und Dauerhaftigkeit sinken.","Deshalb gibt DIN 1045-2 je Expositionsklasse einen höchsten w/z-Wert vor, z. B. 0,75 bei XC1 und 0,45 bei XD3."]],["ex","Beispiel: 320 kg Zement und 176 l Wasser je m³ → w/z = 176 / 320 = 0,55."]]},{"t": "Schwinden und Kriechen","b": [["p","Beton verkürzt sich beim Austrocknen (Schwinden) und verformt sich unter Dauerlast mit der Zeit weiter (Kriechen). Beides wächst mit dem Zementleimgehalt und dem w/z-Wert."],["link","#/stahlbeton/baustoffe/kriechen","→ Kriechen und Schwinden berechnen"]]}],"stahlbeton/betontechnologie/frischbeton": [{"t": "Konsistenz","b": [["p","Die Konsistenz beschreibt, wie leicht sich der Frischbeton verarbeiten lässt. Meist wird sie mit dem Ausbreitmaß am Ausbreittisch gemessen."],["tab",["Klasse","Ausbreitmaß","Bezeichnung"],[["F1","≤ 340 mm","steif"],["F2","350 … 410 mm","plastisch"],["F3","420 … 480 mm","weich"],["F4","490 … 550 mm","sehr weich"],["F5","560 … 620 mm","fließfähig"],["F6","≥ 630 mm","sehr fließfähig"]]],["p","Weicher wird der Beton mit Fließmittel, nicht mit mehr Wasser – sonst steigt der w/z-Wert."]]},{"t": "Einbauen und Verdichten","b": [["li",["Beton in Lagen einbauen und die Fallhöhe begrenzen, sonst entmischt er sich (grobe Körner sinken ab).","Mit dem Innenrüttler verdichten, bis keine größeren Luftblasen mehr aufsteigen. Eingeschlossene Luft mindert Festigkeit und Dichtigkeit.","Selbstverdichtender Beton (SVB) fließt ohne Rütteln in die Schalung und entlüftet sich selbst.","Frischbetontemperatur in der Regel zwischen +5 °C und +30 °C; bei Frost und Hitze sind besondere Maßnahmen nötig."]]]}],"stahlbeton/betontechnologie/festbeton": [{"t": "Druckfestigkeitsklassen","b": [["p","Die Klasse C30/37 nennt die charakteristische Druckfestigkeit nach 28 Tagen: 30 N/mm² am Zylinder (Durchmesser 150 mm, Höhe 300 mm) und 37 N/mm² am Würfel (Kantenlänge 150 mm). Charakteristisch heißt: Nur 5 % der Proben dürfen darunter liegen."],["link","#/stahlbeton/baustoffe/beton","→ Tabelle der Festigkeitsklassen"]]},{"t": "Festigkeitsentwicklung","b": [["f","f<sub>cm</sub>(t) = β<sub>cc</sub>(t) · f<sub>cm</sub> &nbsp;&nbsp; β<sub>cc</sub>(t) = e<sup>s·(1 − √(28/t))</sup>","EN 1992-1-1, 3.1.2 · s = 0,20 (Zement R), 0,25 (N), 0,38 (S) · t in Tagen"],["ex","Beispiel C30/37 mit Zement 42,5 N nach 7 Tagen: f<sub>cm</sub> = 30 + 8 = 38 N/mm², β<sub>cc</sub> = e<sup>0,25·(1 − 2)</sup> = 0,78 → f<sub>cm</sub>(7) ≈ 29,6 N/mm²."]]},{"t": "Nachbehandlung","b": [["p","Frischer Beton muss vor zu frühem Austrocknen geschützt werden: durch Folie, Feuchthalten oder ein Nachbehandlungsmittel. Sonst fehlt in der Randzone das Wasser für die Hydratation."],["p","Gerade diese Randzone ist die Betondeckung, die den Stahl schützt. Schlecht nachbehandelter Beton ist dort poröser, karbonatisiert schneller und neigt zu Schwindrissen. Die Mindestdauer hängt nach DIN 1045-3 von Festigkeitsentwicklung und Temperatur ab."]]}],"stahlbau/allgemein/geschichte": [{"t": "Von Gusseisen zum modernen Baustahl","b": [["tl",[["1779","Iron Bridge bei Coalbrookdale (England): die erste Bogenbrücke aus Gusseisen."],["1784","Henry Cort entwickelt das Puddelverfahren: schmiedbares Eisen in großen Mengen."],["1851","Kristallpalast in London: vorgefertigte Bauteile aus Guss- und Schmiedeeisen mit Glas, in wenigen Monaten montiert."],["1855","Henry Bessemer: Windfrischverfahren – Stahl wird zum Massenprodukt."],["1889","Eiffelturm in Paris aus Puddeleisen, rund 300 m hoch, genietet."],["ab etwa 1930","Das Schweißen verdrängt nach und nach das Nieten."],["1952","Sauerstoffaufblasverfahren (LD-Verfahren, Linz und Donawitz)."],["heute","Ein großer Teil des Stahls entsteht aus Schrott im Elektrolichtbogenofen; Stahl lässt sich ohne Qualitätsverlust wiederverwerten."]],"Jahr","Ereignis"]]}],"stahlbau/allgemein/eigenschaften": [{"t": "Was Stahl auszeichnet","b": [["li",["Hohe Festigkeit, gleich groß für Zug und Druck: Bauteile werden schlank – deshalb sind Knicken, Kippen und Beulen oft maßgebend.","Duktilität: Nach Erreichen der Streckgrenze fließt Stahl und dehnt sich stark, bevor er bricht (bei S235 deutlich über 20 %). Versagen kündigt sich an, und Schnittgrößen können sich umlagern (Plastizitätstheorie).","Zähigkeit: Bei tiefen Temperaturen, dicken Blechen und Kerben kann Stahl spröde brechen. Die Gütegruppen JR, J0 und J2 sichern eine Kerbschlagarbeit von 27 J bei +20 °C, 0 °C bzw. −20 °C.","Homogen und in allen Richtungen gleich: E = 210 000 N/mm², G = 81 000 N/mm², Rohdichte 7850 kg/m³, Wärmedehnzahl 12·10⁻⁶ je Kelvin.","Korrosion: Ungeschützter Stahl rostet; Schutz durch Feuerverzinken oder Beschichtungen, in Innenräumen oft nicht nötig.","Brand: Stahl brennt nicht, verliert aber ab rund 400 bis 500 °C deutlich an Festigkeit und Steifigkeit; Schutz durch Bekleidungen oder Dämmschichtbildner.","Vorfertigung im Werk, schnelle Montage, lösbare Verbindungen und vollständige Wiederverwertbarkeit."]],["link","#/stahlbau/werkstoff/stahlsorten","→ Stahlsorten und Kennwerte"]]}],"holzbau/allgemein/geschichte": [{"t": "Vom Blockhaus zum Holzhochhaus","b": [["tl",[["Frühzeit","Holz ist einer der ältesten Baustoffe: Pfahlbauten, Blockbauten und Stabbauten."],["Mittelalter","Fachwerkhäuser und weit gespannte Dachstühle prägen die Städte."],["1906","Otto Hetzer erhält ein Patent auf gebogene, verleimte Holzträger – der Anfang des Brettschichtholzes."],["1920er Jahre","Friedrich Zollinger entwickelt das Zollinger-Dach aus kurzen, rautenförmig verbundenen Brettern."],["1990er Jahre","Brettsperrholz (BSP) macht Wände und Decken aus massivem Holz möglich."],["heute","Mehrgeschossige Holzbauten und Hochhäuser in Holz-Hybridbauweise."]],"Jahr","Ereignis"]]}],"holzbau/allgemein/eigenschaften": [{"t": "Was Holz auszeichnet","b": [["li",["Anisotrop: In Faserrichtung ist Holz fest und steif, quer dazu deutlich weniger (Druck quer zur Faser nur etwa ein Zehntel, Zug quer zur Faser sehr gering).","Leicht und fest: Nadelholz wiegt rund 420 bis 470 kg/m³ und hat im Verhältnis zum Gewicht eine hohe Festigkeit.","Feuchte: Unterhalb der Fasersättigung (rund 28 bis 30 %) schwindet und quillt Holz, quer zur Faser viel stärker als längs. Die Nutzungsklassen 1 bis 3 erfassen das Umgebungsklima.","Zeit: Die Festigkeit sinkt mit der Dauer der Last (k<sub>mod</sub>), und unter Dauerlast kriecht Holz (k<sub>def</sub>).","Dauerhaftigkeit: Pilze brauchen dauerhaft hohe Holzfeuchte (über etwa 20 %). Konstruktiver Holzschutz – trocken halten, Wasser ableiten – geht vor chemischem (DIN 68800).","Brand: Holz brennt, aber berechenbar. Nadelvollholz brennt mit rund 0,65 mm je Minute ab; die Holzkohleschicht schützt den Restquerschnitt.","Nachwachsend: Ein Kubikmeter Nadelholz speichert rund 0,9 t CO₂, solange er verbaut ist."]],["link","#/holzbau/baustoffe/vollholz","→ Festigkeitsklassen für Vollholz"]]}],"mauerwerk/allgemein/geschichte": [{"t": "Vom Lehmziegel zum Planstein","b": [["tl",[["Jungsteinzeit","Erste Häuser aus luftgetrockneten Lehmziegeln im Vorderen Orient."],["Antike","Gebrannte Ziegel in Mesopotamien; die Römer mauern mit Ziegeln und Kalkmörtel und bauen Bögen und Gewölbe."],["Mittelalter","Kathedralen aus Naturstein mit Strebewerk; Backsteingotik in Norddeutschland."],["1858","Friedrich Hoffmann erfindet den Ringofen: Ziegel werden im Dauerbetrieb gebrannt, die Herstellung wird industriell."],["1880","Wilhelm Michaelis lässt den dampfgehärteten Kalksandstein patentieren."],["1920er Jahre","In Schweden entsteht der Porenbeton."],["heute","Plansteine mit Dünnbettmörtel und gefüllte Hochlochziegel für guten Wärmeschutz."]],"Jahr","Ereignis"]]}],"mauerwerk/allgemein/eigenschaften": [{"t": "Was Mauerwerk auszeichnet","b": [["li",["Mauerwerk ist ein Verbundbaustoff aus Steinen und Mörtel. Es trägt Druck gut, Zug kaum – deshalb tragen Wände und Bögen vorwiegend Druck.","Das Mauerwerk ist schwächer als der Stein: Der weichere Mörtel will sich seitlich ausdehnen und erzeugt im Stein Querzug.","Steine: Ziegel, Kalksandstein, Porenbeton und Leichtbeton. Mörtel: Normalmörtel, Dünnbettmörtel und Leichtmörtel.","Schwere Steine schützen vor Schall und speichern Wärme, porige Steine dämmen besser. Mauerwerk ist nicht brennbar.","Bei schlanken Wänden werden Knicken und Lastausmitte maßgebend."]],["link","#/mauerwerk/bemessung/wand","→ Bemessung von Wänden"]]}],"grundbau/allgemein/geschichte": [{"t": "Wie die Bodenmechanik entstand","b": [["tl",[["1173","Baubeginn des Turms von Pisa: Er neigt sich, weil sich der weiche Ton ungleichmäßig setzt."],["1773","Charles Augustin de Coulomb beschreibt den Erddruck mit einem Gleitkeil und Reibung."],["1856","Henry Darcy findet das Gesetz für die Durchströmung von Sand."],["1857","William Rankine leitet den Erddruck aus Spannungszuständen ab."],["1925","Karl Terzaghi veröffentlicht die „Erdbaumechanik“: Konsolidierung und Prinzip der wirksamen Spannungen – der Beginn der modernen Bodenmechanik."],["heute","Baugrunderkundung, Messungen am Bauwerk und numerische Berechnungen ergänzen sich."]],"Jahr","Ereignis"]]}],"grundbau/allgemein/baugrund": [{"t": "Was den Boden besonders macht","b": [["li",["Boden ist ein Dreiphasensystem aus Körnern, Wasser und Luft. Sein Verhalten hängt stark vom Wassergehalt ab.","Nichtbindige Böden (Sand, Kies) tragen über Reibung, sind durchlässig und setzen sich schnell.","Bindige Böden (Ton, Schluff) haben Kohäsion, sind kaum durchlässig und setzen sich langsam über Jahre (Konsolidierung).","Scherfestigkeit nach Mohr-Coulomb: τ = c′ + σ′ · tan φ′.","Wirksame Spannung σ′ = σ − u: Grundwasser trägt einen Teil der Last und verringert damit die Reibung zwischen den Körnern.","Boden ist gewachsen und ungleichmäßig. Grundlage jeder Gründung ist deshalb die Baugrunderkundung mit Baugrundgutachten; die Geotechnischen Kategorien GK 1 bis 3 ordnen die Schwierigkeit ein."]],["link","#/grundbau/boden/kennwerte","→ Bodenkennwerte"]]}],"wasserbau/allgemein/geschichte": [{"t": "Wasser lenken – eine alte Aufgabe","b": [["tl",[["um 3000 v. Chr.","Bewässerungskanäle in Mesopotamien und Ägypten."],["um 250 v. Chr.","Archimedes beschreibt den Auftrieb."],["Römerzeit","Aquädukte wie der Pont du Gard bringen Wasser über weite Strecken mit gleichmäßigem Gefälle."],["1738","Daniel Bernoulli, „Hydrodynamica“: Energieerhaltung in der Strömung."],["1856","Henry Darcy: Gesetz der Grundwasserströmung."],["1867 bis 1923","Gauckler, Manning und Strickler entwickeln Fließformeln für offene Gerinne."],["heute","Hochwasserschutz, Talsperren, Wasserkraft und naturnaher Flussbau."]],"Jahr","Ereignis"]]}],"wasserbau/allgemein/wasser": [{"t": "Eigenschaften des Wassers","b": [["li",["Dichte rund 1000 kg/m³, Wichte γ<sub>w</sub> = 9,81 kN/m³, im Bauwesen oft gerundet auf 10 kN/m³.","Praktisch inkompressibel: Der Druck steigt linear mit der Tiefe, p = γ<sub>w</sub> · h, und wirkt senkrecht auf jede Fläche.","Ruhendes Wasser überträgt keine Schubspannungen; strömendes Wasser hat innere Reibung (Viskosität).","Die Reynolds-Zahl unterscheidet laminare und turbulente Strömung; in Flüssen und Rohren ist die Strömung meist turbulent.","Dichteanomalie: Wasser ist bei rund 4 °C am dichtesten. Beim Gefrieren dehnt es sich um rund 9 % aus – Ursache von Frostschäden."]],["link","#/wasserbau/hydrostatik/druck","→ Wasserdruck auf Flächen"]]}],"bauphysik/allgemein/geschichte": [{"t": "Vom Mindestwärmeschutz zum Gebäudeenergiegesetz","b": [["tl",[["1952","DIN 4108 „Wärmeschutz im Hochbau“ erscheint zum ersten Mal: Mindestwärmeschutz gegen Tauwasser und Schimmel."],["1959","Helmut Glaser veröffentlicht sein grafisches Verfahren für Tauwasser im Bauteil (Glaser-Verfahren)."],["1977","Erste Wärmeschutzverordnung als Antwort auf die Ölkrise."],["2002","Die Energieeinsparverordnung (EnEV) betrachtet Gebäudehülle und Anlagentechnik gemeinsam."],["2020","Das Gebäudeenergiegesetz (GEG) fasst die Regeln zusammen."]],"Jahr","Ereignis"]]}],"bauphysik/allgemein/aufgaben": [{"t": "Die vier Teilgebiete","b": [["tab",["Gebiet","Worum es geht"],[["Wärmeschutz","Energiebedarf, Behaglichkeit und Mindestwärmeschutz gegen Schimmel; U-Wert, Wärmebrücken, sommerlicher Wärmeschutz"],["Feuchteschutz","Tauwasser an Oberflächen und im Bauteil, Schlagregen, aufsteigende Feuchte"],["Schallschutz","Luftschall und Trittschall zwischen Räumen und von außen"],["Brandschutz","Baustoffklassen, Feuerwiderstand von Bauteilen, Rettungswege"]]],["p","Die Gebiete hängen zusammen: Mehr Dämmung verschiebt die Taupunktebene, schwere Bauteile verbessern den Schallschutz und dämpfen die sommerliche Erwärmung."],["link","#/bauphysik/waerme/uwert","→ U-Wert berechnen"]]}]};
function allgView(key){
  const D=ALLG_DATA[key]; if(!D) return '';
  return D.map(c=>`<div class="card"><div class="card-title">${tt(c.t)}</div>`+c.b.map(b=>{
    if(b[0]==='p') return `<div class="section-note">${tt(b[1])}</div>`;
    if(b[0]==='ex') return `<div class="info-banner">${tt(b[1])}</div>`;
    if(b[0]==='li') return `<ul class="section-note allg-li">${b[1].map(x=>`<li>${tt(x)}</li>`).join('')}</ul>`;
    if(b[0]==='tl') return textTable([tt(b[2]), tt(b[3])], b[1].map(r=>[tt(r[0]), tt(r[1])]));
    if(b[0]==='tab') return textTable(b[1].map(x=>tt(x)), b[2].map(r=>r.map(x=>tt(x))));
    if(b[0]==='f') return `<div class="formula-box">${b[1]}${b[2]?`<div class="comment">${tt(b[2])}</div>`:''}</div>`;
    if(b[0]==='link') return `<a class="applink" href="${b[1]}">${tt(b[2])}</a>`;
    return ''; }).join('')+`</div>`).join('');
}
</script>

// gewalzte I-Profile (parallele Flansche, Ausrundung r): Formeln wie in den Herstellertabellen; mm → cm-Einheiten
function iProps(h,b,tw,tf,r){
  const hw=h-2*tf, PI=Math.PI;
  const A=2*b*tf+hw*tw+(4-PI)*r*r;
  const Iy=(b*h**3-(b-tw)*hw**3)/12+0.03*r**4+0.2146*r*r*(hw-0.4468*r)**2;
  const Iz=(2*tf*b**3+hw*tw**3)/12+0.03*r**4+0.2146*r*r*(tw+0.4468*r)**2;
  const Wply=tw*h*h/4+(b-tw)*(h-tf)*tf+(4-PI)/2*r*r*(h-2*tf)+(3*PI-10)/3*r**3;
  const Wplz=b*b*tf/2+hw*tw*tw/4+r**3*(10/3-PI)+(2-PI/2)*tw*r*r;
  const D=((r+tw/2)**2+(r+tf)**2-r*r)/(2*r+tf);
  const It=2/3*(b-0.63*tf)*tf**3+hw*tw**3/3+2*(tw/tf)*(0.145+0.1*r/tf)*D**4;
  const Iw=tf*b**3*(h-tf)**2/24;
  const Avz=Math.max(A-2*b*tf+(tw+2*r)*tf, (h-2*tf)*tw);   // η = 1,0 (NA)
  return { A:A/100, G:A*7850/1e6, Iy:Iy/1e4, Wy:Iy/(h/2)/1e3, Wply:Wply/1e3, iy:Math.sqrt(Iy/A)/10,
    Iz:Iz/1e4, Wz:Iz/(b/2)/1e3, Wplz:Wplz/1e3, iz:Math.sqrt(Iz/A)/10, Avz:Avz/100, It:It/1e4, Iw:Iw/1e6, Sy:Wply/2/1e3,
    hw:h-2*tf, d:h-2*tf-2*r };
}
// Polygon mit ausgerundeten Ecken: V = [[x, y, r], …] (r = 0: scharfe Ecke)
function roundPoly(V, n=24){
  const out=[], N=V.length;
  for(let i=0;i<N;i++){
    const [x,y,r]=V[i]; if(!r){ out.push([x,y]); continue; }
    const p=V[(i+N-1)%N], q=V[(i+1)%N];
    let ax=p[0]-x, ay=p[1]-y, bx=q[0]-x, by=q[1]-y; const la=Math.hypot(ax,ay), lb=Math.hypot(bx,by); ax/=la; ay/=la; bx/=lb; by/=lb;
    const th=Math.acos(Math.max(-1,Math.min(1,ax*bx+ay*by)))/2, t=r/Math.tan(th);
    let mx=ax+bx, my=ay+by; const lm=Math.hypot(mx,my); mx/=lm; my/=lm;
    const cx=x+mx*r/Math.sin(th), cy=y+my*r/Math.sin(th);
    const t1=[x+ax*t, y+ay*t], t2=[x+bx*t, y+by*t];
    let a1=Math.atan2(t1[1]-cy,t1[0]-cx), a2=Math.atan2(t2[1]-cy,t2[0]-cx), da=a2-a1;
    while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
    for(let k=0;k<=n;k++){ const a=a1+da*k/n; out.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
  }
  return out;
}
// Flächenintegrale eines geschlossenen Polygons (Gauß): A, Sx = ∫y, Sy = ∫x, Ixx = ∫y², Iyy = ∫x², Ixy = ∫xy
function polyInt(P){
  let A=0,Sx=0,Sy=0,Ixx=0,Iyy=0,Ixy=0;
  for(let i=0;i<P.length;i++){ const [x0,y0]=P[i], [x1,y1]=P[(i+1)%P.length], c=x0*y1-x1*y0;
    A+=c/2; Sy+=(x0+x1)*c/6; Sx+=(y0+y1)*c/6; Iyy+=(x0*x0+x0*x1+x1*x1)*c/12; Ixx+=(y0*y0+y0*y1+y1*y1)*c/12; Ixy+=(x0*y1+2*x0*y0+2*x1*y1+x1*y0)*c/24; }
  const s=Math.sign(A)||1; return {A:A*s,Sx:Sx*s,Sy:Sy*s,Ixx:Ixx*s,Iyy:Iyy*s,Ixy:Ixy*s};
}
// Polygon an der Geraden y = c abschneiden (oberer Teil), Sutherland–Hodgman
function clipY(P,c,above=true){ const out=[], inn=p=>above?p[1]>=c:p[1]<=c;
  for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length], ia=inn(a), ib=inn(b);
    if(ia) out.push(a); if(ia!==ib){ const t=(c-a[1])/(b[1]-a[1]); out.push([a[0]+t*(b[0]-a[0]), c]); } }
  return out; }
// plastisches Widerstandsmoment um eine waagerechte Achse (flächenhalbierende Linie)
function wplY(P){ const ys=P.map(p=>p[1]); let lo=Math.min(...ys), hi=Math.max(...ys); const A=polyInt(P).A;
  for(let k=0;k<80;k++){ const m=(lo+hi)/2; if(polyInt(clipY(P,m,true)).A>A/2) lo=m; else hi=m; }
  const c=(lo+hi)/2, up=polyInt(clipY(P,c,true)), dn=polyInt(clipY(P,c,false));
  return (up.Sx-c*up.A)+(c*dn.A-dn.Sx); }
const swapXY=P=>P.map(([x,y])=>[y,x]);
function polyProps(P){ const q=polyInt(P), xs=q.Sy/q.A, ys=q.Sx/q.A;
  const Iy=q.Ixx-q.A*ys*ys, Iz=q.Iyy-q.A*xs*xs, Iyz=q.Ixy-q.A*xs*ys;
  const m=(Iy+Iz)/2, d=Math.hypot((Iy-Iz)/2,Iyz);
  return {A:q.A, xs, ys, Iy, Iz, Iyz, Iu:m+d, Iv:m-d, xmin:Math.min(...P.map(p=>p[0])), xmax:Math.max(...P.map(p=>p[0])), ymin:Math.min(...P.map(p=>p[1])), ymax:Math.max(...P.map(p=>p[1]))}; }

function uProps(P,h){ const p=polyProps(P); return { A:p.A/100, G:p.A*7850/1e6, Iy:p.Iy/1e4, Wy:p.Iy/(h/2)/1e3, Wply:wplY(P)/1e3, iy:Math.sqrt(p.Iy/p.A)/10,
  Iz:p.Iz/1e4, Wz:p.Iz/(p.xmax-p.xs)/1e3, Wplz:wplY(swapXY(P))/1e3, iz:Math.sqrt(p.Iz/p.A)/10, ez:p.xs/10 }; }

function lPoly(b,t,r1,r2){ return roundPoly([[0,0,0],[b,0,0],[b,t,r2],[t,t,r1],[t,b,r2],[0,b,0]]); }

// warmgefertigte Hohlprofile EN 10210-2: Außenradius 1,5 t, Innenradius 1,0 t
function rrect(B,H,r){ // abgerundetes Rechteck: A, I um die Achse ∥ B, Wpl
  const k=4-Math.PI, ec=H/2-r+4*r/(3*Math.PI), Iq=(Math.PI/16-4/(9*Math.PI))*r**4;
  const A=B*H-k*r*r;
  const I=B*H**3/12-4*(r**4/12+r*r*(H/2-r/2)**2)+4*(Iq+Math.PI*r*r/4*ec*ec);
  const Wpl=B*H*H/4-4*r*r*(H/2-r/2)+4*Math.PI*r*r/4*ec;   // 2 · statisches Moment der halben Fläche
  return {A,I,Wpl}; }
function rhsProps(H,B,t){ const ro=1.5*t, ri=t, o=rrect(B,H,ro), i=rrect(B-2*t,H-2*t,ri), o2=rrect(H,B,ro), i2=rrect(H-2*t,B-2*t,ri);
  const A=o.A-i.A, Iy=o.I-i.I, Iz=o2.I-i2.I;
  const Rc=(ro+ri)/2, hp=2*((B-t)+(H-t))-2*Rc*(4-Math.PI), Ap=(B-t)*(H-t)-Rc*Rc*(4-Math.PI), K=2*Ap*t/hp, It=t**3*hp/3+2*K*Ap;
  return { A:A/100, G:A*7850/1e6, Iy:Iy/1e4, Wy:Iy/(H/2)/1e3, Wply:(o.Wpl-i.Wpl)/1e3, iy:Math.sqrt(Iy/A)/10,
    Iz:Iz/1e4, Wz:Iz/(B/2)/1e3, Wplz:(o2.Wpl-i2.Wpl)/1e3, iz:Math.sqrt(Iz/A)/10, It:It/1e4, Wt:It/(t+K/t)/1e3 }; }
function chsProps(D,t){ const d=D-2*t, A=Math.PI*(D*D-d*d)/4, I=Math.PI*(D**4-d**4)/64;
  return { A:A/100, G:A*7850/1e6, I:I/1e4, Wel:I/(D/2)/1e3, Wpl:(D**3-d**3)/6/1e3, i:Math.sqrt(I/A)/10, It:2*I/1e4, Wt:2*I/(D/2)/1e3 }; }

function dimL(x1,y1,x2,y2,t,off=14,tOff=10){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;

function dlTrag(n){
  const x1=30, W=n===2?300:330, x2=x1+W, y=46, ym=112, Ls=W/n; let o=udl(x1,x2,y-2,14,1,1,'q')+beam(x1,x2,y)+supPin(x1,y+1);
  for(let i=1;i<=n;i++) o+=supRoll(x1+Ls*i,y+1);
  const c = n===2 ? [0.375] : [0.4, 0.5];
  // Moment in qL² je Feld
  const M = s => { const i=Math.min(n-1,Math.floor(s)), t=s-i;
    if(n===2) return i===0 ? .375*t-t*t/2 : .375*(1-t)-(1-t)*(1-t)/2;
    if(i===0) return .4*t-t*t/2; if(i===2) return .4*(1-t)-(1-t)*(1-t)/2; return -0.1+0.5*t*(1-t); };
  const k=200; o+=mLine(x1,x2,ym,t=>M(t*n),k,'')+it(x2+8,ym+4,'M','start',SK.m,12);
  const lab=(s,txt)=>{ const v=M(s); o+=it(x1+Ls*s, ym+v*k+(v>=0?14:-6), txt,'middle',SK.m,11); };
  if(n===2){ lab(0.375,'0,070'); lab(1.625,'0,070'); lab(1,'−0,125'); }
  else { lab(0.4,'0,080'); lab(1.5,'0,025'); lab(2.6,'0,080'); lab(1,'−0,100'); lab(2,'−0,100'); }
  o+=tl(x1+W/2,ym+48,tt('Momente in qL²'),'middle');
  return sv(x2+40,ym+58,tt('Durchlaufträger'),o);
}

// Die vier Eulerfälle
function skEuler(){
  const yb=182, yt=52, L=yb-yt, xs=[50,140,230,320]; let o='';
  const base=(x,clamp)=> clamp ? (()=>{ let r=ln(x-14,yb,x+14,yb,SK.ink,1.6); for(let i=-14;i<=10;i+=5) r+=ln(x+i,yb,x+i+4,yb+5,SK.ink,0.7); return r; })() : supPin(x,yb);
  // oben: Gelenk mit seitlichem Rolllager (horizontal gehalten, lotrecht verschieblich)
  const topRoll=(x)=>`<g transform="translate(${x+3},${yt}) rotate(-90)">${supRoll(0,0)}</g><circle cx="${x}" cy="${yt}" r="2.6" fill="#fff" stroke="${SK.ink}" stroke-width="1.1"/>`;
  // oben: Parallelführung (Verdrehung und Querverschiebung gehalten, lotrecht verschieblich)
  const topClamp=(x)=>{ let r=''; [-1,1].forEach(sd=>{ const xg=x+sd*5; r+=ln(xg,yt-4,xg,yt+18,SK.ink,1.6); for(let y=yt-2;y<=yt+14;y+=5) r+=ln(xg,y,xg+sd*5,y+4,SK.ink,0.7); }); return r; };
  // Form y(s), s=0 unten … 1 oben
  const kL=4.4934, A=-1/Math.tan(kL);
  const raw3=s=>{ const x=s; return A*Math.sin(kL*x)+Math.cos(kL*x)-A*kL*x-1; };
  let m3=0; for(let i=0;i<=100;i++) m3=Math.max(m3,Math.abs(raw3(i/100)));
  const shapes=[ s=>1-Math.cos(Math.PI*s/2), s=>Math.sin(Math.PI*s), s=>Math.abs(raw3(s))/m3, s=>(1-Math.cos(2*Math.PI*s))/2 ];
  const beta=['2,0','1,0','0,7','0,5'], tops=[null,'r','r','c'], bots=[true,false,true,true];
  xs.forEach((x,i)=>{
    const top=yt-(i===0?0:0), amp=i===0?22:18, pts=[];
    for(let j=0;j<=40;j++){ const s=j/40; pts.push([x+amp*shapes[i](s), yb-L*s]); }
    o+=ln(x,yb,x,yt,SK.dim,0.8,'stroke-dasharray="4 3"')+pl(pts,SK.ink,2.4)+base(x,bots[i]);
    const xt=x+amp*shapes[i](1);
    if(tops[i]==='r') o+=topRoll(x); if(tops[i]==='c') o+=topClamp(x);
    o+=vec(xt,yt-30,xt,yt-2,SK.load,1.6);
    o+=it(xt-6,yt-20,'N','end',SK.load,12);
    o+=tl(x,yb+28,_L`Fall ${i+1}`,'middle',SK.ink,10)+it(x,yb+44,`β = ${beta[i]}`,'middle',SK.acc,12);
  });
  o+=dimL(18,yb,18,yt,'L',-0.01,-8);
  return sv(370,238,tt('Eulerfälle'),o);
}

    o+=pl(pts,c,1.5); o+=ln(x0+W+24,40+i*16,x0+W+40,40+i*16,c,2)+tl(x0+W+44,44+i*16,n,'start',c,10.5); });

// Grundbruch: Bruchkörper (Prandtl)
function skGrundbruch(){
  const yS=86, b=40, x1=180, x2=x1+b, d=26, phi=30*Math.PI/180; let o='';
  o+=ln(10,yS-d,390,yS-d,SK.ink,1)+`<rect x="10" y="${yS-d}" width="380" height="${150}" fill="#f5efe4" stroke="none"/>`+ln(10,yS-d,x1-6,yS-d,'#8a6d3b',1.2)+ln(x2+6,yS-d,390,yS-d,'#8a6d3b',1.2);
  // Keil I unter dem Fundament
  const th=Math.PI/4+phi/2, apex=[x1+b/2, yS+(b/2)*Math.tan(th)];
  // Spirale II: r = r0·exp(θ tanφ), Pol an der Fundamentkante x2
  const r0=Math.hypot(apex[0]-x2, apex[1]-yS), a0=Math.atan2(apex[1]-yS, apex[0]-x2), spts=[];
  for(let i=0;i<=30;i++){ const t=i/30*(Math.PI/2), r=r0*Math.exp(t*Math.tan(phi)), a=a0-t; spts.push([x2+r*Math.cos(a), yS+r*Math.sin(a)]); }
  const pE=spts[spts.length-1], xe=pE[0]+(pE[1]-yS)/Math.tan(Math.PI/4-phi/2);
  const L=[[x1,yS],[x2,yS],apex], Rspi=[[x2,yS],...spts], Rk=[[x2,yS],pE,[xe,yS]];
  const mir=p=>[2*(x1+b/2)-p[0],p[1]];
  o+=poly(L,'#e8dcc4','#8a6d3b',1)+poly(Rspi,'#efe4cf','#8a6d3b',1)+poly(Rk,'#e8dcc4','#8a6d3b',1)+poly(Rspi.map(mir),'#efe4cf','#8a6d3b',0.7,'stroke-dasharray="4 3"')+poly(Rk.map(mir),'#e8dcc4','#8a6d3b',0.7,'stroke-dasharray="4 3"');
  o+=pl([[x1,yS],apex,...spts,[xe,yS]],'#8a6d3b',2);   // Boden über der Sohle wirkt nur als Auflast γ·d

function lab(P,Q,t,off=10,c=SK.ink,sz=13){ const dx=Q[0]-P[0], dy=Q[1]-P[1], L=Math.hypot(dx,dy)||1, m=mid(P,Q); return it(m[0]-dy/L*off, m[1]+dx/L*off+4, t, 'middle', c, sz); }

const SCHNEE_ZONEN = { '1':[0.19,0.91,0.65,1], '1a':[0.19,0.91,0.65,1.25], '2':[0.25,1.91,0.85,1], '2a':[0.25,1.91,0.85,1.25], '3':[0.31,2.91,1.10,1] };
function schneeSk(zone, A){
  const [c0,c1,min,f] = SCHNEE_ZONEN[zone];
  return f * Math.max(c0 + c1*((A+140)/760)**2, min);
}
function schneeMu1(alpha){ return alpha<=30 ? 0.8 : alpha<60 ? 0.8*(60-alpha)/30 : 0; }
function updateSchnee(){

  if(!isFinite(A) || !isFinite(a)){ out.innerHTML=tt('Bitte Zahlen eingeben.'); return; }

}

// DATEN — Sohlwiderstand nach DIN 1054:2010-12, A 6.10 (Tabellenverfahren)
// σR,d in kN/m². Nichtbindig: Zeilen d = 0,5/1,0/1,5/2,0 m, Spalten b = 0,5/1,0/1,5/2,0 m.
// Bindig: Werte je Einbindetiefe d = 0,5/1,0/1,5/2,0 m (gelten für b = 0,5 … 2,0 m).
// Werte = 1,4 × zulässiger Sohldruck der DIN 1054:2005 (gerundet); abgeglichen mit
// Baugrundgutachten (gemischtkörnig steif, tonig-schluffig steif) und Programmbeispiel (nichtbindig d = b = 1 m).
// ══════════════════════════════════════════════════
const SOHL_D = [0.5, 1.0, 1.5, 2.0];
const SOHL_NB = {
  nb_gb: { label:'nichtbindig — ohne Setzungsbegrenzung (Tab. A 6.1)', rows:[[280,420,560,700],[380,520,660,800],[480,620,760,900],[560,700,840,980]] },
  nb_s:  { label:'nichtbindig — Setzung begrenzt auf 1–2 cm (Tab. A 6.2)', rows:[[280,420,460,390],[380,520,500,430],[480,620,550,480],[560,700,590,500]] },
};
const SOHL_B = {
  schluff:   { label:'reiner Schluff, steif bis halbfest (Tab. A 6.5)', v:[180,250,310,350] },
  gem_steif: { label:'gemischtkörnig, steif (Tab. A 6.6)',   v:[210,250,310,350] },
  gem_halb:  { label:'gemischtkörnig, halbfest (Tab. A 6.6)', v:[310,390,450,520] },
  gem_fest:  { label:'gemischtkörnig, fest (Tab. A 6.6)',     v:[460,530,620,700] },
  ts_steif:  { label:'tonig-schluffig, steif (Tab. A 6.7)',   v:[170,200,220,250] },
  ts_halb:   { label:'tonig-schluffig, halbfest (Tab. A 6.7)',v:[240,290,350,390] },
  ts_fest:   { label:'tonig-schluffig, fest (Tab. A 6.7)',    v:[390,450,500,560] },
  ton_steif: { label:'Ton, steif (Tab. A 6.8)',               v:[130,150,180,210] },
  ton_halb:  { label:'Ton, halbfest (Tab. A 6.8)',            v:[200,250,290,320] },
  ton_fest:  { label:'Ton, fest (Tab. A 6.8)',                v:[280,340,380,420] },
};
const lerp1 = (xs, ys, x) => { for(let i=0;i<xs.length-1;i++) if(x<=xs[i+1]) return ys[i]+(ys[i+1]-ys[i])*(x-xs[i])/(xs[i+1]-xs[i]); return ys[ys.length-1]; };
// Grundwert aus Tabelle (Interpolation); null = außerhalb des Tabellenbereichs
function sohlGrundwert(art, d, b){
  if(d < 0.5 || d > 2.0) return null;
  if(SOHL_NB[art]){
    if(b < 0.5 || b > 2.0) return null;
    const col = SOHL_NB[art].rows.map(r => lerp1(SOHL_D, r, b));
    return lerp1(SOHL_D, col, d);
  }
  if(b < 0.5 || b > 5.0) return null;
  return lerp1(SOHL_D, SOHL_B[art].v, d);
}
// Vollständige Ermittlung mit Erhöhungen und Abminderungen
function sohlBerechne({art, d, b, a, hv, gw, dicht}){
  const nb = !!SOHL_NB[art], steps = [];
  const g = sohlGrundwert(art, d, b);
  if(g == null) return { err: nb ? tt('Tabellenbereich: Einbindetiefe 0,5 … 2,0 m und Breite 0,5 … 2,0 m.')
                                  : tt('Tabellenbereich: Einbindetiefe 0,5 … 2,0 m und Breite 0,5 … 5,0 m.') };
  if(hv > 0.2) return { err: tt('Die Tabellen gelten nur für H/V ≤ 0,2. Bei größerer Neigung Grundbruch nach DIN 4017 rechnen.') };
  let s = g; steps.push([tt('Tabellenwert'), g]);
  if(!nb && b > 2.0){ const f = 1 - 0.1*(b-2.0); s *= f; steps.push([_L`Breite ${deNum(b,1)} m > 2 m: −10 % je m (× ${deNum(f)})`, s]); }
  const rect = a > 0 && a/b < 2;
  if(rect){ s *= 1.2; steps.push([tt('Rechteck/Kreis mit a/b < 2: +20 %'), s]); }
  if(nb && dicht){ s *= 1.5; steps.push([tt('dichte Lagerung nachgewiesen: +50 %'), s]); }
  if(nb && hv > 0){
    // Richtung von H nicht abgefragt → ungünstiger Faktor (1 − H/V)²
    const f = (1-hv)**2; s *= f; steps.push([_L`Horizontallast H/V = ${deNum(hv)}: × (1 − H/V)² = ${deNum(f,3)}`, s]);
  }
  if(nb && isFinite(gw) && gw < b){
    const red = 0.4 * (1 - Math.max(gw,0)/b), f = 1 - red; s *= f;
    steps.push([_L`Grundwasser ${deNum(Math.max(gw,0),2)} m unter Sohle (< b): −${deNum(red*100,0)} %`, s]);
  }
  return { s, steps, nb, rect };
}
function updateSohl(){
  const out = document.getElementById('sw-out'); if(!out) return;
  const art = document.getElementById('sw-art').value, nb = !!SOHL_NB[art];
  document.querySelectorAll('.sw-nb').forEach(e => e.style.display = nb ? '' : 'none');
  const gwRaw = document.getElementById('sw-gw').value.trim();
  const inp = { art, d:num('sw-d'), b:num('sw-b'), a:num('sw-a')||0, hv:num('sw-hv')||0,
                gw: gwRaw==='' ? Infinity : num('sw-gw'), dicht: document.getElementById('sw-dicht').value==='1' };
  if(!isFinite(inp.d) || !isFinite(inp.b)){ out.innerHTML = tt('Bitte Zahlen eingeben.'); return; }
  const r = sohlBerechne(inp);
  if(r.err){ out.innerHTML = r.err; return; }
  out.innerHTML = r.steps.map(([t,v]) => `${t}: ${deNum(v,0)} kN/m²`).join('<br>')
    + `<br>σ<sub>R,d</sub> = <b>${deNum(r.s,0)} kN/m²</b>`
    + _L`<br><span style="color:#555">Nachweis: σ<sub>E,d</sub> = V<sub>d</sub> / (a′·b′) ≤ σ<sub>R,d</sub></span>`;
}

// ── Biegung: Parabel-Rechteck-Diagramm (ε_c2 = 2 ‰, ε_cu2 = 3,5 ‰), Stahl mit horizontalem Ast, ε_s ≤ 25 ‰ ──
function prBlock(ec){   // Völligkeit α_R und Schwerpunktbeiwert k_a der Betondruckzone
  if(ec<=2) return { aR: ec/12*(6-ec), ka: (8-ec)/(4*(6-ec)) };
  return { aR: (3*ec-2)/(3*ec), ka: (ec*(3*ec-4)+2)/(2*ec*(3*ec-2)) };
}
function biegeState(t){ // t ∈ (0, 2): 0…1 → ε_c 0…3,5 bei ε_s = 25; 1…2 → ε_s 25…ε_yd bei ε_c = 3,5
  const ec = t<=1 ? 3.5*t : 3.5, es = t<=1 ? SB.eud : SB.eud - (t-1)*(SB.eud-SB.eyd);
  const xi = ec/(ec+es), {aR,ka} = prBlock(ec);
  return { ec, es, xi, omega: aR*xi, zeta: 1-ka*xi, mu: aR*xi*(1-ka*xi) };
}
function biegeAusMu(mu){
  if(!(mu>0)) return null;
  let lo=1e-9, hi=2;
  if(mu > biegeState(hi).mu) return null;
  for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(biegeState(m).mu < mu) lo=m; else hi=m; }
  return biegeState((lo+hi)/2);
}
const XI_LIM = 0.45;
const MU_LIM = (()=>{ const {aR,ka}=prBlock(3.5); return aR*XI_LIM*(1-ka*XI_LIM); })();   // 0,296

// ── Querkraft ──
function querkraft({bw, d, fck, Asl, VEd, cot, cv}){   // Einheiten: mm, N/mm², mm², kN
  const k=Math.min(1+Math.sqrt(200/d),2), rho=Math.min(Asl/(bw*d),0.02);
  const k1 = d<=600 ? 0.0525 : d>=800 ? 0.0375 : 0.0525-(d-600)/200*0.015;
  const vmin = k1/SB.gc*Math.pow(k,1.5)*Math.sqrt(fck);
  const vc = 0.15/SB.gc*k*Math.cbrt(100*rho*fck);
  const VRdc = Math.max(vc,vmin)*bw*d/1000;
  const z = Math.min(0.9*d, Math.max(d-2*cv, d-cv-30));
  const nu1 = 0.75*Math.min(1.1-fck/500,1), fcd=fcdOf(fck);
  const VRdmax = bw*z*nu1*fcd/(cot+1/cot)/1000;
  const fctm = BETON.find(r=>r[1]===fck)?.[4] ?? 0.3*fck**(2/3);
  const asw = VEd*1000/(z*SB.fyd*cot)*1000/100;          // cm²/m
  const aswmin = 0.16*fctm/SB.fyk*bw*1000/100;            // cm²/m
  return { k, rho, vmin, vc, VRdc, z, nu1, VRdmax, asw, aswmin, minGov: vmin>vc };
}

// ── Verankerung ──
function verankerung(fctk, ds, gut, ssd){
  const fbd = 2.25*(gut?1:0.7)*(ds<=32?1:(132-ds)/100)*fctk/SB.gc;
  const lbrqd = ds/4*ssd/fbd;
  return { fbd, lbrqd, lbmin: Math.max(0.3*lbrqd, 10*ds, 100) };
}

// ── Biegung mit Druckbewehrung (μ_Eds > μ_lim, ξ = 0,45 festgehalten) ──
function biegeDruck(mu, d, d2){   // liefert ω₁, ω₂ (bezogen auf b·d·f_cd/f_yd bzw. σ_s2), σ_s2
  const {aR} = prBlock(3.5), omLim = aR*XI_LIM;
  const es2 = 3.5*(XI_LIM - d2/d)/XI_LIM;                 // ‰ Stauchung der Druckbewehrung
  const ss2 = Math.min(SB.Es*es2/1000, SB.fyd);
  const dmu = mu - MU_LIM;
  return { omLim, es2, ss2, dmu, om1: omLim + dmu/(1-d2/d), om2: dmu/(1-d2/d)*SB.fyd/ss2 };
}

// ── Plattenbalken ──
// mitwirkende Breite nach EN 1992-1-1, 5.3.2.1
function beffCalc(bw, b1, b2, l0){
  const bi = b => Math.max(0, Math.min(0.2*b + 0.1*l0, 0.2*l0, b));
  return { b1e: bi(b1), b2e: bi(b2), beff: bw + bi(b1) + bi(b2) };
}

// ── Durchstanzen (Flachdecke, DIN EN 1992-1-1/NA 6.4) ──
const DS_BETA = [['1.10','Innenstütze'],['1.40','Randstütze'],['1.50','Eckstütze'],['1.35','Wandende'],['1.20','Wandecke']];
const DS_LAGE = DS_BETA.slice(0,3);   // Rechner: nur Stützen
function durchstanzen({form, cx, cy, dx, dy, rx, ry, fck, VEd, beta, innen}){   // mm, %, N/mm², kN
  const d=(dx+dy)/2, k=Math.min(1+Math.sqrt(200/d),2), fcd=fcdOf(fck);
  const rho=Math.min(Math.sqrt(rx*ry)/100, 0.02, 0.5*fcd/SB.fyd);
  // Lage über β: 1,10 innen, 1,40 Rand (freier Rand parallel zu c_y), 1,50 Ecke — Rundschnitt nur über die Plattenseite
  const lage = beta===1.4 ? 'rand' : beta===1.5 ? 'ecke' : 'innen';
  let u0, u1;
  if(form==='rund'){ const f = lage==='rand' ? 0.5 : lage==='ecke' ? 0.25 : 1; u0=f*Math.PI*cx; u1=f*Math.PI*(cx+4*d); }
  else if(lage==='rand'){ u0=Math.min(cy+3*d, cy+2*cx); u1=2*cx+cy+2*Math.PI*d; }
  else if(lage==='ecke'){ u0=Math.min(3*d, cx+cy); u1=cx+cy+Math.PI*d; }
  else { u0=2*(cx+cy); u1=2*(cx+cy)+4*Math.PI*d; }
  let C = 0.18/SB.gc; const red = innen && u0/d < 4; if(red) C *= 0.1*u0/d + 0.6;
  const k1 = d<=600 ? 0.0525 : d>=800 ? 0.0375 : 0.0525-(d-600)/200*0.015;
  const vmin = k1/SB.gc*Math.pow(k,1.5)*Math.sqrt(fck);
  const vRdc = Math.max(C*k*Math.cbrt(100*rho*fck), vmin);
  const vEd = beta*VEd*1000/(u1*d);
  return { d, k, rho, u0, u1, C, red, vmin, vRdc, vEd, vRdmax: 1.4*vRdc };
}

// ── Rissbreite (DIN EN 1992-1-1/NA 7.3) ──
const dsGrenz = (wk, ss) => wk*3.48e6/(ss*ss);          // Grenzdurchmesser Ø*s [mm], Tab. 7.2DE
function rissbreite({b, h, d, As, ds, M, fck}){            // mm, mm², kNm
  const B=BETON.find(r=>r[1]===fck), Ecm=B[6]*1000, fct=B[4], ae=SB.Es/Ecm;
  const rho=As/(b*d), xi=-ae*rho+Math.sqrt((ae*rho)**2+2*ae*rho), x=xi*d, z=d-x/3;
  const ss=M*1e6/(As*z);
  const hce=Math.min(2.5*(h-d), (h-x)/3, h/2), rpe=As/(b*hce);
  const sr=Math.min(ds/(3.6*rpe), ss*ds/(3.6*fct));
  const de=Math.max((ss-0.4*fct/rpe*(1+ae*rpe))/SB.Es, 0.6*ss/SB.Es);
  return { ae, x, z, ss, hce, rpe, sr, de, wk: sr*de, fct };
}

// ── Stützen: Querschnittsbemessung symmetrisch bewehrt (Dehnungsebenen, Parabel-Rechteck) ──
function sigC(e){ const a=-e; if(a<=0) return 0; return a<2 ? -(1-(1-a/2)**2) : -1; }   // bezogen auf f_cd, Druck negativ (e in ‰)
function sigS(e){ return Math.max(-SB.fyd, Math.min(SB.fyd, SB.Es*e/1000)); }
// Dehnungsebene über t ∈ [0,3]: ε(y) in ‰ für y von oben (0) bis unten (h), Druck negativ
// 0–1: ε_s1 = 25 ‰, Randstauchung 0 → −3,5 ‰ · 1–2: Randstauchung −3,5 ‰, Nulllinie x bis h · 2–3: Drehpunkt in 3h/7 bei −2 ‰
function ebene(t, h, d){
  if(t<=1){ const ec=-3.5*t, es=SB.eud; return y => ec + (es-ec)*y/d; }
  if(t<=2){ const xb=3.5/(3.5+SB.eud)*d, x=xb+(t-1)*(h-xb); return y => -3.5 + 3.5*y/x; }
  const yC=3*h/7, eu=-(t-2)*2; return y => -2 + (eu+2)*(y-yC)/(h-yC);
}
function querschnittNM(t, b, h, d1, As2each, fcd){     // b,h,d1 mm; As je Seite mm² → N [kN], M um Schwerachse [kNm]
  const d=h-d1, eps=ebene(t,h,d), n=200; let N=0, M=0;
  for(let i=0;i<n;i++){ const y=(i+0.5)*h/n, sc=sigC(eps(y))*fcd*b*h/n; N+=sc; M+=sc*(h/2-y); }
  for(const y of [d1, d]){ const F=sigS(eps(y))*As2each; N+=F; M+=F*(h/2-y); }
  return { N:N/1000, M:M/1e6 };
}
function stuetzeMRd(b,h,d1,Aeach,fcd,NEd){   // N_Ed als Druck positiv; null = N zu groß
  const target=-NEd;
  if(querschnittNM(3,b,h,d1,Aeach,fcd).N > target) return null;
  let lo=0, hi=3;
  for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(querschnittNM(m,b,h,d1,Aeach,fcd).N > target) lo=m; else hi=m; }
  const t=(lo+hi)/2; return { M:-querschnittNM(t,b,h,d1,Aeach,fcd).M, t };
}
function stuetzeAs(b,h,d1,fcd,NEd,MEd){   // erforderliche Gesamtbewehrung [mm²], symmetrisch
  const Amax=0.09*b*h;
  const ok=A=>{ const r=stuetzeMRd(b,h,d1,A/2,fcd,NEd); return r && r.M>=MEd; };
  if(ok(0)) return 0;
  if(!ok(Amax)) return null;
  let lo=0, hi=Amax; for(let i=0;i<50;i++){ const m=(lo+hi)/2; if(ok(m)) hi=m; else lo=m; }
  return hi;
}
function stuetzeBerechne({b, h, d1, l, beta, NEd, M0, fck}){   // cm, m, kN, kNm
  const fcd=fcdOf(fck), l0=beta*l, i=h/Math.sqrt(12)/100, lam=l0/i;
  const n=NEd*1000/(b*h*100*fcd), lamlim = n>=0.41 ? 25 : 16/Math.sqrt(Math.max(n,1e-9));
  const ah=Math.min(1,Math.max(2/3, 2/Math.sqrt(l))), ei=ah/200*l0/2;   // m
  const e0=Math.max(M0/NEd, h/30/100, 0.02);
  let e2=0, K1=0;
  if(lam>lamlim){ K1 = lam>35 ? 1 : Math.max(0, lam/10-2.5); const d=(h-d1)/100; e2 = K1*(SB.eyd/1000/(0.45*d))*l0*l0/10; }
  const MEd=NEd*(e0+ei+e2);
  const As=stuetzeAs(b*10,h*10,d1*10,fcd,NEd,MEd);
  const Asmin=0.15*NEd*1000/SB.fyd;
  return { fcd, l0, lam, lamlim, n, ei, e0, e2, K1, MEd, As, Asmin, schlank: lam>lamlim };
}

// ── kd-Tafel (B500, Parabel-Rechteck, ohne Druckbewehrung) ──
// kd = d[cm] / √(M[kNm] / b[m]) = √(10 / (μ · f_cd)),  ks = A_s[cm²] · d[cm] / M[kNm] = 1000 / (ζ · f_yd)
const KD_KL = [20,25,30,35,40,45,50];
function kdTafel(){
  const rows=[]; for(let i=1;i<=30;i++){ const mu=i/100; if(mu>MU_LIM+1e-9) break; const st=biegeAusMu(mu); rows.push([...KD_KL.map(fck=>deNum(Math.sqrt(10/(mu*fcdOf(fck))),2)), deNum(1000/(st.zeta*SB.fyd),2), deNum(st.xi,3), deNum(st.zeta,3), deNum(st.ec,2), deNum(st.es,1)]); }
  return rows;
}
function updateKD(){
  const out=document.getElementById('kd-out'); if(!out) return;

  if(!(b>0&&d>0&&M>0)){ out.innerHTML=tt('Bitte b, d, M > 0 eingeben.'); return; }
  const fcd=fcdOf(B[1]), kd=d/Math.sqrt(M/b), mu=10/(kd*kd*fcd), st=biegeAusMu(mu);
  const S=[`§Eingangswert`, `k<sub>d</sub> = d / √(M<sub>Eds</sub> / b) = ${dB(d,1)} / √(${dB(M,1)} / ${dB(b,2)}) = ${dB(kd,3)}`,
    `!entspricht μ<sub>Eds</sub> = 10 / (k<sub>d</sub>² · f<sub>cd</sub>) = 10 / (${dB(kd,3)}² · ${dB(fcd)}) = ${dB(mu,4)}`];

  const ks=1000/(st.zeta*SB.fyd), As=ks*M/d;
  S.push(`§Tafelwert`, `!ξ = ${dB(st.xi,3)} · ζ = ${dB(st.zeta,3)} → k<sub>s</sub> = 1000 / (ζ · f<sub>yd</sub>) = 1000 / (${dB(st.zeta,3)} · 434,8) = ${dB(ks,3)}`,
    `§Bewehrung`, `A<sub>s</sub> = k<sub>s</sub> · M<sub>Eds</sub> / d = ${dB(ks,3)} · ${dB(M,1)} / ${dB(d,1)} = ${dB(As)} cm²`);

// ── Kriechen und Schwinden (EN 1992-1-1, 3.1.4 und Anhang B) ──
const ZEMENT = { S:{t:'S (langsam, 32,5 N)', a:-1, ds1:3, ds2:0.13}, N:{t:'N (normal, 32,5 R / 42,5 N)', a:0, ds1:4, ds2:0.12}, R:{t:'R (schnell, 42,5 R / 52,5)', a:1, ds1:6, ds2:0.11} };
function khSchwinden(h0){ const P=[[100,1.0],[200,0.85],[300,0.75],[500,0.70]]; if(h0<=100) return 1; if(h0>=500) return 0.7;
  for(let i=1;i<P.length;i++) if(h0<=P[i][0]){ const [x0,y0]=P[i-1],[x1,y1]=P[i]; return y0+(y1-y0)*(h0-x0)/(x1-x0); } }
function kriechen(o){
  const fcm=o.fck+8, h0=2*o.Ac/o.u, Z=ZEMENT[o.z];
  const a1=(35/fcm)**0.7, a2=(35/fcm)**0.2;
  const phiRH = fcm<=35 ? 1+(1-o.RH/100)/(0.1*Math.cbrt(h0)) : (1+(1-o.RH/100)/(0.1*Math.cbrt(h0))*a1)*a2;
  const bfcm=16.8/Math.sqrt(fcm), t0=Math.max(0.5, o.t0*(9/(2+o.t0**1.2)+1)**Z.a), bt0=1/(0.1+t0**0.2);
  const phi0=phiRH*bfcm*bt0;
  const bRH=1.55*(1-(o.RH/100)**3), ecd0=0.85*((220+110*Z.ds1)*Math.exp(-Z.ds2*fcm/10))*1e-6*bRH, kh=khSchwinden(h0);
  const ecd=kh*ecd0, eca=2.5*(o.fck-10)*1e-6, ecs=ecd+eca;
  return { fcm, h0, a1, a2, phiRH, bfcm, t0, bt0, phi0, bRH, ecd0, kh, ecd, eca, ecs, Z };
}

      : _L`φ<sub>RH</sub> = [1 + (1 − RH/100) / (0,1 · h<sub>0</sub><sup>1/3</sup>) · α<sub>1</sub>] · α<sub>2</sub> mit α<sub>1</sub> = (35/f<sub>cm</sub>)<sup>0,7</sup> = ${f(r.a1,3)}, α<sub>2</sub> = (35/f<sub>cm</sub>)<sup>0,2</sup> = ${f(r.a2,3)} → ${f(r.phiRH,3)}`,
    `β(f<sub>cm</sub>) = 16,8 / √f<sub>cm</sub> = 16,8 / √${r.fcm} = ${f(r.bfcm,3)}`,
    _L`!Zement ${r.Z.t}: t<sub>0</sub> = t<sub>0,T</sub> · (9/(2 + t<sub>0,T</sub><sup>1,2</sup>) + 1)<sup>α</sup> mit α = ${r.Z.a} → t<sub>0</sub> = ${f(r.t0,2)} Tage`,
    `β(t<sub>0</sub>) = 1 / (0,1 + t<sub>0</sub><sup>0,20</sup>) = 1 / (0,1 + ${f(r.t0**0.2,3)}) = ${f(r.bt0,3)}`,
    `φ(∞, t<sub>0</sub>) = ${f(r.phiRH,3)} · ${f(r.bfcm,3)} · ${f(r.bt0,3)} = ${f(r.phi0,2)}`,
    `§Trocknungsschwinden ε<sub>cd,∞</sub> = k<sub>h</sub> · ε<sub>cd,0</sub>`,

  const fcd=fcdOf(B[1]), A=b*h, u=2*(b+h), tef=Math.max(A/u, 2*c), Ak=(b-tef)*(h-tef), uk=2*((b-tef)+(h-tef));

  const d=h-c, z=0.9*d, VRdmax=b*z*(0.75*Math.min(1.1-B[1]/500,1))*fcd/(cot+1/cot)/1000, inter=(T/TRdmax)**2+(V/VRdmax)**2;

}

// Erddruck (Rankine: senkrechte, glatte Wand, waagerechtes Gelände)
function erdK(phi){ const t=Math.tan((45-phi/2)*Math.PI/180)**2; return {Ka:t, Kp:1/t, K0:1-Math.sin(phi*Math.PI/180)}; }
function updateErd(){
  const out=document.getElementById('ed-out'); if(!out) return;
  const phi=num('ed-phi'), g=num('ed-g'), h=num('ed-h'), q=num('ed-q');
  if(![phi,g,h,q].every(isFinite) || phi<=0 || phi>=60){ out.innerHTML=tt('Bitte gültige Werte eingeben (0° < φ′ < 60°).'); return; }
  const {Ka,Kp,K0}=erdK(phi);
  const Eag=0.5*g*h*h*Ka, Eaq=q*h*Ka;
  const zR = (Eag*h/3 + Eaq*h/2)/(Eag+Eaq||1);
  out.innerHTML = _L`K<sub>a</sub> = <b>${deNum(Ka,3)}</b> &nbsp;·&nbsp; K<sub>p</sub> = <b>${deNum(Kp,3)}</b> &nbsp;·&nbsp; K<sub>0</sub> = <b>${deNum(K0,3)}</b><br>
    e<sub>a</sub> am Wandfuß = (γ·h + q)·K<sub>a</sub> = <b>${deNum((g*h+q)*Ka)} kN/m²</b><br>
    E<sub>a</sub> = ½·γ·h²·K<sub>a</sub> + q·h·K<sub>a</sub> = ${deNum(Eag)} + ${deNum(Eaq)} = <b>${deNum(Eag+Eaq)} kN/m</b>, Angriff ${deNum(zR)} m über dem Fuß`;
}

// Einheiten in den Rechnungen: kN, cm (f_y in kN/cm² = N/mm² / 10)
// ══════════════════════════════════════════════════
const E_ST = 21000, G_ST = 8100;                    // kN/cm²
const GM0 = 1.0, GM1 = 1.1, GM2 = 1.25;
const KNICK_ALPHA = { a0:0.13, a:0.21, b:0.34, c:0.49, d:0.76 };
const stRow = st => STAHL.find(s=>s[0]===st) || STAHL[0];
const stFy = (st,t) => t<=40 ? stRow(st)[1] : stRow(st)[3];
const stFu = (st,t) => t<=40 ? stRow(st)[2] : stRow(st)[4];
const d1 = (v,n=1) => deNum(v,n), dk = v => deNum(v,0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const ok = (eta) => eta<=1.0005 ? _L`<b class="ok-t">✓ erfüllt</b>` : _L`<b class="bad-t">✗ nicht erfüllt</b>`;
// Profilauswahl mit Gruppen
function selProf(id, def, on, typen=['I']){
  const groups = {};
  for(const [n,p] of Object.entries(PROF)) if(typen.includes(p.typ)) (groups[p.reihe] ||= []).push(n);
  return `<select id="${id}" onchange="${on}">${Object.entries(groups).map(([g,ns])=>`<optgroup label="${g}">${ns.map(n=>`<option${n===def?' selected':''}>${n}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
const selSt = (id, def, on) => sel(id, STAHL.map(s=>[s[0],s[0]]), def, on);
const valOf = id => document.getElementById(id)?.value;

// Knicklinie nach EN 1993-1-1, Tab. 6.2 (gewalzte I-Profile)
function knickLinie(name, axis, st='S235'){
  const p = PROF[name]; if(!p) return 'b';
  const s460 = st==='S460', hb = p.h/p.b;
  if(p.typ==='RHS' || p.typ==='CHS') return s460 ? 'a0' : 'a';
  if(p.typ!=='I') return 'c';
  if(hb>1.2) return p.tf<=40 ? (s460?'a0':(axis==='y'?'a':'b')) : (s460?'a':(axis==='y'?'b':'c'));
  return p.tf<=100 ? (s460?'a':(axis==='y'?'b':'c')) : (s460?'c':'d');
}
function chiOf(lb, alpha){
  if(lb<=0.2) return 1;
  const Phi=0.5*(1+alpha*(lb-0.2)+lb*lb);
  return Math.min(1, 1/(Phi+Math.sqrt(Phi*Phi-lb*lb)));
}

// ── Querschnittsklassen (Tab. 5.2) für gewalzte I-Profile ──
// art: 'druck' | 'biegung' | 'nm' (Druck + Biegung um y; N, M aus Eingabe)
function klassifiziere(p, fy, art, N=0, M=0){
  const eps=Math.sqrt(235/fy), S=[];
  const cf=(p.b-p.tw-2*p.r)/2, rf=cf/p.tf;
  const kf = rf<=9*eps?1 : rf<=10*eps?2 : rf<=14*eps?3 : 4;
  const flansch = art==='biegung' || art==='druck' || art==='nm';
  const cw=p.h-2*p.tf-2*p.r, rw=cw/p.tw;
  let kw, gw='', alpha=null, psi=null;
  if(art==='druck'){ kw = rw<=33*eps?1 : rw<=38*eps?2 : rw<=42*eps?3 : 4; gw=`33ε = ${d1(33*eps)} · 38ε = ${d1(38*eps)} · 42ε = ${d1(42*eps)}`; }
  else if(art==='biegung'){ kw = rw<=72*eps?1 : rw<=83*eps?2 : rw<=124*eps?3 : 4; gw=`72ε = ${d1(72*eps)} · 83ε = ${d1(83*eps)} · 124ε = ${d1(124*eps)}`; }
  else {
    // plastisch: Anteil α der gedrückten Steghöhe; elastisch: Spannungsverhältnis ψ
    alpha = Math.min(1, Math.max(0, 0.5*(1 + N/(cw/10*p.tw/10*fy/10))));
    const g1 = alpha>0.5 ? 396*eps/(13*alpha-1) : 36*eps/alpha, g2 = alpha>0.5 ? 456*eps/(13*alpha-1) : 41.5*eps/alpha;
    const sN=N/p.A, sM=M*100/p.Iy*(cw/20), s1=sN+sM, s2=sN-sM; psi = s1>0 ? Math.max(-3, s2/s1) : 1;
    const g3 = psi>-1 ? 42*eps/(0.67+0.33*psi) : 62*eps*(1-psi)*Math.sqrt(-psi);
    kw = rw<=g1?1 : rw<=g2?2 : rw<=g3?3 : 4;
    gw=`α = ${d1(alpha,3)}: Kl. 1 ≤ ${d1(g1)} · Kl. 2 ≤ ${d1(g2)} · ψ = ${d1(psi,3)}: Kl. 3 ≤ ${d1(g3)}`;
  }
  return { eps, cf, rf, kf, cw, rw, kw, gw, alpha, psi, kl: Math.max(flansch?kf:1, kw),
    gf:`9ε = ${d1(9*eps)} · 10ε = ${d1(10*eps)} · 14ε = ${d1(14*eps)}` };
}
function klasseSchritte(p, fy, k, artTxt){
  return [
    `§Querschnittsklasse (EN 1993-1-1, Tab. 5.2) — ${artTxt}`,
    `ε = √(235 / f<sub>y</sub>) = √(235 / ${dk(fy)}) = ${d1(k.eps,3)}`,
    _L`!Flansch (einseitig gestützt, Druck): c = (b − t<sub>w</sub> − 2r) / 2`,
    `c = (${d1(p.b)} − ${d1(p.tw)} − 2 · ${d1(p.r)}) / 2 = ${d1(k.cf)} mm`,
    `c / t<sub>f</sub> = ${d1(k.cf)} / ${d1(p.tf)} = ${d1(k.rf,2)}`,
    _L`!Grenzen ${k.gf} → Flansch Klasse ${k.kf}`,
    _L`!Steg (beidseitig gestützt): c = h − 2t<sub>f</sub> − 2r`,
    `c = ${d1(p.h)} − 2 · ${d1(p.tf)} − 2 · ${d1(p.r)} = ${d1(k.cw)} mm`,
    `c / t<sub>w</sub> = ${d1(k.cw)} / ${d1(p.tw)} = ${d1(k.rw,2)}`,
    _L`!Grenzen ${k.gw} → Steg Klasse ${k.kw}`,
    _L`!Der Querschnitt hat die ungünstigere Klasse: <b>Klasse ${k.kl}</b>`,
  ];
}

  const N=num('qn-N')||0, M=Math.abs(num('qn-M')||0), V=Math.abs(num('qn-V')||0);
  const fy=stFy(st,p.tf), f=fy/10, k=klassifiziere(p,fy, N>0 ? 'nm' : 'biegung', Math.max(N,0), M);
  const S=[_L`§Werkstoff und Profil`, `!${n}: A = ${d1(p.A,2)} cm², W<sub>pl,y</sub> = ${d1(p.Wply,1)} cm³, W<sub>el,y</sub> = ${d1(p.Wy,1)} cm³, A<sub>vz</sub> = ${d1(p.Avz,2)} cm² · f<sub>y</sub> = ${dk(fy)} N/mm²`,
    _L`!Querschnittsklasse für ${N>0?tt('Druck und Biegung'):tt('Biegung')}: Flansch c/t = ${d1(k.rf,2)} (Kl. ${k.kf}), Steg c/t = ${d1(k.rw,2)} (Kl. ${k.kw}) → <b>Klasse ${k.kl}</b>`];
  if(k.kl===4){ out.innerHTML = ablauf(tt('Querschnittsnachweis'), S.concat([tt('!Klasse 4: wirksamer Querschnitt nach EN 1993-1-5 nötig — hier nicht abgedeckt.')])); return; }
  const Npl=p.A*f/GM0, Vpl=p.Avz*f/Math.sqrt(3)/GM0, hw=p.hw, eta=1.2, eps=k.eps;
  S.push(`§Querkraft (6.2.6)`,
    `V<sub>pl,z,Rd</sub> = A<sub>vz</sub> · f<sub>y</sub> / (√3 · γ<sub>M0</sub>) = ${d1(p.Avz,2)} · ${d1(f,2)} / √3 = ${d1(Vpl,1)} kN`,
    `V<sub>Ed</sub> / V<sub>pl,z,Rd</sub> = ${d1(V,1)} / ${d1(Vpl,1)} = ${d1(V/Vpl,3)} ≤ 1 ${ok(V/Vpl)}`,
    `!Schubbeulen: h<sub>w</sub>/t<sub>w</sub> = ${d1(hw,1)} / ${d1(p.tw)} = ${d1(hw/p.tw,1)} ${hw/p.tw<=72*eps/eta?'≤':'>'} 72ε/η = ${d1(72*eps/eta,1)} (η = 1,2) → ${hw/p.tw<=72*eps/eta?tt('kein Beulnachweis nötig'):tt('Schubbeulen nach EN 1993-1-5 nachweisen')}`);
  let MRd, uM, txtM=[];
  if(k.kl<=2){
    let Mpl=p.Wply*f/GM0/100, Mv=Mpl;
    S.push(`§Biegung (6.2.5)`, `M<sub>pl,y,Rd</sub> = W<sub>pl,y</sub> · f<sub>y</sub> / γ<sub>M0</sub> = ${d1(p.Wply,1)} · ${d1(f,2)} / 100 = ${d1(Mpl,1)} kNm`);
    if(V>0.5*Vpl){
      const rho=(2*V/Vpl-1)**2, Aw=hw*p.tw/100;
      Mv=Math.min(Mpl, (p.Wply-rho*Aw*Aw/(4*p.tw/10))*f/GM0/100);
      S.push(_L`!V<sub>Ed</sub> > 0,5 · V<sub>pl,Rd</sub> → Abminderung der Biegetragfähigkeit (6.2.8)`,
        `ρ = (2 · V<sub>Ed</sub> / V<sub>pl,Rd</sub> − 1)² = (2 · ${d1(V/Vpl,3)} − 1)² = ${d1(rho,3)}`,
        `A<sub>w</sub> = h<sub>w</sub> · t<sub>w</sub> = ${d1(hw/10,2)} · ${d1(p.tw/10,2)} = ${d1(Aw,2)} cm²`,
        `M<sub>y,V,Rd</sub> = (W<sub>pl,y</sub> − ρ · A<sub>w</sub>² / (4 t<sub>w</sub>)) · f<sub>y</sub> / γ<sub>M0</sub> = (${d1(p.Wply,1)} − ${d1(rho,3)} · ${d1(Aw,2)}² / (4 · ${d1(p.tw/10,2)})) · ${d1(f,2)} / 100 = ${d1(Mv,1)} kNm`);
    } else S.push(_L`!V<sub>Ed</sub> = ${d1(V,1)} kN ≤ 0,5 · V<sub>pl,Rd</sub> = ${d1(0.5*Vpl,1)} kN → keine Abminderung aus Querkraft`);
    MRd=Mv;
    if(N!==0){
      const nn=Math.abs(N)/Npl, a=Math.min(0.5,(p.A*100-2*p.b*p.tf)/(p.A*100));
      S.push(_L`§Normalkraft und Biegung (6.2.9.1)`,
        `N<sub>pl,Rd</sub> = A · f<sub>y</sub> / γ<sub>M0</sub> = ${d1(p.A,2)} · ${d1(f,2)} = ${d1(Npl,1)} kN`,
        `|N<sub>Ed</sub>| / N<sub>pl,Rd</sub> = ${d1(Math.abs(N),1)} / ${d1(Npl,1)} = ${d1(nn,3)} ≤ 1 ${ok(nn)}`);
      const lim2=0.5*hw*p.tw/100*f/GM0;
      if(Math.abs(N)<=0.25*Npl && Math.abs(N)<=lim2){
        S.push(_L`!|N<sub>Ed</sub>| ≤ 0,25 · N<sub>pl,Rd</sub> = ${d1(0.25*Npl,1)} kN und ≤ 0,5 · h<sub>w</sub> · t<sub>w</sub> · f<sub>y</sub> / γ<sub>M0</sub> = ${d1(lim2,1)} kN → Normalkraft darf bei M<sub>y</sub> unberücksichtigt bleiben`);
      } else {
        const MN=Math.min(MRd, MRd*(1-nn)/(1-0.5*a));
        S.push(`n = ${d1(nn,3)} · a = (A − 2 · b · t<sub>f</sub>) / A = (${d1(p.A,2)} − 2 · ${d1(p.b/10,1)} · ${d1(p.tf/10,2)}) / ${d1(p.A,2)} = ${d1(a,3)} ≤ 0,5`,
          `M<sub>N,y,Rd</sub> = M<sub>y,Rd</sub> · (1 − n) / (1 − 0,5 · a) = ${d1(MRd,1)} · (1 − ${d1(nn,3)}) / (1 − 0,5 · ${d1(a,3)}) = ${d1(MN,1)} kNm`);
        if(V>0.5*Vpl) S.push(_L`!vereinfacht: Abminderung aus Querkraft und Normalkraft nacheinander angesetzt`);
        MRd=MN;
      }
    }
    uM=M/MRd;
    S.push(`§Nachweis`, `M<sub>y,Ed</sub> / M<sub>y,Rd</sub> = ${d1(M,1)} / ${d1(MRd,1)} = ${d1(uM,3)} ≤ 1 ${ok(uM)}`);
  } else {
    const sig=N/p.A+M*100/p.Wy, sv=Math.abs(sig)*10;
    S.push(_L`§Elastischer Nachweis (Klasse 3, 6.2.1 (7))`,
      `σ<sub>x,Ed</sub> = N<sub>Ed</sub> / A + M<sub>y,Ed</sub> / W<sub>el,y</sub> = ${d1(N,1)} / ${d1(p.A,2)} + ${d1(M*100,0)} / ${d1(p.Wy,1)} = ${d1(sig,2)} kN/cm²`,
      `σ<sub>x,Ed</sub> / (f<sub>y</sub> / γ<sub>M0</sub>) = ${d1(sv,1)} / ${dk(fy)} = ${d1(sv/fy,3)} ≤ 1 ${ok(sv/fy)}`);
    uM=sv/fy;
    if(V>0.5*Vpl) S.push(_L`!V<sub>Ed</sub> > 0,5 · V<sub>pl,Rd</sub>: zusätzlich Vergleichsspannung σ<sub>v</sub> = √(σ² + 3τ²) nachweisen`);
  }
  out.innerHTML = ablauf(_L`Querschnittsnachweis ${n}, ${st}`, S) + _L`<div class="info-banner">Maßgebende Ausnutzung: <b>${d1(Math.max(uM, V/Vpl)*100,0)} %</b></div>`;
}

// ── Biegeknicken (6.3.1) ──
function updateKnick(){
  const out=document.getElementById('kn-out'); if(!out) return;
  const name=valOf('kn-prof'), st=valOf('kn-st'), axis=valOf('kn-ax'), p=PROF[name];
  const Lcr=num('kn-L'), NEd=num('kn-N')||0;
  if(!isFinite(Lcr) || Lcr<=0){ out.innerHTML=tt('Bitte eine Knicklänge > 0 eingeben.'); return; }
  const A=p.A, i=axis==='y'?p.iy:p.iz, I=axis==='y'?p.Iy:p.Iz;
  const fy=stFy(st,p.tf), lam1=Math.PI*Math.sqrt(210000/fy);
  const lam=Lcr*100/i, lb=lam/lam1, kl=knickLinie(name,axis,st), al=KNICK_ALPHA[kl];
  const Phi=0.5*(1+al*(lb-0.2)+lb*lb), chi=chiOf(lb,al);
  const Npl=A*fy/10, Nb=chi*Npl/GM1, Ncr=Math.PI**2*E_ST*I/(Lcr*100)**2;
  const S=[_L`§Querschnittswerte ${name} (Achse ${axis}–${axis})`,
    `!A = ${d1(A,2)} cm² · I<sub>${axis}</sub> = ${d1(I,1)} cm⁴ · i<sub>${axis}</sub> = ${d1(i,3)} cm · t<sub>f</sub> = ${d1(p.tf)} mm → f<sub>y</sub> = ${dk(fy)} N/mm²`,
    `§Schlankheit`,
    `λ = L<sub>cr</sub> / i = ${d1(Lcr*100,0)} / ${d1(i,3)} = ${d1(lam,1)}`,
    `λ<sub>1</sub> = π · √(E / f<sub>y</sub>) = π · √(210000 / ${dk(fy)}) = ${d1(lam1,1)}`,
    `λ̄ = λ / λ<sub>1</sub> = ${d1(lam,1)} / ${d1(lam1,1)} = ${d1(lb,3)}`,
    _L`!Kontrolle über N<sub>cr</sub> = π² · E · I / L<sub>cr</sub>² = ${dk(Ncr)} kN → λ̄ = √(A · f<sub>y</sub> / N<sub>cr</sub>) = ${d1(Math.sqrt(Npl/Ncr),3)}`,
    _L`§Knicklinie und Abminderung`,
    _L`!h/b = ${d1(p.h/p.b,2)} ${p.h/p.b>1.2?'> 1,2':'≤ 1,2'}, t<sub>f</sub> = ${d1(p.tf)} mm, ${st} → Knicklinie <b>${kl}</b>, α = ${deNum(al)}`];
  if(lb<=0.2) S.push(_L`!λ̄ ≤ 0,2 → χ = 1,000 (kein Stabilitätsverlust maßgebend)`);
  else S.push(`Φ = 0,5 · (1 + α · (λ̄ − 0,2) + λ̄²) = 0,5 · (1 + ${deNum(al)} · (${d1(lb,3)} − 0,2) + ${d1(lb,3)}²) = ${d1(Phi,3)}`,
    `χ = 1 / (Φ + √(Φ² − λ̄²)) = 1 / (${d1(Phi,3)} + √(${d1(Phi,3)}² − ${d1(lb,3)}²)) = ${d1(chi,3)}`);
  S.push(_L`§Tragfähigkeit`,
    `N<sub>b,Rd</sub> = χ · A · f<sub>y</sub> / γ<sub>M1</sub> = ${d1(chi,3)} · ${d1(A,2)} · ${d1(fy/10,2)} / ${deNum(GM1)} = ${dk(Nb)} kN`);
  if(NEd>0) S.push(`N<sub>Ed</sub> / N<sub>b,Rd</sub> = ${d1(NEd,1)} / ${d1(Nb,1)} = ${d1(NEd/Nb,3)} ≤ 1 ${ok(NEd/Nb)}`);
  out.innerHTML = ablauf(_L`Biegeknicken ${name}, ${st}, L<sub>cr</sub> = ${d1(Lcr,2)} m`, S);
}

// ── Biegedrillknicken (6.3.2) ──
// C1 bei linearem Momentenverlauf, Gabellagerung k = kw = 1 (NCCI SN003a, Tab. 3.1)
const C1_LIN = [[-1,2.55],[-0.75,2.57],[-0.5,2.33],[-0.25,2.05],[0,1.77],[0.25,1.52],[0.5,1.31],[0.75,1.14],[1,1.00]];
const c1Lin = ps => { ps=Math.max(-1,Math.min(1,ps)); for(let i=0;i<C1_LIN.length-1;i++){ const [a,ca]=C1_LIN[i],[b,cb]=C1_LIN[i+1]; if(ps<=b) return ca+(cb-ca)*(ps-a)/(b-a); } return 1; };
const BDK_FALL = {
  M:   { t:'konstantes Moment', C1:()=>1.0, C2:0, kc:()=>1.0 },
  q:   { t:'Gleichstreckenlast', C1:()=>1.13, C2:0.45, kc:()=>0.94 },
  F:   { t:'Einzellast in Feldmitte', C1:()=>1.35, C2:0.63, kc:()=>0.90 },
  psi: { t:'linearer Momentenverlauf ψ', C1:psi=>c1Lin(psi), C2:0, kc:psi=>1/(1.33-0.33*psi) },
};
function mcrOf(p, Lcm, fall, psi, zg){
  const F=BDK_FALL[fall], C1=F.C1(psi), C2=F.C2, a=Math.PI**2*E_ST*p.Iz/Lcm**2;
  const root=Math.sqrt(p.Iw/p.Iz + Lcm**2*G_ST*p.It/(Math.PI**2*E_ST*p.Iz) + (C2*zg)**2);
  return { C1, C2, a, root, Mcr: C1*a*(root - C2*zg) };   // kNcm
}
function chiLT(p, lbLT, kc, lb0=0.4, beta=0.75){
  const kl = p.h/p.b<=2 ? 'b' : 'c', al=KNICK_ALPHA[kl];
  const Phi=0.5*(1+al*(lbLT-lb0)+beta*lbLT*lbLT);
  let chi = lbLT<=lb0 ? 1 : Math.min(1, 1/(Phi+Math.sqrt(Phi*Phi-beta*lbLT*lbLT)), 1/(lbLT*lbLT));
  const f = Math.min(1, 1-0.5*(1-kc)*(1-2*(lbLT-0.8)**2));
  return { kl, al, Phi, chi, f, chiMod: Math.min(1, chi/f, 1/(lbLT*lbLT)) };
}
function updateBDK(){
  const out=document.getElementById('bd-out'); if(!out) return;
  const n=valOf('bd-prof'), st=valOf('bd-st'), fall=valOf('bd-fall'), zgk=valOf('bd-zg'), p=PROF[n];
  const L=num('bd-L'), psi=Math.max(-1,Math.min(1,num('bd-psi')||0)), M=Math.abs(num('bd-M')||0);
  document.getElementById('bd-psi-f').style.display = fall==='psi' ? '' : 'none';
  document.getElementById('bd-zg-f').style.display = fall==='q'||fall==='F' ? '' : 'none';
  if(!(L>0)){ out.innerHTML=tt('Bitte L > 0 eingeben.'); return; }
  const fy=stFy(st,p.tf), f=fy/10, Lcm=L*100;
  const zg = fall==='M'||fall==='psi' ? 0 : {o:p.h/20, s:0, u:-p.h/20}[zgk];
  const kq=klassifiziere(p,fy,'biegung'), W = kq.kl<=2 ? p.Wply : p.Wy;
  const r=mcrOf(p,Lcm,fall,psi,zg), lbLT=Math.sqrt(W*f/r.Mcr), F=BDK_FALL[fall], kc=F.kc(psi), c=chiLT(p,lbLT,kc);
  const MbRd=c.chiMod*W*f/GM1/100;
  const S=[`§Querschnittswerte ${n}, ${st}`,
    `!I<sub>z</sub> = ${d1(p.Iz,1)} cm⁴ · I<sub>t</sub> = ${d1(p.It,2)} cm⁴ · I<sub>w</sub> = ${dk(p.Iw)} cm⁶ · ${kq.kl<=2?_L`Klasse ${kq.kl} → W<sub>y</sub> = W<sub>pl,y</sub>`:_L`Klasse ${kq.kl} → W<sub>y</sub> = W<sub>el,y</sub>`} = ${d1(W,1)} cm³ · f<sub>y</sub> = ${dk(fy)} N/mm²`,
    _L`§Ideales Kippmoment M<sub>cr</sub> (Gabellagerung, k = k<sub>w</sub> = 1)`,
    _L`!${F.t}${fall==='psi'?` = ${d1(psi,2)}`:''} → C<sub>1</sub> = ${d1(r.C1,3)}, C<sub>2</sub> = ${d1(r.C2,2)} · Lastangriff z<sub>g</sub> = ${d1(zg,2)} cm ${zg>0?tt('(Obergurt, ungünstig)'):zg<0?tt('(Untergurt, günstig)'):tt('(Schubmittelpunkt)')}`,
    `!M<sub>cr</sub> = C<sub>1</sub> · π² · E · I<sub>z</sub> / L² · [√(I<sub>w</sub>/I<sub>z</sub> + L² · G · I<sub>t</sub> / (π² · E · I<sub>z</sub>) + (C<sub>2</sub> · z<sub>g</sub>)²) − C<sub>2</sub> · z<sub>g</sub>]`,
    `π² · E · I<sub>z</sub> / L² = π² · 21000 · ${d1(p.Iz,1)} / ${dk(Lcm)}² = ${d1(r.a,1)} kN`,
    `√(…) = √(${d1(p.Iw/p.Iz,1)} + ${d1(Lcm**2*G_ST*p.It/(Math.PI**2*E_ST*p.Iz),1)} + ${d1((r.C2*zg)**2,1)}) = ${d1(r.root,2)} cm`,
    `M<sub>cr</sub> = ${d1(r.C1,3)} · ${d1(r.a,1)} · (${d1(r.root,2)} − ${d1(r.C2*zg,2)}) = ${dk(r.Mcr)} kNcm = ${d1(r.Mcr/100,1)} kNm`,
    _L`§Schlankheit und Abminderung (6.3.2.3, gewalzte Profile)`,
    `λ̄<sub>LT</sub> = √(W<sub>y</sub> · f<sub>y</sub> / M<sub>cr</sub>) = √(${d1(W,1)} · ${d1(f,2)} / ${dk(r.Mcr)}) = ${d1(lbLT,3)}`,
    `!h/b = ${d1(p.h/p.b,2)} ${p.h/p.b<=2?tt('≤ 2 → Knicklinie b'):tt('> 2 → Knicklinie c')}, α<sub>LT</sub> = ${deNum(c.al)} · λ̄<sub>LT,0</sub> = 0,4 · β = 0,75`];
  if(lbLT<=0.4) S.push(_L`!λ̄<sub>LT</sub> ≤ 0,4 → χ<sub>LT</sub> = 1 (kein Biegedrillknicken)`);
  else S.push(`Φ<sub>LT</sub> = 0,5 · (1 + α<sub>LT</sub> · (λ̄<sub>LT</sub> − 0,4) + 0,75 · λ̄<sub>LT</sub>²) = ${d1(c.Phi,3)}`,
    `χ<sub>LT</sub> = 1 / (Φ<sub>LT</sub> + √(Φ<sub>LT</sub>² − 0,75 · λ̄<sub>LT</sub>²)) = ${d1(c.chi,3)}`,
    `k<sub>c</sub> = ${d1(kc,3)} · f = 1 − 0,5 · (1 − k<sub>c</sub>) · (1 − 2 · (λ̄<sub>LT</sub> − 0,8)²) = ${d1(c.f,3)} ≤ 1`,
    `χ<sub>LT,mod</sub> = χ<sub>LT</sub> / f = ${d1(c.chi,3)} / ${d1(c.f,3)} = ${d1(c.chiMod,3)} ≤ 1`);
  S.push(`§Nachweis`,
    `M<sub>b,Rd</sub> = χ<sub>LT,mod</sub> · W<sub>y</sub> · f<sub>y</sub> / γ<sub>M1</sub> = ${d1(c.chiMod,3)} · ${d1(W,1)} · ${d1(f,2)} / (${deNum(GM1)} · 100) = ${d1(MbRd,1)} kNm`);
  if(M>0) S.push(`M<sub>y,Ed</sub> / M<sub>b,Rd</sub> = ${d1(M,1)} / ${d1(MbRd,1)} = ${d1(M/MbRd,3)} ≤ 1 ${ok(M/MbRd)}`);
  out.innerHTML = ablauf(_L`Biegedrillknicken ${n}, L = ${d1(L,2)} m`, S);
}

// ── Biegung und Druck: Ersatzstabverfahren 6.3.3 mit Anhang B (Tab. B.2, verdrehweiche I-Profile) ──
const CM_FALL = { psi:{t:'linear (Randmomente)', cm:psi=>Math.max(0.4,0.6+0.4*psi)}, q:{t:'Gleichstreckenlast', cm:()=>0.95}, F:{t:'Einzellast', cm:()=>0.90} };
function updateNMI(){
  const out=document.getElementById('in-out'); if(!out) return;
  const n=valOf('in-prof'), st=valOf('in-st'), fall=valOf('in-fall'), p=PROF[n];
  const Ly=num('in-Ly'), Lz=num('in-Lz'), N=Math.abs(num('in-N')||0), M=Math.abs(num('in-M')||0), psi=Math.max(-1,Math.min(1,num('in-psi')||0));
  document.getElementById('in-psi-f').style.display = fall==='psi' ? '' : 'none';
  if(!(Ly>0 && Lz>0)){ out.innerHTML=tt('Bitte Knicklängen > 0 eingeben.'); return; }
  const fy=stFy(st,p.tf), f=fy/10, lam1=Math.PI*Math.sqrt(210000/fy);
  const k=klassifiziere(p,fy,'nm',N,M), W = k.kl<=2 ? p.Wply : p.Wy;
  if(k.kl===4){ out.innerHTML = ablauf(tt('Biegung und Druck'), [tt('!Querschnitt Klasse 4 — nicht abgedeckt.')]); return; }
  const NRk=p.A*f, MRk=W*f/100;
  const lby=Ly*100/p.iy/lam1, lbz=Lz*100/p.iz/lam1, ky=knickLinie(n,'y',st), kz=knickLinie(n,'z',st);
  const chy=chiOf(lby,KNICK_ALPHA[ky]), chz=chiOf(lbz,KNICK_ALPHA[kz]);
  const bf = fall==='psi' ? 'psi' : fall, r=mcrOf(p,Lz*100,bf,psi,0), lbLT=Math.sqrt(W*f/r.Mcr), kc=BDK_FALL[bf].kc(psi), c=chiLT(p,lbLT,kc);
  const Cm=CM_FALL[fall].cm(psi), ny=N/(chy*NRk/GM1), nz=N/(chz*NRk/GM1);
  const kyy=Math.min(Cm*(1+(lby-0.2)*ny), Cm*(1+0.8*ny));
  let kzy, kzyTxt;
  if(lbz>=0.4){ kzy=Math.max(1-0.1*lbz*nz/(Cm-0.25), 1-0.1*nz/(Cm-0.25)); kzyTxt=`k<sub>zy</sub> = 1 − 0,1 · λ̄<sub>z</sub> · n<sub>z</sub> / (C<sub>mLT</sub> − 0,25) ≥ 1 − 0,1 · n<sub>z</sub> / (C<sub>mLT</sub> − 0,25) → ${d1(kzy,3)}`; }
  else { kzy=Math.min(0.6+lbz, 1-0.1*lbz*nz/(Cm-0.25)); kzyTxt=`λ̄<sub>z</sub> < 0,4: k<sub>zy</sub> = 0,6 + λ̄<sub>z</sub> ≤ 1 − 0,1 · λ̄<sub>z</sub> · n<sub>z</sub> / (C<sub>mLT</sub> − 0,25) → ${d1(kzy,3)}`; }
  const MbR=c.chiMod*MRk/GM1, e61=ny+kyy*M/MbR, e62=nz+kzy*M/MbR;
  const S=[`§Querschnitt`, _L`!${n}, ${st}: f<sub>y</sub> = ${dk(fy)} N/mm² · Klasse ${k.kl} → W<sub>y</sub> = ${k.kl<=2?'W<sub>pl,y</sub>':'W<sub>el,y</sub>'} = ${d1(W,1)} cm³`,
    `N<sub>Rk</sub> = A · f<sub>y</sub> = ${d1(p.A,2)} · ${d1(f,2)} = ${d1(NRk,1)} kN`,
    `M<sub>y,Rk</sub> = W<sub>y</sub> · f<sub>y</sub> = ${d1(W,1)} · ${d1(f,2)} / 100 = ${d1(MRk,1)} kNm`,
    `§Biegeknicken`,
    `λ̄<sub>y</sub> = L<sub>cr,y</sub> / (i<sub>y</sub> · λ<sub>1</sub>) = ${dk(Ly*100)} / (${d1(p.iy,3)} · ${d1(lam1,1)}) = ${d1(lby,3)}`,
    `!Knicklinie ${ky} → χ<sub>y</sub> = ${d1(chy,3)}`,

// ── Schrauben: Abscheren und Lochleibung (EN 1993-1-8, Tab. 3.4) ──
// [Bezeichnung, d, d0, A (Schaft), A_s (Spannungsquerschnitt)] in mm, mm²
const SCHRAUBEN = [['M12',12,13,113,84.3],['M16',16,18,201,157],['M20',20,22,314,245],['M22',22,24,380,303],['M24',24,26,452,353],['M27',27,30,573,459],['M30',30,33,707,561],['M36',36,39,1018,817]];
const SKLASSEN = [['4.6',240,400],['5.6',300,500],['8.8',640,800],['10.9',900,1000]];
function updateSchraube(){
  const out=document.getElementById('sr-out'); if(!out) return;
  const sb=SCHRAUBEN.find(s=>s[0]===valOf('sr-d')), kl=SKLASSEN.find(s=>s[0]===valOf('sr-kl')), gew=valOf('sr-fuge')==='g';
  const m=+valOf('sr-m'), st=valOf('sr-st'), t=num('sr-t'), e1=num('sr-e1'), e2=num('sr-e2'), p1=num('sr-p1'), p2=num('sr-p2');
  const n1=Math.max(1,Math.round(num('sr-n1')||1)), n2=Math.max(1,Math.round(num('sr-n2')||1)), F=num('sr-F')||0;
  if(!(t>0 && e1>0 && e2>0)){ out.innerHTML=tt('Bitte t, e<sub>1</sub>, e<sub>2</sub> > 0 eingeben.'); return; }
  const [, d, d0, As0, As] = sb, fub=kl[2], fyb=kl[1], fu=stFu(st,t);
  const av = gew ? (kl[0]==='10.9' ? 0.5 : 0.6) : 0.6, Aq = gew ? As : As0;
  const Fv = m*av*fub*Aq/GM2/1000;
  const S=[_L`§Schraube und Blech`,
    _L`!${sb[0]} ${kl[0]}: d = ${d} mm, d<sub>0</sub> = ${d0} mm, A = ${As0} mm², A<sub>s</sub> = ${deNum(As,1)} mm², f<sub>ub</sub> = ${fub} N/mm² · Blech ${st}, t = ${d1(t)} mm, f<sub>u</sub> = ${fu} N/mm²`,
    _L`§Rand- und Lochabstände (Tab. 3.3, Mindestwerte)`,
    `!e<sub>1</sub> = ${d1(e1)} ${e1>=1.2*d0?'≥':'<'} 1,2 · d<sub>0</sub> = ${d1(1.2*d0)} mm · e<sub>2</sub> = ${d1(e2)} ${e2>=1.2*d0?'≥':'<'} ${d1(1.2*d0)} mm`
      + (n1>1?` · p<sub>1</sub> = ${d1(p1)} ${p1>=2.2*d0?'≥':'<'} 2,2 · d<sub>0</sub> = ${d1(2.2*d0)} mm`:'') + (n2>1?` · p<sub>2</sub> = ${d1(p2)} ${p2>=2.4*d0?'≥':'<'} 2,4 · d<sub>0</sub> = ${d1(2.4*d0)} mm`:''),
    _L`§Abscheren je Schraube`,
    _L`!Scherfuge im ${gew?tt('Gewinde → A = A<sub>s</sub>'):tt('Schaft → A = Schaftquerschnitt')}, α<sub>v</sub> = ${deNum(av,1)}, ${m} ${m>1?'Scherfugen':'Scherfuge'}`,
    `F<sub>v,Rd</sub> = n · α<sub>v</sub> · f<sub>ub</sub> · A / γ<sub>M2</sub> = ${m} · ${deNum(av,1)} · ${fub} · ${deNum(Aq,1)} / ${deNum(GM2)} = ${d1(Fv,1)} kN`,
    `§Lochleibung (Tab. 3.4)`];
  // k1 quer zur Kraft: Randreihe (e2) bzw. innere Reihe (p2)
  const k1R = Math.min(2.8*e2/d0-1.7, n2>1 ? 1.4*p2/d0-1.7 : 99, 2.5), k1I = Math.min(1.4*p2/d0-1.7, 2.5);
  const adE = e1/(3*d0), adI = n1>1 ? p1/(3*d0)-0.25 : null, rf=fub/fu;
  const abE = Math.min(adE, rf, 1), abI = adI===null ? null : Math.min(adI, rf, 1);
  const Fb = (k1,ab) => k1*ab*fu*d*t/GM2/1000;
  S.push(_L`!α<sub>b</sub> = min(α<sub>d</sub>; f<sub>ub</sub>/f<sub>u</sub>; 1) mit f<sub>ub</sub>/f<sub>u</sub> = ${fub}/${fu} = ${d1(rf,3)}`,
    _L`α<sub>d</sub> (Endschraube) = e<sub>1</sub> / (3 · d<sub>0</sub>) = ${d1(e1)} / (3 · ${d0}) = ${d1(adE,3)} → α<sub>b</sub> = ${d1(abE,3)}`);
  if(adI!==null) S.push(_L`α<sub>d</sub> (innere Schraube) = p<sub>1</sub> / (3 · d<sub>0</sub>) − 1/4 = ${d1(p1)} / (3 · ${d0}) − 0,25 = ${d1(adI,3)} → α<sub>b</sub> = ${d1(abI,3)}`);
  S.push(_L`k<sub>1</sub> (Randreihe) = min(2,8 · e<sub>2</sub>/d<sub>0</sub> − 1,7${n2>1?'; 1,4 · p<sub>2</sub>/d<sub>0</sub> − 1,7':''}; 2,5) = ${d1(k1R,3)}`);
  if(n2>2) S.push(_L`k<sub>1</sub> (innere Reihe) = min(1,4 · p<sub>2</sub>/d<sub>0</sub> − 1,7; 2,5) = ${d1(k1I,3)}`);
  S.push(`!F<sub>b,Rd</sub> = k<sub>1</sub> · α<sub>b</sub> · f<sub>u</sub> · d · t / γ<sub>M2</sub>`);
  // alle Schrauben: Reihe i (in Kraftrichtung), Spalte j (quer)
  const list=[];
  for(let i=0;i<n1;i++) for(let j=0;j<n2;j++){ const rand = j===0 || j===n2-1, k1 = rand ? k1R : k1I, ab = i===0 ? abE : abI; list.push({i,j,k1,ab,Fb:Fb(k1,ab)}); }
  const seen=new Set();
  list.forEach(b=>{ const key=`${b.i===0?'E':'I'}${b.k1===k1R?'R':'I'}`; if(seen.has(key)) return; seen.add(key);
    S.push(`F<sub>b,Rd</sub> (${b.i===0?'End':'innere'}schraube, ${b.k1===k1R?tt('Randreihe'):tt('innere Reihe')}) = ${d1(b.k1,3)} · ${d1(b.ab,3)} · ${fu} · ${d} · ${d1(t)} / ${deNum(GM2)} = ${d1(b.Fb,1)} kN`); });
  const allFvGe = list.every(b=>Fv>=b.Fb);
  const FRd = allFvGe ? list.reduce((s,b)=>s+b.Fb,0) : list.length*Math.min(...list.map(b=>Math.min(Fv,b.Fb)));
  S.push(_L`§Tragfähigkeit der Verbindung (3.7)`,
    allFvGe ? _L`!F<sub>v,Rd</sub> ≥ F<sub>b,Rd</sub> für alle Schrauben → Summe der Lochleibungswiderstände`
            : _L`!F<sub>v,Rd</sub> < F<sub>b,Rd</sub> bei mindestens einer Schraube → n · kleinster Einzelwiderstand`,
    _L`F<sub>Rd</sub> = ${d1(FRd,1)} kN (${list.length} Schrauben)`);
  if(F>0) S.push(`F<sub>Ed</sub> / F<sub>Rd</sub> = ${d1(F,1)} / ${d1(FRd,1)} = ${d1(F/FRd,3)} ≤ 1 ${ok(F/FRd)}`);
  const Lj=(n1-1)*p1; if(Lj>15*d) S.push(_L`!Anschlusslänge L<sub>j</sub> = ${d1(Lj)} mm > 15 d → Abminderung β<sub>Lf</sub> für lange Anschlüsse (3.8) beachten`);
  out.innerHTML = ablauf(_L`Schraubenverbindung ${n1} × ${n2} ${sb[0]} ${kl[0]}`, S);
}

// ── Kehlnähte: vereinfachtes Verfahren (EN 1993-1-8, 4.5.3.3) ──
const BETA_W = { S235:0.8, S275:0.85, S355:0.9, S420:0.88, S460:0.85 };   // S420/S460 nach DIN EN 1993-1-8/NA (EN: 1,0)
function updateKehl(){
  const out=document.getElementById('kw-out'); if(!out) return;
  const st=valOf('kw-st'), a=num('kw-a'), l=num('kw-l'), nN=Math.max(1,Math.round(num('kw-n')||1)), F=num('kw-F')||0, t1=num('kw-t1'), t2=num('kw-t2');
  if(!(a>0 && l>0 && t1>0 && t2>0)){ out.innerHTML=tt('Bitte a, l, t<sub>1</sub>, t<sub>2</sub> > 0 eingeben.'); return; }
  const tmin=Math.min(t1,t2), tmax=Math.max(t1,t2), fu=stFu(st,tmax), bw=BETA_W[st];
  const amin=Math.max(3, Math.sqrt(tmax)-0.5), amax=0.7*tmin, leff=l-2*a;
  const fvw=fu/(Math.sqrt(3)*bw*GM2), FwRd=fvw*a/1000, FRd=nN*leff*FwRd;
  const S=[_L`§Grenzwerte der Nahtdicke`,
    `!a = ${d1(a)} mm · a<sub>min</sub> = max(3 mm; √t<sub>max</sub> − 0,5) = max(3; √${d1(tmax)} − 0,5) = ${d1(amin,2)} mm · a<sub>max</sub> = 0,7 · t<sub>min</sub> = 0,7 · ${d1(tmin)} = ${d1(amax,2)} mm → ${a>=amin-1e-9 && a<=amax+1e-9 ? 'eingehalten' : tt('<b>nicht eingehalten</b>')}`,
    `l<sub>eff</sub> = l − 2 · a = ${d1(l)} − 2 · ${d1(a)} = ${d1(leff)} mm ${leff>=Math.max(30,6*a)?'≥':'<'} max(30 mm; 6a) = ${d1(Math.max(30,6*a))} mm`,
    _L`§Festigkeit der Naht`,
    `!${st}: f<sub>u</sub> = ${fu} N/mm², β<sub>w</sub> = ${deNum(bw,2)}`,
    `f<sub>vw,d</sub> = f<sub>u</sub> / (√3 · β<sub>w</sub> · γ<sub>M2</sub>) = ${fu} / (√3 · ${deNum(bw,2)} · ${deNum(GM2)}) = ${d1(fvw,1)} N/mm²`,
    `F<sub>w,Rd</sub> = f<sub>vw,d</sub> · a = ${d1(fvw,1)} · ${d1(a)} / 1000 = ${d1(FwRd,3)} kN/mm`,
    _L`§Tragfähigkeit`,
    `F<sub>Rd</sub> = n · l<sub>eff</sub> · F<sub>w,Rd</sub> = ${nN} · ${d1(leff)} · ${d1(FwRd,3)} = ${d1(FRd,1)} kN`];
  if(F>0) S.push(`F<sub>Ed</sub> / F<sub>Rd</sub> = ${d1(F,1)} / ${d1(FRd,1)} = ${d1(F/FRd,3)} ≤ 1 ${ok(F/FRd)}`);
  if(leff>150*a) S.push(_L`!l<sub>eff</sub> > 150 a: Abminderung β<sub>Lw</sub> für lange Nähte (4.11) beachten`);
  out.innerHTML = ablauf(_L`Kehlnaht a = ${d1(a)} mm`, S);
}

let profileFilter = 'IPE';
const PCOLS = {

};
const DEC = { A:2, G:1, iy:2, iz:2, i:2, iu:2, iv:2, Avz:2, It:2, e:2, ez:2, Iw:0 };

// ══════════════════════════════════════════════════
// BEISPIELRECHNUNGEN (ref v0.3.10): Lastkombination, zusammengesetzter Querschnitt, Gleichungen
// ══════════════════════════════════════════════════
const fz = (v,n=1) => deNum(v,n);
// ── Lastannahmen: Kombination für eine Stütze (vier Einwirkungen) ──
const KB = { G:180, N:90, S:60, W:20, psi:{ N:[0.7,0.5,0.3], S:[0.5,0.2,0], W:[0.6,0.2,0] }, name:{ N:'Nutzlast (Kat. B)', S:'Schnee', W:'Wind' } };
function kombiRechnung(){
  const Q=['N','S','W'], gz=[], gzg={c:[],h:[]};
  for(const L of Q){
    const rest=Q.filter(k=>k!==L);
    gz.push({ L, v:1.35*KB.G + 1.5*KB[L] + rest.reduce((s,k)=>s+1.5*KB.psi[k][0]*KB[k],0), rest });

// ── Stahlbau: zusammengesetzter (geschweißter) I-Querschnitt ──
function zqGeom(o){ // alle Maße in mm, z von Oberkante nach unten
  const P=[ {b:o.bo, t:o.to, z0:0}, {b:o.tw, t:o.hw, z0:o.to}, {b:o.bu, t:o.tu, z0:o.to+o.hw} ];
  const A=P.reduce((s,p)=>s+p.b*p.t,0), Sz=P.reduce((s,p)=>s+p.b*p.t*(p.z0+p.t/2),0), zs=Sz/A;
  const Iy=P.reduce((s,p)=>s+p.b*p.t**3/12+p.b*p.t*(p.z0+p.t/2-zs)**2,0), h=o.to+o.hw+o.tu;
  // Fläche oberhalb z
  const Aab = z => P.reduce((s,p)=>s+p.b*Math.max(0,Math.min(p.t, z-p.z0)),0);
  let lo=0, hi=h; for(let i=0;i<100;i++){ const m=(lo+hi)/2; if(Aab(m)<A/2) lo=m; else hi=m; } const zpl=(lo+hi)/2;
  const Sab = z => P.reduce((s,p)=>{ const t=Math.max(0,Math.min(p.t,z-p.z0)); return s+p.b*t*(z-(p.z0+t/2)); },0);
  const Sbe = z => P.reduce((s,p)=>{ const t0=Math.max(p.z0,z), t=Math.max(0,p.z0+p.t-t0); return s+p.b*t*((t0+t/2)-z); },0);
  const Wpl=Sab(zpl)+Sbe(zpl);
  return { P, A, zs, Iy, h, zpl, Wpl, Wo:Iy/zs, Wu:Iy/(h-zs) };
}
function zqKlasse(o, fy){
  const g=zqGeom(o), eps=Math.sqrt(235/fy), w=Math.SQRT2*o.a;
  const cf=(o.bo-o.tw)/2-w, rf=cf/o.to, kf = rf<=9*eps?1 : rf<=10*eps?2 : rf<=14*eps?3 : 4;
  const c=o.hw-2*w, zt=o.to+w, zb=o.to+o.hw-w, rw=c/o.tw;
  const cc=Math.min(c, Math.max(0, g.zpl-zt)), alpha=cc/c;
  const g1 = alpha>0.5 ? 396*eps/(13*alpha-1) : 36*eps/alpha, g2 = alpha>0.5 ? 456*eps/(13*alpha-1) : 41.5*eps/alpha;
  const s1=g.zs-zt, s2=g.zs-zb, psi=s2/s1;                // σ ~ (z_s − z), Druck oben positiv
  const g3 = psi>-1 ? 42*eps/(0.67+0.33*psi) : 62*eps*(1-psi)*Math.sqrt(-psi);
  const kw = rw<=g1?1 : rw<=g2?2 : rw<=g3?3 : 4;
  return { g, eps, w, cf, rf, kf, c, rw, cc, alpha, g1, g2, g3, psi, kw, kl:Math.max(kf,kw) };
}

// ── Mathematik: Beispiele zu Gleichungen ──
function quadBeispiel(){
  const b=30, d=46, As=12.6, n=15, p=2*n*As/b, q=-2*n*As*d/b, D=(p/2)**2-q, x1=-p/2+Math.sqrt(D), x2=-p/2-Math.sqrt(D);
  return { p, q, D, x1, x2, html: ablauf(tt('Beispiel: Druckzonenhöhe x im Zustand II (Rechteckquerschnitt)'), [
    _L`§Ansatz: Die Nulllinie liegt im Schwerpunkt des ideellen Querschnitts`,
    _L`!b = ${b} cm, d = ${d} cm, A<sub>s</sub> = ${fz(As)} cm², α<sub>e</sub> = E<sub>s</sub>/E<sub>c</sub> = ${n} · statisches Moment Druckzone = statisches Moment Stahl`,
    `!b · x²/2 = α<sub>e</sub> · A<sub>s</sub> · (d − x)`,
    `§Normalform x² + p · x + q = 0 (durch b/2 teilen)`,
    `p = 2 · α<sub>e</sub> · A<sub>s</sub> / b = 2 · ${n} · ${fz(As)} / ${b} = ${fz(p,2)} cm`,
    `q = −2 · α<sub>e</sub> · A<sub>s</sub> · d / b = −2 · ${n} · ${fz(As)} · ${d} / ${b} = ${fz(q,2)} cm²`,
    `§p-q-Formel`,
    `(p/2)² − q = ${fz(p/2,2)}² − (${fz(q,2)}) = ${fz(D,2)}`,
    `x<sub>1</sub> = −p/2 + √(${fz(D,2)}) = −${fz(p/2,2)} + ${fz(Math.sqrt(D),3)} = ${fz(x1,2)} cm`,

// Gauß-Verfahren 3×3 mit Rechenweg
function gaussSchritte(A, b){
  let sw=1; const M=A.map((r,i)=>[...r, b[i]]), S=[], n=3, mat = () => `<table class="gmat">${M.map(r=>`<tr>${r.map((v,j)=>`<td${j===3?' class="gb"':''}>${fz(Math.abs(v)<1e-12?0:v,3)}</td>`).join('')}</tr>`).join('')}</table>`;
  S.push(tt('§Erweiterte Koeffizientenmatrix (A | b)'), '!'+mat());
  for(let k=0;k<n-1;k++){
    if(Math.abs(M[k][k])<1e-12){ const j=[...Array(n).keys()].find(i=>i>k && Math.abs(M[i][k])>1e-12); if(j===undefined) return { S:S.concat([tt('!Keine eindeutige Lösung (Determinante 0)')]), x:null };
      [M[k],M[j]]=[M[j],M[k]]; sw=-sw; S.push(_L`!Pivot null → Zeile ${k+1} und ${j+1} tauschen`, '!'+mat()); }
    S.push(_L`§Spalte ${k+1}: Nullen unter dem Pivot a<sub>${k+1}${k+1}</sub> = ${fz(M[k][k],3)}`);
    for(let i=k+1;i<n;i++){ const fct=M[i][k]/M[k][k]; if(Math.abs(fct)<1e-12) continue;
      for(let j=k;j<=n;j++) M[i][j]-=fct*M[k][j];
      S.push(`!Z${i+1} ← Z${i+1} − (${fz(fct,4)}) · Z${k+1}`); }
    S.push('!'+mat());
  }
  if(Math.abs(M[2][2])<1e-12) return { S:S.concat([tt('!a₃₃ = 0 → keine eindeutige Lösung')]), x:null };
  const x=[0,0,0];
  S.push(tt('§Rückwärts einsetzen'));
  for(let i=n-1;i>=0;i--){ let sum=M[i][n]; let txt=`${fz(M[i][n],3)}`; for(let j=i+1;j<n;j++){ sum-=M[i][j]*x[j]; txt+=` − (${fz(M[i][j],3)}) · ${fz(x[j],4)}`; }
    x[i]=sum/M[i][i]; S.push(`x<sub>${i+1}</sub> = (${txt}) / ${fz(M[i][i],3)} = ${fz(x[i],4)}`); }
  const det=sw*M[0][0]*M[1][1]*M[2][2];
  S.push('§Kontrolle', _L`!det A = Produkt der Pivots (bei Zeilentausch Vorzeichen wechseln) = ${fz(det,3)} ≠ 0 → eindeutig lösbar`);
  return { S, x };
}
function updateGauss(){
  const out=document.getElementById('gs-out'); if(!out) return;
  const A=[0,1,2].map(i=>[0,1,2].map(j=>num(`gs-a${i}${j}`))), b=[0,1,2].map(i=>num(`gs-b${i}`));
  if([...A.flat(),...b].some(v=>!isFinite(v))){ out.innerHTML=tt('Bitte alle 12 Zahlen eingeben.'); return; }
  const r=gaussSchritte(A,b);
  if(r.x) r.S.push(...[0,1,2].map(i=>_L`Zeile ${i+1}: ${A[i].map((v,j)=>`${fz(v,2)} · ${fz(r.x[j],3)}`).join(' + ')} = ${fz(A[i].reduce((s,v,j)=>s+v*r.x[j],0),3)} = b<sub>${i+1}</sub> ✓`));
  out.innerHTML = ablauf(tt('Gauß-Verfahren'), r.S) + (r.x ? _L`<div class="info-banner">Lösung: x<sub>1</sub> = <b>${fz(r.x[0],4)}</b>, x<sub>2</sub> = <b>${fz(r.x[1],4)}</b>, x<sub>3</sub> = <b>${fz(r.x[2],4)}</b></div>` : '');
}

const QART = { nA:{t:'Nutzlast Kat. A/B (Wohnen, Büro)', kled:'2', p0:0.7, p2:0.3}, nC:{t:'Nutzlast Kat. C (Versammlung)', kled:'3', p0:0.7, p2:0.6}, nD:{t:'Nutzlast Kat. D (Verkauf)', kled:'2', p0:0.7, p2:0.6}, s:{t:'Schnee (bis 1000 m)', kled:'3', p0:0.5, p2:0}, w:{t:'Wind', kled:'wind', p0:0.6, p2:0} };
function holzEinfeld(o){
  const m=holzMat(o.cls), b=o.b, h=o.h, L=o.L*1000, nkl=o.nkl, Q=QART[o.qa];

  LK.forEach(k=>k.r=k.w/k.km); const mg = LK[0].r>LK[1].r ? LK[0] : LK[1];

}
