  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

    body { font-family:'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; position: relative; }

    .main { padding: 1rem; max-width: 560px; margin: 0 auto; }

    .card-title { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1.2px; font-family: 'DM Mono', monospace; margin-bottom: 12px; }

    /* Tile grid for navigation */
    .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    a.tile:hover { border-color: var(--accent); background: var(--accent-bg); transform: translateY(-1px); }
    .tile.soon { opacity: 0.55; }
    .tile-tag { display:inline-block; font-family:'DM Mono',monospace; font-size:11px; font-weight:600; letter-spacing:1px; color:var(--text3); margin-bottom:8px; text-transform:uppercase; }
    .tile-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .tile-sub { font-size: 11px; color: var(--text3); line-height: 1.4; }

    /* List item navigation */
    .nav-list { display: flex; flex-direction: column; gap: 6px; }
    .nav-list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.92); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 13px 15px; text-decoration: none; color: inherit; transition: all 0.15s; font-family:'DM Sans', sans-serif; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

    /* Search */
    .search { position: relative; margin-bottom: 12px; }

    /* Page heading */
    .page-head { margin-bottom: 1rem; }

    .page-sub { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5; }

    /* Section heading inside content */
    .section-head { font-size: 13px; font-weight: 600; color: var(--text); margin: 4px 0 8px; }
    .section-note { font-size: 12.5px; color: var(--text2); line-height: 1.65; margin-bottom: 10px; }

    /* Data tables — erste Spalte bleibt beim waagerechten Scrollen stehen */
    .data-table-wrap { overflow-x: auto; margin: 8px 0 4px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; font-family:'DM Mono', monospace; white-space: nowrap; }
    table.data th { background: var(--surface2); color: var(--text2); font-weight: 600; padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border-dark); }
    table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; }
    table.data th:first-child { background: var(--surface2); }
    table.data td { padding: 6px 9px; text-align: right; border-bottom: 1px solid var(--surface2); color: var(--text); background: var(--surface); }
    table.data td:first-child { font-weight: 600; color: var(--text); box-shadow: 1px 0 0 var(--surface2); }
    table.data tr:last-child td { border-bottom: none; }
    table.data tbody tr { cursor: pointer; }
    table.data tbody tr:hover td { background: var(--wood-bg); }
    table.data tr.row-highlight td { background: var(--accent-bg); }
    table.data.text-cols th:first-child, table.data.text-cols td:first-child { white-space: normal; min-width: 110px; max-width: 170px; }
    table.data.text-table { white-space: normal; }
    table.data.text-table td, table.data.text-table th { text-align: left; }
    table.data.text-table td:not(:first-child) { min-width: 90px; }
    .table-hint { font-size: 10.5px; color: var(--text3); font-family:'DM Mono', monospace; margin-top: 2px; }

    /* Legend / footnote */
    .legend { font-size: 11px; color: var(--text3); line-height: 1.75; margin-top: 8px; font-family:'DM Mono', monospace; }
    .legend b { color: var(--text2); font-weight: 600; }

    /* Formula box */
    .formula-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin: 8px 0; font-family:'DM Mono', monospace; font-size: 12px; color: var(--text); line-height: 1.9; overflow-x: auto; }
    .formula-box .comment { color: var(--text3); font-size: 11px; line-height: 1.6; margin-top: 4px; }

    .footnote { text-align: center; font-size: 11px; color: var(--text3); margin-top: 1.5rem; font-family:'DM Mono', monospace; }

    /* Cross-app links */
    .applink { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family:'DM Mono', monospace; color: var(--accent); background: var(--accent-bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; margin-top: 6px; text-decoration: none; }
    a.applink:hover { border-color: var(--accent); }
    .applink.soon { color: var(--text3); background: var(--surface2); cursor: default; }

    /* Info / Hinweis */
    .info-banner { background: var(--wood-bg); border: 1px solid #e0cba0; border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12px; color: #6b4f23; line-height: 1.6; margin: 8px 0 10px; }
    .norm-note { background: var(--accent-bg); border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12px; color: #1e3a8a; line-height: 1.6; margin: 8px 0 10px; }

    /* Rechner */
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .calc-field label { display: block; font-size: 11px; font-family:'DM Mono', monospace; color: var(--text3); margin-bottom: 3px; }
    .calc-field select { width: 100%; padding: 7px 8px; font-size: 13px; font-family:'DM Sans', sans-serif; border: 1px solid var(--border-dark); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
    .calc-out { font-size: 12px; font-family:'DM Mono', monospace; color: var(--text2); margin-bottom: 6px; line-height: 1.7; }
    .calc-out b { color: var(--text); }

    /* Abbildungen (schwarz-weiß) */
    .figure { margin: 6px 0 4px; }
    .figure svg { display: block; width: 100%; height: auto; }
    .shape-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:6px 0 12px; }
    .shape { background:#fff; border:1px solid #eceef1; border-radius:12px; padding:8px 10px 10px; }
    .shape-fig svg { display:block; width:100%; height:auto; }
    .shape-t { font-size:12.5px; font-weight:600; color:var(--text); margin:4px 0 5px; }
    .shape-f { font-size:11.5px; font-family:'DM Mono', monospace; color:var(--text2); line-height:1.65; }
    .shape-f div { display:flex; justify-content:space-between; gap:8px; }
    .shape-f b { color:var(--text); font-weight:500; text-align:right; }
    .skfig { min-width:0; }
    .sk-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; align-items:start; }
    .figure-cap { font-size: 11px; color: var(--text3); font-family:'DM Mono', monospace; margin-top: 4px; line-height: 1.6; }

    .hidden { display: none; }

    @media print {
      body::before, .app-header, .nav, .search, .applink { display: none !important; }
      body { background: white; padding: 0; }
      .main { max-width: none; }
      .card { break-inside: avoid; box-shadow: none; }
      table.data th:first-child, table.data td:first-child { position: static; }
    }

// Lagersymbole mit Reaktionen
function figLager(){
  const hatch = (x,y,w) => { let s=`<line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="#111" stroke-width="1.3"/>`;
    for(let i=0;i<=w;i+=5) s+=`<line x1="${x-w/2+i}" y1="${y}" x2="${x-w/2+i-4}" y2="${y+5}" stroke="#111" stroke-width="0.8"/>`; return s; };
  let s = `<svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lagersymbole: Loslager, Festlager, Einspannung, Gelenk">${SVG_DEFS}`;
  // Loslager
  let x=45; s += `<line x1="${x-30}" y1="40" x2="${x+10}" y2="40" stroke="#111" stroke-width="3"/>
    <polygon points="${x},40 ${x-9},56 ${x+9},56" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <circle cx="${x-5}" cy="60" r="3" fill="#fff" stroke="#111"/><circle cx="${x+5}" cy="60" r="3" fill="#fff" stroke="#111"/>${hatch(x,64,26)}
    <line x1="${x}" y1="98" x2="${x}" y2="72" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>${T(x+4,92,'V')}
    ${T(x,118,'Loslager','text-anchor="middle"')}${T(x,131,'1-wertig','text-anchor="middle" fill="#555"')}`;
  // Festlager
  x=135; s += `<line x1="${x-30}" y1="40" x2="${x+10}" y2="40" stroke="#111" stroke-width="3"/>
    <polygon points="${x},40 ${x-9},58 ${x+9},58" fill="#fff" stroke="#111" stroke-width="1.3"/>${hatch(x,58,26)}
    <line x1="${x}" y1="98" x2="${x}" y2="70" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>${T(x+4,92,'V')}
    <line x1="${x-30}" y1="80" x2="${x-8}" y2="80" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>${T(x-30,76,'H')}
    ${T(x,118,'Festlager','text-anchor="middle"')}${T(x,131,'2-wertig','text-anchor="middle" fill="#555"')}`;
  // Einspannung
  x=225; s += `<line x1="${x}" y1="40" x2="${x+40}" y2="40" stroke="#111" stroke-width="3"/>
    <line x1="${x}" y1="24" x2="${x}" y2="56" stroke="#111" stroke-width="1.6"/>`;
  for(let i=0;i<=32;i+=5) s+=`<line x1="${x}" y1="${24+i}" x2="${x-5}" y2="${28+i}" stroke="#111" stroke-width="0.8"/>`;
  s += `<line x1="${x+14}" y1="98" x2="${x+14}" y2="70" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>${T(x+18,92,'V')}
    <line x1="${x-24}" y1="78" x2="${x-4}" y2="78" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>${T(x-24,74,'H')}
    <path d="M ${x+30} 62 A 12 12 0 1 1 ${x+42} 50" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>${T(x+44,74,'M')}
    ${T(x+10,118,'Einspannung','text-anchor="middle"')}${T(x+10,131,'3-wertig','text-anchor="middle" fill="#555"')}`;
  // Gelenk
  x=318; s += `<line x1="${x-28}" y1="40" x2="${x-5}" y2="40" stroke="#111" stroke-width="3"/><line x1="${x+5}" y1="40" x2="${x+28}" y2="40" stroke="#111" stroke-width="3"/>
    <circle cx="${x}" cy="40" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>

}

// Stützwand mit aktivem Erddruck
function figErddruck(){
  let s = `<svg viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aktiver Erddruck auf eine Stützwand">${SVG_DEFS}`;
  s += `<rect x="150" y="20" width="18" height="140" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <rect x="120" y="160" width="90" height="16" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <line x1="168" y1="20" x2="330" y2="20" stroke="#111" stroke-width="1.2"/>`;
  for(let x=175;x<330;x+=12) s += `<line x1="${x}" y1="20" x2="${x+6}" y2="26" stroke="#999" stroke-width="0.7"/>`;
  s += T(260,40,'Boden γ, φ′');
  // Druckdreieck links der Wand (auf die Wand wirkend, von rechts)
  s += `<polygon points="168,20 168,160 238,160" fill="#eee" stroke="#111" stroke-width="1"/>`;
  for(let y=40;y<=150;y+=22){ const w=70*(y-20)/140; s += `<line x1="${(168+w).toFixed(1)}" y1="${y}" x2="171" y2="${y}" stroke="#111" stroke-width="0.9" marker-end="url(#ar)"/>`; }
  s += T(242,158,'e_a = γ·h·K_a');
  s += `<line x1="236" y1="113.3" x2="172" y2="113.3" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>${T(240,116,'E_a')}
    <line x1="100" y1="160" x2="100" y2="113.3" stroke="#111" stroke-width="0.8" marker-start="url(#dm2)" marker-end="url(#dm2)"/>${T(80,140,'h/3')}
    <line x1="60" y1="20" x2="60" y2="160" stroke="#111" stroke-width="0.8" marker-start="url(#dm2)" marker-end="url(#dm2)"/>${T(48,94,'h')}
    <line x1="56" y1="20" x2="150" y2="20" stroke="#bbb" stroke-width="0.5"/><line x1="56" y1="160" x2="120" y2="160" stroke="#bbb" stroke-width="0.5"/>`;
  return `<div class="figure">${s}</svg></div><div class="figure-cap">Aktiver Erddruck ohne Kohäsion und Auflast: dreieckförmig,
    Resultierende E<sub>a</sub> = ½·γ·h²·K<sub>a</sub> im unteren Drittelpunkt.</div>`;
}

// I-Profil mit Bezeichnungen
function figIProfil(){
  let s = `<svg viewBox="0 0 230 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I-Profil mit Abmessungen h, b, t_w, t_f, r">${SVG_DEFS}`;
  const cx=110, top=25, H=150, B=110, tf=14, tw=9, r=10;
  const L=cx-B/2, R=cx+B/2, wl=cx-tw/2, wr=cx+tw/2, yb=top+H;
  s += `<path d="M ${L} ${top} H ${R} V ${top+tf} H ${wr+r} Q ${wr} ${top+tf} ${wr} ${top+tf+r} V ${yb-tf-r} Q ${wr} ${yb-tf} ${wr+r} ${yb-tf} H ${R} V ${yb} H ${L} V ${yb-tf} H ${wl-r} Q ${wl} ${yb-tf} ${wl} ${yb-tf-r} V ${top+tf+r} Q ${wl} ${top+tf} ${wl-r} ${top+tf} H ${L} Z" fill="#f2f2f2" stroke="#111" stroke-width="1.4"/>`;
  // Achsen
  s += `<line x1="${L-20}" y1="${top+H/2}" x2="${R+25}" y2="${top+H/2}" stroke="#111" stroke-width="0.6" stroke-dasharray="6,3"/>${T(R+28,top+H/2+3,'y')}
    <line x1="${cx}" y1="${top-12}" x2="${cx}" y2="${yb+14}" stroke="#111" stroke-width="0.6" stroke-dasharray="6,3"/>${T(cx+4,yb+14,'z')}`;
  // Maße
  s += `<line x1="${R+45}" y1="${top}" x2="${R+45}" y2="${yb}" stroke="#111" stroke-width="0.8" marker-start="url(#dm2)" marker-end="url(#dm2)"/>${T(R+50,top+H/2-10,'h')}
    <line x1="${R}" y1="${top}" x2="${R+48}" y2="${top}" stroke="#bbb" stroke-width="0.5"/><line x1="${R}" y1="${yb}" x2="${R+48}" y2="${yb}" stroke="#bbb" stroke-width="0.5"/>
    <line x1="${L}" y1="${yb+26}" x2="${R}" y2="${yb+26}" stroke="#111" stroke-width="0.8" marker-start="url(#dm2)" marker-end="url(#dm2)"/>${T(cx-3,yb+23,'b')}
    <line x1="${L}" y1="${yb}" x2="${L}" y2="${yb+30}" stroke="#bbb" stroke-width="0.5"/><line x1="${R}" y1="${yb}" x2="${R}" y2="${yb+30}" stroke="#bbb" stroke-width="0.5"/>
    ${T(R+4,top+tf-2,'t_f')}<line x1="${wr}" y1="${top+H*0.62}" x2="${wr+34}" y2="${top+H*0.62}" stroke="#111" stroke-width="0.6"/>${T(wr+36,top+H*0.62+3,'t_w')}
    <line x1="${wr+3}" y1="${top+tf+3}" x2="${wr+30}" y2="${top+tf+22}" stroke="#111" stroke-width="0.6"/>${T(wr+32,top+tf+26,'r')}`;
  return `<div class="figure">${s}</svg></div><div class="figure-cap">I<sub>y</sub>, W<sub>y</sub>: Biegung um die starke Achse y–y ·
    I<sub>z</sub>, W<sub>z</sub>: Biegung um die schwache Achse z–z</div>`;
}

const SK = { ink:'#111', dim:'#6b7280', fill:'#eef0f3', fill2:'#dfe3e9', acc:'#2563eb', load:'#c2410c', m:'#0f6e56' };
const sv = (w,h,lab,body) => `<svg viewBox="0 0 ${w} ${h}" style="max-width:${Math.round(w*1.45)}px;margin:0 auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${lab}">${SVG_DEFS}

const ln = (x1,y1,x2,y2,c=SK.ink,w=1.3,extra='') => `<line x1="${R1(x1)}" y1="${R1(y1)}" x2="${R1(x2)}" y2="${R1(y2)}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const poly = (pts,fill=SK.fill,c=SK.ink,w=1.4,extra='') => `<polygon points="${pts.map(p=>R1(p[0])+','+R1(p[1])).join(' ')}" fill="${fill}" stroke="${c}" stroke-width="${w}" ${extra}/>`;

// Maßlinie zwischen zwei Punkten, um off parallel versetzt (Vorzeichen = Seite), mit Hilfslinien und Text
function dimL(x1,y1,x2,y2,t,off=14,tOff=10){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  const a=[x1+nx*off, y1+ny*off], b=[x2+nx*off, y2+ny*off], s=Math.sign(off)||1;

function dlTrag(n){
  const x1=30, W=n===2?300:330, x2=x1+W, y=46, ym=112, Ls=W/n; let o=udl(x1,x2,y-2,14,1,1,'q')+beam(x1,x2,y)+supPin(x1,y+1);
  for(let i=1;i<=n;i++) o+=supRoll(x1+Ls*i,y+1);
  const c = n===2 ? [0.375] : [0.4, 0.5];
  // Moment in qL² je Feld
  const M = s => { const i=Math.min(n-1,Math.floor(s)), t=s-i;
    if(n===2) return i===0 ? .375*t-t*t/2 : .375*(1-t)-(1-t)*(1-t)/2;
    if(i===0) return .4*t-t*t/2; if(i===2) return .4*(1-t)-(1-t)*(1-t)/2; return -0.1+0.5*t*(1-t); };
  const k=200; o+=mLine(x1,x2,ym,t=>M(t*n),k,'')+it(x2+8,ym+4,'M','start',SK.m,12);
  const lab=(s,txt)=>{ const v=M(s); o+=it(x1+Ls*s, ym+v*k+(v>=0?14:-6), txt,'middle',SK.m,11); };
  if(n===2){ lab(0.375,'0,070'); lab(1.625,'0,070'); lab(1,'−0,125'); }

  o+=tl(x1+W/2,ym+48,'Momente in qL²','middle');
  return sv(x2+40,ym+58,'Durchlaufträger',o);
}

// Die vier Eulerfälle
function skEuler(){
  const yb=182, yt=52, L=yb-yt, xs=[50,140,230,320]; let o='';
  const base=(x,clamp)=> clamp ? (()=>{ let r=ln(x-14,yb,x+14,yb,SK.ink,1.6); for(let i=-14;i<=10;i+=5) r+=ln(x+i,yb,x+i+4,yb+5,SK.ink,0.7); return r; })() : supPin(x,yb);
  const topRoll=(x)=>`<g transform="translate(${x},${yt}) rotate(180)">${poly([[0,0],[-8,13],[8,13]],'#fff')}${hatchB(0,13,24)}</g>`;
  const topClamp=(x)=>{ let r=ln(x-14,yt,x+14,yt,SK.ink,1.6); for(let i=-14;i<=10;i+=5) r+=ln(x+i,yt,x+i+4,yt-5,SK.ink,0.7); return r; };
  // Form y(s), s=0 unten … 1 oben
  const kL=4.4934, A=-1/Math.tan(kL);
  const raw3=s=>{ const x=1-s; return A*Math.sin(kL*x)+Math.cos(kL*x)-A*kL*x-1; };
  let m3=0; for(let i=0;i<=100;i++) m3=Math.max(m3,Math.abs(raw3(i/100)));
  const shapes=[ s=>1-Math.cos(Math.PI*s/2), s=>Math.sin(Math.PI*s), s=>Math.abs(raw3(s))/m3, s=>(1-Math.cos(2*Math.PI*s))/2 ];
  const beta=['2,0','1,0','0,7','0,5'], tops=[null,'r','r','c'], bots=[true,false,true,true];
  xs.forEach((x,i)=>{
    const top=yt-(i===0?0:0), amp=i===0?22:18, pts=[];
    for(let j=0;j<=40;j++){ const s=j/40; pts.push([x+amp*shapes[i](s), yb-L*s]); }
    o+=ln(x,yb,x,yt,SK.dim,0.8,'stroke-dasharray="4 3"')+pl(pts,SK.ink,2.4)+base(x,bots[i]);
    const xt=x+amp*shapes[i](1);
    if(tops[i]==='r') o+=topRoll(x); if(tops[i]==='c') o+=topClamp(x);
    o+=vec(xt,yt-(tops[i]?44:28),xt,yt-(tops[i]?21:2),SK.load,1.6);
    o+=it(xt+6,yt-(tops[i]?36:20),'N','start',SK.load,12);
    o+=tl(x,yb+28,`Fall ${i+1}`,'middle',SK.ink,10)+it(x,yb+44,`β = ${beta[i]}`,'middle',SK.acc,12);
  });
  o+=dimL(18,yb,18,yt,'L',-0.01,-8);
  return sv(370,238,'Eulerfälle',o);
}

// Grundbruch: Bruchkörper (Prandtl)
function skGrundbruch(){
  const yS=86, b=40, x1=180, x2=x1+b, d=26, phi=30*Math.PI/180; let o='';
  o+=ln(10,yS-d,390,yS-d,SK.ink,1)+`<rect x="10" y="${yS-d}" width="380" height="${150}" fill="#f5efe4" stroke="none"/>`+ln(10,yS-d,x1-6,yS-d,'#8a6d3b',1.2)+ln(x2+6,yS-d,390,yS-d,'#8a6d3b',1.2);
  // Keil I unter dem Fundament
  const th=Math.PI/4+phi/2, apex=[x1+b/2, yS+(b/2)*Math.tan(th)];
  // Spirale II: r = r0·exp(θ tanφ), Pol an der Fundamentkante x2
  const r0=Math.hypot(apex[0]-x2, apex[1]-yS), a0=Math.atan2(apex[1]-yS, apex[0]-x2), spts=[];
  for(let i=0;i<=30;i++){ const t=i/30*(Math.PI/2), r=r0*Math.exp(t*Math.tan(phi)), a=a0-t; spts.push([x2+r*Math.cos(a), yS+r*Math.sin(a)]); }
  const pE=spts[spts.length-1], xe=pE[0]+(pE[1]-yS)/Math.tan(Math.PI/4-phi/2);
  const L=[[x1,yS],[x2,yS],apex], Rspi=[[x2,yS],...spts], Rk=[[x2,yS],pE,[xe,yS]];
  const mir=p=>[2*(x1+b/2)-p[0],p[1]];
  o+=poly(L,'#e8dcc4','#8a6d3b',1)+poly(Rspi,'#efe4cf','#8a6d3b',1)+poly(Rk,'#e8dcc4','#8a6d3b',1)+poly(Rspi.map(mir),'#efe4cf','#8a6d3b',0.7,'stroke-dasharray="4 3"')+poly(Rk.map(mir),'#e8dcc4','#8a6d3b',0.7,'stroke-dasharray="4 3"');
  o+=pl([[x1,yS],apex,...spts,[xe,yS]],'#8a6d3b',2)+ln(xe,yS,xe+10,yS-d,'#8a6d3b',1);
  o+=poly([[x1,yS-d-14],[x2,yS-d-14],[x2,yS],[x1,yS]],SK.fill2)+vec(x1+b/2,yS-d-52,x1+b/2,yS-d-16,SK.load,1.8)+it(x1+b/2+6,yS-d-38,'V','start',SK.load);

// Schnee: s_k nach DIN EN 1991-1-3/NA, μ1 nach EN 1991-1-3, Tab. 5.2
const SCHNEE_ZONEN = { '1':[0.19,0.91,0.65,1], '1a':[0.19,0.91,0.65,1.25], '2':[0.25,1.91,0.85,1], '2a':[0.25,1.91,0.85,1.25], '3':[0.31,2.91,1.10,1] };
function schneeSk(zone, A){
  const [c0,c1,min,f] = SCHNEE_ZONEN[zone];
  return f * Math.max(c0 + c1*((A+140)/760)**2, min);
}
function schneeMu1(alpha){ return alpha<=30 ? 0.8 : alpha<60 ? 0.8*(60-alpha)/30 : 0; }
function updateSchnee(){
  const z=document.getElementById('sn-zone').value, A=num('sn-A'), a=num('sn-alpha');
  const out=document.getElementById('sn-out'); if(!out) return;
  if(!isFinite(A) || !isFinite(a)){ out.innerHTML='Bitte Zahlen eingeben.'; return; }
  const sk=schneeSk(z,A), mu=schneeMu1(a);
  out.innerHTML = `s<sub>k</sub> = <b>${deNum(sk)} kN/m²</b> &nbsp;·&nbsp; μ<sub>1</sub> = <b>${deNum(mu)}</b> &nbsp;·&nbsp; s = μ<sub>1</sub>·s<sub>k</sub> = <b>${deNum(mu*sk)} kN/m²</b>`;
}

function updateAufbau(){
  const out=document.getElementById('ga-out'); if(!out) return;
  let sum=0, rows=[];
  for(let i=0;i<4;i++){
    const m=document.getElementById('ga-m'+i), d=num('ga-d'+i);
    if(!m || !isFinite(d) || d<=0) continue;
    const w=WICHTEN[+m.value];
    if(w[4]==null){ rows.push(`${w[0]}: bitte Wichte nach Herstellerangabe`); continue; }
    const g=w[4]*d/100; sum+=g;
    rows.push(`${w[0]}: ${deNum(w[4],1)} · ${deNum(d/100,3)} = ${deNum(g)} kN/m²`);
  }
  out.innerHTML = rows.join('<br>') + `<br>g<sub>k</sub> = <b>${deNum(sum)} kN/m²</b>`;
}
// Nägel: Einschlagtiefe (DIN EN 1995-1-1/NA vereinfacht) und Eindringtiefe axial (EN 1995-1-1, 8.3.2)
function nagelFaktoren(d, t, art){
  const shear = t>=9*d ? 1 : t>=4*d ? t/(9*d) : 0;
  const ax = art==='glatt'
    ? (t>=12*d ? 1 : t>=8*d ? t/(4*d)-2 : 0)
    : (t>=8*d ? 1 : t>=6*d ? t/(2*d)-3 : 0);
  return {shear, ax};
}
function updateNagel(){
  const out=document.getElementById('ng-out'); if(!out) return;
  const d=num('ng-d'), t=num('ng-t'), rho=num('ng-rho'), art=document.getElementById('ng-art').value;
  if(!(d>0) || !(t>=0) || !(rho>0)){ out.innerHTML='Bitte Zahlen eingeben.'; return; }
  const f=nagelFaktoren(d,t,art), tmin=Math.max(7*d,(13*d-30)*rho/400);
  const shearTxt = art==='glatt' ? `Abscheren (t<sub>req</sub> = 9·d = ${deNum(9*d,1)} mm): Faktor <b>${deNum(f.shear)}</b>${f.shear===0?' — Scherfuge zählt nicht':''}`
                                 : 'Abscheren: Werte aus der Zulassung des Sondernagels';
  out.innerHTML = `${shearTxt}<br>Herausziehen: Faktor <b>${deNum(f.ax)}</b>${f.ax===0?' — keine Axialkraft ansetzen':''}<br>`
    + `Mindestholzdicke ohne Vorbohren: <b>${deNum(tmin,1)} mm</b>`;
}

// DATEN — Sohlwiderstand nach DIN 1054:2010-12, A 6.10 (Tabellenverfahren)
// σR,d in kN/m². Nichtbindig: Zeilen d = 0,5/1,0/1,5/2,0 m, Spalten b = 0,5/1,0/1,5/2,0 m.
// Bindig: Werte je Einbindetiefe d = 0,5/1,0/1,5/2,0 m (gelten für b = 0,5 … 2,0 m).
// Werte = 1,4 × zulässiger Sohldruck der DIN 1054:2005 (gerundet); abgeglichen mit
// Baugrundgutachten (gemischtkörnig steif, tonig-schluffig steif) und Programmbeispiel (nichtbindig d = b = 1 m).
// ══════════════════════════════════════════════════
const SOHL_D = [0.5, 1.0, 1.5, 2.0];
const SOHL_NB = {
  nb_gb: { label:'nichtbindig — ohne Setzungsbegrenzung (Tab. A 6.1)', rows:[[280,420,560,700],[380,520,660,800],[480,620,760,900],[560,700,840,980]] },
  nb_s:  { label:'nichtbindig — Setzung begrenzt auf 1–2 cm (Tab. A 6.2)', rows:[[280,420,460,390],[380,520,500,430],[480,620,550,480],[560,700,590,500]] },
};
const SOHL_B = {
  schluff:   { label:'reiner Schluff, steif bis halbfest (Tab. A 6.5)', v:[180,250,310,350] },
  gem_steif: { label:'gemischtkörnig, steif (Tab. A 6.6)',   v:[210,250,310,350] },
  gem_halb:  { label:'gemischtkörnig, halbfest (Tab. A 6.6)', v:[310,390,450,520] },
  gem_fest:  { label:'gemischtkörnig, fest (Tab. A 6.6)',     v:[460,530,620,700] },
  ts_steif:  { label:'tonig-schluffig, steif (Tab. A 6.7)',   v:[170,200,220,250] },
  ts_halb:   { label:'tonig-schluffig, halbfest (Tab. A 6.7)',v:[240,290,350,390] },
  ts_fest:   { label:'tonig-schluffig, fest (Tab. A 6.7)',    v:[390,450,500,560] },
  ton_steif: { label:'Ton, steif (Tab. A 6.8)',               v:[130,150,180,210] },
  ton_halb:  { label:'Ton, halbfest (Tab. A 6.8)',            v:[200,250,290,320] },
  ton_fest:  { label:'Ton, fest (Tab. A 6.8)',                v:[280,340,380,420] },
};
const lerp1 = (xs, ys, x) => { for(let i=0;i<xs.length-1;i++) if(x<=xs[i+1]) return ys[i]+(ys[i+1]-ys[i])*(x-xs[i])/(xs[i+1]-xs[i]); return ys[ys.length-1]; };
// Grundwert aus Tabelle (Interpolation); null = außerhalb des Tabellenbereichs
function sohlGrundwert(art, d, b){
  if(d < 0.5 || d > 2.0) return null;
  if(SOHL_NB[art]){
    if(b < 0.5 || b > 2.0) return null;
    const col = SOHL_NB[art].rows.map(r => lerp1(SOHL_D, r, b));
    return lerp1(SOHL_D, col, d);
  }
  if(b < 0.5 || b > 5.0) return null;
  return lerp1(SOHL_D, SOHL_B[art].v, d);
}
// Vollständige Ermittlung mit Erhöhungen und Abminderungen
function sohlBerechne({art, d, b, a, hv, gw, dicht}){
  const nb = !!SOHL_NB[art], steps = [];
  const g = sohlGrundwert(art, d, b);
  if(g == null) return { err: nb ? 'Tabellenbereich: Einbindetiefe 0,5 … 2,0 m und Breite 0,5 … 2,0 m.'
                                  : 'Tabellenbereich: Einbindetiefe 0,5 … 2,0 m und Breite 0,5 … 5,0 m.' };
  if(hv > 0.2) return { err: 'Die Tabellen gelten nur für H/V ≤ 0,2. Bei größerer Neigung Grundbruch nach DIN 4017 rechnen.' };
  let s = g; steps.push(['Tabellenwert', g]);
  if(!nb && b > 2.0){ const f = 1 - 0.1*(b-2.0); s *= f; steps.push([`Breite ${deNum(b,1)} m > 2 m: −10 % je m (× ${deNum(f)})`, s]); }
  const rect = a > 0 && a/b < 2;
  if(rect){ s *= 1.2; steps.push(['Rechteck/Kreis mit a/b < 2: +20 %', s]); }
  if(nb && dicht){ s *= 1.5; steps.push(['dichte Lagerung nachgewiesen: +50 %', s]); }
  if(nb && hv > 0){
    // Richtung von H nicht abgefragt → ungünstiger Faktor (1 − H/V)²
    const f = (1-hv)**2; s *= f; steps.push([`Horizontallast H/V = ${deNum(hv)}: × (1 − H/V)² = ${deNum(f,3)}`, s]);
  }
  if(nb && isFinite(gw) && gw < b){
    const red = 0.4 * (1 - Math.max(gw,0)/b), f = 1 - red; s *= f;
    steps.push([`Grundwasser ${deNum(Math.max(gw,0),2)} m unter Sohle (< b): −${deNum(red*100,0)} %`, s]);
  }
  return { s, steps, nb, rect };
}
function updateSohl(){
  const out = document.getElementById('sw-out'); if(!out) return;
  const art = document.getElementById('sw-art').value, nb = !!SOHL_NB[art];
  document.querySelectorAll('.sw-nb').forEach(e => e.style.display = nb ? '' : 'none');
  const gwRaw = document.getElementById('sw-gw').value.trim();
  const inp = { art, d:num('sw-d'), b:num('sw-b'), a:num('sw-a')||0, hv:num('sw-hv')||0,
                gw: gwRaw==='' ? Infinity : num('sw-gw'), dicht: document.getElementById('sw-dicht').value==='1' };
  if(!isFinite(inp.d) || !isFinite(inp.b)){ out.innerHTML = 'Bitte Zahlen eingeben.'; return; }
  const r = sohlBerechne(inp);
  if(r.err){ out.innerHTML = r.err; return; }
  out.innerHTML = r.steps.map(([t,v]) => `${t}: ${deNum(v,0)} kN/m²`).join('<br>')
    + `<br>σ<sub>R,d</sub> = <b>${deNum(r.s,0)} kN/m²</b>`
    + `<br><span style="color:#555">Nachweis: σ<sub>E,d</sub> = V<sub>d</sub> / (a′·b′) ≤ σ<sub>R,d</sub></span>`;
}

// Beton nach EN 1992-1-1, Tab. 3.1: Klasse, f_ck, f_ck,cube, f_cm, f_ctm, f_ctk;0,05 [N/mm²], E_cm [GPa]
// Kontrolle: f_ctm = 0,30·f_ck^(2/3), f_ctk;0,05 = 0,7·f_ctm, E_cm = 22·(f_cm/10)^0,3 — gerundet wie in der Tabelle
const BETON = [
  ['C12/15',12,15,20,1.6,1.1,27], ['C16/20',16,20,24,1.9,1.3,29], ['C20/25',20,25,28,2.2,1.5,30],
  ['C25/30',25,30,33,2.6,1.8,31], ['C30/37',30,37,38,2.9,2.0,33], ['C35/45',35,45,43,3.2,2.2,34],
  ['C40/50',40,50,48,3.5,2.5,35], ['C45/55',45,55,53,3.8,2.7,36], ['C50/60',50,60,58,4.1,2.9,37],
];
const SB = { gc:1.5, gs:1.15, acc:0.85, fyk:500, Es:200000, eud:25 };
SB.fyd = SB.fyk/SB.gs;                 // 434,8 N/mm²
SB.eyd = SB.fyd/SB.Es*1000;            // 2,17 ‰
const betonRow = name => BETON.find(r=>r[0]===name) || BETON[3];
const fcdOf = fck => SB.acc*fck/SB.gc;
const betonSel = (id, def, on) => sel(id, BETON.map(r=>[r[0], r[0]]), def, on);

// Expositionsklassen: Klasse, Beschreibung, Beispiel, c_min,dur, Δc_dur,γ, Δc_dev, Mindestfestigkeit

  ['XD2','nass, selten trocken + Chlorid','Solebäder, Bauteile in chloridhaltigem Industriewasser',35,5,15,'C35/45'],
  ['XD3','wechselnd nass und trocken + Chlorid','Parkdecks, Brückenteile mit Spritzwasser',40,0,15,'C35/45'],

function deckung(cls, ds){

}
function updateDeckung(){

    + `<br>c<sub>nom</sub> = <b>${deNum(r.cnom,0)} mm</b> · Mindestbetonfestigkeit: <b>${r.e[6]}</b>`;
}

// ── Biegung: Parabel-Rechteck-Diagramm (ε_c2 = 2 ‰, ε_cu2 = 3,5 ‰), Stahl mit horizontalem Ast, ε_s ≤ 25 ‰ ──
function prBlock(ec){   // Völligkeit α_R und Schwerpunktbeiwert k_a der Betondruckzone
  if(ec<=2) return { aR: ec/12*(6-ec), ka: (8-ec)/(4*(6-ec)) };
  return { aR: (3*ec-2)/(3*ec), ka: (ec*(3*ec-4)+2)/(2*ec*(3*ec-2)) };
}
function biegeState(t){ // t ∈ (0, 2): 0…1 → ε_c 0…3,5 bei ε_s = 25; 1…2 → ε_s 25…ε_yd bei ε_c = 3,5
  const ec = t<=1 ? 3.5*t : 3.5, es = t<=1 ? SB.eud : SB.eud - (t-1)*(SB.eud-SB.eyd);
  const xi = ec/(ec+es), {aR,ka} = prBlock(ec);
  return { ec, es, xi, omega: aR*xi, zeta: 1-ka*xi, mu: aR*xi*(1-ka*xi) };
}
function biegeAusMu(mu){
  if(!(mu>0)) return null;
  let lo=1e-9, hi=2;
  if(mu > biegeState(hi).mu) return null;
  for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(biegeState(m).mu < mu) lo=m; else hi=m; }
  return biegeState((lo+hi)/2);
}
const XI_LIM = 0.45;
const MU_LIM = (()=>{ const {aR,ka}=prBlock(3.5); return aR*XI_LIM*(1-ka*XI_LIM); })();   // 0,296
function updateBiegung(){
  const out=document.getElementById('bg-out'); if(!out) return;
  const b=num('bg-b'), h=num('bg-h'), d1=num('bg-d1'), M=num('bg-M'), B=betonRow(document.getElementById('bg-c').value);
  if(![b,h,d1,M].every(isFinite) || b<=0 || h<=d1 || M<=0){ out.innerHTML='Bitte Zahlen eingeben (h > d₁, M > 0).'; return; }
  const d=h-d1, fcd=fcdOf(B[1]);
  const mu = M*1e6/(b*10*(d*10)**2*fcd);
  const st = biegeAusMu(mu);
  let s = `d = ${deNum(d,1)} cm · f<sub>cd</sub> = ${deNum(fcd)} N/mm²<br>μ<sub>Eds</sub> = M<sub>Ed</sub> / (b·d²·f<sub>cd</sub>) = <b>${deNum(mu,4)}</b>`;
  if(!st || mu > MU_LIM){
    const d2=num('bg-d2');
    if(!(d2>0) || d2>=d/2){ out.innerHTML = s + `<br>μ<sub>Eds</sub> > μ<sub>lim</sub>: Druckbewehrung nötig — bitte d₂ angeben.`; return; }
    const r=biegeDruck(mu, d, d2), f=b*d*fcd/SB.fyd;
    const As1=r.om1*f, As2=r.om2*f, ok=(As1+As2) <= 0.08*b*h;
    out.innerHTML = s + `<br>μ<sub>Eds</sub> > μ<sub>lim</sub> = ${deNum(MU_LIM,3)} → <b>Druckbewehrung</b> (ξ = 0,45 festgehalten), Δμ = ${deNum(r.dmu,4)}`
      + `<br>ε<sub>s2</sub> = ${deNum(r.es2,2)} ‰ → σ<sub>s2</sub> = ${deNum(r.ss2,0)} N/mm²${r.ss2<SB.fyd-0.5?' (Druckbewehrung fließt nicht)':''}`
      + `<br>A<sub>s1</sub> = (ω<sub>lim</sub> + Δμ/(1 − d₂/d))·b·d·f<sub>cd</sub>/f<sub>yd</sub> = <b>${deNum(As1)} cm²</b> (Zug)`
      + `<br>A<sub>s2</sub> = Δμ/(1 − d₂/d)·b·d·f<sub>cd</sub>/σ<sub>s2</sub> = <b>${deNum(As2)} cm²</b> (Druck)`
      + (ok ? '' : `<br><b>A<sub>s1</sub> + A<sub>s2</sub> > 0,08·A<sub>c</sub></b> — Querschnitt vergrößern.`);
    return;
  }
  const As = st.omega*b*10*d*10*fcd/SB.fyd/100;              // cm²
  const fctm=B[4], Asmin = fctm*(b*h*h/6*1000)/(SB.fyk*0.9*d*10)/100;   // cm², aus Rissmoment
  const Aserf = Math.max(As, Asmin);
  const vorschlag = [12,14,16,20,25].map(ds=>{ const a1=Math.PI*ds*ds/400, n=Math.max(2,Math.ceil(Aserf/a1-1e-9)); return n<=8 ? `${n} Ø ${ds} = ${deNum(n*a1)} cm²` : null; }).filter(Boolean);
  s += `<br>ω = ${deNum(st.omega,4)} · ξ = x/d = ${deNum(st.xi,3)} · ζ = z/d = ${deNum(st.zeta,3)} · ε<sub>c</sub> = ${deNum(st.ec,2)} ‰ · ε<sub>s</sub> = ${deNum(st.es,1)} ‰`
     + `<br>A<sub>s,erf</sub> = ω·b·d·f<sub>cd</sub>/f<sub>yd</sub> = <b>${deNum(As)} cm²</b> · A<sub>s,min</sub> = ${deNum(Asmin)} cm²`
     + `<br>Vorschlag: ${vorschlag.join(' · ')}`;
  out.innerHTML = s;
}

// ── Querkraft ──
function querkraft({bw, d, fck, Asl, VEd, cot, cv}){   // Einheiten: mm, N/mm², mm², kN
  const k=Math.min(1+Math.sqrt(200/d),2), rho=Math.min(Asl/(bw*d),0.02);
  const k1 = d<=600 ? 0.0525 : d>=800 ? 0.0375 : 0.0525-(d-600)/200*0.015;
  const vmin = k1/SB.gc*Math.pow(k,1.5)*Math.sqrt(fck);
  const vc = 0.15/SB.gc*k*Math.cbrt(100*rho*fck);
  const VRdc = Math.max(vc,vmin)*bw*d/1000;
  const z = Math.min(0.9*d, Math.max(d-2*cv, d-cv-30));
  const nu1 = 0.75*Math.min(1.1-fck/500,1), fcd=fcdOf(fck);
  const VRdmax = bw*z*nu1*fcd/(cot+1/cot)/1000;
  const fctm = BETON.find(r=>r[1]===fck)?.[4] ?? 0.3*fck**(2/3);
  const asw = VEd*1000/(z*SB.fyd*cot)*1000/100;          // cm²/m
  const aswmin = 0.16*fctm/SB.fyk*bw*1000/100;            // cm²/m
  return { k, rho, vmin, vc, VRdc, z, nu1, VRdmax, asw, aswmin, minGov: vmin>vc };
}
function updateQuerkraft(){
  const out=document.getElementById('qk-out'); if(!out) return;
  const B=betonRow(document.getElementById('qk-c').value);
  const p={ bw:num('qk-bw')*10, d:num('qk-d')*10, fck:B[1], Asl:num('qk-As')*100, VEd:num('qk-V'), cot:num('qk-cot'), cv:num('qk-cv')*10 };
  if(!Object.values(p).every(v=>isFinite(v)&&v>0)){ out.innerHTML='Bitte Zahlen eingeben.'; return; }
  if(p.cot<1 || p.cot>3){ out.innerHTML='cot θ muss zwischen 1,0 und 3,0 liegen.'; return; }
  const r=querkraft(p);
  let s = `k = ${deNum(r.k,3)} · ρ<sub>l</sub> = ${deNum(r.rho*100,2)} % · z = ${deNum(r.z/10,1)} cm`
    + `<br>V<sub>Rd,c</sub> = <b>${deNum(r.VRdc,1)} kN</b>${r.minGov?' (Mindestwert v<sub>min</sub> maßgebend)':''}`
    + ` · V<sub>Rd,max</sub> = <b>${deNum(r.VRdmax,1)} kN</b>`;
  if(p.VEd > r.VRdmax) s += `<br>V<sub>Ed</sub> > V<sub>Rd,max</sub>: Druckstrebe versagt — Querschnitt vergrößern oder cot θ verkleinern.`;
  else if(p.VEd <= r.VRdc) s += `<br>V<sub>Ed</sub> ≤ V<sub>Rd,c</sub>: rechnerisch keine Querkraftbewehrung (Balken: Mindestbügel a<sub>sw,min</sub> = ${deNum(r.aswmin)} cm²/m).`;
  else s += `<br>a<sub>sw,erf</sub> = V<sub>Ed</sub> / (z·f<sub>ywd</sub>·cot θ) = <b>${deNum(Math.max(r.asw,r.aswmin))} cm²/m</b> (Mindestwert ${deNum(r.aswmin)} cm²/m) · Ausnutzung Druckstrebe ${deNum(p.VEd/r.VRdmax*100,0)} %`;
  out.innerHTML = s;
}

// ── Verankerung ──
function verankerung(fctk, ds, gut, ssd){
  const fbd = 2.25*(gut?1:0.7)*(ds<=32?1:(132-ds)/100)*fctk/SB.gc;

    + `<br>gerade: l<sub>bd</sub> ≥ ${deNum(Math.max(r.lbrqd,r.lbmin),0)} mm · mit Haken/Winkelhaken (α₁ = 0,7): ${deNum(Math.max(0.7*r.lbrqd,r.lbmin),0)} mm · l<sub>b,min</sub> = ${deNum(r.lbmin,0)} mm`;

// Biegung: Dehnungen und Spannungen im Rechteckquerschnitt
function figBiegung(){
  let s = `<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rechteckquerschnitt mit Dehnungsverteilung und Parabel-Rechteck-Spannungsblock">${SVG_DEFS}`;

// ── Biegung mit Druckbewehrung (μ_Eds > μ_lim, ξ = 0,45 festgehalten) ──
function biegeDruck(mu, d, d2){   // liefert ω₁, ω₂ (bezogen auf b·d·f_cd/f_yd bzw. σ_s2), σ_s2
  const {aR} = prBlock(3.5), omLim = aR*XI_LIM;
  const es2 = 3.5*(XI_LIM - d2/d)/XI_LIM;                 // ‰ Stauchung der Druckbewehrung
  const ss2 = Math.min(SB.Es*es2/1000, SB.fyd);
  const dmu = mu - MU_LIM;
  return { omLim, es2, ss2, dmu, om1: omLim + dmu/(1-d2/d), om2: dmu/(1-d2/d)*SB.fyd/ss2 };
}

// ── Plattenbalken ──
// mitwirkende Breite nach EN 1992-1-1, 5.3.2.1
function beffCalc(bw, b1, b2, l0){
  const bi = b => Math.max(0, Math.min(0.2*b + 0.1*l0, 0.2*l0, b));
  return { b1e: bi(b1), b2e: bi(b2), beff: bw + bi(b1) + bi(b2) };
}
function updatePlattenbalken(){
  const out=document.getElementById('pb-out'); if(!out) return;
  const g=id=>num('pb-'+id), B=betonRow(document.getElementById('pb-c').value);
  const bw=g('bw'), b1=g('b1'), b2=g('b2'), hf=g('hf'), h=g('h'), d1=g('d1'), M=g('M'), l=g('l'), f=+document.getElementById('pb-l0').value;
  if(![bw,b1,b2,hf,h,d1,M,l].every(v=>isFinite(v)&&v>=0) || h<=d1 || hf>=h || M<=0){ out.innerHTML='Bitte Zahlen eingeben.'; return; }
  const l0=f*l*100, bf=beffCalc(bw,b1,b2,l0), d=h-d1, fcd=fcdOf(B[1]);
  let s = `l<sub>0</sub> = ${deNum(l0/100,2)} m · b<sub>eff,1</sub> = ${deNum(bf.b1e,1)} cm · b<sub>eff,2</sub> = ${deNum(bf.b2e,1)} cm · b<sub>eff</sub> = <b>${deNum(bf.beff,1)} cm</b>`;
  const mu = M*1e6/(bf.beff*10*(d*10)**2*fcd), st = biegeAusMu(mu);
  if(st && mu<=MU_LIM && st.xi*d <= hf){
    const As = st.omega*bf.beff*d*fcd/SB.fyd;          // cm² (b, d in cm → ·100 mm², /100)
    s += `<br>μ<sub>Eds</sub> = ${deNum(mu,4)} → x = ξ·d = ${deNum(st.xi*d,1)} cm ≤ h<sub>f</sub> = ${deNum(hf,1)} cm: Nulllinie in der Platte, Rechteck mit b<sub>eff</sub>`
       + `<br>ω = ${deNum(st.omega,4)} → A<sub>s</sub> = <b>${deNum(As)} cm²</b>`;
  } else {
    const z = d - hf/2, As = M*1e6/(z*10*SB.fyd)/100, sc = M*1e6/(z*10*bf.beff*10*hf*10);
    s += `<br>Nulllinie im Steg → Näherung: Druckkraft in der Platte, z = d − h<sub>f</sub>/2 = ${deNum(z,1)} cm`
       + `<br>A<sub>s</sub> = M<sub>Ed</sub> / (z·f<sub>yd</sub>) = <b>${deNum(As)} cm²</b> · σ<sub>cd</sub> = M<sub>Ed</sub>/(z·b<sub>eff</sub>·h<sub>f</sub>) = ${deNum(sc)} N/mm² ${sc<=fcd?'≤':'>'} f<sub>cd</sub> = ${deNum(fcd)} N/mm²`
       + (sc>fcd ? '<br><b>Platte überlastet</b> — genauere Bemessung oder größere Plattendicke.' : '')
       + (bf.beff/bw < 5 ? '<br>Hinweis: b<sub>eff</sub>/b<sub>w</sub> < 5 — die Näherung liegt auf der unsicheren Seite, genauer mit Bemessungstafeln für Plattenbalken.' : '');
  }
  out.innerHTML = s;
}

// ── Durchstanzen (Flachdecke, DIN EN 1992-1-1/NA 6.4) ──
const DS_BETA = [['1.10','Innenstütze'],['1.40','Randstütze'],['1.50','Eckstütze'],['1.35','Wandende'],['1.20','Wandecke']];
const DS_LAGE = DS_BETA.slice(0,3);   // Rechner: nur Stützen
function durchstanzen({form, cx, cy, dx, dy, rx, ry, fck, VEd, beta, innen}){   // mm, %, N/mm², kN
  const d=(dx+dy)/2, k=Math.min(1+Math.sqrt(200/d),2), fcd=fcdOf(fck);
  const rho=Math.min(Math.sqrt(rx*ry)/100, 0.02, 0.5*fcd/SB.fyd);
  // Lage über β: 1,10 innen, 1,40 Rand (freier Rand parallel zu c_y), 1,50 Ecke — Rundschnitt nur über die Plattenseite
  const lage = beta===1.4 ? 'rand' : beta===1.5 ? 'ecke' : 'innen';
  let u0, u1;
  if(form==='rund'){ const f = lage==='rand' ? 0.5 : lage==='ecke' ? 0.25 : 1; u0=f*Math.PI*cx; u1=f*Math.PI*(cx+4*d); }
  else if(lage==='rand'){ u0=Math.min(cy+3*d, cy+2*cx); u1=2*cx+cy+2*Math.PI*d; }
  else if(lage==='ecke'){ u0=Math.min(3*d, cx+cy); u1=cx+cy+Math.PI*d; }
  else { u0=2*(cx+cy); u1=2*(cx+cy)+4*Math.PI*d; }
  let C = 0.18/SB.gc; const red = innen && u0/d < 4; if(red) C *= 0.1*u0/d + 0.6;
  const k1 = d<=600 ? 0.0525 : d>=800 ? 0.0375 : 0.0525-(d-600)/200*0.015;
  const vmin = k1/SB.gc*Math.pow(k,1.5)*Math.sqrt(fck);
  const vRdc = Math.max(C*k*Math.cbrt(100*rho*fck), vmin);
  const vEd = beta*VEd*1000/(u1*d);
  return { d, k, rho, u0, u1, C, red, vmin, vRdc, vEd, vRdmax: 1.4*vRdc };
}
function updateDurchstanzen(){
  const out=document.getElementById('ds-out'); if(!out) return;
  const form=document.getElementById('ds-form').value, bsel=document.getElementById('ds-beta').value;
  document.querySelectorAll('.ds-rect').forEach(e=>e.style.display = form==='rund'?'none':'');
  const p={ form, cx:num('ds-cx')*10, cy:num('ds-cy')*10, dx:num('ds-dx')*10, dy:num('ds-dy')*10, rx:num('ds-rx'), ry:num('ds-ry'),
            fck:betonRow(document.getElementById('ds-c').value)[1], VEd:num('ds-V'), beta:+bsel, innen: bsel==='1.10' };
  if(form==='rund') p.cy=p.cx;
  if(!Object.values(p).every(v=>typeof v!=='number' || (isFinite(v) && v>0))){ out.innerHTML='Bitte Zahlen eingeben.'; return; }
  const r=durchstanzen(p);
  let s = `d = ${deNum(r.d/10,1)} cm · k = ${deNum(r.k,3)} · ρ<sub>l</sub> = ${deNum(r.rho*100,2)} %`
    + `<br>u<sub>0</sub> = ${deNum(r.u0/10,1)} cm · u<sub>1</sub> = ${deNum(r.u1/10,1)} cm (Abstand 2,0·d) · C<sub>Rd,c</sub> = ${deNum(r.C,4)}${r.red?' (abgemindert, u<sub>0</sub>/d < 4)':''}`
    + `<br>v<sub>Ed</sub> = β·V<sub>Ed</sub>/(u<sub>1</sub>·d) = <b>${deNum(r.vEd,3)} N/mm²</b> · v<sub>Rd,c</sub> = <b>${deNum(r.vRdc,3)} N/mm²</b>${r.vRdc===r.vmin?' (v<sub>min</sub>)':''}`;
  if(r.vEd <= r.vRdc) s += `<br>v<sub>Ed</sub> ≤ v<sub>Rd,c</sub>: <b>keine Durchstanzbewehrung</b> erforderlich (Ausnutzung ${deNum(r.vEd/r.vRdc*100,0)} %).`;
  else if(r.vEd <= r.vRdmax) s += `<br>v<sub>Rd,c</sub> < v<sub>Ed</sub> ≤ v<sub>Rd,max</sub> = 1,4·v<sub>Rd,c</sub> = ${deNum(r.vRdmax,3)} N/mm²: <b>Durchstanzbewehrung erforderlich</b> (Bügel oder Dübelleisten).`;
  else s += `<br>v<sub>Ed</sub> > 1,4·v<sub>Rd,c</sub> = ${deNum(r.vRdmax,3)} N/mm²: <b>auch mit Bewehrung nicht möglich</b> — Decke dicker, Stütze größer, Stützenkopf oder höhere Betonklasse.`;
  out.innerHTML = s;
}

// ── Rissbreite (DIN EN 1992-1-1/NA 7.3) ──
const dsGrenz = (wk, ss) => wk*3.48e6/(ss*ss);          // Grenzdurchmesser Ø*s [mm], Tab. 7.2DE
function rissbreite({b, h, d, As, ds, M, fck}){            // mm, mm², kNm
  const B=BETON.find(r=>r[1]===fck), Ecm=B[6]*1000, fct=B[4], ae=SB.Es/Ecm;
  const rho=As/(b*d), xi=-ae*rho+Math.sqrt((ae*rho)**2+2*ae*rho), x=xi*d, z=d-x/3;
  const ss=M*1e6/(As*z);
  const hce=Math.min(2.5*(h-d), (h-x)/3, h/2), rpe=As/(b*hce);
  const sr=Math.min(ds/(3.6*rpe), ss*ds/(3.6*fct));
  const de=Math.max((ss-0.4*fct/rpe*(1+ae*rpe))/SB.Es, 0.6*ss/SB.Es);
  return { ae, x, z, ss, hce, rpe, sr, de, wk: sr*de, fct };
}
function updateRiss(){
  const out=document.getElementById('rb-out'); if(!out) return;
  const p={ b:num('rb-b')*10, h:num('rb-h')*10, d:num('rb-d')*10, As:num('rb-As')*100, ds:num('rb-ds'), M:num('rb-M'),
            fck:betonRow(document.getElementById('rb-c').value)[1] };
  const wmax=+document.getElementById('rb-w').value;
  if(!Object.values(p).every(v=>isFinite(v)&&v>0) || p.d>=p.h){ out.innerHTML='Bitte Zahlen eingeben (d < h).'; return; }
  const r=rissbreite(p), dsg=dsGrenz(wmax, r.ss)*r.fct/2.9;
  out.innerHTML = `α<sub>e</sub> = ${deNum(r.ae,2)} · x = ${deNum(r.x/10,1)} cm · z = ${deNum(r.z/10,1)} cm → σ<sub>s</sub> = M/(A<sub>s</sub>·z) = <b>${deNum(r.ss,0)} N/mm²</b>`
    + `<br>h<sub>c,ef</sub> = ${deNum(r.hce/10,1)} cm · ρ<sub>p,eff</sub> = ${deNum(r.rpe*100,2)} % · s<sub>r,max</sub> = ${deNum(r.sr,0)} mm · ε<sub>sm</sub> − ε<sub>cm</sub> = ${deNum(r.de*1000,3)} ‰`
    + `<br>w<sub>k</sub> = s<sub>r,max</sub>·(ε<sub>sm</sub> − ε<sub>cm</sub>) = <b>${deNum(r.wk,2)} mm</b> ${r.wk<=wmax?'≤':'>'} w<sub>max</sub> = ${deNum(wmax,1)} mm → ${r.wk<=wmax?'eingehalten':'<b>nicht eingehalten</b>'}`
    + `<br>Zum Vergleich ohne direkte Berechnung: Grenzdurchmesser Ø*<sub>s</sub>·f<sub>ct,eff</sub>/2,9 = ${deNum(dsg,1)} mm ${p.ds<=dsg?'≥':'<'} Ø = ${deNum(p.ds,0)} mm`;
}

// ── Stützen: Querschnittsbemessung symmetrisch bewehrt (Dehnungsebenen, Parabel-Rechteck) ──
function sigC(e){ const a=-e; if(a<=0) return 0; return a<2 ? -(1-(1-a/2)**2) : -1; }   // bezogen auf f_cd, Druck negativ (e in ‰)
function sigS(e){ return Math.max(-SB.fyd, Math.min(SB.fyd, SB.Es*e/1000)); }
// Dehnungsebene über t ∈ [0,3]: ε(y) in ‰ für y von oben (0) bis unten (h), Druck negativ
// 0–1: ε_s1 = 25 ‰, Randstauchung 0 → −3,5 ‰ · 1–2: Randstauchung −3,5 ‰, Nulllinie x bis h · 2–3: Drehpunkt in 3h/7 bei −2 ‰
function ebene(t, h, d){
  if(t<=1){ const ec=-3.5*t, es=SB.eud; return y => ec + (es-ec)*y/d; }
  if(t<=2){ const xb=3.5/(3.5+SB.eud)*d, x=xb+(t-1)*(h-xb); return y => -3.5 + 3.5*y/x; }
  const yC=3*h/7, eu=-(t-2)*2; return y => -2 + (eu+2)*(y-yC)/(h-yC);
}
function querschnittNM(t, b, h, d1, As2each, fcd){     // b,h,d1 mm; As je Seite mm² → N [kN], M um Schwerachse [kNm]
  const d=h-d1, eps=ebene(t,h,d), n=200; let N=0, M=0;
  for(let i=0;i<n;i++){ const y=(i+0.5)*h/n, sc=sigC(eps(y))*fcd*b*h/n; N+=sc; M+=sc*(h/2-y); }
  for(const y of [d1, d]){ const F=sigS(eps(y))*As2each; N+=F; M+=F*(h/2-y); }
  return { N:N/1000, M:M/1e6 };
}
function stuetzeMRd(b,h,d1,Aeach,fcd,NEd){   // N_Ed als Druck positiv; null = N zu groß
  const target=-NEd;
  if(querschnittNM(3,b,h,d1,Aeach,fcd).N > target) return null;
  let lo=0, hi=3;
  for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(querschnittNM(m,b,h,d1,Aeach,fcd).N > target) lo=m; else hi=m; }
  const t=(lo+hi)/2; return { M:-querschnittNM(t,b,h,d1,Aeach,fcd).M, t };
}
function stuetzeAs(b,h,d1,fcd,NEd,MEd){   // erforderliche Gesamtbewehrung [mm²], symmetrisch
  const Amax=0.09*b*h;
  const ok=A=>{ const r=stuetzeMRd(b,h,d1,A/2,fcd,NEd); return r && r.M>=MEd; };
  if(ok(0)) return 0;
  if(!ok(Amax)) return null;
  let lo=0, hi=Amax; for(let i=0;i<50;i++){ const m=(lo+hi)/2; if(ok(m)) hi=m; else lo=m; }
  return hi;
}
function stuetzeBerechne({b, h, d1, l, beta, NEd, M0, fck}){   // cm, m, kN, kNm
  const fcd=fcdOf(fck), l0=beta*l, i=h/Math.sqrt(12)/100, lam=l0/i;
  const n=NEd*1000/(b*h*100*fcd), lamlim = n>=0.41 ? 25 : 16/Math.sqrt(Math.max(n,1e-9));
  const ah=Math.min(1,Math.max(2/3, 2/Math.sqrt(l))), ei=ah/200*l0/2;   // m
  const e0=Math.max(M0/NEd, h/30/100, 0.02);
  let e2=0, K1=0;
  if(lam>lamlim){ K1 = lam>35 ? 1 : Math.max(0, lam/10-2.5); const d=(h-d1)/100; e2 = K1*(SB.eyd/1000/(0.45*d))*l0*l0/10; }
  const MEd=NEd*(e0+ei+e2);
  const As=stuetzeAs(b*10,h*10,d1*10,fcd,NEd,MEd);
  const Asmin=0.15*NEd*1000/SB.fyd;
  return { fcd, l0, lam, lamlim, n, ei, e0, e2, K1, MEd, As, Asmin, schlank: lam>lamlim };
}
function updateStuetze(){
  const out=document.getElementById('st-out'); if(!out) return;
  const p={ b:num('st-b'), h:num('st-h'), d1:num('st-d1'), l:num('st-l'), beta:+document.getElementById('st-beta').value,
            NEd:num('st-N'), M0:num('st-M'), fck:betonRow(document.getElementById('st-c').value)[1] };
  if(!Object.values(p).every(v=>isFinite(v)) || p.b<=0 || p.h<=2*p.d1 || p.l<=0 || p.NEd<=0 || p.M0<0){ out.innerHTML='Bitte Zahlen eingeben (N<sub>Ed</sub> als Druck > 0).'; return; }
  const r=stuetzeBerechne(p);
  let s = `l<sub>0</sub> = β·l = ${deNum(r.l0,2)} m · λ = l<sub>0</sub>/i = <b>${deNum(r.lam,1)}</b> · n = ${deNum(r.n,3)} · λ<sub>lim</sub> = ${deNum(r.lamlim,1)} → ${r.schlank?'<b>schlank</b>, Theorie II. Ordnung':'gedrungen, ohne Theorie II. Ordnung'}`
    + `<br>e<sub>0</sub> = ${deNum(r.e0*100,2)} cm · e<sub>i</sub> = ${deNum(r.ei*100,2)} cm${r.schlank?` · e<sub>2</sub> = ${deNum(r.e2*100,2)} cm (K<sub>1</sub> = ${deNum(r.K1,2)})`:''}`
    + `<br>M<sub>Ed</sub> = N<sub>Ed</sub>·(e<sub>0</sub> + e<sub>i</sub>${r.schlank?' + e<sub>2</sub>':''}) = <b>${deNum(r.MEd,1)} kNm</b>`;
  if(r.As==null) s += `<br><b>Querschnitt reicht auch mit 9 % Bewehrung nicht</b> — größer wählen oder höhere Betonklasse.`;
  else { const A=Math.max(r.As,r.Asmin)/100;
    s += `<br>A<sub>s,tot,erf</sub> = ${deNum(r.As/100)} cm² · A<sub>s,min</sub> = 0,15·N<sub>Ed</sub>/f<sub>yd</sub> = ${deNum(r.Asmin/100)} cm² → <b>${deNum(A)} cm² gesamt</b>, je Seite ${deNum(A/2)} cm²`; }
  out.innerHTML = s;
}

// Wind: vereinfachte Geschwindigkeitsdrücke nach DIN EN 1991-1-4/NA, Tab. NA.B.3 (h ≤ 25 m)
const WIND_Q = [
  ['1',  'Zone 1 — Binnenland',              [0.50,0.65,0.75]],
  ['2',  'Zone 2 — Binnenland',              [0.65,0.80,0.90]],
  ['2k', 'Zone 2 — Küste, Inseln der Ostsee',[0.85,1.00,1.10]],
  ['3',  'Zone 3 — Binnenland',              [0.80,0.95,1.10]],
  ['3k', 'Zone 3 — Küste, Inseln der Ostsee',[1.05,1.20,1.30]],
  ['4',  'Zone 4 — Binnenland',              [0.95,1.15,1.30]],
  ['4k', 'Zone 4 — Küste Nord-/Ostsee, Inseln der Ostsee',[1.25,1.40,1.55]],
];
function windQ(zone, h){
  const row = WIND_Q.find(r=>r[0]===zone); if(!row || h>25) return null;
  return row[2][h<=10 ? 0 : h<=18 ? 1 : 2];
}
function updateWind(){
  const out=document.getElementById('wi-out'); if(!out) return;
  const z=document.getElementById('wi-zone').value, h=num('wi-h');
  const q=windQ(z,h);
  out.innerHTML = q==null ? 'Das vereinfachte Verfahren gilt nur bis h = 25 m.'
    : `q = <b>${deNum(q)} kN/m²</b> &nbsp;·&nbsp; Luv (D, c<sub>pe,10</sub> = +0,8): w = <b>${deNum(0.8*q)}</b> &nbsp;·&nbsp; Sog Ecke (A, −1,2): w = <b>${deNum(-1.2*q)} kN/m²</b>`;
}

// Erddruck (Rankine: senkrechte, glatte Wand, waagerechtes Gelände)
function erdK(phi){ const t=Math.tan((45-phi/2)*Math.PI/180)**2; return {Ka:t, Kp:1/t, K0:1-Math.sin(phi*Math.PI/180)}; }
function updateErd(){
  const out=document.getElementById('ed-out'); if(!out) return;
  const phi=num('ed-phi'), g=num('ed-g'), h=num('ed-h'), q=num('ed-q');
  if(![phi,g,h,q].every(isFinite) || phi<=0 || phi>=60){ out.innerHTML='Bitte gültige Werte eingeben (0° < φ′ < 60°).'; return; }
  const {Ka,Kp,K0}=erdK(phi);
  const Eag=0.5*g*h*h*Ka, Eaq=q*h*Ka;
  const zR = (Eag*h/3 + Eaq*h/2)/(Eag+Eaq||1);
  out.innerHTML = `K<sub>a</sub> = <b>${deNum(Ka,3)}</b> &nbsp;·&nbsp; K<sub>p</sub> = <b>${deNum(Kp,3)}</b> &nbsp;·&nbsp; K<sub>0</sub> = <b>${deNum(K0,3)}</b><br>
    e<sub>a</sub> am Wandfuß = (γ·h + q)·K<sub>a</sub> = <b>${deNum((g*h+q)*Ka)} kN/m²</b><br>
    E<sub>a</sub> = ½·γ·h²·K<sub>a</sub> + q·h·K<sub>a</sub> = ${deNum(Eag)} + ${deNum(Eaq)} = <b>${deNum(Eag+Eaq)} kN/m</b>, Angriff ${deNum(zR)} m über dem Fuß`;
}

// Biegeknicken nach EN 1993-1-1, 6.3.1 (gewalzte I-Profile, S235–S355)
const KNICK_ALPHA = { a0:0.13, a:0.21, b:0.34, c:0.49, d:0.76 };
function knickLinie(name, axis){
  const p=PROFILE.find(r=>r[0]===name); const [,h,b,,tf]=p;
  if(h/b>1.2) return axis==='y' ? 'a' : 'b';          // t_f ≤ 40 mm bei allen Profilen der Tabelle
  return axis==='y' ? 'b' : 'c';                      // t_f ≤ 100 mm
}
function chiOf(lb, alpha){
  if(lb<=0.2) return 1;
  const Phi=0.5*(1+alpha*(lb-0.2)+lb*lb);
  return Math.min(1, 1/(Phi+Math.sqrt(Phi*Phi-lb*lb)));
}
function updateKnick(){
  const out=document.getElementById('kn-out'); if(!out) return;
  const name=document.getElementById('kn-prof').value, st=document.getElementById('kn-st').value, axis=document.getElementById('kn-ax').value;
  const Lcr=num('kn-L');
  if(!isFinite(Lcr) || Lcr<=0){ out.innerHTML='Bitte eine Knicklänge > 0 eingeben.'; return; }
  const p=PROFILE.find(r=>r[0]===name), A=p[6], i=axis==='y'?p[11]:p[15];
  const fy=STAHL.find(s=>s[0]===st)[1], lam1=Math.PI*Math.sqrt(210000/fy);
  const lam=Lcr*100/i, lb=lam/lam1, kl=knickLinie(name,axis), chi=chiOf(lb,KNICK_ALPHA[kl]);
  const Npl=A*fy/10, Nb=chi*Npl/1.1;
  out.innerHTML = `λ = L<sub>cr</sub>/i = ${deNum(lam,1)} &nbsp;·&nbsp; λ<sub>1</sub> = ${deNum(lam1,1)} &nbsp;·&nbsp; λ̄ = <b>${deNum(lb,3)}</b><br>
    Knicklinie <b>${kl}</b> (α = ${deNum(KNICK_ALPHA[kl])}) &nbsp;·&nbsp; χ = <b>${deNum(chi,3)}</b><br>
    N<sub>pl,Rk</sub> = A·f<sub>y</sub> = ${deNum(Npl,0)} kN &nbsp;·&nbsp; N<sub>b,Rd</sub> = χ·A·f<sub>y</sub>/γ<sub>M1</sub> = <b>${deNum(Nb,0)} kN</b>`;
}

// Wasserbau-Rechner
function updateManning(){
  const out=document.getElementById('wbg-out'); if(!out) return;
  const b=num('wbg-b'), h=num('wbg-h'), m=num('wbg-m')||0, I=num('wbg-I')/1000, k=num('wbg-k');
  if(!(b>=0 && h>0 && m>=0 && I>0 && k>0) || (b===0 && m===0)){ out.innerHTML='Bitte b, h, I und k<sub>St</sub> > 0 eingeben.'; return; }
  const A=(b+m*h)*h, U=b+2*h*Math.sqrt(1+m*m), R=A/U, v=k*R**(2/3)*Math.sqrt(I), Q=v*A, B=b+2*m*h, hm=A/B, Fr=v/Math.sqrt(9.81*hm);
  out.innerHTML=`A = ${deNum(A,3)} m² · U = ${deNum(U,3)} m · R = ${deNum(R,3)} m<br>v = <b>${deNum(v,2)} m/s</b> · Q = <b>${deNum(Q,3)} m³/s</b> · Fr = ${deNum(Fr,2)} (${Fr<1?'strömend':Fr>1?'schießend':'kritisch'})`;
}
function updateRohrR(){
  const out=document.getElementById('wbr-out'); if(!out) return;
  const Q=num('wbr-Q')/1000, d=num('wbr-d')/1000, L=num('wbr-L'), k=num('wbr-k')/1000, nu=1.31e-6, g=9.81;
  if(!(Q>0 && d>0 && L>0 && k>=0)){ out.innerHTML='Bitte Q, d, L > 0 eingeben.'; return; }
  const v=Q/(Math.PI*d*d/4), Re=v*d/nu; let lam;
  if(Re<2320) lam=64/Re; else { lam=0.02; for(let i=0;i<60;i++) lam=(-2*Math.log10(2.51/(Re*Math.sqrt(lam))+k/(3.71*d)))**-2; }
  const hv=lam*L/d*v*v/(2*g);
  out.innerHTML=`v = <b>${deNum(v,2)} m/s</b> · v²/2g = ${deNum(v*v/2/g,3)} m · Re = ${deNum(Re,0)} (${Re<2320?'laminar':'turbulent'})<br>λ = ${deNum(lam,4)} · h<sub>v,R</sub> = λ·L/d·v²/2g = <b>${deNum(hv,2)} m</b> (${deNum(hv/L*1000,2)} ‰)`;
}
function updatePoleni(){
  const out=document.getElementById('wbw-out'); if(!out) return;
  const b=num('wbw-b'), h=num('wbw-h'), mu=num('wbw-mu');
  if(!(b>0 && h>0 && mu>0)){ out.innerHTML='Bitte b, h<sub>ü</sub>, μ > 0 eingeben.'; return; }
  const Q=2/3*mu*b*Math.sqrt(2*9.81)*h**1.5;
  out.innerHTML=`Q = 2/3 · ${deNum(mu,3)} · ${deNum(b,2)} · √(2·9,81) · ${deNum(h,3)}<sup>3/2</sup> = <b>${deNum(Q,3)} m³/s</b> · q = Q/b = ${deNum(Q/b,3)} m²/s`;
}
function updateNeigung(fromAngle){
  const out=document.getElementById('ng2-out'); if(!out) return;
  let p=num('ng2-p'), a=num('ng2-a');
  if(fromAngle && a>=0 && a<90){ p=100*Math.tan(a*Math.PI/180); document.getElementById('ng2-p').value=+p.toFixed(2); }

const hrefOf = (f,k,t) => '#/' + [f,k,t].filter(Boolean).join('/');
const escapeHtml = v => String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deNum = (v, d=2) => (+v + Math.sign(+v)*1e-9).toFixed(d).replace('.', ',');   // 1e-9: 1,575 → 1,58 statt 1,57 (Gleitkomma)

// Datentabelle. Zeile antippen = markieren (hilft beim Ablesen breiter Tabellen).
function dataTable(data){
  let head = '<tr>' + data.cols.map(c=>`<th>${c}</th>`).join('') + '</tr>';
  if(data.units){
    head += '<tr>' + data.units.map(u=>`<th style="font-weight:400;color:var(--text3);font-size:10px">${u}</th>`).join('') + '</tr>';
  }
  const body = data.rows.map(r=>'<tr>' + r.map(c=>`<td>${typeof c==='number' ? String(c).replace('.',',') : c}</td>`).join('') + '</tr>').join('');
  return `<div class="data-table-wrap"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="table-hint">Zeile antippen zum Markieren${data.cols.length>5 ? ' · waagerecht scrollbar' : ''}</div>`;
}
// Einfache Texttabelle (Formeln, Grenzwerte)
function textTable(cols, rows){
  // Lange Texte in den hinteren Spalten → umbrechen und linksbündig statt waagerecht scrollen
  const plain = c => String(c).replace(/<[^>]*>/g,'');
  const wrap = rows.some(r => r.slice(1).some(c => plain(c).length > 26));
  return `<div class="data-table-wrap"><table class="data text-cols${wrap?' text-table':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`
    + (cols.length>=5 && !wrap ? '<div class="table-hint">waagerecht scrollbar</div>' : '');
}

function fdCalc(key, defClass){

  return `

        <div class="calc-field"><label for="fd-${key}-gm">γM</label>
          <select id="fd-${key}-gm" onchange="updateFd('${key}')">${opt('na','1,30 (NA Deutschland)',true)}${opt('en', key==='bsh'?'1,25 (EN-Empfehlung)':'1,30 (EN-Empfehlung)',false)}</select></div>
      </div>
      <div class="calc-out" id="fd-${key}-head"></div>
      <div id="fd-${key}-out"></div>
      <div class="legend">Nicht enthalten: k<sub>h</sub> (Höhenfaktor bei Biegung/Zug), k<sub>cr</sub> (Rissfaktor beim Schub),
        k<sub>sys</sub> (Systembeiwert). Sie kommen im jeweiligen Nachweis dazu.</div>
    </div>`;
}
function kmodOf(nkl, kled){
  if(kled==='wind'){ const r=KMOD.rows[nkl]; return (r[4]+r[5])/2; }   // Mittelwert kurz / sehr kurz (NA)
  return KMOD.rows[nkl][1+(+kled)];
}
function updateFd(key){
  const T = FD_TABLES[key];
  const el = id => document.getElementById(`fd-${key}-${id}`);
  if(!el('cls')) return;
  const row = T.rows.find(r=>r[0]===el('cls').value);
  const nkl = +el('nkl').value, kled = el('kled').value;
  const km = kmodOf(nkl, kled);
  const gm = el('gm').value==='en' && key==='bsh' ? 1.25 : 1.30;
  const names = [['f_m,d','Biegung',1],['f_t,0,d','Zug ∥',2],['f_t,90,d','Zug ⊥',3],['f_c,0,d','Druck ∥',4],['f_c,90,d','Druck ⊥',5],['f_v,d','Schub',6]];
  el('head').innerHTML = `k<sub>mod</sub> = <b>${deNum(km)}</b> &nbsp;·&nbsp; γ<sub>M</sub> = <b>${deNum(gm)}</b> &nbsp;·&nbsp; k<sub>mod</sub>/γ<sub>M</sub> = <b>${deNum(km/gm,3)}</b>`;
  el('out').innerHTML = textTable(['','Beanspruchung','f_k','f_d'],
    names.map(([n,l,i])=>[n, l, deNum(row[i],1), `<b>${deNum(km*row[i]/gm)}</b>`]))
    + `<div class="table-hint">Werte in N/mm²</div>`;
}

        Druck- und Zugfestigkeit ∥ Faser ist niedriger als bei homogenem BSH gleicher Klasse.

      </div>
    </div>
    ${fdCalc('bsh','GL24h')}
  `,

      <div class="section-note">In der ständigen und vorübergehenden Bemessungssituation (GZT):</div>
      <div class="formula-box">
        E<sub>d</sub> = γ<sub>G</sub>·G<sub>k</sub> + γ<sub>Q</sub>·Q<sub>k,1</sub> + Σ<sub>i>1</sub> γ<sub>Q</sub>·ψ<sub>0,i</sub>·Q<sub>k,i</sub>

      </div>

    <div class="card">

      <div class="section-note">

      </div>

        a<sub>4,t</sub> / a<sub>4,c</sub> — zum beanspruchten / unbeanspruchten Rand

  // ── Verbindungen → Stabdübel & Bolzen ────────────
  'holzbau/verbindungen/stabduebel': () => `
    <div class="card">
      <div class="card-title">Tragfähigkeit auf Abscheren — Theorie nach Johansen</div>
      <div class="section-note">
        Die charakteristische Tragfähigkeit F<sub>v,Rk</sub> eines stiftförmigen
        Verbindungsmittels je Scherfuge ergibt sich aus dem kleinsten Wert mehrerer
        Versagensmechanismen (Fließgelenktheorie).
      </div>
      <div class="formula-box">
        Maßgebend ist der <b>kleinste</b> Wert aus:<br>
        — Lochleibungsversagen im Holz<br>
        — Lochleibung + 1 Fließgelenk im Stift<br>
        — Lochleibung + 2 Fließgelenke im Stift
        <div class="comment">Mechanismen mit Fließgelenken sind erwünscht: Sie sind duktil und
        kündigen das Versagen durch Verformung an.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Lochleibungsfestigkeit f_h,0,k</div>
      <div class="section-note">Für Stabdübel und Bolzen, Kraft ∥ Faser:</div>
      <div class="formula-box">
        f<sub>h,0,k</sub> = 0,082 · (1 − 0,01·d) · ρ<sub>k</sub>&nbsp;&nbsp;[N/mm²]
        <div class="comment">d — Durchmesser [mm] · ρ<sub>k</sub> — char. Rohdichte [kg/m³]</div>
      </div>
      <div class="section-note" style="margin-top:8px">Unter dem Winkel α zur Faser:</div>
      <div class="formula-box">
        f<sub>h,α,k</sub> = f<sub>h,0,k</sub> / (k<sub>90</sub>·sin²α + cos²α)
        <div class="comment">k<sub>90</sub> = 1,35 + 0,015·d (Nadelholz)</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Fließmoment M_y,Rk</div>
      <div class="formula-box">
        M<sub>y,Rk</sub> = 0,3 · f<sub>u,k</sub> · d<sup>2,6</sup>&nbsp;&nbsp;[Nmm]
        <div class="comment">f<sub>u,k</sub> — char. Zugfestigkeit des Stahlstifts
        (z. B. S235: 360 N/mm²)</div>
      </div>
      ${sizeSoon('→ Abscher-Nachweis führen')}
    </div>

    <div class="card">
      <div class="card-title">Übliche Durchmesser</div>
      <div class="section-note">
        Stabdübel: 6, 8, 10, 12, 16, 20, 24 mm — passgenau im vorgebohrten Loch.<br>

        Unterlegscheibe.
      </div>
      <a class="applink" href="#/holzbau/verbindungen/abstaende">→ Mindestabstände</a>
    </div>
  `,

  'holzbau/gzg/durchbiegung': () => `

  'holzbau/gzg/schwingung': () => `

      <div class="card-title">Schwingungsnachweis für Wohnungsdecken — EN 1995-1-1, 7.3.3</div>

      ${textTable(['Eigenfrequenz','Vorgehen'], [

      <div class="norm-note">
        Der deutsche NA regelt den Schwingungsnachweis abweichend (eigene Frequenzgrenzen
        und Kriterien). Für Nachweise in Deutschland den NA heranziehen.
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Eigenfrequenz</div>
      <div class="formula-box">

      </div>
    </div>

    <div class="card">
      <div class="card-title">2. Steifigkeitskriterium (f₁ > 8 Hz)</div>
      <div class="section-note">

      </div>
      <div class="formula-box">
        w / F ≤ a&nbsp;&nbsp;[mm/kN]
        <div class="comment">Grenzwert a je nach gewünschtem Schwingverhalten (EN 1995-1-1, Bild 7.2).</div>
      </div>

        und Eigenspannungen → Bemessung mit Abminderungsbeiwerten (χ im Stahlbau, k<sub>c</sub> im Holzbau).</div>
      </div>
      ${fig(skEuler(),'Knickfiguren der vier Eulerfälle: L<sub>cr</sub> = β·L ist der Abstand der Wendepunkte (Halbwelle der Sinuslinie).')}
      ${textTable(['Eulerfall','Lagerung','β'], [
        ['1','eingespannt – frei','2,0'],
        ['2','gelenkig – gelenkig','1,0'],
        ['3','eingespannt – gelenkig','0,7'],
        ['4','eingespannt – eingespannt','0,5'],
      ])}
      <div class="section-note" style="margin-top:8px">Schlankheit: λ = L<sub>cr</sub> / i mit i = √(I/A). Maßgebend ist die Achse mit dem kleineren i.</div>
      <a class="applink" href="#/stahlbau/nachweise/biegeknicken">→ Biegeknicken im Stahlbau</a>
      <a class="applink" href="#/holzbau/gzt/knicken">→ Knicken im Holzbau</a>

  `,

  'baustatik/arbeitssatz/pvk': () => `
    <div class="card">
      <div class="card-title">Verschiebung an einer Stelle berechnen</div>
      <div class="section-note">
        Mit dem Prinzip der virtuellen Kräfte (Arbeitssatz) berechnet man die Verschiebung oder Verdrehung
        an einer beliebigen Stelle. Bei Biegeträgern überwiegt der Biegeanteil:
      </div>
      <div class="formula-box">
        δ = ∫ M · M̄ / (EI) dx&nbsp;&nbsp; (+ ∫ N · N̄ / (EA) dx + …)
        <div class="comment">M — Momentenverlauf aus der tatsächlichen Last<br>
        M̄ — Momentenverlauf aus einer virtuellen „1“ an der gesuchten Stelle</div>
      </div>
      ${fig(skPVK(),'Oben: tatsächliche Last und M · unten: virtuelle „1“ an der gesuchten Stelle und M̄')}
      ${textTable(['Schritt','Vorgehen'], [
        ['1','M-Verlauf aus der äußeren Last bestimmen'],
        ['2','Virtuelle Last „1“ an der gesuchten Stelle in Richtung der gesuchten Verformung (Kraft für w, Moment für φ)'],
        ['3','M̄-Verlauf aus dieser „1“ bestimmen'],
        ['4','Integral abschnittsweise mit der Koppeltafel auswerten, durch EI teilen'],
      ])}
      <div class="info-banner">
        Beispiel: Einfeldträger mit Gleichlast, Durchbiegung in Feldmitte. M ist eine Parabel mit Stich qL²/8,
        M̄ ein Dreieck mit Spitze L/4 in der Mitte. Koppeltafel: 5/12 · L · i · k<br>
        w = (1/EI) · 5/12 · L · qL²/8 · L/4 = <b>5qL⁴/(384EI)</b>
      </div>
      <a class="applink" href="#/baustatik/arbeitssatz/koppeltafel">→ Koppeltafel</a>
    </div>
  `,

  'baustatik/arbeitssatz/koppeltafel': () => `
    <div class="card">
      <div class="card-title">Integraltafel ∫₀ᴸ M · M̄ dx</div>
      <div class="section-note">i — Ordinate von M, k — Ordinate von M̄, L — Länge des Abschnitts.
        „Dreieck“ hat die Spitze am Ende, „Dreieck Mitte“ die Spitze in der Mitte, „Parabel“ ist die
        quadratische Parabel mit Stich i in der Mitte (Gleichlast).</div>
      ${textTable(['M \\ M̄','Rechteck k','Dreieck k','Dreieck Mitte k'], [
        ['Rechteck i','L·i·k','½·L·i·k','½·L·i·k'],
        ['Dreieck i (gleichsinnig)','½·L·i·k','⅓·L·i·k','¼·L·i·k'],
        ['Dreieck i (gegensinnig)','½·L·i·k','⅙·L·i·k','¼·L·i·k'],
        ['Parabel i','⅔·L·i·k','⅓·L·i·k','5/12·L·i·k'],
      ])}
      <div class="formula-box">
        Trapez (i₁, i₂) × Trapez (k₁, k₂):<br>
        L/6 · (2·i₁·k₁ + 2·i₂·k₂ + i₁·k₂ + i₂·k₁)
        <div class="comment">Die allgemeine Formel für lineare Verläufe. Dreiecke und Rechtecke sind Sonderfälle.</div>
      </div>
      <div class="legend">Vorzeichen beachten: Liegen i und k auf verschiedenen Seiten, wird das Produkt negativ.</div>
    </div>
  `,

      <div class="formula-box">

  'stahlbau/nachweise/biegeknicken': () => `

        Φ = 0,5 · (1 + α·(λ̄ − 0,2) + λ̄²)<br>
        χ = 1 / (Φ + √(Φ² − λ̄²)) ≤ 1<br>
        N<sub>b,Rd</sub> = χ · A · f<sub>y</sub> / γ<sub>M1</sub>
        <div class="comment">Für λ̄ ≤ 0,2 ist χ = 1 (kein Stabilitätsnachweis nötig).</div>

  'grundbau/boden/kennwerte': () => `

      ${textTable(['Boden','γ [kN/m³]','γ′ [kN/m³]','φ′','c′ [kN/m²]','E_s [MN/m²]','k [m/s]'], [
        ['Sand, locker','17–18','9–10','30°','0','10–30','10⁻³–10⁻⁵'],
        ['Sand, mitteldicht','18–19','10–11','32,5°','0','30–60','10⁻³–10⁻⁵'],
        ['Sand, dicht / Kies-Sand','19–20','11–12','35°–37,5°','0','60–150','10⁻²–10⁻⁴'],

      <div class="legend">γ′ — Wichte unter Auftrieb (γ<sub>r</sub> − γ<sub>w</sub>, γ<sub>w</sub> = 10 kN/m³) · φ′ — wirksamer Reibungswinkel · c′ — wirksame Kohäsion</div>
    </div>
    <div class="card">
      <div class="card-title">Nichtbindig und bindig</div>
      <div class="section-note">
        <b>Nichtbindige Böden</b> (Sand, Kies) tragen über Reibung, c′ ≈ 0. Wasser fließt schnell ab,
        Setzungen treten fast sofort ein.<br>
        <b>Bindige Böden</b> (Schluff, Ton) haben Kohäsion, sind wasserempfindlich und setzen sich zeitverzögert

    </div>
    <div class="card">
      <div class="card-title">Lagerungsdichte und Konsistenz</div>

        ['locker','0,15–0,30','weich','0,50–0,75'],
        ['mitteldicht','0,30–0,50','steif','0,75–1,00'],
        ['dicht','&gt; 0,50','halbfest','&gt; 1,00'],
      ])}
      <div class="formula-box">
        I<sub>c</sub> = (w<sub>L</sub> − w) / (w<sub>L</sub> − w<sub>P</sub>)

  'grundbau/boden/setzung': () => `
    <div class="card">
      <div class="card-title">Setzung aus Steifemodul</div>

        s = Σ ( Δσ<sub>z,i</sub> · Δh<sub>i</sub> / E<sub>s,i</sub> )
        <div class="comment">Δσ<sub>z</sub> — Zusatzspannung aus dem Bauwerk in der Schicht (nimmt mit der Tiefe ab)<br>

  'grundbau/erddruck/beiwerte': () => `

      <div class="formula-box">
        aktiv:&nbsp; K<sub>a</sub> = tan²(45° − φ′/2)<br>
        passiv:&nbsp; K<sub>p</sub> = tan²(45° + φ′/2) = 1/K<sub>a</sub><br>
        Ruhedruck:&nbsp; K<sub>0</sub> = 1 − sin φ′
        <div class="comment">Aktiver Erddruck: Wand gibt nach (kleinster Druck). Passiv: Wand wird gegen den Boden gedrückt (größter Widerstand).

      </div>
      ${textTable(['φ′','K_a','K_p','K_0'], [[25,0.406,2.464,0.577],[30,0.333,3.0,0.5],[32.5,0.301,3.322,0.463],[35,0.271,3.69,0.426]]

  // ═════════════ MATHEMATIK ═════════════
  'mathematik/geometrie/trigonometrie': () => `
    <div class="card">
      <div class="card-title">Rechtwinkliges Dreieck</div>
      <div class="sk-row">${fig(skRechtwinklig())}${fig(skEinheitskreis())}</div>
      <div class="formula-box">
        sin α = g / c&nbsp;&nbsp;&nbsp; cos α = a / c&nbsp;&nbsp;&nbsp; tan α = g / a<br>
        sin²α + cos²α = 1&nbsp;&nbsp;&nbsp; c² = a² + g²
      </div>
      ${textTable(['α','0°','30°','45°','60°','90°'], [
        ['sin α','0','½','½·√2','½·√3','1'],
        ['cos α','1','½·√3','½·√2','½','0'],
        ['tan α','0','⅓·√3','1','√3','—'],
      ])}
    </div>
    <div class="card">
      <div class="card-title">Beliebiges Dreieck</div>
      <div class="formula-box">
        Sinussatz:&nbsp; a / sin α = b / sin β = c / sin γ<br>
        Kosinussatz:&nbsp; c² = a² + b² − 2·a·b·cos γ<br>
        Fläche:&nbsp; A = c·h<sub>c</sub>/2 = ½·a·b·sin γ&nbsp;&nbsp;&nbsp; α + β + γ = 180°
      </div>
      <div class="sk-row">${fig(skDreieckAllg(),'Gegenüber jeder Ecke liegt die gleichnamige Seite: a gegenüber A usw.')}${fig(skKraftzerlegung(),'Zerlegung einer Kraft in eine senkrechte und eine waagerechte Komponente')}</div>
      <div class="info-banner">Anwendung in der Statik: Zerlegen einer schrägen Kraft F unter dem Winkel α zur Senkrechten:
        V = F·cos α, H = F·sin α.</div>
    </div>
  `,

  // ═════════════ WASSERBAU ═════════════
  'wasserbau/hydrostatik/druck': () => `
    <div class="card">
      <div class="card-title">Hydrostatischer Druck</div>
      <div class="formula-box">
        p = ρ · g · h = γ<sub>w</sub> · h&nbsp;&nbsp;&nbsp; γ<sub>w</sub> = 9,81 kN/m³ ≈ 10 kN/m³
        <div class="comment">Der Druck wächst linear mit der Tiefe h unter dem Wasserspiegel und wirkt immer senkrecht auf die Fläche — unabhängig von deren Neigung.</div>
      </div>
      ${fig(skWDWand(),'Senkrechte Wand: Druckdreieck, Resultierende im Drittelpunkt über der Sohle.')}
      <div class="formula-box">
        Senkrechte Wand, Breite b:&nbsp; F = γ<sub>w</sub> · h² / 2 · b&nbsp;&nbsp;&nbsp; Angriff in h/3 über der Sohle<br>
        Moment am Wandfuß:&nbsp; M = F · h/3 = γ<sub>w</sub> · h³ / 6 · b
      </div>
      <div class="info-banner">Beispiel: h = 3,0 m, b = 1 m → F = 10 · 3,0²/2 = <b>45 kN/m</b>, M = 45 · 1,0 = <b>45 kNm/m</b> (mit γ<sub>w</sub> = 10 kN/m³).</div>
    </div>
    <div class="card">
      <div class="card-title">Geneigte Fläche — Druckkraft und Druckmittelpunkt</div>
      ${fig(skWDSchraeg(),'y wird in der Ebene der Fläche ab dem Wasserspiegel gemessen. Der Druckmittelpunkt D liegt immer tiefer als der Schwerpunkt S.')}
      <div class="formula-box">
        F = γ<sub>w</sub> · h<sub>s</sub> · A&nbsp;&nbsp;&nbsp; (h<sub>s</sub> — Tiefe des Flächenschwerpunkts)<br>
        y<sub>D</sub> = y<sub>s</sub> + I<sub>s</sub> / (y<sub>s</sub> · A)&nbsp;&nbsp;&nbsp; mit h<sub>s</sub> = y<sub>s</sub> · sin α
        <div class="comment">I<sub>s</sub> — Flächenträgheitsmoment um die waagerechte Schwerachse der Fläche (Rechteck: b·l³/12)</div>
      </div>
      <div class="info-banner">Beispiel: Schütz 1 × 2 m (l = 2 m in Neigungsrichtung), α = 60°, Oberkante bei y = 1,0 m.<br>
        y<sub>s</sub> = 2,0 m, h<sub>s</sub> = 2,0 · sin 60° = 1,73 m → F = 10 · 1,73 · 2,0 = <b>34,6 kN</b> · y<sub>D</sub> = 2,0 + (1·2³/12)/(2,0·2,0) = <b>2,17 m</b></div>
      <a class="applink" href="size.html">→ Wasserdruck mit Gegendruck in statiq·size (Wasserbau)</a>
    </div>
  `,

  'wasserbau/hydrostatik/gekruemmt': () => `
    <div class="card">
      <div class="card-title">Gekrümmte Flächen — Zerlegen in Komponenten</div>
      ${fig(skWDGekruemmt(),'Segmentschütz (Viertelkreis): F<sub>H</sub> aus der senkrechten Projektion, F<sub>V</sub> aus dem Wasservolumen V<sub>W</sub> über der Fläche.')}
      <div class="formula-box">
        F<sub>H</sub> = γ<sub>w</sub> · h<sub>s,proj</sub> · A<sub>proj</sub>&nbsp;&nbsp;&nbsp; (wie bei einer senkrechten Wand mit der Projektionsfläche)<br>
        F<sub>V</sub> = γ<sub>w</sub> · V<sub>W</sub>&nbsp;&nbsp;&nbsp; (Gewicht des — wirklichen oder gedachten — Wasserkörpers zwischen Fläche und Wasserspiegel)<br>
        F = √(F<sub>H</sub>² + F<sub>V</sub>²)
        <div class="comment">Bei Kreisflächen gehen alle Druckkräfte durch den Mittelpunkt — die Resultierende also auch. Liegt das Wasser unter der Fläche, wirkt F<sub>V</sub> nach oben.</div>
      </div>
      <div class="info-banner">Beispiel Viertelkreis r = h = 2,0 m, Breite 1 m:<br>
        F<sub>H</sub> = 10 · 2,0²/2 = <b>20 kN</b> · V<sub>W</sub> = π·r²/4 = 3,14 m³ (Viertelkreis über der Fläche) → F<sub>V</sub> = <b>31,4 kN</b> (nach oben) · F = <b>37,2 kN</b></div>
    </div>
  `,

  'wasserbau/hydrostatik/auftrieb': () => `
    <div class="card">
      <div class="card-title">Auftrieb (Archimedes)</div>
      <div class="formula-box">
        F<sub>A</sub> = γ<sub>w</sub> · V<sub>verdrängt</sub>&nbsp;&nbsp;&nbsp; Schwimmen: F<sub>A</sub> = G
        <div class="comment">Die Auftriebskraft greift im Schwerpunkt B des verdrängten Wasservolumens an.</div>
      </div>
      ${fig(skSchwimm(),'G — Schwerpunkt des Körpers, B — Verdrängungsschwerpunkt, M — Metazentrum, h<sub>M</sub> — metazentrische Höhe.')}
      <div class="formula-box">
        Tiefgang Ponton L × B:&nbsp; t = G / (γ<sub>w</sub> · L · B)<br>
        h<sub>M</sub> = I / V − e&nbsp;&nbsp;&nbsp; (e = Abstand G über B)<br>
        stabil, wenn h<sub>M</sub> > 0 (M liegt über G)
        <div class="comment">I — Flächenträgheitsmoment der Wasserlinienfläche um die Längsachse (Rechteck: L·B³/12), V — verdrängtes Volumen</div>
      </div>
      <div class="info-banner">Beispiel: Ponton 10 × 6 m, t = 0,80 m, G in 1,20 m Höhe.<br>
        V = 48 m³ · I = 10·6³/12 = 180 m⁴ · I/V = 3,75 m · e = 1,20 − 0,40 = 0,80 m → h<sub>M</sub> = <b>2,95 m</b> > 0 → stabil</div>
      <a class="applink" href="#/grundbau/flach/sohldruck">→ Auftrieb bei Bauwerken: Nachweis UPL in statiq·size (Grundbau)</a>
    </div>
  `,

  'wasserbau/hydrodynamik/bernoulli': () => `
    <div class="card">
      <div class="card-title">Kontinuität</div>
      <div class="formula-box">Q = v · A = konst.&nbsp;&nbsp;&nbsp; v<sub>1</sub> · A<sub>1</sub> = v<sub>2</sub> · A<sub>2</sub>
        <div class="comment">Wird der Querschnitt kleiner, wird das Wasser schneller.</div></div>
    </div>
    <div class="card">
      <div class="card-title">Bernoulli-Gleichung (Energiehöhe)</div>
      ${fig(skBernoulli(),'EL — Energielinie (ohne Verluste waagerecht), DL — Drucklinie. In der Engstelle steigt v, der Druck sinkt.')}
      <div class="formula-box">
        H = z + p/(ρ·g) + v²/(2g) = konst.&nbsp;&nbsp;&nbsp; (ohne Verluste)<br>
        mit Verlusten:&nbsp; z<sub>1</sub> + p<sub>1</sub>/(ρg) + v<sub>1</sub>²/(2g) = z<sub>2</sub> + p<sub>2</sub>/(ρg) + v<sub>2</sub>²/(2g) + h<sub>v</sub>
        <div class="comment">z — Lagehöhe · p/(ρg) — Druckhöhe · v²/(2g) — Geschwindigkeitshöhe, alle in m</div>
      </div>
      ${textTable(['v [m/s]','0,5','1,0','2,0','3,0','5,0'], [['v²/(2g) [m]','0,013','0,051','0,204','0,459','1,274']])}
    </div>
  `,

  'wasserbau/hydrodynamik/rohr': () => `
    <div class="card">
      <div class="card-title">Reibungsverlust (Darcy-Weisbach)</div>
      ${fig(skRohrleitung(),'Zwischen zwei Behältern fällt die Energielinie um den Höhenunterschied Δh: Einlaufverlust, Reibung entlang der Leitung, Auslaufverlust.')}
      <div class="formula-box">
        h<sub>v,R</sub> = λ · L/d · v²/(2g)&nbsp;&nbsp;&nbsp; Re = v · d / ν&nbsp;&nbsp; (ν ≈ 1,31·10⁻⁶ m²/s bei 10 °C)<br>
        laminar (Re < 2320):&nbsp; λ = 64 / Re<br>
        turbulent (Colebrook-White):&nbsp; 1/√λ = −2 · lg( 2,51/(Re·√λ) + k/(3,71·d) )<br>

  'wasserbau/gerinne/normalabfluss': () => `

  'mathematik/geometrie/dreiecke': () => `
    <div class="card">
      <div class="card-title">Rechtwinkliges Dreieck — Pythagoras, Höhen- und Kathetensatz</div>
      <div class="sk-row">${fig(skPythagoras(),'Die Flächen der Quadrate über den Katheten ergeben zusammen das Quadrat über der Hypotenuse.')}${fig(skHoehensatz(),'Die Höhe h teilt die Hypotenuse c in die Abschnitte p (unter a) und q (unter b).')}</div>
      <div class="formula-box">
        Pythagoras:&nbsp; a² + b² = c²&nbsp;&nbsp;&nbsp; c = √(a² + b²)<br>
        Höhensatz:&nbsp; h² = p · q<br>
        Kathetensatz:&nbsp; a² = c · p&nbsp;&nbsp;&nbsp; b² = c · q<br>
        Fläche:&nbsp; A = a · b / 2 = c · h / 2
      </div>
      <div class="info-banner">Baustelle: Ein rechter Winkel lässt sich mit dem Maßband abstecken — 3 m, 4 m und 5 m bilden ein rechtwinkliges Dreieck (3² + 4² = 9 + 16 = 25 = 5²).</div>

      <div class="card-title">Besondere Dreiecke</div>
      ${shapeGrid([
        shapeCard(skGleichseitig(),'Gleichseitiges Dreieck',[['h','a·√3/2 ≈ 0,866·a'],['A','a²·√3/4 ≈ 0,433·a²'],['Winkel','je 60°'],['S','h/3 über der Seite']]),
        shapeCard(skGleichschenklig(),'Gleichschenkliges Dreieck',[['h<sub>c</sub>','√(a² − c²/4)'],['A','c · h<sub>c</sub> / 2'],['β','(180° − γ)/2'],['c','2 · a · sin(γ/2)']]),

      <div class="legend">In jedem Dreieck gilt die Winkelsumme α + β + γ = 180°. Gleich lange Seiten sind mit einem Strich markiert.</div>

      <div class="card-title">Strahlensatz</div>
      ${fig(skStrahlensatz(),'Zwei Strahlen von Z werden von zwei parallelen Geraden geschnitten.')}
      <div class="formula-box">
        ZA : ZA′ = ZB : ZB′&nbsp;&nbsp;&nbsp; (1. Strahlensatz)<br>
        AB : A′B′ = ZA : ZA′&nbsp;&nbsp;&nbsp; (2. Strahlensatz)

      <div class="info-banner">Anwendung: Höhe eines Pultdachs an einer Zwischenstelle. Firsthöhe 3,0 m über 6,0 m Länge → in 2,0 m Abstand vom Tiefpunkt: 3,0 · 2,0/6,0 = <b>1,0 m</b>.</div>

      ${fig(skAbleitung(),'Die Ableitung f′(x₀) ist die Steigung der Tangente im Punkt x₀ — Grenzwert des Differenzenquotienten Δy/Δx.')}
    </div>
    <div class="card">
      <div class="card-title">Grundableitungen und Stammfunktionen</div>
      ${textTable(['f(x)','f′(x)','∫ f(x) dx'], [
        ['xⁿ','n·xⁿ⁻¹','xⁿ⁺¹/(n + 1) + C'],
        ['sin x','cos x','−cos x + C'],
        ['cos x','−sin x','sin x + C'],
        ['eˣ','eˣ','eˣ + C'],
        ['ln x','1/x','x·ln x − x + C'],
      ])}
    </div>
    <div class="card">
      <div class="card-title">Regeln</div>
      <div class="formula-box">
        Produktregel:&nbsp; (u·v)′ = u′·v + u·v′<br>
        Quotientenregel:&nbsp; (u/v)′ = (u′·v − u·v′) / v²<br>
        Kettenregel:&nbsp; f(g(x))′ = f′(g(x)) · g′(x)<br>
        Partielle Integration:&nbsp; ∫ u·v′ dx = u·v − ∫ u′·v dx
      </div>
      <div class="info-banner">Statik-Beispiel: q konstant → Q = −q·x + C₁ → M = −q·x²/2 + C₁·x + C₂.
        Die Konstanten folgen aus den Randbedingungen (z. B. M = 0 an gelenkigen Enden).</div>
    </div>
  `,

      <div class="formula-box">

  'mathematik/algebra/gleichungen': () => `
    <div class="card">
      <div class="card-title">Quadratische Gleichungen</div>
      <div class="formula-box">
        a·x² + b·x + c = 0&nbsp; →&nbsp; x₁,₂ = ( −b ± √(b² − 4ac) ) / (2a)<br>
        x² + p·x + q = 0&nbsp; →&nbsp; x₁,₂ = −p/2 ± √( (p/2)² − q )
      </div>
    </div>
    <div class="card">
      <div class="card-title">Lineare Gleichungssysteme</div>
      <div class="formula-box">
        2×2 (Cramer):&nbsp; a₁x + b₁y = c₁, a₂x + b₂y = c₂<br>
        D = a₁b₂ − a₂b₁,&nbsp; x = (c₁b₂ − c₂b₁)/D,&nbsp; y = (a₁c₂ − a₂c₁)/D
        <div class="comment">D = 0: keine oder unendlich viele Lösungen (in der Statik: verschiebliches System)</div>
      </div>
      <div class="section-note"><b>Gauß-Verfahren</b> für größere Systeme: Gleichungen so kombinieren, dass
        unterhalb der Diagonale Nullen entstehen (Dreiecksform), dann von unten nach oben rückwärts einsetzen.
        So löst auch statiq·calc die Steifigkeitsgleichung K·u = F.</div>
      <div class="formula-box">
        Determinante 3×3 (Sarrus):<br>
        det = a₁₁a₂₂a₃₃ + a₁₂a₂₃a₃₁ + a₁₃a₂₁a₃₂ − a₁₃a₂₂a₃₁ − a₁₁a₂₃a₃₂ − a₁₂a₂₁a₃₃
      </div>
    </div>
  `,

  'grundbau/flach/sohlwiderstand': () => `

  'stahlbeton/bemessung/biegung': () => `
    <div class="card">
      <div class="card-title">Prinzip der Biegebemessung</div>
      ${figBiegung()}
      <div class="section-note">Der Beton nimmt den Druck, der Betonstahl den Zug. Gesucht ist die Bewehrung, bei der das
        innere Kräftepaar F<sub>cd</sub> · z dem Moment standhält. Ohne Normalkraft gilt M<sub>Eds</sub> = M<sub>Ed</sub>.</div>
    </div>
    <div class="card">
      <div class="card-title">Bemessung mit dem ω-Verfahren (Rechteck, ohne Druckbewehrung)</div>
      <div class="formula-box">
        1.&nbsp; μ<sub>Eds</sub> = M<sub>Eds</sub> / (b · d² · f<sub>cd</sub>)<br>
        2.&nbsp; ω, ξ, ζ aus der Tabelle (μ<sub>Eds</sub> ≤ μ<sub>lim</sub> = 0,296)<br>
        3.&nbsp; A<sub>s1</sub> = ω · b · d · f<sub>cd</sub> / f<sub>yd</sub>&nbsp;&nbsp;(+ N<sub>Ed</sub> / f<sub>yd</sub> bei Normalkraft)
        <div class="comment">d — statische Nutzhöhe (Abstand Druckrand bis Schwerpunkt der Zugbewehrung) · ξ = x/d · ζ = z/d<br>
        μ<sub>lim</sub> gehört zu ξ = 0,45: Bis dahin verformt sich der Querschnitt duktil, darüber Druckbewehrung oder größerer Querschnitt.</div>
      </div>
      ${textTable(['μ_Eds','ω','ξ','ζ','ε_c [‰]','ε_s [‰]'], (()=>{ const r=[]; for(let i=1;i<=29;i++){ const st=biegeAusMu(i/100); r.push([deNum(i/100,2), deNum(st.omega,4), deNum(st.xi,3), deNum(st.zeta,3), deNum(-st.ec,2), deNum(st.es,1)]); } return r; })())}
      <div class="legend">Berechnet mit dem Parabel-Rechteck-Diagramm (C12/15 bis C50/60), B500 mit horizontalem Ast, ε<sub>s</sub> ≤ 25 ‰.
        Tabellen mit ansteigendem Stahlast liefern bei großem μ etwas kleinere ω (sichere Seite hier).</div>
    </div>
    <div class="card">
      <div class="card-title">Druckbewehrung (μ<sub>Eds</sub> > μ<sub>lim</sub>)</div>
      <div class="section-note">Reicht die Betondruckzone nicht, hält man die Nulllinie bei ξ = 0,45 fest und legt das restliche Moment
        Δμ auf ein Stahl-Kräftepaar aus Druckbewehrung A<sub>s2</sub> (oben) und zusätzlicher Zugbewehrung (unten) mit dem Hebelarm d − d₂.</div>
      <div class="formula-box">
        Δμ = μ<sub>Eds</sub> − μ<sub>lim</sub>&nbsp;&nbsp;(μ<sub>lim</sub> = 0,296, ω<sub>lim</sub> = 0,364)<br>
        A<sub>s1</sub> = (ω<sub>lim</sub> + Δμ / (1 − d₂/d)) · b·d·f<sub>cd</sub> / f<sub>yd</sub><br>
        A<sub>s2</sub> = Δμ / (1 − d₂/d) · b·d·f<sub>cd</sub> / σ<sub>s2</sub>&nbsp;&nbsp;mit&nbsp; ε<sub>s2</sub> = 3,5 ‰ · (ξ − d₂/d) / ξ
        <div class="comment">σ<sub>s2</sub> = f<sub>yd</sub>, solange d₂/d ≤ 0,17 (ε<sub>s2</sub> ≥ 2,17 ‰). Druckstäbe mit Bügeln gegen Ausknicken sichern (Abstand ≤ 12·Ø).</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Biegebemessung Rechteckquerschnitt</div>

        ${field('Breite b [cm]', inp('bg-b', 30, 'updateBiegung()'))}
