    menu.innerHTML=h; menu.setAttribute('aria-label', t('menu'));

    burger.setAttribute('aria-expanded','true'); requestAnimationFrame(placePills); var f=menu.querySelector('[aria-current="page"]')||menu.querySelector('.k5-mod'); if(f) f.focus({preventScroll:true}); }

  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ show(en.target); io.unobserve(en.target); } }); }, {rootMargin:'0px 0px -8% 0px'}) : null;
  var revealN=0, revealT=0;
  function show(el){ var now=Date.now(); if(now-revealT>400) revealN=0; revealT=now; el.style.setProperty('--k5-d', Math.min(revealN++,8)*55+'ms'); el.classList.add('k5-rv');
    setTimeout(function(){ el.classList.remove('k5-rv'); el.style.removeProperty('--k5-d'); }, 1300); }
  function reveal(sel){ if(STILL()) return; Array.prototype.forEach.call(D.querySelectorAll(sel), function(el){ if(el.k5seen || el.offsetParent===null) return; el.k5seen=1; io ? io.observe(el) : show(el); }); }

  // ── Zahlen zählen beim ersten Erscheinen hoch, danach kurzes Nachrücken bei Änderung ──
  // Der echte Text bleibt unverändert im Element; gezählt wird in einer darübergelegten Ebene.
  function countUp(el){
    if(STILL() || el.k5counted) return; var txt=el.textContent.trim(), m=txt.match(/^(-?)(\d[\d.,\s]*)(.*)$/); if(!m) return; el.k5counted=1;
    var raw=m[2].trim(), dec=(raw.match(/[.,](\d+)$/)||[])[1]||'', sep=(raw.match(/[.,](?=\d+$)/)||[])[0]||'.';
    var val=parseFloat(raw.replace(/[\s]/g,'').replace(sep===','?/\./g:/,/g,'').replace(',','.')); if(!isFinite(val)||val===0) return;
    var o=D.createElement('span'); o.className='k5-count'; o.setAttribute('aria-hidden','true'); el.classList.add('k5-counting'); el.appendChild(o);

    (function step(now){ var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3), v=val*e;
      o.textContent=m[1]+v.toFixed(dec.length).replace('.',sep)+m[3];
      if(p<1 && o.isConnected) requestAnimationFrame(step); else { o.remove(); el.classList.remove('k5-counting'); } })(t0);
  }
  function watchNumbers(sel){
    Array.prototype.forEach.call(D.querySelectorAll(sel), function(el){ if(el.k5w) return; el.k5w=1; var last=el.textContent;
      if(/\d/.test(last) && el.offsetParent!==null) countUp(el);
      new MutationObserver(function(){ var now=el.textContent; if(el.querySelector('.k5-count')) return; if(now===last) return; var was=last; last=now;

de:{ title:'Impressum, Datenschutz und Hinweise',
  lead:'kragr ist ein Lernwerkzeug für das Bauingenieurstudium. Diese Seite enthält die Anbieterkennzeichnung, die Datenschutzerklärung, den Haftungsausschluss und Hinweise zu Normen und Quellen.',
  toc:['Impressum','Haftung','Normen und Quellen','Datenschutz','Lizenzen'],
  imp:`<h2 id="impressum">Impressum</h2>
    <p>Angaben gemäß § 5 DDG</p>
    <p>${ph('name')}<br>${ph('street')}<br>${ph('city')}<br>Deutschland</p>
    <h3>Kontakt</h3><p>E-Mail: ${ph('mail')}</p>
    <h3>Umsatzsteuer</h3><p>${ph('vat')}</p>
    <h3>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h3><p>${ph('name')}, Anschrift wie oben</p>`,
  haft:`<h2 id="haftung">Haftung</h2>
    <p><b>kragr ist ein Lern- und Übungswerkzeug.</b> Die Ergebnisse ersetzen keine statische Berechnung durch eine fachkundige Person und keinen geprüften Standsicherheitsnachweis. Sie dürfen nicht ungeprüft für die Bemessung, Ausführung oder Prüfung von Bauwerken verwendet werden.</p>
    <p>Die Rechenwege und Werte wurden sorgfältig erstellt und mit unabhängigen Tests geprüft. Fehler, vereinfachte Annahmen und veraltete Werte lassen sich trotzdem nicht ausschließen. Normen und Nationale Anhänge ändern sich; maßgebend ist immer die bauaufsichtlich eingeführte Fassung.</p>
    <p>Für Schäden, die aus der Nutzung der Inhalte entstehen, wird keine Haftung übernommen, soweit sie nicht auf Vorsatz oder grober Fahrlässigkeit beruhen. Die Haftung für Schäden aus der Verletzung des Lebens, des Körpers oder der Gesundheit bleibt unberührt.</p>
    <h3>Links</h3><p>Für die Inhalte verlinkter fremder Seiten sind deren Betreiber verantwortlich.</p>`,
  norm:`<h2 id="normen">Normen und Quellen</h2>
    <p>kragr enthält keine Normtexte. Formeln, Rechenwerte und Beiwerte werden in eigenen Worten und eigener Darstellung wiedergegeben, meist nur als Auszug für die Werte, die ein Rechner braucht. Die Fundstelle steht jeweils dabei, zum Beispiel „nach DIN EN 1992-1-1, Tab. 3.1“.</p>
    <p>Die vollständigen Normen mit den Nationalen Anhängen sind bei DIN Media erhältlich. Hochschulbibliotheken stellen sie in der Regel kostenlos bereit. Für eine Bemessung sind immer die vollständigen, aktuell gültigen Normen heranzuziehen.</p>
    <p>„DIN“ ist eine eingetragene Marke des DIN Deutsches Institut für Normung e. V. kragr steht in keiner Verbindung zum DIN.</p>
    <h3>Urheberrecht</h3><p>Texte, Abbildungen und Programmcode von kragr sind urheberrechtlich geschützt. Eine Weitergabe oder Veröffentlichung, auch auszugsweise, bedarf der Zustimmung. Das Herunterladen und Verwenden für das eigene Studium ist erlaubt.</p>`,
  ds:`<h2 id="datenschutz">Datenschutz</h2>
    <h3>Verantwortlicher</h3><p>${ph('name')}, ${ph('street')}, ${ph('city')}, E-Mail: ${ph('mail')}</p>
    <h3>Keine Konten, kein Tracking</h3><p>kragr verlangt keine Anmeldung, setzt keine Cookies zu Werbe- oder Analysezwecken und bindet keine Inhalte Dritter ein. Schriften werden vom eigenen Server geladen.</p>
    <h3>Speicherung im Browser</h3><p>Gespeicherte Berechnungen, Positionen, Projekte und die Spracheinstellung legt kragr im lokalen Speicher deines Browsers ab (localStorage). Diese Daten verlassen dein Gerät nicht und werden nicht an den Anbieter übertragen. Du kannst sie jederzeit über die Browsereinstellungen oder in „Projekte“ löschen.</p>
    <h3>Offline-Nutzung und Installation</h3><p>Damit kragr ohne Internet funktioniert und sich als App installieren lässt, legt dein Browser eine Kopie der Programmdateien (Seiten, Schriften, Symbole) auf deinem Gerät ab (Service Worker). Dabei werden keine personenbezogenen Daten gespeichert oder übertragen. Die Kopie verschwindet, wenn du die Websitedaten im Browser löschst oder die App deinstallierst.</p>
    <h3>Server-Logdateien</h3><p>Beim Aufruf der Seiten verarbeitet der Hosting-Anbieter technisch notwendige Daten (IP-Adresse, Datum und Uhrzeit, aufgerufene Datei, Browserkennung), um die Seiten auszuliefern und die Sicherheit zu gewährleisten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Hosting-Anbieter: ${ph('host')}. Dabei können Daten in die USA übermittelt werden. Die Logdateien werden nach den Vorgaben des Anbieters gelöscht.</p>
    <h3>Deine Rechte</h3><p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch (Art. 15–21 DSGVO) sowie das Recht, dich bei einer Datenschutz-Aufsichtsbehörde zu beschweren.</p>`,
  lic:`<h2 id="lizenzen">Lizenzen</h2>

    <p>Bewegungen: GSAP 3.13 (GreenSock), selbst gehostet unter der kostenlosen GSAP Standard License (<a href="https://gsap.com/standard-license" rel="noopener">gsap.com/standard-license</a>).</p>`,

en:{ title:'Legal notice, privacy and disclaimer',
  lead:'kragr is a learning tool for civil engineering students. This page contains the legal notice, the privacy policy, the disclaimer and notes on standards and sources. The German version is authoritative.',
  toc:['Legal notice','Liability','Standards and sources','Privacy','Licences'],
  imp:`<h2 id="impressum">Legal notice</h2>

    <h3>Responsible for content under § 18 (2) MStV</h3><p>${ph('name')}, address as above</p>`,
  haft:`<h2 id="haftung">Liability</h2>
    <p><b>kragr is a learning and practice tool.</b> Its results do not replace a structural calculation by a qualified person or a checked structural safety verification. They must not be used unchecked for the design, construction or checking of structures.</p>
    <p>The calculation steps and values were prepared carefully and verified with independent tests. Errors, simplifying assumptions and outdated values can nevertheless not be ruled out. Standards and National Annexes change; the officially adopted version always governs.</p>
    <p>No liability is accepted for damage arising from the use of the content unless it is based on intent or gross negligence. Liability for injury to life, body or health remains unaffected.</p>
    <h3>Links</h3><p>The operators of linked external pages are responsible for their content.</p>`,
  norm:`<h2 id="normen">Standards and sources</h2>
    <p>kragr contains no text of standards. Formulas, design values and coefficients are given in our own words and presentation, mostly only as an extract of the values a calculator needs. The reference is always stated, e.g. “to DIN EN 1992-1-1, Table 3.1”.</p>
    <p>The complete standards with their National Annexes are available from DIN Media; university libraries usually provide them free of charge. For any design, always use the complete standards currently in force.</p>
    <p>“DIN” is a registered trademark of DIN Deutsches Institut für Normung e. V. kragr is not affiliated with DIN.</p>
    <h3>Copyright</h3><p>Texts, figures and program code of kragr are protected by copyright. Redistribution or publication, even in part, requires permission. Downloading and using kragr for your own studies is permitted.</p>`,
  ds:`<h2 id="datenschutz">Privacy</h2>
    <h3>Controller</h3><p>${ph('name')}, ${ph('street')}, ${ph('city')}, email: ${ph('mail')}</p>
    <h3>No accounts, no tracking</h3><p>kragr requires no sign-in, sets no advertising or analytics cookies and embeds no third-party content. Fonts are loaded from our own server.</p>
    <h3>Storage in your browser</h3><p>Saved calculations, positions, projects and the language setting are stored in your browser’s local storage. This data does not leave your device and is not transmitted to the provider. You can delete it at any time in your browser settings or in “Projects”.</p>
    <h3>Offline use and installation</h3><p>So that kragr works without internet and can be installed as an app, your browser keeps a copy of the program files (pages, fonts, icons) on your device (service worker). No personal data is stored or transmitted in the process. The copy is removed when you clear the site data in your browser or uninstall the app.</p>
    <h3>Server log files</h3><p>When pages are requested, the hosting provider processes technically necessary data (IP address, date and time, requested file, browser identifier) to deliver the pages and keep them secure. Legal basis: Art. 6(1)(f) GDPR. Hosting provider: ${ph('host')}. Data may be transferred to the USA in the process. Log files are deleted according to the provider’s rules.</p>
    <h3>Your rights</h3><p>You have the right of access, rectification, erasure, restriction of processing, data portability and objection (Art. 15–21 GDPR) and the right to lodge a complaint with a data protection authority.</p>`,

fr:{ title:'Mentions légales, confidentialité et avertissement',
  lead:'kragr est un outil d’apprentissage pour les études de génie civil. Cette page contient les mentions légales, la politique de confidentialité, l’avertissement et des remarques sur les normes et les sources. La version allemande fait foi.',
  toc:['Mentions légales','Responsabilité','Normes et sources','Confidentialité','Licences'],
  imp:`<h2 id="impressum">Mentions légales</h2>
    <p>Informations selon le § 5 DDG (loi allemande sur les services numériques)</p>
    <p>${ph('name')}<br>${ph('street')}<br>${ph('city')}<br>Allemagne</p>
    <h3>Contact</h3><p>E-mail : ${ph('mail')}</p>

    <h3>Responsable du contenu selon le § 18 al. 2 MStV</h3><p>${ph('name')}, adresse ci-dessus</p>`,
  haft:`<h2 id="haftung">Responsabilité</h2>
    <p><b>kragr est un outil d’apprentissage et d’exercice.</b> Ses résultats ne remplacent ni une note de calcul établie par une personne qualifiée ni une justification de stabilité contrôlée. Ils ne doivent pas être utilisés sans vérification pour le dimensionnement, l’exécution ou le contrôle d’ouvrages.</p>
    <p>Les calculs et les valeurs ont été établis avec soin et vérifiés par des tests indépendants. Des erreurs, des hypothèses simplificatrices et des valeurs dépassées ne peuvent toutefois pas être exclues. Les normes et les annexes nationales évoluent ; seule la version officiellement introduite fait foi.</p>
    <p>Aucune responsabilité n’est assumée pour les dommages résultant de l’utilisation du contenu, sauf faute intentionnelle ou négligence grave. La responsabilité en cas d’atteinte à la vie, au corps ou à la santé reste inchangée.</p>
    <h3>Liens</h3><p>Les exploitants des pages externes liées sont responsables de leur contenu.</p>`,
  norm:`<h2 id="normen">Normes et sources</h2>
    <p>kragr ne contient aucun texte de norme. Les formules, valeurs de calcul et coefficients sont présentés avec nos propres mots et dans notre propre présentation, le plus souvent sous forme d’extrait des valeurs dont un calculateur a besoin. La référence est toujours indiquée, p. ex. « selon DIN EN 1992-1-1, tab. 3.1 ».</p>
    <p>Les normes complètes avec leurs annexes nationales sont disponibles auprès de DIN Media ; les bibliothèques universitaires les mettent généralement à disposition gratuitement. Pour tout dimensionnement, utilisez toujours les normes complètes en vigueur.</p>
    <p>« DIN » est une marque déposée du DIN Deutsches Institut für Normung e. V. kragr n’a aucun lien avec le DIN.</p>
    <h3>Droit d’auteur</h3><p>Les textes, figures et le code de kragr sont protégés par le droit d’auteur. Toute diffusion ou publication, même partielle, nécessite une autorisation. Le téléchargement et l’utilisation pour vos propres études sont autorisés.</p>`,
  ds:`<h2 id="datenschutz">Confidentialité</h2>
    <h3>Responsable du traitement</h3><p>${ph('name')}, ${ph('street')}, ${ph('city')}, e-mail : ${ph('mail')}</p>
    <h3>Pas de compte, pas de suivi</h3><p>kragr ne demande aucune inscription, ne dépose aucun cookie publicitaire ou d’analyse et n’intègre aucun contenu tiers. Les polices sont chargées depuis notre propre serveur.</p>
    <h3>Stockage dans le navigateur</h3><p>Les calculs, positions, projets enregistrés et le choix de la langue sont stockés dans le stockage local de votre navigateur. Ces données ne quittent pas votre appareil et ne sont pas transmises au fournisseur. Vous pouvez les supprimer à tout moment dans les réglages du navigateur ou dans « Projets ».</p>
    <h3>Utilisation hors ligne et installation</h3><p>Pour que kragr fonctionne sans internet et puisse être installé comme application, votre navigateur conserve une copie des fichiers du programme (pages, polices, icônes) sur votre appareil (service worker). Aucune donnée personnelle n’est enregistrée ni transmise. La copie disparaît lorsque vous effacez les données du site dans le navigateur ou désinstallez l’application.</p>
    <h3>Journaux du serveur</h3><p>Lors de l’appel des pages, l’hébergeur traite les données techniquement nécessaires (adresse IP, date et heure, fichier demandé, identifiant du navigateur) pour délivrer les pages et assurer leur sécurité. Base juridique : art. 6, par. 1, point f du RGPD. Hébergeur : ${ph('host')}. Des données peuvent alors être transférées aux États-Unis. Les journaux sont supprimés selon les règles de l’hébergeur.</p>
    <h3>Vos droits</h3><p>Vous disposez des droits d’accès, de rectification, d’effacement, de limitation, de portabilité et d’opposition (art. 15 à 21 du RGPD) ainsi que du droit d’introduire une réclamation auprès d’une autorité de contrôle.</p>`,
  lic:`<h2 id="lizenzen">Licences</h2>
    <p>Polices utilisées : Figtree, JetBrains Mono et Inter (lettres grecques uniquement), chacune sous SIL Open Font License 1.1. Les textes des licences se trouvent dans le dossier fonts (<a href="fonts/LICENSE-Figtree.txt">Figtree</a>, <a href="fonts/LICENSE-JetBrainsMono.txt">JetBrains Mono</a>, <a href="fonts/LICENSE-Inter.txt">Inter</a>).</p>
    <p>Animations : GSAP 3.13 (GreenSock), hébergé localement sous la licence gratuite GSAP Standard License (<a href="https://gsap.com/standard-license" rel="noopener">gsap.com/standard-license</a>).</p>`,
  stand:'Mise à jour : octobre 2026', back:'Retour à l’accueil' },
es:{ title:'Aviso legal, privacidad y exención de responsabilidad',
  lead:'kragr es una herramienta de aprendizaje para estudiantes de ingeniería civil. Esta página contiene el aviso legal, la política de privacidad, la exención de responsabilidad y notas sobre normas y fuentes. La versión alemana es la vinculante.',
  toc:['Aviso legal','Responsabilidad','Normas y fuentes','Privacidad','Licencias'],
  imp:`<h2 id="impressum">Aviso legal</h2>
    <p>Información conforme al § 5 DDG (ley alemana de servicios digitales)</p>
    <p>${ph('name')}<br>${ph('street')}<br>${ph('city')}<br>Alemania</p>
    <h3>Contacto</h3><p>Correo electrónico: ${ph('mail')}</p>

    <h3>Responsable del contenido según el § 18, apdo. 2 MStV</h3><p>${ph('name')}, dirección arriba indicada</p>`,
  haft:`<h2 id="haftung">Responsabilidad</h2>
    <p><b>kragr es una herramienta de aprendizaje y práctica.</b> Sus resultados no sustituyen un cálculo estructural realizado por una persona cualificada ni una justificación de estabilidad revisada. No deben utilizarse sin comprobación para el dimensionamiento, la ejecución o la revisión de estructuras.</p>
    <p>Los cálculos y valores se han elaborado con cuidado y verificado con pruebas independientes. Aun así, no pueden descartarse errores, hipótesis simplificadas ni valores desactualizados. Las normas y los anejos nacionales cambian; siempre rige la versión oficialmente implantada.</p>
    <p>No se asume responsabilidad por daños derivados del uso del contenido, salvo dolo o negligencia grave. Queda intacta la responsabilidad por daños a la vida, la integridad física o la salud.</p>
    <h3>Enlaces</h3><p>Los responsables de las páginas externas enlazadas responden de su contenido.</p>`,
  norm:`<h2 id="normen">Normas y fuentes</h2>
    <p>kragr no contiene textos de normas. Las fórmulas, valores de cálculo y coeficientes se presentan con palabras y formato propios, casi siempre como extracto de los valores que necesita una calculadora. Siempre se indica la referencia, p. ej. «según DIN EN 1992-1-1, tabla 3.1».</p>
    <p>Las normas completas con sus anejos nacionales pueden adquirirse en DIN Media; las bibliotecas universitarias suelen ofrecerlas gratuitamente. Para cualquier dimensionamiento deben utilizarse siempre las normas completas vigentes.</p>
    <p>«DIN» es una marca registrada de DIN Deutsches Institut für Normung e. V. kragr no tiene relación con DIN.</p>
    <h3>Derechos de autor</h3><p>Los textos, figuras y el código de kragr están protegidos por derechos de autor. Su difusión o publicación, incluso parcial, requiere autorización. Se permite descargar y utilizar kragr para los propios estudios.</p>`,
  ds:`<h2 id="datenschutz">Privacidad</h2>
    <h3>Responsable</h3><p>${ph('name')}, ${ph('street')}, ${ph('city')}, correo: ${ph('mail')}</p>
    <h3>Sin cuentas, sin seguimiento</h3><p>kragr no requiere registro, no instala cookies publicitarias ni analíticas y no integra contenido de terceros. Las fuentes se cargan desde nuestro propio servidor.</p>
    <h3>Almacenamiento en el navegador</h3><p>Los cálculos, posiciones y proyectos guardados y el idioma elegido se almacenan en el almacenamiento local de tu navegador. Estos datos no salen de tu dispositivo ni se transmiten al proveedor. Puedes borrarlos en cualquier momento en los ajustes del navegador o en «Proyectos».</p>
    <h3>Uso sin conexión e instalación</h3><p>Para que kragr funcione sin internet y pueda instalarse como app, tu navegador guarda una copia de los archivos del programa (páginas, fuentes, iconos) en tu dispositivo (service worker). No se almacenan ni transmiten datos personales. La copia desaparece al borrar los datos del sitio en el navegador o al desinstalar la app.</p>
    <h3>Registros del servidor</h3><p>Al acceder a las páginas, el proveedor de alojamiento trata datos técnicamente necesarios (dirección IP, fecha y hora, archivo solicitado, identificador del navegador) para entregar las páginas y garantizar su seguridad. Base jurídica: art. 6.1.f RGPD. Proveedor de alojamiento: ${ph('host')}. En este proceso pueden transferirse datos a EE. UU. Los registros se eliminan según las normas del proveedor.</p>
    <h3>Tus derechos</h3><p>Tienes derecho de acceso, rectificación, supresión, limitación, portabilidad y oposición (arts. 15–21 RGPD) y derecho a presentar una reclamación ante una autoridad de protección de datos.</p>`,
  lic:`<h2 id="lizenzen">Licencias</h2>
    <p>Fuentes utilizadas: Figtree, JetBrains Mono e Inter (solo letras griegas), todas bajo SIL Open Font License 1.1. Los textos de las licencias están en la carpeta fonts (<a href="fonts/LICENSE-Figtree.txt">Figtree</a>, <a href="fonts/LICENSE-JetBrainsMono.txt">JetBrains Mono</a>, <a href="fonts/LICENSE-Inter.txt">Inter</a>).</p>
    <p>Animaciones: GSAP 3.13 (GreenSock), alojado localmente bajo la licencia gratuita GSAP Standard License (<a href="https://gsap.com/standard-license" rel="noopener">gsap.com/standard-license</a>).</p>`,
  stand:'Actualizado: octubre de 2026', back:'Volver al inicio' }
};
const IDS=['impressum','haftung','normen','datenschutz','lizenzen'];
function render(l){
  const t=T[l]||T.de; document.documentElement.lang=l; try{ kmodApply(); }catch(e){} document.title='kragr — '+t.title;
  document.getElementById('content').innerHTML = `<h1>${t.title}</h1><p class="lead">${t.lead}</p>
    <nav class="toc">${t.toc.map((x,i)=>`<a href="#${IDS[i]}">${x}</a>`).join('')}</nav>
    <section>${t.imp}</section><section>${t.haft}</section><section>${t.norm}</section><section>${t.ds}</section><section>${t.lic}</section>`;
  document.getElementById('foot').innerHTML = `${t.stand} · <a href="index.html">${t.back}</a>`;
  document.getElementById('lang').value=l;
  if(location.hash){ const el=document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
}
function setLang(l){ try{ localStorage.setItem('statiq-lang', l); }catch(e){} render(l); }
let L0='de'; try{ L0=localStorage.getItem('statiq-lang')||'de'; }catch(e){}
render(T[L0]?L0:'de');

// Offline-Nutzung und Installation als App (Service Worker, nur über http/https)
if(typeof navigator!=='undefined' && navigator.serviceWorker && typeof location!=='undefined' && /^https?:$/.test(location.protocol||'')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
