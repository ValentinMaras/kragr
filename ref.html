// ── Schrauben: Abscheren und Lochleibung (EN 1993-1-8, Tab. 3.4) ──
// [Bezeichnung, d, d0, A (Schaft), A_s (Spannungsquerschnitt)] in mm, mm²
const SCHRAUBEN = [['M12',12,13,113,84.3],['M16',16,18,201,157],['M20',20,22,314,245],['M22',22,24,380,303],['M24',24,26,452,353],['M27',27,30,573,459],['M30',30,33,707,561],['M36',36,39,1018,817]];
const SKLASSEN = [['4.6',240,400],['5.6',300,500],['8.8',640,800],['10.9',900,1000]];
function updateSchraube(){
  const out=document.getElementById('sr-out'); if(!out) return;
  const sb=SCHRAUBEN.find(s=>s[0]===valOf('sr-d')), kl=SKLASSEN.find(s=>s[0]===valOf('sr-kl')), gew=valOf('sr-fuge')==='g';
  const m=+valOf('sr-m'), st=valOf('sr-st'), t=num('sr-t'), e1=num('sr-e1'), e2=num('sr-e2'), p1=num('sr-p1'), p2=num('sr-p2');
  const n1=Math.max(1,Math.round(num('sr-n1')||1)), n2=Math.max(1,Math.round(num('sr-n2')||1)), F=num('sr-F')||0;
  if(!(t>0 && e1>0 && e2>0)){ out.innerHTML='Bitte t, e<sub>1</sub>, e<sub>2</sub> > 0 eingeben.'; return; }
  const [, d, d0, As0, As] = sb, fub=kl[2], fyb=kl[1], fu=stFu(st,t);
  const av = gew ? (kl[0]==='10.9' ? 0.5 : 0.6) : 0.6, Aq = gew ? As : As0;
  const Fv = m*av*fub*Aq/GM2/1000;
  const S=[`§Schraube und Blech`,
    `!${sb[0]} ${kl[0]}: d = ${d} mm, d<sub>0</sub> = ${d0} mm, A = ${As0} mm², A<sub>s</sub> = ${deNum(As,1)} mm², f<sub>ub</sub> = ${fub} N/mm² · Blech ${st}, t = ${d1(t)} mm, f<sub>u</sub> = ${fu} N/mm²`,
    `§Rand- und Lochabstände (Tab. 3.3, Mindestwerte)`,
    `!e<sub>1</sub> = ${d1(e1)} ${e1>=1.2*d0?'≥':'<'} 1,2 · d<sub>0</sub> = ${d1(1.2*d0)} mm · e<sub>2</sub> = ${d1(e2)} ${e2>=1.2*d0?'≥':'<'} ${d1(1.2*d0)} mm`
      + (n1>1?` · p<sub>1</sub> = ${d1(p1)} ${p1>=2.2*d0?'≥':'<'} 2,2 · d<sub>0</sub> = ${d1(2.2*d0)} mm`:'') + (n2>1?` · p<sub>2</sub> = ${d1(p2)} ${p2>=2.4*d0?'≥':'<'} 2,4 · d<sub>0</sub> = ${d1(2.4*d0)} mm`:''),
    `§Abscheren je Schraube`,
    `!Scherfuge im ${gew?'Gewinde → A = A<sub>s</sub>':'Schaft → A = Schaftquerschnitt'}, α<sub>v</sub> = ${deNum(av,1)}, ${m} Scherfuge${m>1?'n':''}`,
    `F<sub>v,Rd</sub> = n · α<sub>v</sub> · f<sub>ub</sub> · A / γ<sub>M2</sub> = ${m} · ${deNum(av,1)} · ${fub} · ${deNum(Aq,1)} / ${deNum(GM2)} = ${d1(Fv,1)} kN`,
    `§Lochleibung (Tab. 3.4)`];
  // k1 quer zur Kraft: Randreihe (e2) bzw. innere Reihe (p2)
  const k1R = Math.min(2.8*e2/d0-1.7, n2>1 ? 1.4*p2/d0-1.7 : 99, 2.5), k1I = Math.min(1.4*p2/d0-1.7, 2.5);
  const adE = e1/(3*d0), adI = n1>1 ? p1/(3*d0)-0.25 : null, rf=fub/fu;
  const abE = Math.min(adE, rf, 1), abI = adI===null ? null : Math.min(adI, rf, 1);
  const Fb = (k1,ab) => k1*ab*fu*d*t/GM2/1000;
  S.push(`!α<sub>b</sub> = min(α<sub>d</sub>; f<sub>ub</sub>/f<sub>u</sub>; 1) mit f<sub>ub</sub>/f<sub>u</sub> = ${fub}/${fu} = ${d1(rf,3)}`,
    `α<sub>d</sub> (Endschraube) = e<sub>1</sub> / (3 · d<sub>0</sub>) = ${d1(e1)} / (3 · ${d0}) = ${d1(adE,3)} → α<sub>b</sub> = ${d1(abE,3)}`);
  if(adI!==null) S.push(`α<sub>d</sub> (innere Schraube) = p<sub>1</sub> / (3 · d<sub>0</sub>) − 1/4 = ${d1(p1)} / (3 · ${d0}) − 0,25 = ${d1(adI,3)} → α<sub>b</sub> = ${d1(abI,3)}`);
  S.push(`k<sub>1</sub> (Randreihe) = min(2,8 · e<sub>2</sub>/d<sub>0</sub> − 1,7${n2>1?'; 1,4 · p<sub>2</sub>/d<sub>0</sub> − 1,7':''}; 2,5) = ${d1(k1R,3)}`);
  if(n2>2) S.push(`k<sub>1</sub> (innere Reihe) = min(1,4 · p<sub>2</sub>/d<sub>0</sub> − 1,7; 2,5) = ${d1(k1I,3)}`);
  S.push(`!F<sub>b,Rd</sub> = k<sub>1</sub> · α<sub>b</sub> · f<sub>u</sub> · d · t / γ<sub>M2</sub>`);
  // alle Schrauben: Reihe i (in Kraftrichtung), Spalte j (quer)
  const list=[];
  for(let i=0;i<n1;i++) for(let j=0;j<n2;j++){ const rand = j===0 || j===n2-1, k1 = rand ? k1R : k1I, ab = i===0 ? abE : abI; list.push({i,j,k1,ab,Fb:Fb(k1,ab)}); }
  const seen=new Set();
  list.forEach(b=>{ const key=`${b.i===0?'E':'I'}${b.k1===k1R?'R':'I'}`; if(seen.has(key)) return; seen.add(key);
    S.push(`F<sub>b,Rd</sub> (${b.i===0?'End':'innere'}schraube, ${b.k1===k1R?'Randreihe':'innere Reihe'}) = ${d1(b.k1,3)} · ${d1(b.ab,3)} · ${fu} · ${d} · ${d1(t)} / ${deNum(GM2)} = ${d1(b.Fb,1)} kN`); });
  const allFvGe = list.every(b=>Fv>=b.Fb);
  const FRd = allFvGe ? list.reduce((s,b)=>s+b.Fb,0) : list.length*Math.min(...list.map(b=>Math.min(Fv,b.Fb)));
  S.push(`§Tragfähigkeit der Verbindung (3.7)`,
    allFvGe ? `!F<sub>v,Rd</sub> ≥ F<sub>b,Rd</sub> für alle Schrauben → Summe der Lochleibungswiderstände`
            : `!F<sub>v,Rd</sub> < F<sub>b,Rd</sub> bei mindestens einer Schraube → n · kleinster Einzelwiderstand`,
    `F<sub>Rd</sub> = ${d1(FRd,1)} kN (${list.length} Schrauben)`);
  if(F>0) S.push(`F<sub>Ed</sub> / F<sub>Rd</sub> = ${d1(F,1)} / ${d1(FRd,1)} = ${d1(F/FRd,3)} ≤ 1 ${ok(F/FRd)}`);
  const Lj=(n1-1)*p1; if(Lj>15*d) S.push(`!Anschlusslänge L<sub>j</sub> = ${d1(Lj)} mm > 15 d → Abminderung β<sub>Lf</sub> für lange Anschlüsse (3.8) beachten`);

const BETA_W = { S235:0.8, S275:0.85, S355:0.9, S420:1.0, S460:1.0 };
function updateKehl(){
  const out=document.getElementById('kw-out'); if(!out) return;

  const tmin=Math.min(t1,t2), tmax=Math.max(t1,t2), fu=stFu(st,tmax), bw=BETA_W[st];

    `!a = ${d1(a)} mm · a<sub>min</sub> = max(3 mm; √t<sub>max</sub> − 0,5) = max(3; √${d1(tmax)} − 0,5) = ${d1(amin,2)} mm · a<sub>max</sub> = 0,7 · t<sub>min</sub> = 0,7 · ${d1(tmin)} = ${d1(amax,2)} mm → ${a>=amin-1e-9 && a<=amax+1e-9 ? 'eingehalten' : '<b>nicht eingehalten</b>'}`,
    `l<sub>eff</sub> = l − 2 · a = ${d1(l)} − 2 · ${d1(a)} = ${d1(leff)} mm ${leff>=Math.max(30,6*a)?'≥':'<'} max(30 mm; 6a) = ${d1(Math.max(30,6*a))} mm`,
    `§Festigkeit der Naht`,
    `!${st}: f<sub>u</sub> = ${fu} N/mm², β<sub>w</sub> = ${deNum(bw,2)}`,
    `f<sub>vw,d</sub> = f<sub>u</sub> / (√3 · β<sub>w</sub> · γ<sub>M2</sub>) = ${fu} / (√3 · ${deNum(bw,2)} · ${deNum(GM2)}) = ${d1(fvw,1)} N/mm²`,
    `F<sub>w,Rd</sub> = f<sub>vw,d</sub> · a = ${d1(fvw,1)} · ${d1(a)} / 1000 = ${d1(FwRd,3)} kN/mm`,
    `§Tragfähigkeit`,
    `F<sub>Rd</sub> = n · l<sub>eff</sub> · F<sub>w,Rd</sub> = ${nN} · ${d1(leff)} · ${d1(FwRd,3)} = ${d1(FRd,1)} kN`];

// ── Stahlbau: zusammengesetzter (geschweißter) I-Querschnitt ──
function zqGeom(o){ // alle Maße in mm, z von Oberkante nach unten
  const P=[ {b:o.bo, t:o.to, z0:0}, {b:o.tw, t:o.hw, z0:o.to}, {b:o.bu, t:o.tu, z0:o.to+o.hw} ];
  const A=P.reduce((s,p)=>s+p.b*p.t,0), Sz=P.reduce((s,p)=>s+p.b*p.t*(p.z0+p.t/2),0), zs=Sz/A;
  const Iy=P.reduce((s,p)=>s+p.b*p.t**3/12+p.b*p.t*(p.z0+p.t/2-zs)**2,0), h=o.to+o.hw+o.tu;
  // Fläche oberhalb z
  const Aab = z => P.reduce((s,p)=>s+p.b*Math.max(0,Math.min(p.t, z-p.z0)),0);
  let lo=0, hi=h; for(let i=0;i<100;i++){ const m=(lo+hi)/2; if(Aab(m)<A/2) lo=m; else hi=m; } const zpl=(lo+hi)/2;
  const Sab = z => P.reduce((s,p)=>{ const t=Math.max(0,Math.min(p.t,z-p.z0)); return s+p.b*t*(z-(p.z0+t/2)); },0);
  const Sbe = z => P.reduce((s,p)=>{ const t0=Math.max(p.z0,z), t=Math.max(0,p.z0+p.t-t0); return s+p.b*t*((t0+t/2)-z); },0);
  const Wpl=Sab(zpl)+Sbe(zpl);
  return { P, A, zs, Iy, h, zpl, Wpl, Wo:Iy/zs, Wu:Iy/(h-zs) };
}
function zqKlasse(o, fy){
  const g=zqGeom(o), eps=Math.sqrt(235/fy), w=Math.SQRT2*o.a;
  const cf=(o.bo-o.tw)/2-w, rf=cf/o.to, kf = rf<=9*eps?1 : rf<=10*eps?2 : rf<=14*eps?3 : 4;
  const c=o.hw-2*w, zt=o.to+w, zb=o.to+o.hw-w, rw=c/o.tw;
  const cc=Math.min(c, Math.max(0, g.zpl-zt)), alpha=cc/c;

// Gauß-Verfahren 3×3 mit Rechenweg
function gaussSchritte(A, b){
  let sw=1; const M=A.map((r,i)=>[...r, b[i]]), S=[], n=3, mat = () => `<table class="gmat">${M.map(r=>`<tr>${r.map((v,j)=>`<td${j===3?' class="gb"':''}>${fz(Math.abs(v)<1e-12?0:v,3)}</td>`).join('')}</tr>`).join('')}</table>`;
  S.push('§Erweiterte Koeffizientenmatrix (A | b)', '!'+mat());
  for(let k=0;k<n-1;k++){
    if(Math.abs(M[k][k])<1e-12){ const j=[...Array(n).keys()].find(i=>i>k && Math.abs(M[i][k])>1e-12); if(j===undefined) return { S:S.concat(['!Keine eindeutige Lösung (Determinante 0)']), x:null };
      [M[k],M[j]]=[M[j],M[k]]; sw=-sw; S.push(`!Pivot null → Zeile ${k+1} und ${j+1} tauschen`, '!'+mat()); }
    S.push(`§Spalte ${k+1}: Nullen unter dem Pivot a<sub>${k+1}${k+1}</sub> = ${fz(M[k][k],3)}`);
    for(let i=k+1;i<n;i++){ const fct=M[i][k]/M[k][k]; if(Math.abs(fct)<1e-12) continue;
      for(let j=k;j<=n;j++) M[i][j]-=fct*M[k][j];
      S.push(`!Z${i+1} ← Z${i+1} − (${fz(fct,4)}) · Z${k+1}`); }
    S.push('!'+mat());
  }
  if(Math.abs(M[2][2])<1e-12) return { S:S.concat(['!a₃₃ = 0 → keine eindeutige Lösung']), x:null };
  const x=[0,0,0];
  S.push('§Rückwärts einsetzen');
  for(let i=n-1;i>=0;i--){ let sum=M[i][n]; let txt=`${fz(M[i][n],3)}`; for(let j=i+1;j<n;j++){ sum-=M[i][j]*x[j]; txt+=` − (${fz(M[i][j],3)}) · ${fz(x[j],4)}`; }
    x[i]=sum/M[i][i]; S.push(`x<sub>${i+1}</sub> = (${txt}) / ${fz(M[i][i],3)} = ${fz(x[i],4)}`); }
  const det=sw*M[0][0]*M[1][1]*M[2][2];
  S.push('§Kontrolle', `!det A = Produkt der Pivots (bei Zeilentausch Vorzeichen wechseln) = ${fz(det,3)} ≠ 0 → eindeutig lösbar`);
  return { S, x };
}
function updateGauss(){
  const out=document.getElementById('gs-out'); if(!out) return;
  const A=[0,1,2].map(i=>[0,1,2].map(j=>num(`gs-a${i}${j}`))), b=[0,1,2].map(i=>num(`gs-b${i}`));
  if([...A.flat(),...b].some(v=>!isFinite(v))){ out.innerHTML='Bitte alle 12 Zahlen eingeben.'; return; }
  const r=gaussSchritte(A,b);
  if(r.x) r.S.push(...[0,1,2].map(i=>`Zeile ${i+1}: ${A[i].map((v,j)=>`${fz(v,2)} · ${fz(r.x[j],3)}`).join(' + ')} = ${fz(A[i].reduce((s,v,j)=>s+v*r.x[j],0),3)} = b<sub>${i+1}</sub> ✓`));
  out.innerHTML = ablauf('Gauß-Verfahren', r.S) + (r.x ? `<div class="info-banner">Lösung: x<sub>1</sub> = <b>${fz(r.x[0],4)}</b>, x<sub>2</sub> = <b>${fz(r.x[1],4)}</b>, x<sub>3</sub> = <b>${fz(r.x[2],4)}</b></div>` : '');

const khOf = (m, h) => m.bsh ? (h<600 ? Math.min((600/h)**0.1, 1.1) : 1) : (h<150 ? Math.min((150/h)**0.2, 1.3) : 1);
const kcrOf = m => Math.min(1, (m.bsh ? 2.5 : 2.0)/m.fv);
// Torsionsträgheitsmoment Rechteck: Saint-Venant-Reihe (n ungerade)
const itRect = (b,h) => { const s=Math.min(b,h), l=Math.max(b,h); let S=0; for(let n=1;n<200;n+=2) S+=Math.tanh(n*Math.PI*l/(2*s))/n**5; return s**3*l/3*(1-192/Math.PI**5*s/l*S); };
const dH = (v,n=2) => deNum(v,n);

// ── Querschnittstabellen ──
const KVH_VORZUG = new Set(['60×120','60×140','60×160','60×180','60×200','60×240','80×120','80×140','80×160','80×180','80×200','80×240','100×100','100×120','100×140','100×160','100×200','100×240','120×120','120×140','120×160','120×200','120×240','140×140','160×160']);
function rectProps(b,h,rho){ const A=b*h; return { b, h, A:A/100, G:A*rho/1e6, Iy:b*h**3/12/1e4, Wy:b*h*h/6/1e3, iy:h/Math.sqrt(12)/10, Iz:h*b**3/12/1e4, Wz:h*b*b/6/1e3, iz:b/Math.sqrt(12)/10, It:itRect(b,h)/1e4 }; }
const QS_VH = []; for(const b of [60,80,100,120,140,160,180,200]) for(let h=Math.max(80,b); h<=300; h+=20) QS_VH.push({ n:`${b}×${h}`, kvh:KVH_VORZUG.has(`${b}×${h}`), ...rectProps(b,h,420) });
const QS_BSH = []; for(const b of [80,100,120,140,160,180,200,220,240]) for(let h=Math.max(120,b+40); h<=1200; h+=40) QS_BSH.push({ n:`${b}×${h}`, ...rectProps(b,h,420) });
let bshB = 120;
function qsTable(id, rows, mark){
  const C=[['b','mm','b'],['h','mm','h'],['A','cm²','A'],['G','kg/m','G'],['I<sub>y</sub>','cm⁴','Iy'],['W<sub>y</sub>','cm³','Wy'],['i<sub>y</sub>','cm','iy'],['I<sub>z</sub>','cm⁴','Iz'],['W<sub>z</sub>','cm³','Wz'],['i<sub>z</sub>','cm','iz'],['I<sub>t</sub>','cm⁴','It']];
  const fm = (v,k) => ['b','h'].includes(k) ? v : k==='G' ? deNum(v,1) : ['iy','iz'].includes(k) ? deNum(v,2) : v>=1000 ? dk(v) : deNum(v,1);
  return `<div class="data-table-wrap tall" id="${id}"><table class="data"><thead><tr><th>b × h</th>${C.map(c=>`<th>${c[0]}<br><span class="th-u">${c[1]}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.n}${mark&&r.kvh?' •':''}</td>${C.map(c=>`<td>${fm(r[c[2]],c[2])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="table-hint">${rows.length} Querschnitte · waagerecht scrollbar</div>`;
}
function setBshB(b){ bshB=b; document.querySelectorAll('.chip[data-bb]').forEach(c=>c.classList.toggle('active', +c.dataset.bb===b)); document.getElementById('bsh-qs').innerHTML = qsTable('bsh-tbl', QS_BSH.filter(r=>r.b===b)); }

// ── Einfeldträger: Biegung, Schub, Auflagerpressung, Durchbiegung ──
const QART = { nA:{t:'Nutzlast Kat. A/B (Wohnen, Büro)', kled:'2', p0:0.7, p2:0.3}, nC:{t:'Nutzlast Kat. C/D', kled:'3', p0:0.7, p2:0.6}, s:{t:'Schnee (bis 1000 m)', kled:'3', p0:0.5, p2:0}, w:{t:'Wind', kled:'wind', p0:0.6, p2:0} };
function holzEinfeld(o){
  const m=holzMat(o.cls), b=o.b, h=o.h, L=o.L*1000, nkl=o.nkl, Q=QART[o.qa];
  const A=b*h, W=b*h*h/6, I=b*h**3/12;
  const kG=kmodOf(nkl,'0'), kQ=kmodOf(nkl,Q.kled);
  const w1=1.35*o.g, w2=1.35*o.g+1.5*o.q;          // kN/m
  const LK=[{t:'nur ständig', w:w1, km:kG}, {t:`ständig + ${Q.t}`, w:w2, km:kQ}];
  LK.forEach(k=>k.r=k.w/k.km); const mg = LK[0].r>LK[1].r ? LK[0] : LK[1];
  const Md=mg.w*o.L**2/8, Vd=mg.w*o.L/2, Ad=Vd;
  const kh=khOf(m,h), fmd=mg.km*kh*m.fm/GM_H, sm=Md*1e6/W;
  const kcr=kcrOf(m), bef=kcr*b, fvd=mg.km*m.fv/GM_H, tau=1.5*Vd*1000/(bef*h);
  const kc90 = m.bsh ? 1.75 : 1.5, lef=o.lA+30, fc90d=mg.km*m.fc90/GM_H, sc90=Ad*1000/(b*lef);
  const wf = q => 5*q*L**4/(384*m.E0*I);        // q in N/mm = kN/m
  const wG=wf(o.g), wQ=wf(o.q), kdef=KDEF[nkl];
  const winst=wG+wQ, wfin=wG*(1+kdef)+wQ*(1+Q.p2*kdef), wnet=(wG+Q.p2*wQ)*(1+kdef);
  return { m, A, W, I, kG, kQ, LK, mg, Md, Vd, kh, fmd, sm, kcr, bef, fvd, tau, kc90, lef, fc90d, sc90, wG, wQ, kdef, winst, wfin, wnet, Q, L };
}

    `!maßgebend: <b>${r.mg.t}</b> mit q<sub>d</sub> = ${f(r.mg.w)} kN/m und k<sub>mod</sub> = ${f(r.mg.km)}`,
    `M<sub>d</sub> = q<sub>d</sub> · L² / 8 = ${f(r.mg.w)} · ${f(o.L)}² / 8 = ${f(r.Md)} kNm`,
    `V<sub>d</sub> = A<sub>d</sub> = q<sub>d</sub> · L / 2 = ${f(r.mg.w)} · ${f(o.L)} / 2 = ${f(r.Vd)} kN`,
    `§Biegung (6.1.6)`,
    `!Höhenbeiwert ${m.bsh?'BSH: k<sub>h</sub> = min((600/h)<sup>0,1</sup>; 1,1) für h < 600 mm':'Vollholz: k<sub>h</sub> = min((150/h)<sup>0,2</sup>; 1,3) für h < 150 mm'} → k<sub>h</sub> = ${f(r.kh,3)}`,
    `f<sub>m,d</sub> = k<sub>mod</sub> · k<sub>h</sub> · f<sub>m,k</sub> / γ<sub>M</sub> = ${f(r.mg.km)} · ${f(r.kh,3)} · ${f(m.fm,1)} / 1,3 = ${f(r.fmd)} N/mm²`,
    `σ<sub>m,d</sub> = M<sub>d</sub> / W<sub>y</sub> = ${f(r.Md*1e6,0)} / ${dk(r.W)} = ${f(r.sm)} N/mm²`,
    `σ<sub>m,d</sub> / f<sub>m,d</sub> = ${f(r.sm)} / ${f(r.fmd)} = ${f(r.sm/r.fmd,3)} ≤ 1 ${ok(r.sm/r.fmd)}`,

    `τ<sub>d</sub> / f<sub>v,d</sub> = ${f(r.tau)} / ${f(r.fvd)} = ${f(r.tau/r.fvd,3)} ≤ 1 ${ok(r.tau/r.fvd)}`,

    `w<sub>net,fin</sub> = (w<sub>G</sub> + ψ<sub>2</sub> · w<sub>Q</sub>) · (1 + k<sub>def</sub>) = (${f(r.wG,1)} + ${f(r.Q.p2,1)} · ${f(r.wQ,1)}) · ${f(1+r.kdef,2)} = ${f(r.wnet,1)} mm`,

// ── Druckstab: Knicken mit Biegung (6.3.2) ──
function holzKnick(o){
  const m=holzMat(o.cls), A=o.b*o.h, iy=o.h/Math.sqrt(12), iz=o.b/Math.sqrt(12), km=kmodOf(o.nkl,o.kled), bc=m.bsh?0.1:0.2;
  const ax = (lef,i) => { const lam=lef*1000/i, lr=lam/Math.PI*Math.sqrt(m.fc0/m.E05), k=0.5*(1+bc*(lr-0.3)+lr*lr), kc= lr<=0.3 ? 1 : Math.min(1, 1/(k+Math.sqrt(k*k-lr*lr))); return {lam,lr,k,kc}; };
  const Y=ax(o.ly,iy), Z=ax(o.lz,iz), fc0d=km*m.fc0/GM_H, sc=o.N*1000/A;
  const W=o.b*o.h*o.h/6, kh=khOf(m,o.h), fmd=km*kh*m.fm/GM_H, sm=Math.abs(o.M)*1e6/W;
  const e623=sc/(Y.kc*fc0d)+sm/fmd, e624=sc/(Z.kc*fc0d)+0.7*sm/fmd;
  return { m, A, iy, iz, km, bc, Y, Z, fc0d, sc, W, kh, fmd, sm, e623, e624 };
}
function updateHKN(){
  const out=document.getElementById('hkn-out'); if(!out) return;
  const o={ cls:valOf('hkn-cls'), b:num('hkn-b'), h:num('hkn-h'), ly:num('hkn-ly'), lz:num('hkn-lz'), N:num('hkn-N')||0, M:num('hkn-M')||0, nkl:+valOf('hkn-nkl'), kled:valOf('hkn-kled') };
  if(!(o.b>0&&o.h>0&&o.ly>0&&o.lz>0)){ out.innerHTML='Bitte b, h und Knicklängen > 0 eingeben.'; return; }
  const r=holzKnick(o), m=r.m, f=dH;
  const axS = (n,X,lef,i) => [`λ<sub>${n}</sub> = l<sub>ef,${n}</sub> / i<sub>${n}</sub> = ${dk(lef*1000)} / ${f(i,1)} = ${f(X.lam,1)}`,
    `λ<sub>rel,${n}</sub> = λ<sub>${n}</sub>/π · √(f<sub>c,0,k</sub> / E<sub>0,05</sub>) = ${f(X.lam,1)}/π · √(${f(m.fc0,1)} / ${dk(m.E05)}) = ${f(X.lr,3)}`,
    X.lr<=0.3 ? `!λ<sub>rel</sub> ≤ 0,3 → k<sub>c,${n}</sub> = 1` : `k<sub>${n}</sub> = 0,5 · (1 + β<sub>c</sub> · (λ<sub>rel</sub> − 0,3) + λ<sub>rel</sub>²) = ${f(X.k,3)} → k<sub>c,${n}</sub> = 1 / (k + √(k² − λ<sub>rel</sub>²)) = ${f(X.kc,3)}`];
  const S=[`§Baustoff ${m.cls}, NKL ${o.nkl+1}, KLED ${KLED_TXT[o.kled]}`,
    `!f<sub>c,0,k</sub> = ${f(m.fc0,1)} · f<sub>m,k</sub> = ${f(m.fm,1)} N/mm² · E<sub>0,05</sub> = ${dk(m.E05)} N/mm² · β<sub>c</sub> = ${f(r.bc,1)} · k<sub>mod</sub> = ${f(r.km)}`,
    `f<sub>c,0,d</sub> = k<sub>mod</sub> · f<sub>c,0,k</sub> / γ<sub>M</sub> = ${f(r.km)} · ${f(m.fc0,1)} / 1,3 = ${f(r.fc0d)} N/mm²`,
    `§Querschnitt ${o.b} × ${o.h} mm`,
    `!A = ${dk(r.A)} mm² · i<sub>y</sub> = h/√12 = ${f(r.iy,1)} mm · i<sub>z</sub> = b/√12 = ${f(r.iz,1)} mm`,
    `§Ausknicken um y (in Richtung h)`, ...axS('y',r.Y,o.ly,r.iy),
    `§Ausknicken um z (in Richtung b)`, ...axS('z',r.Z,o.lz,r.iz),
    `§Spannungen`,
    `σ<sub>c,0,d</sub> = N<sub>d</sub> / A = ${f(o.N*1000,0)} / ${dk(r.A)} = ${f(r.sc)} N/mm²`];
  if(o.M) S.push(`!k<sub>h</sub> = ${f(r.kh,3)} → f<sub>m,d</sub> = k<sub>mod</sub> · k<sub>h</sub> · f<sub>m,k</sub> / γ<sub>M</sub> = ${f(r.fmd)} N/mm²`,
    `σ<sub>m,y,d</sub> = M<sub>y,d</sub> / W<sub>y</sub> = ${f(Math.abs(o.M)*1e6,0)} / ${dk(r.W)} = ${f(r.sm)} N/mm²`);
  S.push(`§Nachweise (6.23) und (6.24), k<sub>m</sub> = 0,7`,
    `(6.23): σ<sub>c</sub>/(k<sub>c,y</sub> · f<sub>c,0,d</sub>) + σ<sub>m,y</sub>/f<sub>m,y,d</sub> = ${f(r.sc)}/(${f(r.Y.kc,3)} · ${f(r.fc0d)}) + ${f(r.sm)}/${f(r.fmd)} = ${f(r.e623,3)} ≤ 1 ${ok(r.e623)}`,
    `(6.24): σ<sub>c</sub>/(k<sub>c,z</sub> · f<sub>c,0,d</sub>) + k<sub>m</sub> · σ<sub>m,y</sub>/f<sub>m,y,d</sub> = ${f(r.sc)}/(${f(r.Z.kc,3)} · ${f(r.fc0d)}) + 0,7 · ${f(r.sm)}/${f(r.fmd)} = ${f(r.e624,3)} ≤ 1 ${ok(r.e624)}`);
  out.innerHTML = ablauf(`Druckstab ${m.cls} ${o.b}/${o.h}`, S);
}

// ── Kippen (6.3.3) ──
const KIPP_SYS = { eq:{t:'Einfeldträger, Gleichlast', a:0.9}, eF:{t:'Einfeldträger, Einzellast in Feldmitte', a:0.8}, eM:{t:'Einfeldträger, konstantes Moment', a:1.0}, kq:{t:'Kragträger, Gleichlast', a:0.5}, kF:{t:'Kragträger, Einzellast am Ende', a:0.8} };
function holzKipp(o){
  const m=holzMat(o.cls), km=kmodOf(o.nkl,o.kled), S_=KIPP_SYS[o.sys], L=o.L*1000;
  const lef = S_.a*L + (o.lp==='o'?2*o.h : o.lp==='u'?-0.5*o.h : 0);
  const Iz=o.h*o.b**3/12, It=itRect(o.b,o.h), W=o.b*o.h*o.h/6;
  const scrit = m.bsh ? Math.PI*Math.sqrt(m.E05*Iz*m.G05*It)/(lef*W) : 0.78*o.b*o.b*m.E05/(o.h*lef);
  const lrm=Math.sqrt(m.fm/scrit), kcrit = lrm<=0.75 ? 1 : lrm<=1.4 ? 1.56-0.75*lrm : 1/(lrm*lrm);
  const kh=khOf(m,o.h), fmd=km*kh*m.fm/GM_H, sm=Math.abs(o.M)*1e6/W;
  return { m, km, lef, Iz, It, W, scrit, lrm, kcrit, kh, fmd, sm, eta:sm/(kcrit*fmd) };
}
function updateHKI(){
  const out=document.getElementById('hki-out'); if(!out) return;
  const o={ cls:valOf('hki-cls'), b:num('hki-b'), h:num('hki-h'), L:num('hki-L'), sys:valOf('hki-sys'), lp:valOf('hki-lp'), M:num('hki-M')||0, nkl:+valOf('hki-nkl'), kled:valOf('hki-kled') };
  if(!(o.b>0&&o.h>0&&o.L>0)){ out.innerHTML='Bitte b, h, L > 0 eingeben.'; return; }
  const r=holzKipp(o), m=r.m, f=dH, A=KIPP_SYS[o.sys];
  const S=[`§Wirksame Kipplänge (Tab. 6.1)`,
    `l<sub>ef</sub> = ${f(A.a,1)} · L ${o.lp==='o'?'+ 2h':o.lp==='u'?'− 0,5h':''} = ${f(A.a,1)} · ${dk(o.L*1000)}${o.lp==='o'?` + 2 · ${o.h}`:o.lp==='u'?` − 0,5 · ${o.h}`:''} = ${dk(r.lef)} mm`,
    `!${A.t}; Last ${o.lp==='o'?'am Druckrand (oben, ungünstig)':o.lp==='u'?'am Zugrand (unten, günstig)':'in der Schwerachse'}`,
    `§Kritische Biegespannung`];
  if(m.bsh) S.push(`!BSH: allgemeine Formel mit G<sub>0,05</sub> = 540 N/mm², I<sub>tor</sub> = b³·h/3 · [1 − 192/π⁵ · b/h · Σ tanh(nπh/2b)/n⁵] = ${f(r.It/1e6,2)} · 10⁶ mm⁴`,
    `!I<sub>z</sub> = h · b³ / 12 = ${f(r.Iz/1e6,2)} · 10⁶ mm⁴ · W<sub>y</sub> = ${dk(r.W)} mm³ · E<sub>0,05</sub> = ${dk(m.E05)} N/mm²`,
    `σ<sub>m,crit</sub> = π · √(E<sub>0,05</sub> · I<sub>z</sub> · G<sub>0,05</sub> · I<sub>tor</sub>) / (l<sub>ef</sub> · W<sub>y</sub>) = π · √(${dk(m.E05)} · ${f(r.Iz/1e6,2)}·10⁶ · 540 · ${f(r.It/1e6,2)}·10⁶) / (${dk(r.lef)} · ${dk(r.W)}) = ${f(r.scrit)} N/mm²`);

// GRUNDBAU (ref v0.3.13): Bodenphysik, Klassifikation, Spannungen, Setzung, Konsolidation,

const dG = (v,n=2) => deNum(v,n);

const GW_W = 10;                         // γ_w in der Grundbaupraxis [kN/m³]

// ── Bodenphysik ──
function bodenPhasen(o){   // m, md [g], V [cm³], rs [g/cm³]
  const w=(o.m-o.md)/o.md, rho=o.m/o.V, rd=o.md/o.V, n=1-rd/o.rs, e=n/(1-n), Sr=w*o.rs/e;   // ρ_w = 1 g/cm³
  const g=rho*GW_G, gr=((1-n)*o.rs+n)*GW_G, ga=gr-GW_G, gd=rd*GW_G;
  return { w, rho, rd, n, e, Sr, g, gr, ga, gd };
}

  if(!(o.m>0&&o.md>0&&o.m>=o.md&&o.V>0&&o.rs>0)){ out.innerHTML='Bitte m ≥ m<sub>d</sub> > 0, V > 0 und ρ<sub>s</sub> > 0 eingeben.'; return; }

  const S=[`§Wassergehalt und Dichten`,

    `§Porenanteil und Porenzahl`,
    `n = 1 − ρ<sub>d</sub> / ρ<sub>s</sub> = 1 − ${f(r.rd,3)} / ${f(o.rs,3)} = ${f(r.n,3)}`,

    `S<sub>r</sub> = w · ρ<sub>s</sub> / (e · ρ<sub>w</sub>) = ${f(r.w,4)} · ${f(o.rs,3)} / ${f(r.e,3)} = ${f(r.Sr,3)}${r.Sr>1.005?' (> 1: Eingaben prüfen)':''}`,
    `§Wichten (g = 9,81 m/s², γ<sub>w</sub> = 9,81 kN/m³)`,

  if(o.emax>0 && o.emin>0 && o.emax>o.emin){ const ID=(o.emax-r.e)/(o.emax-o.emin);
    S.push(`§Bezogene Lagerungsdichte (nichtbindig)`, `I<sub>D</sub> = (e<sub>max</sub> − e) / (e<sub>max</sub> − e<sub>min</sub>) = (${f(o.emax,3)} − ${f(r.e,3)}) / (${f(o.emax,3)} − ${f(o.emin,3)}) = ${f(ID,3)}`,

  if(o.wL>0 && o.wP>0 && o.wL>o.wP){ const Ip=o.wL-o.wP, Ic=(o.wL-r.w*100)/Ip;
    S.push(`§Plastizität und Konsistenz (bindig)`, `I<sub>P</sub> = w<sub>L</sub> − w<sub>P</sub> = ${f(o.wL,1)} − ${f(o.wP,1)} = ${f(Ip,1)} %`,
      `I<sub>C</sub> = (w<sub>L</sub> − w) / I<sub>P</sub> = (${f(o.wL,1)} − ${f(r.w*100,1)}) / ${f(Ip,1)} = ${f(Ic,3)}`,

  out.innerHTML = ablauf('Bodenkenngrößen aus dem Versuch', S);

// ── Spannungen im Boden (geschichtet, mit Grundwasser) ──
function bodenSpannung(L, zw, q){   // L: [{d, g, gr}], zw: GW-Tiefe unter GOK, q: Auflast
  const pts=[0]; let z=0; L.forEach(l=>{ z+=l.d; pts.push(z); }); if(zw>0 && zw<z) pts.push(zw); pts.sort((a,b)=>a-b);
  const zz=[...new Set(pts.map(v=>+v.toFixed(6)))];
  const sigma = zt => { let s=q, top=0; for(const l of L){ const bot=top+l.d, a=Math.min(zt,bot); if(a>top){ const dry=Math.max(0,Math.min(a,zw)-top), wet=Math.max(0,a-Math.max(top,zw)); s+=dry*l.g+wet*l.gr; } top=bot; } return s; };
  return zz.map(zi=>{ const s=sigma(zi), u=Math.max(0,zi-zw)*GW_W; return { z:zi, s, u, sp:s-u }; });
}

// ── Steinbrenner: Eckpunkt eines Rechtecks, Setzung im Mittelpunkt ──
function steinbrennerI(a, b, z){   // Einflusswert unter der Ecke (a, b Seitenlängen)
  if(z<=0) return 0.25;
  const R1_=Math.hypot(a,z), R2_=Math.hypot(b,z), R3_=Math.sqrt(a*a+b*b+z*z);
  return (Math.atan(a*b/(z*R3_)) + a*b*z/R3_*(1/R1_**2 + 1/R2_**2)) / (2*Math.PI);
}
function setzungMitte(o){   // a, b [m], d, s0 (Sohlspannung), g (Wichte), Es [MN/m²], dz
  const s1=o.s0-o.g*o.d, rows=[]; let s=0, z=0, zg=null;
  for(let k=0;k<400;k++){
    const zm=z+o.dz/2, i=4*steinbrennerI(o.a/2,o.b/2,zm), ds=s1*i, su=o.g*(o.d+zm);
    if(ds<0.2*su){ zg=z; break; }
    const dsz=ds*o.dz/(o.Es*1000); s+=dsz; rows.push({ z0:z, z1:z+o.dz, zm, i, ds, su, dsz }); z+=o.dz;
  }
  return { s1, rows, s, zg };
}

    `§Spannungsausbreitung (Steinbrenner, Mittelpunkt = 4 Eckrechtecke a/2 × b/2)`,
    `!i(z) = 1/(2π) · [arctan(a·b/(z·R<sub>3</sub>)) + a·b·z/R<sub>3</sub> · (1/R<sub>1</sub>² + 1/R<sub>2</sub>²)] mit R<sub>1</sub> = √(a² + z²), R<sub>2</sub> = √(b² + z²), R<sub>3</sub> = √(a² + b² + z²)`,
    `!Δσ(z) = σ<sub>1</sub> · 4 · i · σ<sub>ü</sub>(z) = γ · (d + z) · Schicht bis zur Grenztiefe Δσ = 0,2 · σ<sub>ü</sub>`,
    `§Schichtweise Setzung Δs = Δσ · Δz / E<sub>s</sub> (E<sub>s</sub> = ${f(o.Es,1)} MN/m²)`])

    `s = Σ Δs = ${f(r.s*1000,1)} mm (schlaffe Last, Mittelpunkt)`,

function UvonT(T){ if(T<=0) return 0; let s=0; for(let m=0;m<200;m++){ const M=Math.PI*(2*m+1)/2; s+=2/(M*M)*Math.exp(-M*M*T); } return Math.max(0,1-s); }
function TvonU(U){ let lo=0, hi=5; for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(UvonT(m)<U) lo=m; else hi=m; } return (lo+hi)/2; }

    `U(T<sub>v</sub> = ${f(T,4)}) = ${f(U*100,1)} %`,
    ...(sinf>0 ? [`s(t) = U · s<sub>∞</sub> = ${f(U,3)} · ${f(sinf,1)} = ${f(U*sinf,1)} mm`] : []),
    `§Kennzeiten`, `t<sub>50</sub> = T<sub>50</sub> · H<sub>dr</sub>² / c<sub>v</sub> = 0,197 · ${f(Hd,2)}² / ${f(cv,2)} = ${f(t50,2)} Jahre`,
    `t<sub>90</sub> = T<sub>90</sub> · H<sub>dr</sub>² / c<sub>v</sub> = 0,848 · ${f(Hd,2)}² / ${f(cv,2)} = ${f(t90,2)} Jahre`]);

// ── Scherfestigkeit aus zwei Triaxialversuchen ──
function mohrCoulomb(s3a,s1a,s3b,s1b){
  const p1=(s1a+s3a)/2, q1=(s1a-s3a)/2, p2=(s1b+s3b)/2, q2=(s1b-s3b)/2;
  const sp=(q2-q1)/(p2-p1), ph=Math.asin(sp), c=(q1-p1*sp)/Math.cos(ph);
  return { p1, q1, p2, q2, ph:degG(ph), c };
}
function skMohr(T, r){
  const W=340, H=200, smax=Math.max(T.s1b,T.s1a)*1.08, sc=280/smax, X=s=>30+s*sc, Y=t=>170-t*sc;
  let o=ln(20,170,330,170,SK.ink,0.9,'marker-end="url(#skb)"')+ln(30,180,30,14,SK.ink,0.9,'marker-end="url(#skb)"')+it(326,186,'σ′','end')+it(36,18,'τ','start');
  [[r.p1,r.q1],[r.p2,r.q2]].forEach(([p,q],i)=>{ o+=`<path d="M ${R1(X(p-q))} 170 A ${R1(q*sc)} ${R1(q*sc)} 0 0 1 ${R1(X(p+q))} 170" fill="none" stroke="${i?SK.acc:SK.ink}" stroke-width="1.3"/>`; });
  const tg=Math.tan(radG(r.ph)), t0=r.c, sEnd=Math.min(smax, (150/sc - r.c)/tg), t1=r.c+sEnd*tg;
  o+=pl([[X(0),Y(t0)],[X(sEnd),Y(t1)]],SK.load,1.6)+it(X(sEnd*0.42),Y(r.c+sEnd*0.42*tg)-10,'τ = c′ + σ′·tan φ′','end',SK.load,11);
  return sv(W,H,'Mohrsche Spannungskreise mit Bruchgerade', o);
}

// ── Erddruck nach Coulomb (DIN 4085) ──
function kagh(phi, a, b, d){   // Grad; horizontaler Beiwert
  const P=radG(phi), A=radG(a), B=radG(b), D=radG(d);
  const r=Math.sin(P+D)*Math.sin(P-B)/(Math.cos(A-B)*Math.cos(A+D)); if(r<0) return NaN;
  return Math.cos(P-A)**2/(Math.cos(A)**2*(1+Math.sqrt(r))**2);
}
function kpgh(phi, a, b){       // δ_p = 0
  const P=radG(phi), A=radG(a), B=radG(b);
  const r=Math.sin(P)*Math.sin(P+B)/(Math.cos(A-B)*Math.cos(A)); if(r>=1) return NaN;
  return Math.cos(P+A)**2/(Math.cos(A)**2*(1-Math.sqrt(r))**2);
}
const kach = (phi, d) => 2*Math.cos(radG(phi))*Math.cos(radG(d))/(1+Math.sin(radG(phi+d)));   // α = β = 0
function updateCoulomb(){
  const out=document.getElementById('cb-out'); if(!out) return;
  const phi=num('cb-phi'), a=num('cb-a')||0, b=num('cb-b')||0, dm=valOf('cb-d');
  if(!(phi>0&&phi<50) || b>=phi){ out.innerHTML='Bitte 0 < φ′ < 50° und β < φ′ eingeben.'; return; }
  const d = dm==='0' ? 0 : dm==='13' ? phi/3 : dm==='12' ? phi/2 : 2*phi/3;
  const K=kagh(phi,a,b,d), Kp=kpgh(phi,a,b), K0=kagh(phi,0,0,0), f=dG;
  out.innerHTML = ablauf('Erddruckbeiwerte nach Coulomb', [
    `§Eingangswerte`, `!φ′ = ${f(phi,1)}° · Wandneigung α = ${f(a,1)}° · Geländeneigung β = ${f(b,1)}° · Wandreibung δ<sub>a</sub> = ${f(d,2)}°`,
    `§Aktiver Erddruck, horizontale Komponente`,
    `!K<sub>agh</sub> = cos²(φ′ − α) / [cos²α · (1 + √(sin(φ′ + δ) · sin(φ′ − β) / (cos(α − β) · cos(α + δ))))²]`,
    `K<sub>agh</sub> = cos²(${f(phi-a,1)}°) / [${f(Math.cos(radG(a))**2,4)} · (1 + √(${f(Math.sin(radG(phi+d))*Math.sin(radG(phi-b)),4)} / ${f(Math.cos(radG(a-b))*Math.cos(radG(a+d)),4)}))²] = ${f(K,4)}`,
    `!zum Vergleich ohne Wandreibung und waagerecht (Rankine): K<sub>a</sub> = tan²(45° − φ′/2) = ${f(K0,4)}`,
    `§Gleitflächenwinkel`, `!ϑ<sub>a</sub> ≈ 45° + φ′/2 = ${f(45+phi/2,1)}° gegen die Waagerechte (für α = β = δ = 0)`,
    `§Passiver Erddruck (δ<sub>p</sub> = 0)`,
    `K<sub>pgh</sub> = cos²(φ′ + α) / [cos²α · (1 − √(sin φ′ · sin(φ′ + β) / (cos(α − β) · cos α)))²] = ${isFinite(Kp)?f(Kp,4):'—'}`,
    `§Kohäsion (α = β = 0)`, `K<sub>ach</sub> = 2 · cos φ′ · cos δ / (1 + sin(φ′ + δ)) = ${f(kach(phi,d),4)}`]);
}
// geschichteter Erddruck mit Grundwasser (α = β = 0, δ je Schicht als Anteil von φ′)
function erddruckSchichten(L, zw, q, dFak){
  let top=0, sv=q; const P=[];
  const svAt=(z)=>{ let s=q, t=0; for(const l of L){ const bot=t+l.d, a=Math.min(z,bot); if(a>t){ const dry=Math.max(0,Math.min(a,zw)-t), wet=Math.max(0,a-Math.max(t,zw)); s+=dry*l.g+wet*l.gp; } t=bot; } return s; };
  L.forEach(l=>{ const K=kagh(l.phi,0,0,dFak*l.phi), Kc=kach(l.phi,dFak*l.phi);
    const zs=[top, ...(zw>top && zw<top+l.d ? [zw] : []), top+l.d];
    zs.forEach(z=>{ const s=svAt(z), e=Math.max(0, s*K - l.c*Kc), w=Math.max(0,z-zw)*10; P.push({ z, s, K, Kc, e, w, c:l.c }); });
    top+=l.d; });
  // Resultierende (Trapezregel über die Punkte, Sprünge an Schichtgrenzen berücksichtigt)
  let Ea=0, Ma=0, Ew=0, Mw=0; const H=top;
  for(let i=0;i<P.length-1;i++){ const A=P[i], B=P[i+1]; const h=B.z-A.z; if(h<=0) continue;
    const F=(A.e+B.e)/2*h, zc = (A.e+B.e)>0 ? A.z + h*(A.e+2*B.e)/(3*(A.e+B.e)) : A.z+h/2; Ea+=F; Ma+=F*(H-zc);
    const Fw=(A.w+B.w)/2*h, zw2 = (A.w+B.w)>0 ? A.z + h*(A.w+2*B.w)/(3*(A.w+B.w)) : A.z+h/2; Ew+=Fw; Mw+=Fw*(H-zw2); }
  return { P, Ea, ya: Ea>0?Ma/Ea:0, Ew, yw: Ew>0?Mw/Ew:0, H };
}
function updateErdS(){
  const out=document.getElementById('es-out'); if(!out) return;

  const zw=num('es-zw'), q=num('es-q')||0, df=+valOf('es-df');
  if(!L.length || L.some(l=>!(l.g>0&&l.gp>0&&l.phi>0&&l.phi<50)) || !(zw>=0)){ out.innerHTML='Bitte alle Schichtwerte und die GW-Tiefe eingeben.'; return; }
  const r=erddruckSchichten(L,zw,q,df), f=dG;

    `!e<sub>ah</sub>(z) = σ′<sub>v</sub>(z) · K<sub>agh</sub> − c′ · K<sub>ach</sub> ≥ 0 · σ′<sub>v</sub> = q + Σ γ · h (unter GW γ′) · Wasserdruck w = γ<sub>w</sub> · (z − z<sub>w</sub>) mit γ<sub>w</sub> = 10 kN/m³`];
  L.forEach((l,i)=>S.push(`!Schicht ${i+1}: K<sub>agh</sub> = ${f(kagh(l.phi,0,0,df*l.phi),4)}, K<sub>ach</sub> = ${f(kach(l.phi,df*l.phi),4)} (φ′ = ${f(l.phi,1)}°, c′ = ${f(l.c,1)} kN/m²)`));

    `§Resultierende je m Wand`, `E<sub>ah</sub> = ${f(r.Ea,2)} kN/m, Angriff ${f(r.ya,2)} m über dem Fuß`,
    ...(r.Ew>0 ? [`W = ${f(r.Ew,2)} kN/m, Angriff ${f(r.yw,2)} m über dem Fuß`, `Summe E<sub>ah</sub> + W = ${f(r.Ea+r.Ew,2)} kN/m`] : []));
  out.innerHTML = ablauf(`Erddruck auf ${f(r.H,2)} m Wandhöhe`, S);
  document.getElementById('es-fig').innerHTML = fig(skErdS(r, zw), 'Orange: aktiver Erddruck e<sub>ah</sub>, blau: Wasserdruck. Sprünge entstehen an Schichtgrenzen durch das andere K<sub>agh</sub>.');

// ── Sohldruck ──
function updateSohldruck(){
  const out=document.getElementById('sd-out'); if(!out) return;
  const a=num('sd-a'), b=num('sd-b'), V=num('sd-V'), M=Math.abs(num('sd-M')||0), staend=valOf('sd-art')==='g';
  if(!(a>0&&b>0&&V>0)){ out.innerHTML='Bitte a, b, V > 0 eingeben.'; return; }
  const e=M/V, k1=b/6, k2=b/3, A=a*b, f=dG, S=[`§Ausmitte`, `e = M / V = ${f(M,1)} / ${f(V,1)} = ${f(e,3)} m`,
    `!1. Kernweite b/6 = ${f(k1,3)} m · 2. Kernweite b/3 = ${f(k2,3)} m`];
  if(e<=k1){ S.push(`§Trapezförmige Sohlspannung (e ≤ b/6)`, `σ<sub>max</sub> = V/(a·b) · (1 + 6e/b) = ${f(V,1)}/${f(A,2)} · (1 + 6 · ${f(e,3)}/${f(b,2)}) = ${f(V/A*(1+6*e/b),1)} kN/m²`,
      `σ<sub>min</sub> = V/(a·b) · (1 − 6e/b) = ${f(V/A*(1-6*e/b),1)} kN/m²`); }
  else if(e<b/2){ const c=b/2-e; S.push(`§Klaffende Fuge (e > b/6)`, `c = b/2 − e = ${f(b/2,3)} − ${f(e,3)} = ${f(c,3)} m · überdrückte Länge 3c = ${f(3*c,3)} m`,
      `σ<sub>max</sub> = 2V / (3 · a · c) = 2 · ${f(V,1)} / (3 · ${f(a,2)} · ${f(c,3)}) = ${f(2*V/(3*a*c),1)} kN/m²`); }
  else S.push('!e ≥ b/2: Resultierende außerhalb der Sohle — Fundament kippt.');
  const lim = staend ? k1 : k2;
  S.push(`§Lage der Resultierenden (DIN 1054)`, `!${staend?'nur ständige Lasten: e ≤ b/6':'ständige + veränderliche Lasten: e ≤ b/3'} → ${f(e,3)} ${e<=lim?'≤':'>'} ${f(lim,3)} m ${ok(e/lim)}`,

  out.innerHTML = ablauf('Sohlspannung', S);
}

// ── Grundbruch DIN 4017 (wie statiq·size) ──
function gb4017(o){   // b, a (Infinity = Streifen), d, phi, c, g1, g2, V, H, e
  const ph=radG(o.phi), tp=Math.tan(ph), strip=!isFinite(o.a);
  const bp=o.b-2*o.e, ap=strip?1:o.a, A=bp*ap, bs = strip ? bp : Math.min(bp,ap), r = strip ? 0 : Math.min(bp,ap)/Math.max(bp,ap);
  const Nd0=Math.tan(Math.PI/4+ph/2)**2*Math.exp(Math.PI*tp), Nb0=(Nd0-1)*tp, Nc0=(Nd0-1)/tp;
  const vb=1-0.3*r, vd=1+r*Math.sin(ph), vc=(vd*Nd0-1)/(Nd0-1);
  const m = strip ? 2 : (2+bp/ap)/(1+bp/ap), t=o.H/(o.V+A*o.c/tp);
  const id=(1-t)**m, ib=(1-t)**(m+1), ic=(id*Nd0-1)/(Nd0-1);
  const Nb=Nb0*vb*ib, Nd=Nd0*vd*id, Nc=Nc0*vc*ic, qg=o.g2*bs*Nb, qd=o.g1*o.d*Nd, qc=o.c*Nc;
  return { bp, ap, A, bs, r, Nd0, Nb0, Nc0, vb, vd, vc, m, t, id, ib, ic, Nb, Nd, Nc, qg, qd, qc, Rk: t<1 ? A*(qg+qd+qc) : 0, strip };
}
function updateGB(){
  const out=document.getElementById('gb-out'); if(!out) return;

  document.querySelectorAll('.gb-af').forEach(e=>e.style.display=strip?'none':'');
  if(!(o.b>0&&(strip||o.a>0)&&o.phi>0&&o.phi<=45&&o.g1>0&&o.g2>0&&o.V>0&&o.e>=0&&o.e<o.b/2)){ out.innerHTML='Bitte gültige Werte eingeben (0 < φ′ ≤ 45°, e < b/2).'; return; }
  const G=gb4017(o), f=dG, u=strip?'/m':'', Rd=G.Rk/1.4;
  const S=[`§Wirksame Fläche`, `b′ = b − 2e = ${f(o.b)} − 2 · ${f(o.e,3)} = ${f(G.bp,3)} m${strip?' (Streifen, je m)':` · a′ = ${f(G.ap)} m`} → A′ = ${f(G.A,3)} m²`,
    `§Tragfähigkeitsbeiwerte`,
    `N<sub>d0</sub> = tan²(45° + φ′/2) · e<sup>π · tan φ′</sup> = ${f(G.Nd0,3)}`,

    `§Formbeiwerte`, G.strip ? '!Streifen: ν<sub>b</sub> = ν<sub>d</sub> = ν<sub>c</sub> = 1'
      : `!b′/a′ = ${f(G.r,3)}: ν<sub>b</sub> = 1 − 0,3 · b′/a′ = ${f(G.vb,3)} · ν<sub>d</sub> = 1 + b′/a′ · sin φ′ = ${f(G.vd,3)} · ν<sub>c</sub> = (ν<sub>d</sub> · N<sub>d0</sub> − 1)/(N<sub>d0</sub> − 1) = ${f(G.vc,3)}`,

    `§Grundbruchspannung`,
    `σ<sub>0f</sub> = γ<sub>2</sub> · b′ · N<sub>b</sub> + γ<sub>1</sub> · d · N<sub>d</sub> + c′ · N<sub>c</sub> = ${f(o.g2,1)} · ${f(G.bs,3)} · ${f(G.Nb,3)} + ${f(o.g1,1)} · ${f(o.d)} · ${f(G.Nd,3)} + ${f(o.c,1)} · ${f(G.Nc,3)} = ${f(G.qg+G.qd+G.qc,1)} kN/m²`,

  const B=radG(b), gs = str ? gr : g, gn = str ? gr-10 : g;

    `§Spannungen in der Gleitfläche in der Tiefe z = ${f(z,2)} m`,
    `τ = ${str?'γ<sub>r</sub>':'γ'} · z · sin β · cos β = ${f(gs,1)} · ${f(z,2)} · ${f(Math.sin(B),4)} · ${f(Math.cos(B),4)} = ${f(tau,2)} kN/m²`,
    `σ′ = ${str?'γ′':'γ'} · z · cos²β = ${f(gn,1)} · ${f(z,2)} · ${f(Math.cos(B)**2,4)} = ${f(sn,2)} kN/m²${str?' (γ′ = γ<sub>r</sub> − γ<sub>w</sub>, Strömungskraft hangparallel)':''}`,
    `§Nachweis`,

// WASSERBAU (ref v0.3.14): Stoffwerte, Kennzahlen, Rohrhydraulik (Moody), Pumpen, Druckstoß,
// Ausfluss, Gerinne (Grenztiefe, Wechselsprung, Teilfüllung), Brunnen, Regenabfluss
// ══════════════════════════════════════════════════
const dW = (v,n=2) => deNum(v,n), gW = 9.81;
// Wasser bei 1 bar: T [°C], ρ [kg/m³], ν [10⁻⁶ m²/s], μ [10⁻³ Pa·s], p_D [kPa], σ [N/m]
const WASSER = [[0,999.8,1.792,1.792,0.611,0.0756],[5,1000.0,1.519,1.519,0.872,0.0749],[10,999.7,1.306,1.306,1.228,0.0742],[15,999.1,1.139,1.138,1.705,0.0735],
  [20,998.2,1.004,1.002,2.339,0.0728],[25,997.0,0.893,0.890,3.169,0.0720],[30,995.7,0.801,0.798,4.246,0.0712],[40,992.2,0.658,0.653,7.384,0.0696],
  [50,988.0,0.553,0.547,12.35,0.0679],[60,983.2,0.474,0.466,19.94,0.0662],[80,971.8,0.365,0.355,47.39,0.0626],[100,958.4,0.294,0.282,101.33,0.0589]];
function wasserBei(T){ const W=WASSER; if(T<=W[0][0]) return W[0]; if(T>=W[W.length-1][0]) return W[W.length-1];
  for(let i=1;i<W.length;i++) if(T<=W[i][0]){ const a=W[i-1], b=W[i], t=(T-a[0])/(b[0]-a[0]); return a.map((v,k)=>v+(b[k]-v)*t); } }
function lamColebrook(Re, kd){ if(Re<2320) return 64/Re; let l=0.02; for(let i=0;i<100;i++){ const n=(-2*Math.log10(2.51/(Re*Math.sqrt(l))+kd/3.71))**-2; if(Math.abs(n-l)<1e-14){ l=n; break; } l=n; } return l; }
const lamSwamee = (Re, kd) => 0.25/Math.log10(kd/3.7+5.74/Re**0.9)**2;

// ── Kennzahlen ──
function updateKZ(){
  const out=document.getElementById('kz-out'); if(!out) return;
  const v=num('kz-v'), L=num('kz-L'), T=num('kz-T'), art=valOf('kz-art'), h=num('kz-h');
  if(!(v>0&&L>0&&T>=0&&T<=100)){ out.innerHTML='Bitte v, L > 0 und 0 ≤ T ≤ 100 °C eingeben.'; return; }
  const W=wasserBei(T), nu=W[2]*1e-6, Re=v*L/nu, f=dW, S=[`§Stoffwerte bei ${f(T,1)} °C (interpoliert)`, `!ν = ${f(W[2],3)} · 10⁻⁶ m²/s · ρ = ${f(W[1],1)} kg/m³`,
    `§Reynolds-Zahl (Trägheit / Zähigkeit)`, `Re = v · L / ν = ${f(v,2)} · ${f(L,3)} / ${f(W[2],3)}·10⁻⁶ = ${dk(Re)}`];
  if(art==='rohr') S.push(`!Rohr (L = d): ${Re<2320?'laminar (Re < 2320)':Re<1e4?'Übergangsbereich (2320 … 10⁴)':'turbulent (Re > 10⁴)'}`);
  else { S.push(`!Gerinne (L = 4R bzw. R mit Re<sub>R</sub> < 580 laminar): Re<sub>4R</sub> = ${dk(Re)} → ${Re<2320?'laminar':'turbulent'}`);
    if(h>0){ const Fr=v/Math.sqrt(gW*h); S.push(`§Froude-Zahl (Trägheit / Schwere)`, `Fr = v / √(g · h<sub>m</sub>) = ${f(v,2)} / √(9,81 · ${f(h,2)}) = ${f(Fr,3)}`, `!${Fr<1?'strömend (Fr < 1)':Fr>1?'schießend (Fr > 1)':'kritisch'}`); } }
  out.innerHTML = ablauf('Kennzahlen', S);
}

// ── Rohrleitung mit Moody-Diagramm ──
function skMoody(pt){
  const W=360, H=250, x0=44, y0=220, xw=300, yh=200, lx=v=>x0+(Math.log10(v)-3)/5*xw, ly=l=>y0-(Math.log10(l)-Math.log10(0.005))/(Math.log10(0.1)-Math.log10(0.005))*yh;
  let o='';
  for(let e=3;e<=8;e++){ o+=ln(lx(10**e),y0,lx(10**e),y0-yh,'#e5e7eb',0.6)+tl(lx(10**e),y0+12,`10${'⁰¹²³⁴⁵⁶⁷⁸'[e]}`,'middle'); }
  for(const l of [0.006,0.008,0.01,0.015,0.02,0.03,0.04,0.06,0.08,0.1]){ o+=ln(x0,ly(l),x0+xw,ly(l),'#e5e7eb',0.6)+tl(x0-4,ly(l)+3,deNum(l,3).replace(/0+$/,'').replace(/,$/,''),'end'); }
  o+=ln(x0,y0,x0+xw,y0,SK.ink,0.9)+ln(x0,y0,x0,y0-yh,SK.ink,0.9)+tl(x0+xw,y0+24,'Re','end')+it(x0-30,y0-yh-6,'λ','start',SK.ink,12);
  // laminar
  const lam=[]; for(let r=1000;r<=2320*1.0001;r*=1.02) lam.push([lx(r),ly(64/r)]); lam.push([lx(2320),ly(64/2320)]); o+=pl(lam,SK.ink,1.2);
  o+=tl(lx(2320)-3,ly(64/2320)+14,'64/Re','end');
  for(const kd of [0,1e-5,1e-4,1e-3,5e-3,0.01,0.03]){ const P=[]; for(let e=3.4;e<=8.001;e+=0.05){ const r=10**e, l=lamColebrook(r,kd); if(l>=0.005&&l<=0.1) P.push([lx(r),ly(l)]); }
    o+=pl(P, kd===0?SK.acc:'#6b7280', kd===0?1.4:1); const last=P[P.length-1]; if(last) o+=tl(last[0]+2,last[1]+3, kd===0?'glatt':String(kd).replace('.',','),'start', kd===0?SK.acc:SK.dim); }
  if(pt && pt.Re>=1000 && pt.Re<=1e8 && pt.lam>=0.005 && pt.lam<=0.1) o+=`<circle cx="${R1(lx(pt.Re))}" cy="${R1(ly(pt.lam))}" r="5" fill="${SK.load}" stroke="#fff" stroke-width="1.5"/>`;
  o+=tl(x0+xw+2,y0-yh-6,'k/d','start');
  return sv(W+30,H+10,'Moody-Diagramm: Reibungsbeiwert über Reynolds-Zahl', o);
}
function updateRohrR(){
  const out=document.getElementById('wbr-out'); if(!out) return;
  const Q=num('wbr-Q')/1000, d=num('wbr-d')/1000, L=num('wbr-L'), k=num('wbr-k')/1000, T=num('wbr-T'), z=num('wbr-z')||0;
  if(!(Q>0 && d>0 && L>0 && k>=0) || !(T>=0 && T<=100)){ out.innerHTML='Bitte Q, d, L > 0 und 0 … 100 °C eingeben.'; return; }
  const W=wasserBei(T), nu=W[2]*1e-6, A=Math.PI*d*d/4, v=Q/A, Re=v*d/nu, kd=k/d, lam=lamColebrook(Re,kd), hv2=v*v/(2*gW);
  const hr=lam*L/d*hv2, ho=z*hv2, f=dW;
  const S=[`§Fließgeschwindigkeit`, `A = π · d² / 4 = π · ${f(d,3)}² / 4 = ${deNum(A,5)} m²`, `v = Q / A = ${f(Q,4)} / ${deNum(A,5)} = ${f(v,3)} m/s`,
    `§Reynolds-Zahl (${f(T,1)} °C: ν = ${f(W[2],3)} · 10⁻⁶ m²/s)`, `Re = v · d / ν = ${f(v,3)} · ${f(d,3)} / ${f(W[2],3)}·10⁻⁶ = ${dk(Re)} → ${Re<2320?'laminar':'turbulent'}`,
    `§Reibungsbeiwert`];
  if(Re<2320) S.push(`λ = 64 / Re = 64 / ${dk(Re)} = ${f(lam,5)}`);
  else S.push(`!relative Rauheit k/d = ${deNum(kd,6)} · Colebrook-White iterativ: 1/√λ = −2 · lg(2,51/(Re · √λ) + k/(3,71 · d))`,
    `λ = ${f(lam,5)} (explizit nach Swamee-Jain zum Vergleich: ${f(lamSwamee(Re,kd),5)}${Re>=5000&&kd>=1e-6&&kd<=0.01?'':', hier außerhalb des Gültigkeitsbereichs Re ≥ 5000, 10⁻⁶ ≤ k/d ≤ 10⁻²'})`,
    `!${kd*Re*Math.sqrt(lam)/Math.sqrt(8)<5?'hydraulisch glatt':kd*Re*Math.sqrt(lam)/Math.sqrt(8)>70?'vollkommen rau':'Übergangsbereich'} (Re · k/d · √(λ/8) = ${f(kd*Re*Math.sqrt(lam/8),1)})`);
  S.push(`§Verlusthöhen`, `v² / (2g) = ${f(v,3)}² / 19,62 = ${f(hv2,4)} m`,
    `h<sub>v,R</sub> = λ · L/d · v²/(2g) = ${f(lam,5)} · ${f(L,1)}/${f(d,3)} · ${f(hv2,4)} = ${f(hr,3)} m (${f(hr/L*1000,2)} ‰)`);
  if(z>0) S.push(`h<sub>v,ö</sub> = Σζ · v²/(2g) = ${f(z,2)} · ${f(hv2,4)} = ${f(ho,3)} m`, `h<sub>v</sub> = h<sub>v,R</sub> + h<sub>v,ö</sub> = ${f(hr,3)} + ${f(ho,3)} = ${f(hr+ho,3)} m`);
  S.push(`!Druckverlust Δp = ρ · g · h<sub>v</sub> = ${f(W[1]*gW*(hr+ho)/1000,1)} kPa = ${f(W[1]*gW*(hr+ho)/1e5,3)} bar`);
  out.innerHTML = ablauf(`Rohrleitung DN ${f(d*1000,0)}, Q = ${f(Q*1000,1)} l/s`, S);
  const fg=document.getElementById('wbr-fig'); if(fg) fg.innerHTML = fig(skMoody({Re, lam}), 'Moody-Diagramm (Colebrook-White): Reibungsbeiwert λ über Re für verschiedene k/d. Punkt: deine Leitung.');
}

// ── Druckstoß (Joukowsky) ──
function updateDruckstoss(){
  const out=document.getElementById('dst-out'); if(!out) return;
  const d=num('dst-d')/1000, s=num('dst-s')/1000, E=num('dst-E')*1e9, L=num('dst-L'), dv=num('dst-dv'), ts=num('dst-ts')||0, K=2.1e9, rho=1000;
  if(!(d>0&&s>0&&E>0&&L>0&&dv>0)){ out.innerHTML='Bitte alle Werte > 0 eingeben.'; return; }
  const a=Math.sqrt(K/rho/(1+K*d/(E*s))), Tr=2*L/a, dp=rho*a*dv, f=dW, fast = ts<=Tr;
  const S=[`§Druckwellengeschwindigkeit`, `a = √((K/ρ) / (1 + K · d / (E · s))) = √((2,1·10⁹/1000) / (1 + 2,1·10⁹ · ${f(d,3)} / (${f(E/1e9,1)}·10⁹ · ${f(s,4)}))) = ${f(a,0)} m/s`,

function kreisTeil(D,h){ const r=D/2, th=2*Math.acos(1-2*h/D), A=r*r/2*(th-Math.sin(th)), U=r*th; return { th, A, U, R:A/U }; }

  const Q=2/3*mu*b*Math.sqrt(2*9.81)*h**1.5, f=dW;
  out.innerHTML = ablauf('Vollkommener Überfall', [`Q = 2/3 · μ · b · √(2g) · h<sub>ü</sub><sup>3/2</sup> = 2/3 · ${f(mu,3)} · ${f(b)} · ${f(Math.sqrt(2*9.81),3)} · ${f(h,3)}<sup>3/2</sup> = ${f(Q,3)} m³/s`,
    `!spezifischer Abfluss q = Q / b = ${f(Q/b,3)} m²/s · Grenztiefe auf der Krone h<sub>gr</sub> = ∛(q²/g) = ${f(Math.cbrt((Q/b)**2/9.81),3)} m`]);
}

// ── Skizzen Stahlprofile (aus der echten Geometrie gezeichnet) ──
function skPolyAt(P, ox, oy, s){ return P.map(([x,y])=>[ox+x*s, oy-y*s]); }
function skUProfil(){
  const h=200,b=75,tw=8.5,tf=11.5, P=uPoly(h,b,tw,tf,tf,tf/2,0.08), pp=PROF['UPN 200'], s=0.8, ox=70, oy=195;
  const Q=skPolyAt(P,ox,oy,s), xs=ox+pp.ez*10*s, ym=oy-h/2*s;
  return sv(345,230,'U-Profil mit Abmessungen und Schwerpunkt', poly(Q)
    + axH(ox-22, ox+b*s+40, ym, 'y') + axV(xs, oy-h*s-14, oy+14, 'z') + cen(xs, ym, 'S')
    + dimL(ox, oy, ox, oy-h*s, 'h', -22) + dimL(ox, oy, ox+b*s, oy, 'b', 18)
    + dimL(ox, oy-h*s, xs, oy-h*s, sb('e','z'), -14)
    + ln(ox+tw*s, oy-h*0.66*s, ox+tw*s+70, oy-h*0.66*s, SK.ink, 0.6) + it(ox+tw*s+74, oy-h*0.66*s+4, sb('t','w'), 'start')
    + ln(ox+b*s*0.5, oy-(h-tf/2)*s, ox+b*s+30, oy-(h+8)*s+12, SK.ink, 0.6) + it(ox+b*s+33, oy-(h+8)*s+16, sb('t','f'), 'start')
    + tl(ox+b*s+50, oy-h*0.35*s, 'UPN: Flansch innen geneigt', 'start') + tl(ox+b*s+50, oy-h*0.35*s+13, 'UPE: Flansche parallel', 'start'));
}
function skLProfil(){
  const b=100,t=10, P=lPoly(b,t,12,6), pp=PROF['L 100×10'], s=1.35, ox=60, oy=185;
  const Q=skPolyAt(P,ox,oy,s), xs=ox+pp.e*10*s, ys=oy-pp.e*10*s, r=95;
  const c=Math.SQRT1_2;
  return sv(300,255,'Winkelprofil mit Hauptachsen', poly(Q)
    + axH(ox-16, ox+b*s+18, ys, 'y') + axV(xs, oy-b*s-12, oy+16, 'z')
    + ln(xs-r*c, ys+r*c, xs+r*c, ys-r*c, SK.acc, 0.7, 'stroke-dasharray="7 3 2 3"') + it(xs+r*c+4, ys-r*c, 'u', 'start', SK.acc)
    + ln(xs-55*c, ys-55*c, xs+55*c, ys+55*c, SK.acc, 0.7, 'stroke-dasharray="7 3 2 3"') + it(xs+55*c+4, ys+55*c+6, 'v', 'start', SK.acc)
    + cen(xs, ys, '') + dimL(ox, oy, ox+b*s, oy, 'b', 18) + dimL(ox, oy, ox, oy-b*s, 'b', -20)
    + dimL(ox, oy, xs, oy, 'e', 36) + ln(ox+t*s, oy-b*s*0.75, ox+t*s+46, oy-b*s*0.75, SK.ink, 0.6) + it(ox+t*s+50, oy-b*s*0.75+4, 't', 'start'));
}
function skHohl(){
  const rr=(B,H,r,ox,oy)=>{ const P=roundPoly([[0,0,r],[B,0,r],[B,H,r],[0,H,r]],8); return skPolyAt(P,ox,oy,1); };

const hrefOf = (f,k,t) => '#/' + [f,k,t].filter(Boolean).join('/');
const escapeHtml = v => String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deNum = (v, d=2) => (+v + Math.sign(+v)*1e-9).toFixed(d).replace('.', ',');   // 1e-9: 1,575 → 1,58 statt 1,57 (Gleitkomma)

// Datentabelle. Zeile antippen = markieren (hilft beim Ablesen breiter Tabellen).
function dataTable(data){
  let head = '<tr>' + data.cols.map(c=>`<th>${c}</th>`).join('') + '</tr>';
  if(data.units){
    head += '<tr>' + data.units.map(u=>`<th style="font-weight:400;color:var(--text3);font-size:10px">${u}</th>`).join('') + '</tr>';
  }
  const body = data.rows.map(r=>'<tr>' + r.map(c=>`<td>${typeof c==='number' ? String(c).replace('.',',') : c}</td>`).join('') + '</tr>').join('');
  return `<div class="data-table-wrap"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="table-hint">Zeile antippen zum Markieren${data.cols.length>5 ? ' · waagerecht scrollbar' : ''}</div>`;
}
// Einfache Texttabelle (Formeln, Grenzwerte)
function textTable(cols, rows){
  // Lange Texte in den hinteren Spalten → umbrechen und linksbündig statt waagerecht scrollen
  const plain = c => String(c).replace(/<[^>]*>/g,'');
  const wrap = rows.some(r => r.slice(1).some(c => plain(c).length > 26));
  return `<div class="data-table-wrap"><table class="data text-cols${wrap?' text-table':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`
    + (cols.length>=5 && !wrap ? '<div class="table-hint">waagerecht scrollbar</div>' : '');
}
const sizeSoon = txt => `<span class="applink soon" title="statiq·size ist in Vorbereitung">${txt} — statiq·size folgt</span>`;

// ── Rechner: Bemessungswerte der Festigkeit f_d = kmod · f_k / γM ──
// Für Vollholz und BSH. Nicht enthalten: k_h (Höhenfaktor), k_cr (Rissfaktor
// beim Schub), k_sys (Systembeiwert) — sie werden im jeweiligen Nachweis angesetzt.
const FD_TABLES = { vollholz: VOLLHOLZ_NADEL, bsh: BSH };
function fdCalc(key, defClass){
  const T = FD_TABLES[key];
  const opt = (v,l,sel) => `<option value="${v}"${sel?' selected':''}>${l}</option>`;
  return `
    <div class="card">
      <div class="card-title">Bemessungswerte berechnen</div>
      <div class="section-note">Festigkeitsklasse, Nutzungsklasse und Klasse der Lasteinwirkungsdauer (KLED) wählen:</div>
      <div class="calc-grid">
        <div class="calc-field"><label for="fd-${key}-cls">Klasse</label>
          <select id="fd-${key}-cls" onchange="updateFd('${key}')">${T.rows.map(r=>opt(r[0],r[0],r[0]===defClass)).join('')}</select></div>
        <div class="calc-field"><label for="fd-${key}-nkl">Nutzungsklasse</label>
          <select id="fd-${key}-nkl" onchange="updateFd('${key}')">${[0,1,2].map(i=>opt(i,'NKL '+(i+1),i===0)).join('')}</select></div>
        <div class="calc-field"><label for="fd-${key}-kled">KLED</label>
          <select id="fd-${key}-kled" onchange="updateFd('${key}')">${KLED.map((k,i)=>opt(i,k,i===2)).join('')}${opt('wind','Wind (kurz/sehr kurz)',false)}</select></div>
        <div class="calc-field"><label for="fd-${key}-gm">γM</label>
          <select id="fd-${key}-gm" onchange="updateFd('${key}')">${opt('na','1,30 (NA Deutschland)',true)}${opt('en', key==='bsh'?'1,25 (EN-Empfehlung)':'1,30 (EN-Empfehlung)',false)}</select></div>
      </div>
      <div class="calc-out" id="fd-${key}-head"></div>
      <div id="fd-${key}-out"></div>
      <div class="legend">Nicht enthalten: k<sub>h</sub> (Höhenfaktor bei Biegung/Zug), k<sub>cr</sub> (Rissfaktor beim Schub),
        k<sub>sys</sub> (Systembeiwert). Sie kommen im jeweiligen Nachweis dazu.</div>
    </div>`;
}
function kmodOf(nkl, kled){
  if(kled==='wind'){ const r=KMOD.rows[nkl]; return (r[4]+r[5])/2; }   // Mittelwert kurz / sehr kurz (NA)
  return KMOD.rows[nkl][1+(+kled)];
}
function updateFd(key){
  const T = FD_TABLES[key];
  const el = id => document.getElementById(`fd-${key}-${id}`);
  if(!el('cls')) return;
  const row = T.rows.find(r=>r[0]===el('cls').value);
  const nkl = +el('nkl').value, kled = el('kled').value;
  const km = kmodOf(nkl, kled);
  const gm = el('gm').value==='en' && key==='bsh' ? 1.25 : 1.30;
  const names = [['f_m,d','Biegung',1],['f_t,0,d','Zug ∥',2],['f_t,90,d','Zug ⊥',3],['f_c,0,d','Druck ∥',4],['f_c,90,d','Druck ⊥',5],['f_v,d','Schub',6]];
  el('head').innerHTML = `k<sub>mod</sub> = <b>${deNum(km)}</b> &nbsp;·&nbsp; γ<sub>M</sub> = <b>${deNum(gm)}</b> &nbsp;·&nbsp; k<sub>mod</sub>/γ<sub>M</sub> = <b>${deNum(km/gm,3)}</b>`;
  el('out').innerHTML = textTable(['','Beanspruchung','f_k','f_d'],
    names.map(([n,l,i])=>[n, l, deNum(row[i],1), `<b>${deNum(km*row[i]/gm)}</b>`]))
    + `<div class="table-hint">Werte in N/mm²</div>`;
}

        Die Spalte „EN-Empfehlung“ zeigt die Werte ohne NA (EN 1995-1-1, Tab. 2.3), z. B. für andere Länder.
      </div>
    </div>
  `,

  // ── Grundlagen → Einwirkungen ────────────────────
  'holzbau/grundlagen/einwirkungen': () => `
    <div class="card">
      <div class="card-title">Bemessungswert der Einwirkung</div>
      <div class="section-note">In der ständigen und vorübergehenden Bemessungssituation (GZT):</div>
      <div class="formula-box">
        E<sub>d</sub> = γ<sub>G</sub>·G<sub>k</sub> + γ<sub>Q</sub>·Q<sub>k,1</sub> + Σ<sub>i>1</sub> γ<sub>Q</sub>·ψ<sub>0,i</sub>·Q<sub>k,i</sub>
        <div class="comment">γ<sub>G</sub> = 1,35 (ungünstig) bzw. 1,00 (günstig) · γ<sub>Q</sub> = 1,50 · ψ<sub>0</sub> — Kombinationsbeiwert<br>
        Q<sub>k,1</sub> ist die Leiteinwirkung; jede veränderliche Last muss einmal als Leiteinwirkung untersucht werden.</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Bemessungswert des Widerstands</div>
      <div class="section-note">
        Wegen der Anisotropie des Holzes wird zwischen Beanspruchung
        <b>parallel</b> und <b>senkrecht</b> zur Faser unterschieden.
      </div>
      <div class="formula-box">
        ∥ Faser:&nbsp;&nbsp; R<sub>d</sub> = k<sub>mod</sub> · R<sub>k,0</sub> / γ<sub>M</sub><br>
        ⊥ Faser:&nbsp;&nbsp; R<sub>d</sub> = k<sub>mod</sub> · R<sub>k,90</sub> / γ<sub>M</sub>
        <div class="comment">Die Festigkeit ⊥ Faser ist deutlich kleiner, besonders bei Zug
        (f<sub>t,90,k</sub> = 0,4 N/mm² bei Vollholz, 0,5 N/mm² bei BSH).</div>
      </div>
      <div class="info-banner">
        Zug senkrecht zur Faser ist der kritischste Beanspruchungsfall im Holzbau
        und wird, wo möglich, konstruktiv vermieden.
      </div>
    </div>
  `,

  // ── Verbindungen → Mindestabstände ───────────────
  'holzbau/verbindungen/abstaende': () => `
    <div class="card">
      <div class="card-title">Mindestabstände stiftförmiger Verbindungsmittel</div>
      <div class="section-note">
        Damit ein Verbindungsmittel seine volle Tragfähigkeit erreicht und das Holz
        nicht aufspaltet, sind Mindestabstände einzuhalten. Sie werden als Vielfache
        des Durchmessers <b>d</b> angegeben und hängen vom Winkel α zwischen Kraft und Faser ab.
      </div>
      ${figAbstaende()}
      <div class="formula-box">
        a<sub>1</sub> — untereinander ∥ Faser&nbsp;&nbsp;|&nbsp;&nbsp;a<sub>2</sub> — untereinander ⊥ Faser<br>
        a<sub>3,t</sub> / a<sub>3,c</sub> — zum beanspruchten / unbeanspruchten Hirnholzende<br>
        a<sub>4,t</sub> / a<sub>4,c</sub> — zum beanspruchten / unbeanspruchten Rand
        <div class="comment">„beansprucht“ (t): Die Kraft drückt das Verbindungsmittel zum Ende bzw. Rand hin.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Stabdübel — EN 1995-1-1, Tab. 8.5</div>
      ${textTable(['Abstand','Winkel α','Mindestwert'], [
        ['a₁','0° … 360°','(3 + 2·|cos α|)·d'],
        ['a₂','0° … 360°','3·d'],
        ['a₃,t','−90° … 90°','max(7·d ; 80 mm)'],
        ['a₃,c','90° … 150° und 210° … 270°','max(a₃,t·|sin α| ; 3·d)'],
        ['a₃,c','150° … 210°','3·d'],
        ['a₄,t','0° … 180°','max((2 + 2·sin α)·d ; 3·d)'],
        ['a₄,c','180° … 360°','3·d'],
      ])}
    </div>

    <div class="card">
      <div class="card-title">Bolzen — EN 1995-1-1, Tab. 8.4</div>
      ${textTable(['Abstand','Winkel α','Mindestwert'], [
        ['a₁','0° … 360°','(4 + |cos α|)·d'],
        ['a₂','0° … 360°','4·d'],
        ['a₃,t','−90° … 90°','max(7·d ; 80 mm)'],
        ['a₃,c','90° … 150° und 210° … 270°','max((1 + 6·|sin α|)·d ; 4·d)'],
        ['a₃,c','150° … 210°','4·d'],
        ['a₄,t','0° … 180°','max((2 + 2·sin α)·d ; 3·d)'],
        ['a₄,c','180° … 360°','3·d'],
      ])}
      <div class="legend">Bolzen haben Lochspiel und brauchen deshalb größere Abstände als passgenaue Stabdübel.</div>
    </div>

    <div class="card">
      <div class="card-title">Nägel — EN 1995-1-1, Tab. 8.2</div>
      <div class="section-note"><b>Nicht vorgebohrt, ρ<sub>k</sub> ≤ 420 kg/m³</b></div>
      ${textTable(['Abstand','Bedingung','Mindestwert'], [
        ['a₁','d < 5 mm','(5 + 5·|cos α|)·d'],
        ['a₁','d ≥ 5 mm','(5 + 7·|cos α|)·d'],
        ['a₂','—','5·d'],
        ['a₃,t','—','(10 + 5·cos α)·d'],
        ['a₃,c','—','10·d'],
        ['a₄,t','d < 5 mm','(5 + 2·sin α)·d'],
        ['a₄,t','d ≥ 5 mm','(5 + 5·sin α)·d'],
        ['a₄,c','—','5·d'],
      ])}
      <div class="section-note" style="margin-top:10px"><b>Nicht vorgebohrt, 420 < ρ<sub>k</sub> ≤ 500 kg/m³</b></div>
      ${textTable(['Abstand','Bedingung','Mindestwert'], [
        ['a₁','—','(7 + 8·|cos α|)·d'],
        ['a₂','—','7·d'],
        ['a₃,t','—','(15 + 5·cos α)·d'],
        ['a₃,c','—','15·d'],
        ['a₄,t','d < 5 mm','(7 + 2·sin α)·d'],
        ['a₄,t','d ≥ 5 mm','(7 + 5·sin α)·d'],
        ['a₄,c','—','7·d'],
      ])}
      <div class="section-note" style="margin-top:10px"><b>Vorgebohrt</b></div>
      ${textTable(['Abstand','Bedingung','Mindestwert'], [
        ['a₁','—','(4 + |cos α|)·d'],
        ['a₂','—','(3 + |sin α|)·d'],
        ['a₃,t','—','(7 + 5·cos α)·d'],
        ['a₃,c','—','7·d'],
        ['a₄,t','d < 5 mm','(3 + 2·sin α)·d'],

        Vorbohren ist nach EN 1995-1-1 nötig, wenn ρ<sub>k</sub> > 500 kg/m³ oder d > 6 mm ist.

      </div>
    </div>
  `,

  // ── Verbindungen → Stabdübel & Bolzen ────────────
  'holzbau/verbindungen/stabduebel': () => `
    <div class="card">
      <div class="card-title">Tragfähigkeit auf Abscheren — Theorie nach Johansen</div>
      <div class="section-note">
        Die charakteristische Tragfähigkeit F<sub>v,Rk</sub> eines stiftförmigen
        Verbindungsmittels je Scherfuge ergibt sich aus dem kleinsten Wert mehrerer
        Versagensmechanismen (Fließgelenktheorie).
      </div>
      <div class="formula-box">
        Maßgebend ist der <b>kleinste</b> Wert aus:<br>
        — Lochleibungsversagen im Holz<br>
        — Lochleibung + 1 Fließgelenk im Stift<br>
        — Lochleibung + 2 Fließgelenke im Stift
        <div class="comment">Mechanismen mit Fließgelenken sind erwünscht: Sie sind duktil und
        kündigen das Versagen durch Verformung an.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Lochleibungsfestigkeit f_h,0,k</div>
      <div class="section-note">Für Stabdübel und Bolzen, Kraft ∥ Faser:</div>
      <div class="formula-box">
        f<sub>h,0,k</sub> = 0,082 · (1 − 0,01·d) · ρ<sub>k</sub>&nbsp;&nbsp;[N/mm²]
        <div class="comment">d — Durchmesser [mm] · ρ<sub>k</sub> — char. Rohdichte [kg/m³]</div>
      </div>
      <div class="section-note" style="margin-top:8px">Unter dem Winkel α zur Faser:</div>
      <div class="formula-box">
        f<sub>h,α,k</sub> = f<sub>h,0,k</sub> / (k<sub>90</sub>·sin²α + cos²α)
        <div class="comment">k<sub>90</sub> = 1,35 + 0,015·d (Nadelholz)</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Fließmoment M_y,Rk</div>
      <div class="formula-box">
        M<sub>y,Rk</sub> = 0,3 · f<sub>u,k</sub> · d<sup>2,6</sup>&nbsp;&nbsp;[Nmm]
        <div class="comment">f<sub>u,k</sub> — char. Zugfestigkeit des Stahlstifts
        (z. B. S235: 360 N/mm²)</div>
      </div>
      ${sizeSoon('→ Abscher-Nachweis führen')}
    </div>

    <div class="card">
      <div class="card-title">Übliche Durchmesser</div>
      <div class="section-note">
        Stabdübel: 6, 8, 10, 12, 16, 20, 24 mm — passgenau im vorgebohrten Loch.<br>
        Bolzen: 6, 8, 10, 12, 16, 20, 24, 30 mm — mit Lochspiel, Mutter und
        Unterlegscheibe.
      </div>
      <a class="applink" href="#/holzbau/verbindungen/abstaende">→ Mindestabstände</a>
    </div>
  `,

  // ── Verbindungen → Nägel ─────────────────────────
  'holzbau/verbindungen/naegel': () => `
    <div class="card">
      <div class="card-title">Nagelverbindungen — EN 1995-1-1, Abschn. 8.3</div>
      <div class="section-note">
        Nägel übertragen Kräfte überwiegend auf Abscheren. Maßgebend sind die
        Lochleibung im Holz, das Fließmoment des Nagels und bei axialer Last
        der Ausziehwiderstand.
      </div>
    </div>

    <div class="card">
      <div class="card-title">Lochleibungsfestigkeit</div>
      <div class="section-note">Nägel ohne Vorbohrung (d ≤ 8 mm):</div>

        f<sub>h,k</sub> = 0,082 · ρ<sub>k</sub> · d<sup>−0,3</sup>&nbsp;&nbsp;[N/mm²]

      </div>
    </div>

      <div class="legend">f_u — Zugfestigkeit des Nageldrahts, mindestens 600 N/mm²</div>
    </div>

    <div class="card">

      <div class="section-note">
        Die Einschlagtiefe t ist die Länge, mit der der Nagel im Holzteil mit der Spitze steckt.
        Für glattschaftige Nägel in Holz-Holz-Verbindungen gilt:
      </div>
      ${textTable(['Einschlagtiefe t','Tragfähigkeit der Scherfuge an der Spitze'], [
        ['t ≥ 9·d','voll'],
        ['4·d ≤ t < 9·d','abgemindert mit Faktor t / (9·d)'],
        ['t < 4·d','darf nicht in Rechnung gestellt werden'],
      ])}
      <div class="legend">Für Sondernägel (gerillt, profiliert) gelten die Werte aus der Zulassung bzw. ETA des Herstellers.</div>
    </div>

    <div class="card">
      <div class="card-title">Eindringtiefe bei Herausziehen — EN 1995-1-1, 8.3.2 (7)</div>
      ${textTable(['Nagelart','min. t_pen','voll ab','Faktor dazwischen'], [
        ['glattschaftig','8·d','12·d','t<sub>pen</sub>/(4·d) − 2'],
        ['Sondernagel','6·d','8·d','t<sub>pen</sub>/(2·d) − 3'],
      ])}
      <div class="legend">Unterhalb des Mindestwerts darf der Nagel keine Axialkraft übernehmen. Glattschaftige Nägel nicht für
        ständige oder langfristige Axiallasten verwenden.</div>
    </div>

    <div class="card">
      <div class="card-title">Mindestholzdicke ohne Vorbohren — EN 1995-1-1, 8.3.1.2 (6)</div>
      <div class="formula-box">
        t ≥ max { 7·d ;&nbsp; (13·d − 30) · ρ<sub>k</sub> / 400 }&nbsp;&nbsp; [mm]
        <div class="comment">ρ<sub>k</sub> in kg/m³ · Für spaltempfindliche Holzarten (z. B. Douglasie): t ≥ max { 14·d ; (13·d − 30) · ρ<sub>k</sub> / 200 }.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Einschlagtiefe prüfen</div>
      <div class="calc-grid">
        ${field('Nageldurchmesser d [mm]', inp('ng-d', 3.1, 'updateNagel()'))}
        ${field('Einschlagtiefe t [mm]', inp('ng-t', 25, 'updateNagel()'))}
        ${field('Nagelart', sel('ng-art', [['glatt','glattschaftig'],['sonder','Sondernagel']], 'glatt', 'updateNagel()'))}
        ${field('ρ<sub>k</sub> [kg/m³]', inp('ng-rho', 350, 'updateNagel()'))}
      </div>
      <div class="calc-out" id="ng-out"></div>
      <div class="info-banner">
        Glattschaftnägel haben einen geringen Ausziehwiderstand. Für axial

      </div>
      <a class="applink" href="#/holzbau/verbindungen/abstaende">→ Mindestabstände für Nägel</a>
    </div>
  `,

      ${textTable(['Ergebnis','Bedeutung'], [

      <div class="legend">Rechteck plastisch: W<sub>pl</sub> = b·h²/4 = 1,5·W<sub>el</sub>. Dreieck: Schwerpunkt bei h/3 über der Basis.</div>

        I<sub>y</sub> = Σ( I<sub>i</sub> + A<sub>i</sub>·(z<sub>i</sub> − z<sub>s</sub>)² )
        <div class="comment">I<sub>i</sub> — Eigenträgheitsmoment des Teils um seine eigene Schwerachse<br>

        I<sub>y</sub> = 200·20³/12 + 4000·47,4² + 20·180³/12 + 3600·52,6² ≈ <b>2880 cm⁴</b><br>
        W oben = 2880/5,74 ≈ 502 cm³ · W unten = 2880/14,26 ≈ 202 cm³

    </div>

  'stahlbau/profile/walzprofile': () => `
    <div class="card">

      <div class="chip-row">

        G = Masse je Meter (ρ = 7850 kg/m³) · A<sub>vz</sub> = Schubfläche für Querkraft in z (η = 1,0) · I<sub>t</sub> = Torsionsträgheitsmoment · I<sub>w</sub> = Wölbwiderstand.</div>
    </div>
    <div class="card">
      <div class="card-title">So werden die Werte berechnet</div>
      ${ablauf('', [
        '§Fläche und Trägheitsmomente (h<sub>w</sub> = h − 2t<sub>f</sub>)',
        '!A = 2 · b · t<sub>f</sub> + h<sub>w</sub> · t<sub>w</sub> + (4 − π) · r²',
        '!I<sub>y</sub> = [b · h³ − (b − t<sub>w</sub>) · h<sub>w</sub>³] / 12 + 0,03 · r⁴ + 0,2146 · r² · (h<sub>w</sub> − 0,4468 · r)²',
        '!I<sub>z</sub> = [2 · t<sub>f</sub> · b³ + h<sub>w</sub> · t<sub>w</sub>³] / 12 + 0,03 · r⁴ + 0,2146 · r² · (t<sub>w</sub> + 0,4468 · r)²',
        '§Plastische Widerstandsmomente',
        '!W<sub>pl,y</sub> = t<sub>w</sub> · h² / 4 + (b − t<sub>w</sub>) · (h − t<sub>f</sub>) · t<sub>f</sub> + (4 − π)/2 · r² · h<sub>w</sub> + (3π − 10)/3 · r³',
        '!W<sub>pl,z</sub> = b² · t<sub>f</sub> / 2 + h<sub>w</sub> · t<sub>w</sub>² / 4 + r³ · (10/3 − π) + (2 − π/2) · t<sub>w</sub> · r²',
        '§Schub, Torsion, Wölbung',
        '!A<sub>vz</sub> = A − 2 · b · t<sub>f</sub> + (t<sub>w</sub> + 2r) · t<sub>f</sub> ≥ η · h<sub>w</sub> · t<sub>w</sub>',
        '!I<sub>t</sub> = 2/3 · (b − 0,63 · t<sub>f</sub>) · t<sub>f</sub>³ + 1/3 · h<sub>w</sub> · t<sub>w</sub>³ + 2 · (t<sub>w</sub>/t<sub>f</sub>) · (0,145 + 0,1 · r/t<sub>f</sub>) · D⁴ mit D = [(r + t<sub>w</sub>/2)² + (r + t<sub>f</sub>)² − r²] / (2r + t<sub>f</sub>)',
        '!I<sub>w</sub> = t<sub>f</sub> · b³ · (h − t<sub>f</sub>)² / 24',
        '!W<sub>el</sub> = I / (Randabstand), i = √(I / A)'])}
    </div>

      <div class="legend">γ′ — Wichte unter Auftrieb (γ<sub>r</sub> − γ<sub>w</sub>, γ<sub>w</sub> = 10 kN/m³) · φ′ — wirksamer Reibungswinkel · c′ — wirksame Kohäsion</div>

      <div class="card-title">Nichtbindig und bindig</div>

        Setzungen treten fast sofort ein.<br>
        <b>Bindige Böden</b> (Schluff, Ton) haben Kohäsion, sind wasserempfindlich und setzen sich zeitverzögert

        sin α = g / c&nbsp;&nbsp;&nbsp; cos α = a / c&nbsp;&nbsp;&nbsp; tan α = g / a<br>

      </div>
      ${textTable(['α','0°','30°','45°','60°','90°'], [
        ['sin α','0','½','½·√2','½·√3','1'],

        ['tan α','0','⅓·√3','1','√3','—'],
      ])}
    </div>
    <div class="card">
      <div class="card-title">Beliebiges Dreieck</div>
      <div class="formula-box">

        Kosinussatz:&nbsp; c² = a² + b² − 2·a·b·cos γ<br>

  `,

        ${[1,2,3].map(i=>field(`Fläche ${i} [m²] / ψ`, `<div style="display:flex;gap:6px">${inp('rg-A'+i, [450,300,200][i-1], 'updateRegen()')}${inp('rg-p'+i, [0.9,0.75,0.15][i-1], 'updateRegen()')}</div>`)).join('')}
        ${field('Regenspende r<sub>D,T</sub> [l/(s·ha)]', inp('rg-r', 300, 'updateRegen()'))}
      </div>
      <div class="calc-out" id="rg-out"></div>
    </div>
  `,

  'wasserbau/hydrostatik/druck': () => `
    <div class="card">
      <div class="card-title">Hydrostatischer Druck</div>
      <div class="formula-box">
        p = ρ · g · h = γ<sub>w</sub> · h&nbsp;&nbsp;&nbsp; γ<sub>w</sub> = 9,81 kN/m³ ≈ 10 kN/m³
        <div class="comment">Der Druck wächst linear mit der Tiefe h unter dem Wasserspiegel und wirkt immer senkrecht auf die Fläche — unabhängig von deren Neigung.</div>
      </div>
      ${fig(skWDWand(),'Senkrechte Wand: Druckdreieck, Resultierende im Drittelpunkt über der Sohle.')}
      <div class="formula-box">
        Senkrechte Wand, Breite b:&nbsp; F = γ<sub>w</sub> · h² / 2 · b&nbsp;&nbsp;&nbsp; Angriff in h/3 über der Sohle<br>
        Moment am Wandfuß:&nbsp; M = F · h/3 = γ<sub>w</sub> · h³ / 6 · b
      </div>
      <div class="info-banner">Beispiel: h = 3,0 m, b = 1 m → F = 10 · 3,0²/2 = <b>45 kN/m</b>, M = 45 · 1,0 = <b>45 kNm/m</b> (mit γ<sub>w</sub> = 10 kN/m³).</div>
    </div>
    <div class="card">
      <div class="card-title">Geneigte Fläche — Druckkraft und Druckmittelpunkt</div>
      ${fig(skWDSchraeg(),'y wird in der Ebene der Fläche ab dem Wasserspiegel gemessen. Der Druckmittelpunkt D liegt immer tiefer als der Schwerpunkt S.')}
      <div class="formula-box">
        F = γ<sub>w</sub> · h<sub>s</sub> · A&nbsp;&nbsp;&nbsp; (h<sub>s</sub> — Tiefe des Flächenschwerpunkts)<br>
        y<sub>D</sub> = y<sub>s</sub> + I<sub>s</sub> / (y<sub>s</sub> · A)&nbsp;&nbsp;&nbsp; mit h<sub>s</sub> = y<sub>s</sub> · sin α
        <div class="comment">I<sub>s</sub> — Flächenträgheitsmoment um die waagerechte Schwerachse der Fläche (Rechteck: b·l³/12)</div>
      </div>
      <div class="info-banner">Beispiel: Schütz 1 × 2 m (l = 2 m in Neigungsrichtung), α = 60°, Oberkante bei y = 1,0 m.<br>
        y<sub>s</sub> = 2,0 m, h<sub>s</sub> = 2,0 · sin 60° = 1,73 m → F = 10 · 1,73 · 2,0 = <b>34,6 kN</b> · y<sub>D</sub> = 2,0 + (1·2³/12)/(2,0·2,0) = <b>2,17 m</b></div>
      <a class="applink" href="size.html">→ Wasserdruck mit Gegendruck in statiq·size (Wasserbau)</a>
    </div>
  `,

  'wasserbau/hydrostatik/gekruemmt': () => `
    <div class="card">
      <div class="card-title">Gekrümmte Flächen — Zerlegen in Komponenten</div>
      ${fig(skWDGekruemmt(),'Segmentschütz (Viertelkreis): F<sub>H</sub> aus der senkrechten Projektion, F<sub>V</sub> aus dem Wasservolumen V<sub>W</sub> über der Fläche.')}
      <div class="formula-box">
        F<sub>H</sub> = γ<sub>w</sub> · h<sub>s,proj</sub> · A<sub>proj</sub>&nbsp;&nbsp;&nbsp; (wie bei einer senkrechten Wand mit der Projektionsfläche)<br>
        F<sub>V</sub> = γ<sub>w</sub> · V<sub>W</sub>&nbsp;&nbsp;&nbsp; (Gewicht des — wirklichen oder gedachten — Wasserkörpers zwischen Fläche und Wasserspiegel)<br>
        F = √(F<sub>H</sub>² + F<sub>V</sub>²)
        <div class="comment">Bei Kreisflächen gehen alle Druckkräfte durch den Mittelpunkt — die Resultierende also auch. Liegt das Wasser unter der Fläche, wirkt F<sub>V</sub> nach oben.</div>
      </div>
      <div class="info-banner">Beispiel Viertelkreis r = h = 2,0 m, Breite 1 m:<br>
        F<sub>H</sub> = 10 · 2,0²/2 = <b>20 kN</b> · V<sub>W</sub> = π·r²/4 = 3,14 m³ (Viertelkreis über der Fläche) → F<sub>V</sub> = <b>31,4 kN</b> (nach oben) · F = <b>37,2 kN</b></div>
    </div>
  `,

  'wasserbau/hydrostatik/auftrieb': () => `
    <div class="card">
      <div class="card-title">Auftrieb (Archimedes)</div>
      <div class="formula-box">
        F<sub>A</sub> = γ<sub>w</sub> · V<sub>verdrängt</sub>&nbsp;&nbsp;&nbsp; Schwimmen: F<sub>A</sub> = G
        <div class="comment">Die Auftriebskraft greift im Schwerpunkt B des verdrängten Wasservolumens an.</div>
      </div>
      ${fig(skSchwimm(),'G — Schwerpunkt des Körpers, B — Verdrängungsschwerpunkt, M — Metazentrum, h<sub>M</sub> — metazentrische Höhe.')}
      <div class="formula-box">
        Tiefgang Ponton L × B:&nbsp; t = G / (γ<sub>w</sub> · L · B)<br>
        h<sub>M</sub> = I / V − e&nbsp;&nbsp;&nbsp; (e = Abstand G über B)<br>
        stabil, wenn h<sub>M</sub> > 0 (M liegt über G)
        <div class="comment">I — Flächenträgheitsmoment der Wasserlinienfläche um die Längsachse (Rechteck: L·B³/12), V — verdrängtes Volumen</div>
      </div>
      <div class="info-banner">Beispiel: Ponton 10 × 6 m, t = 0,80 m, G in 1,20 m Höhe.<br>
        V = 48 m³ · I = 10·6³/12 = 180 m⁴ · I/V = 3,75 m · e = 1,20 − 0,40 = 0,80 m → h<sub>M</sub> = <b>2,95 m</b> > 0 → stabil</div>
      <a class="applink" href="#/grundbau/flach/sohldruck">→ Auftrieb bei Bauwerken: Nachweis UPL in statiq·size (Grundbau)</a>
    </div>
  `,

  'wasserbau/hydrodynamik/bernoulli': () => `
    <div class="card">
      <div class="card-title">Kontinuität</div>
      <div class="formula-box">Q = v · A = konst.&nbsp;&nbsp;&nbsp; v<sub>1</sub> · A<sub>1</sub> = v<sub>2</sub> · A<sub>2</sub>
        <div class="comment">Wird der Querschnitt kleiner, wird das Wasser schneller.</div></div>
    </div>
    <div class="card">
      <div class="card-title">Bernoulli-Gleichung (Energiehöhe)</div>
      ${fig(skBernoulli(),'EL — Energielinie (ohne Verluste waagerecht), DL — Drucklinie. In der Engstelle steigt v, der Druck sinkt.')}
      <div class="formula-box">
        H = z + p/(ρ·g) + v²/(2g) = konst.&nbsp;&nbsp;&nbsp; (ohne Verluste)<br>
        mit Verlusten:&nbsp; z<sub>1</sub> + p<sub>1</sub>/(ρg) + v<sub>1</sub>²/(2g) = z<sub>2</sub> + p<sub>2</sub>/(ρg) + v<sub>2</sub>²/(2g) + h<sub>v</sub>
        <div class="comment">z — Lagehöhe · p/(ρg) — Druckhöhe · v²/(2g) — Geschwindigkeitshöhe, alle in m</div>
      </div>
      ${textTable(['v [m/s]','0,5','1,0','2,0','3,0','5,0'], [['v²/(2g) [m]','0,013','0,051','0,204','0,459','1,274']])}
    </div>
  `,

  'wasserbau/hydrodynamik/rohr': () => `
    <div class="card">
      <div class="card-title">Reibungsverlust (Darcy-Weisbach)</div>
      ${fig(skRohrleitung(),'Zwischen zwei Behältern fällt die Energielinie um den Höhenunterschied Δh: Einlaufverlust, Reibung entlang der Leitung, Auslaufverlust.')}
      <div class="formula-box">
        h<sub>v,R</sub> = λ · L/d · v²/(2g)&nbsp;&nbsp;&nbsp; Re = v · d / ν&nbsp;&nbsp; (ν ≈ 1,31·10⁻⁶ m²/s bei 10 °C, siehe Stoffwerte)<br>
        laminar (Re < 2320):&nbsp; λ = 64 / Re<br>
        turbulent (Colebrook-White):&nbsp; 1/√λ = −2 · lg( 2,51/(Re·√λ) + k/(3,71·d) )<br>
        örtliche Verluste:&nbsp; h<sub>v,ö</sub> = Σζ · v²/(2g)
      </div>
      <div class="sk-row">
      ${textTable(['Rohrwerkstoff','k [mm]'], [['PE, PVC','0,007 – 0,05'],['Stahl, neu','0,05 – 0,1'],['Guss, bitumiert','0,1 – 0,25'],['Beton, glatt','0,3 – 1,0'],['Beton, rau / alt','1 – 3']])}
      ${textTable(['Formstück','ζ'], [['Einlauf scharfkantig','0,5'],['Einlauf gut gerundet','0,05 – 0,25'],['Auslauf ins Becken','1,0'],['Krümmer 90° (r/d = 1 … 4)','0,2 – 0,5'],['Kniestück 90° scharf','1,0 – 1,3'],['Krümmer 45°','0,1 – 0,3'],['T-Stück Abzweig','1,0 – 1,5'],['T-Stück Durchgang','0,1 – 0,4'],['Erweiterung plötzlich','(1 − A₁/A₂)²'],['Verengung plötzlich','≈ 0,5 · (1 − A₂/A₁)'],['Absperrschieber offen','0,1 – 0,3'],['Absperrklappe offen','0,2 – 0,6'],['Rückschlagklappe','0,8 – 2,0'],['Saugkorb mit Fußventil','2 – 3']])}
      </div>
      <div class="legend">Anhaltswerte aus der Literatur — im Projekt die Herstellerangaben verwenden.</div>
    </div>
    <div class="card">
      <div class="card-title">Rohrleitung berechnen</div>
      <div class="calc-grid">
        ${field('Durchfluss Q [l/s]', inp('wbr-Q', 50, 'updateRohrR()'))}
        ${field('Innendurchmesser d [mm]', inp('wbr-d', 200, 'updateRohrR()'))}
        ${field('Länge L [m]', inp('wbr-L', 500, 'updateRohrR()'))}
        ${field('Rauheit k [mm]', inp('wbr-k', 0.1, 'updateRohrR()'))}
        ${field('Wassertemperatur T [°C]', inp('wbr-T', 10, 'updateRohrR()'))}
        ${field('Summe Verlustbeiwerte Σζ', inp('wbr-z', 1.5, 'updateRohrR()'))}
      </div>
      <div class="calc-out" id="wbr-out"></div>
      <div id="wbr-fig"></div>
      <a class="applink" href="size.html">→ Mit Energie- und Drucklinie in statiq·size (Wasserbau → Rohr)</a>
    </div>
  `,

  'wasserbau/hydrodynamik/ausfluss': () => `
    <div class="card">
      <div class="card-title">Ausfluss aus einer Öffnung (Torricelli)</div>
      ${fig(skAusfluss(),'Ausfluss unter dem Wasserspiegel: Geschwindigkeit wie im freien Fall aus der Höhe h.')}

        v = √(2·g·h)&nbsp;&nbsp;&nbsp; Q = μ · A · √(2·g·h)

  'wasserbau/gerinne/normalabfluss': () => `
    <div class="card">
      <div class="card-title">Fließformel nach Gauckler-Manning-Strickler</div>
      ${fig(skGerinneQS(),'Benetzter Querschnitt A und benetzter Umfang U (blau, ohne Wasserspiegel), Böschungsneigung 1 : m.')}
      <div class="formula-box">
        v = k<sub>St</sub> · R<sup>2/3</sup> · I<sup>1/2</sup>&nbsp;&nbsp;&nbsp; Q = v · A&nbsp;&nbsp;&nbsp; R = A / U<br>

  'wasserbau/gerinne/energie': () => `

  'mathematik/geometrie/dreiecke': () => `
    <div class="card">
      <div class="card-title">Rechtwinkliges Dreieck — Pythagoras, Höhen- und Kathetensatz</div>
      <div class="sk-row">${fig(skPythagoras(),'Die Flächen der Quadrate über den Katheten ergeben zusammen das Quadrat über der Hypotenuse.')}${fig(skHoehensatz(),'Die Höhe h teilt die Hypotenuse c in die Abschnitte p (unter a) und q (unter b).')}</div>
      <div class="formula-box">
        Pythagoras:&nbsp; a² + b² = c²&nbsp;&nbsp;&nbsp; c = √(a² + b²)<br>
        Höhensatz:&nbsp; h² = p · q<br>
        Kathetensatz:&nbsp; a² = c · p&nbsp;&nbsp;&nbsp; b² = c · q<br>
        Fläche:&nbsp; A = a · b / 2 = c · h / 2
      </div>
      <div class="info-banner">Baustelle: Ein rechter Winkel lässt sich mit dem Maßband abstecken — 3 m, 4 m und 5 m bilden ein rechtwinkliges Dreieck (3² + 4² = 9 + 16 = 25 = 5²).</div>
    </div>
    <div class="card">
      <div class="card-title">Besondere Dreiecke</div>
      ${shapeGrid([
        shapeCard(skGleichseitig(),'Gleichseitiges Dreieck',[['h','a·√3/2 ≈ 0,866·a'],['A','a²·√3/4 ≈ 0,433·a²'],['Winkel','je 60°'],['S','h/3 über der Seite']]),
        shapeCard(skGleichschenklig(),'Gleichschenkliges Dreieck',[['h<sub>c</sub>','√(a² − c²/4)'],['A','c · h<sub>c</sub> / 2'],['β','(180° − γ)/2'],['c','2 · a · sin(γ/2)']]),

      <div class="legend">In jedem Dreieck gilt die Winkelsumme α + β + γ = 180°. Gleich lange Seiten sind mit einem Strich markiert.</div>

    <div class="card">
      <div class="card-title">Strahlensatz</div>
      ${fig(skStrahlensatz(),'Zwei Strahlen von Z werden von zwei parallelen Geraden geschnitten.')}
      <div class="formula-box">
        ZA : ZA′ = ZB : ZB′&nbsp;&nbsp;&nbsp; (1. Strahlensatz)<br>
        AB : A′B′ = ZA : ZA′&nbsp;&nbsp;&nbsp; (2. Strahlensatz)
      </div>
      <div class="info-banner">Anwendung: Höhe eines Pultdachs an einer Zwischenstelle. Firsthöhe 3,0 m über 6,0 m Länge → in 2,0 m Abstand vom Tiefpunkt: 3,0 · 2,0/6,0 = <b>1,0 m</b>.</div>

  'mathematik/geometrie/kreis': () => `
    <div class="card">
      <div class="card-title">Kreisbogen, Sehne und Stichhöhe</div>
      ${fig(skKreisteile(),'Zentriwinkel φ, Radius r, Bogen b (orange), Sehne s (blau), Stichhöhe h (grün), Kreisabschnitt hellblau.')}
      <div class="formula-box">
        Bogenlänge:&nbsp; b = r · φ&nbsp;&nbsp; (φ im Bogenmaß)<br>
        Sehne:&nbsp; s = 2 · r · sin(φ/2)<br>
        Stichhöhe:&nbsp; h = r · (1 − cos(φ/2))<br>
        Radius aus Sehne und Stich:&nbsp; r = s²/(8·h) + h/2<br>
        Kreisausschnitt:&nbsp; A = r² · φ / 2&nbsp;&nbsp;&nbsp; Kreisabschnitt:&nbsp; A = r²/2 · (φ − sin φ)

  'mathematik/algebra/gleichungen': () => `
    <div class="card">
      <div class="card-title">Quadratische Gleichungen</div>
      <div class="formula-box">
        a·x² + b·x + c = 0&nbsp; →&nbsp; x₁,₂ = ( −b ± √(b² − 4ac) ) / (2a)<br>
        x² + p·x + q = 0&nbsp; →&nbsp; x₁,₂ = −p/2 ± √( (p/2)² − q )
      </div>
    </div>
    <div class="card">
      <div class="card-title">Lineare Gleichungssysteme</div>
      <div class="formula-box">
        2×2 (Cramer):&nbsp; a₁x + b₁y = c₁, a₂x + b₂y = c₂<br>
        D = a₁b₂ − a₂b₁,&nbsp; x = (c₁b₂ − c₂b₁)/D,&nbsp; y = (a₁c₂ − a₂c₁)/D
        <div class="comment">D = 0: keine oder unendlich viele Lösungen (in der Statik: verschiebliches System)</div>
      </div>
      <div class="section-note"><b>Gauß-Verfahren</b> für größere Systeme: Gleichungen so kombinieren, dass
        unterhalb der Diagonale Nullen entstehen (Dreiecksform), dann von unten nach oben rückwärts einsetzen.
        So löst auch statiq·calc die Steifigkeitsgleichung K·u = F.</div>
      <div class="formula-box">
        Determinante 3×3 (Sarrus):<br>
        det = a₁₁a₂₂a₃₃ + a₁₂a₂₃a₃₁ + a₁₃a₂₁a₃₂ − a₁₃a₂₂a₃₁ − a₁₁a₂₃a₃₂ − a₁₂a₂₁a₃₃

    </div>

      <div class="card-title">Beispiel 1: quadratische Gleichung</div>
      ${(()=>{ const r=quadBeispiel(); return fig(skParabel(r),'f(x) = x² + p·x + q: Die Nullstellen sind die Schnittpunkte mit der x-Achse, der Scheitel liegt bei x = −p/2.')+r.html; })()}

    </div>
    <div class="card">
      <div class="card-title">Beispiel 3: Gauß-Verfahren 3 × 3 (eigene Werte möglich)</div>

      <div class="calc-out" id="gs-out"></div>
    </div>
  `,

  'grundbau/flach/sohlwiderstand': () => `
