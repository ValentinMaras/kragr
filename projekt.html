<script data-mod>
// Modulnamen (seit 26.10.2026; „Rechenblätter“ statt „Projekte“ seit 27.10.2026): sichtbar „Schnittkräfte · Bemessung · Wissen · Rechenblätter“ statt calc · size · ref · Projekte.
// Dateinamen (calc.html …) und gespeicherte Daten bleiben. kmod('calc') liefert den Namen in der Sprache der Seite; Elemente mit
// data-mod="calc|size|ref|proj" bekommen ihn als Text.
(function(){
  var K={ de:{calc:'Schnittkräfte', size:'Bemessung', ref:'Wissen', proj:'Rechenblätter'}, en:{calc:'Internal forces', size:'Design', ref:'Reference', proj:'Calculation sheets'},
          fr:{calc:'Efforts', size:'Dimensionnement', ref:'Référence', proj:'Notes de calcul'}, es:{calc:'Esfuerzos', size:'Dimensionado', ref:'Referencia', proj:'Memorias de cálculo'} };
  function lang(){ try{ if(typeof calcLang!=='undefined' && calcLang) return calcLang; }catch(e){} try{ if(typeof LANG!=='undefined' && LANG) return LANG; }catch(e){}
    try{ return localStorage.getItem('statiq-lang') || 'de'; }catch(e){ return 'de'; } }
  window.KMOD=K; window.kmodLang=lang;
  window.kmod=function(m, L){ var d=K[L||lang()]||K.de; return d[m] || m; };
  window.kmodApply=function(){ if(typeof document==='undefined') return; document.querySelectorAll('[data-mod]').forEach(function(e){ var v=window.kmod(e.getAttribute('data-mod')); if(e.textContent!==v) e.textContent=v; });
    var pg=document.documentElement.getAttribute('data-kpage'); if(pg) document.title=window.kmod(pg)+' — kragr'; };
  if(typeof document!=='undefined' && document.addEventListener) document.addEventListener('DOMContentLoaded', window.kmodApply);
})();

    <span class="proj-btn cur" aria-current="page"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M2.6 5.6c0-.9.7-1.6 1.6-1.6h3.4l1.7 1.9h6.5c.9 0 1.6.7 1.6 1.6v7.4c0 .9-.7 1.6-1.6 1.6H4.2c-.9 0-1.6-.7-1.6-1.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="pb-tx" data-mod="proj">Rechenblätter</span></span>

  </div>
</header>

<div class="wrap k-frame">
  <div class="top">
    <div><h1 class="ptitle" data-mod="proj">Rechenblätter</h1><div class="sumline" id="sum"></div></div>
    <div class="acts">
      <button class="btn q" onclick="exportFile()" data-t="export">Alle als Datei sichern</button>
      <label class="btn q"><span data-t="import">Datei laden</span><input type="file" accept=".json,.statiq,.muly,.kragr,application/json" style="display:none" onchange="importFile(this)"></label>
    </div>
  </div>
  <div class="filt" id="filt" role="group"></div>
  <div class="list" id="list"></div>

</div>

<div id="report-view">
  <div class="rep-acts"><button class="btn" onclick="hideReport()" data-t="back">← Zurück</button><span class="rep-title" id="rep-title"></span><button class="btn p" onclick="window.print()" data-t="print">Drucken / PDF</button></div>
  <div class="report" id="report"></div>
</div>

<script>
const PROJ_VERSION = '0.1.25';
const LANG = (()=>{ try{ return localStorage.getItem('statiq-lang') || 'de'; }catch(e){ return 'de'; } })();
const T = {
 de:{ addChk:'＋ Nachweis', withForces:'Mit den Schnittkräften dieses Systems:', z_riegel:'Riegel', z_stiel:'Stiel (der stärker gedrückte)', kn_node:'Knoten', kn_eL:'Ecke links', kn_eR:'Ecke rechts', kn_first:'First', kn_sup:'Auflager', kn_weld:'Stahl · Schweißnaht am Stab {0} ({1})', kn_fuss:'Stahl · Stützenfuß am Stab {0}', kn_col:'Stütze', kn_raf:'Riegel', n1:'1 Rechenblatt', n:'{0} Rechenblätter', all:'Alle', report:'Bericht', open:'Öffnen', more:'Weitere Aktionen', rename:'Umbenennen', toSize:'In „{0}“ übernehmen',
  del:'Löschen', delAsk:'Wirklich löschen?', deleted:'„{0}“ gelöscht.', export:'Alle als Datei sichern', import:'Datei laden', exported:'Datei gespeichert.', imported:'{0} Rechenblätter geladen.',
  badFile:'Diese Datei ist keine kragr-Datei.', back:'← Zurück', print:'Drucken / PDF', ok:'erfüllt', notOk:'nicht erfüllt', noDraft:'älterer Stand: nur Bericht',
  noRep:'Für dieses Rechenblatt ist kein Bericht gespeichert. In „{0}“ öffnen und erneut speichern.',
  none:'<b>Noch keine Rechenblätter.</b><br>Rechne in „{0}“ oder „{1}“ und wähle unter den Ergebnissen <b>„Als Rechenblatt speichern“</b>. Hier kannst du es danach als Bericht ansehen, als PDF drucken oder wieder öffnen.',
  noneF:'In dieser Auswahl gibt es noch keine Rechenblätter.',
  hint:'Rechenblätter liegen nur in diesem Browser. Zum Sichern oder für ein anderes Gerät: „Alle als Datei sichern“ und dort „Datei laden“.',
  types:{ beam:'Einfeldträger', cantilever:'Kragarm', cont:'Durchlaufträger', frame:'Rahmen' } },
 en:{ addChk:'＋ Check', withForces:'With the internal forces of this system:', z_riegel:'Rafter', z_stiel:'Column (the more compressed one)', kn_node:'Node', kn_eL:'left corner', kn_eR:'right corner', kn_first:'ridge', kn_sup:'Support', kn_weld:'Steel · Weld at member {0} ({1})', kn_fuss:'Steel · Column base at member {0}', kn_col:'column', kn_raf:'rafter', n1:'1 calculation sheet', n:'{0} calculation sheets', all:'All', report:'Report', open:'Open', more:'More actions', rename:'Rename', toSize:'Use in “{0}”',
  del:'Delete', delAsk:'Really delete?', deleted:'“{0}” deleted.', export:'Save all to file', import:'Load file', exported:'File saved.', imported:'{0} calculation sheets loaded.',
  badFile:'This file is not a kragr file.', back:'← Back', print:'Print / PDF', ok:'satisfied', notOk:'not satisfied', noDraft:'older version: report only',
  noRep:'No report is stored for this sheet. Open it in “{0}” and save again.',
  none:'<b>No calculation sheets yet.</b><br>Calculate in “{0}” or “{1}” and choose <b>“Save as calculation sheet”</b> below the results. Here you can then view it as a report, print it as a PDF or open it again.',
  noneF:'No calculation sheets in this selection yet.',
  hint:'Calculation sheets are stored in this browser only. To back them up or move them to another device: “Save all to file”, then “Load file” there.',
  types:{ beam:'Simply supported beam', cantilever:'Cantilever', cont:'Continuous beam', frame:'Frame' } },
 fr:{ addChk:'＋ Vérification', withForces:'Avec les efforts internes de ce système :', z_riegel:'Traverse', z_stiel:'Montant (le plus comprimé)', kn_node:'Nœud', kn_eL:'angle gauche', kn_eR:'angle droit', kn_first:'faîtage', kn_sup:'Appui', kn_weld:'Acier · Soudure sur la barre {0} ({1})', kn_fuss:'Acier · Pied de poteau, barre {0}', kn_col:'poteau', kn_raf:'traverse', n1:'1 note de calcul', n:'{0} notes de calcul', all:'Toutes', report:'Rapport', open:'Ouvrir', more:'Autres actions', rename:'Renommer', toSize:'Reprendre dans « {0} »',
  del:'Supprimer', delAsk:'Vraiment supprimer ?', deleted:'« {0} » supprimée.', export:'Tout enregistrer dans un fichier', import:'Charger un fichier', exported:'Fichier enregistré.', imported:'{0} notes de calcul chargées.',
  badFile:'Ce fichier n’est pas un fichier kragr.', back:'← Retour', print:'Imprimer / PDF', ok:'vérifiée', notOk:'non vérifiée', noDraft:'ancienne version : rapport seulement',
  noRep:'Aucun rapport enregistré pour cette note. L’ouvrir dans « {0} » et l’enregistrer à nouveau.',
  none:'<b>Pas encore de notes de calcul.</b><br>Calculer dans « {0} » ou « {1} » et choisir <b>« Enregistrer comme note de calcul »</b> sous les résultats. Ici, on peut ensuite la voir comme rapport, l’imprimer en PDF ou la rouvrir.',
  noneF:'Pas encore de notes de calcul dans cette sélection.',
  hint:'Les notes de calcul sont stockées uniquement dans ce navigateur. Pour les sauvegarder ou les utiliser sur un autre appareil : « Tout enregistrer dans un fichier », puis « Charger un fichier » sur l’autre appareil.',
  types:{ beam:'Poutre sur deux appuis', cantilever:'Console', cont:'Poutre continue', frame:'Portique' } },
 es:{ addChk:'＋ Comprobación', withForces:'Con los esfuerzos de este sistema:', z_riegel:'Dintel', z_stiel:'Pilar (el más comprimido)', kn_node:'Nudo', kn_eL:'esquina izquierda', kn_eR:'esquina derecha', kn_first:'cumbrera', kn_sup:'Apoyo', kn_weld:'Acero · Soldadura en la barra {0} ({1})', kn_fuss:'Acero · Placa base, barra {0}', kn_col:'pilar', kn_raf:'dintel', n1:'1 memoria de cálculo', n:'{0} memorias de cálculo', all:'Todas', report:'Informe', open:'Abrir', more:'Más acciones', rename:'Renombrar', toSize:'Usar en «{0}»',
  del:'Eliminar', delAsk:'¿Eliminar de verdad?', deleted:'«{0}» eliminada.', export:'Guardar todo en un archivo', import:'Cargar archivo', exported:'Archivo guardado.', imported:'{0} memorias de cálculo cargadas.',
  badFile:'El archivo no es un archivo de kragr.', back:'← Volver', print:'Imprimir / PDF', ok:'cumple', notOk:'no cumple', noDraft:'versión antigua: solo informe',
  noRep:'No hay informe guardado para esta memoria. Abrirla en «{0}» y guardarla de nuevo.',
  none:'<b>Aún no hay memorias de cálculo.</b><br>Calcula en «{0}» o «{1}» y elige <b>«Guardar como memoria de cálculo»</b> debajo de los resultados. Aquí podrás verla como informe, imprimirla en PDF o volver a abrirla.',
  noneF:'Aún no hay memorias de cálculo en esta selección.',
  hint:'Las memorias de cálculo se guardan solo en este navegador. Para hacer una copia o usarlas en otro dispositivo: «Guardar todo en un archivo» y allí «Cargar archivo».',
  types:{ beam:'Viga biapoyada', cantilever:'Voladizo', cont:'Viga continua', frame:'Pórtico' } } };
const t = (k, ...a) => String(((T[LANG]||T.de)[k] ?? T.de[k] ?? k)).replace(/\{(\d+)\}/g, (_,i)=>a[+i]);
const tTyp = k => ((T[LANG]||T.de).types||T.de.types)[k] || k;
const M = m => (typeof kmod==='function' ? kmod(m, LANG) : m);
const LOC = ({ de:'de-DE', en:'en-GB', fr:'fr-FR', es:'es-ES' })[LANG] || 'de-DE';
const nf = (v,d=1) => { const s=(+v).toFixed(d); return LANG==='en' ? s : s.replace('.', ','); };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const dShort = iso => { try{ return new Date(iso).toLocaleString(LOC, {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); }catch(e){ return ''; } };

// ── Speicher (Schlüssel wie bisher) ──────────────
// calc: statiq_sdf_<Zeit> = {name, sdf, draft?}; size: statiq-size-positionen (Liste) + Bericht statiq-size-bericht:<Name>.
// Was zu einer früheren Projekt-Position gehörte (statiq_sdf_pos_*, size-Einträge mit Zuordnung), wird nicht gezeigt (Entscheidung Valentin: verwerfen).
const POS_STORE='statiq-size-positionen', REP='statiq-size-bericht:', FILT='kragr-blatt-filter';
const lsGet = (k, d) => { try{ const v=localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
function oldAsg(){ const p=lsGet('statiq-projekt', null); return (p && p.asg) || {}; }
function calcItems(){ const out=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k || !k.startsWith('statiq_sdf_') || k.startsWith('statiq_sdf_pos_')) continue;
    const o=lsGet(k, null); if(!o || !o.sdf || (o.sdf.module && o.sdf.module!=='calc')) continue; out.push({ kind:'c', id:'c:'+k, key:k, name:o.name||k, o, ts:o.sdf.timestamp||'' }); } }catch(e){}
  return out; }
function sizeItems(){ const A=oldAsg();
  return (lsGet(POS_STORE, [])||[]).filter(p=>A['s:'+p.name]==null && !(p.src && String(p.src.key||'').startsWith('statiq_sdf_pos_')))
    .map(p=>({ kind:'s', id:'s:'+p.name, name:p.name, p, ts:p.date||'' })); }
function allItems(){ return [...calcItems(), ...sizeItems()].sort((a,b)=>a.ts<b.ts?1:a.ts>b.ts?-1:0); }

// Nachweise, die die Schnittkräfte eines Systems sinnvoll übernehmen (aus „Projekte“ übernommen, projekt v0.1.24: Ziel über size.html#calc=…): je System [Ziel, Bauteil des Rahmens]
const ZL = {
  de:{ 'beton.balken':'Stahlbeton · Balken', 'beton.unterzug':'Stahlbeton · Unterzug (Plattenbalken)', 'beton.platte':'Stahlbeton · Platte (je m Breite)', 'stahl.traeger':'Stahl · Träger', 'holz.bauteil':'Holz · Träger', 'beton.stuetze':'Stahlbeton · Stütze (Knicken)', 'stahl.stuetze':'Stahl · Stütze (Biegeknicken)', 'holz.stuetze':'Holz · Stütze (Knicken)', 'stahl.fuss':'Stahl · Stützenfuß', 'stahl.schweiss':'Stahl · Schweißnaht (Anschluss an Stirnplatte)' },
  en:{ 'beton.balken':'Reinforced concrete · Beam', 'beton.unterzug':'Reinforced concrete · Downstand beam (T-beam)', 'beton.platte':'Reinforced concrete · Slab (per m width)', 'stahl.traeger':'Steel · Beam', 'holz.bauteil':'Timber · Beam', 'beton.stuetze':'Reinforced concrete · Column (buckling)', 'stahl.stuetze':'Steel · Column (flexural buckling)', 'holz.stuetze':'Timber · Column (buckling)', 'stahl.fuss':'Steel · Column base', 'stahl.schweiss':'Steel · Weld (connection to end plate)' },
  fr:{ 'beton.balken':'Béton armé · Poutre', 'beton.unterzug':'Béton armé · Poutre en T (retombée)', 'beton.platte':'Béton armé · Dalle (par m de largeur)', 'stahl.traeger':'Acier · Poutre', 'holz.bauteil':'Bois · Poutre', 'beton.stuetze':'Béton armé · Poteau (flambement)', 'stahl.stuetze':'Acier · Poteau (flambement)', 'holz.stuetze':'Bois · Poteau (flambement)', 'stahl.fuss':'Acier · Pied de poteau', 'stahl.schweiss':'Acier · Soudure (assemblage sur platine)' },
  es:{ 'beton.balken':'Hormigón armado · Viga', 'beton.unterzug':'Hormigón armado · Viga en T (descolgada)', 'beton.platte':'Hormigón armado · Losa (por m de ancho)', 'stahl.traeger':'Acero · Viga', 'holz.bauteil':'Madera · Viga', 'beton.stuetze':'Hormigón armado · Pilar (pandeo)', 'stahl.stuetze':'Acero · Pilar (pandeo)', 'holz.stuetze':'Madera · Pilar (pandeo)', 'stahl.fuss':'Acero · Placa base', 'stahl.schweiss':'Acero · Soldadura (unión a placa de testa)' } };
const zl = k => (ZL[LANG]||ZL.de)[k] || ZL.de[k] || k;
const ZB = [['beton.balken','beton.balken'],['beton.unterzug','beton.unterzug'],['beton.platte','beton.platte'],['stahl.traeger','stahl.traeger'],['holz.bauteil','holz.bauteil']];
const ZIELE = { beam:[{items:ZB}], cont:[{items:ZB}], cantilever:[{items:[...ZB.filter(x=>x[0]!=='beton.unterzug'), ['stahl.schweiss','stahl.schweiss']]}],
  frame:[{head:'z_riegel', part:'riegel', items:[['beton.balken','beton.balken'],['beton.unterzug','beton.unterzug'],['stahl.traeger','stahl.traeger'],['holz.bauteil','holz.bauteil'],['stahl.schweiss','stahl.schweiss']]},
         {head:'z_stiel', part:'stiel', items:[['beton.stuetze','beton.stuetze'],['stahl.stuetze','stahl.traeger'],['holz.stuetze','holz.bauteil'],['stahl.fuss','stahl.fuss'],['stahl.schweiss','stahl.schweiss']]}] };
// Menü „＋ Nachweis“ einer Berechnung: passende Nachweise mit Übergabe der Schnittkräfte, beim Rahmen zusätzlich je Knoten die Stabenden
function chkMenu(it){ const S=it.o.sdf, sysT=S.system?.type, K=S.results?.knoten, base=`size.html#calc=${encodeURIComponent(it.key)}`;
  const u=(z,p,ik)=>base+`&ziel=${z}`+(p?`&part=${p}`:'')+(ik?`&ende=${ik}`:'');
  let kn=''; if(sysT==='frame' && K && K.nodes){ const pof=m=>m==='rafter'?'riegel':'stiel', nm=m=>t(m==='rafter'?'kn_raf':'kn_col');
    K.nodes.forEach(n=>{ const ends=[]; K.bars.forEach(b=>{ if(b.i===n.nr) ends.push([b.i,b.k,b.mem]); if(b.k===n.nr) ends.push([b.k,b.i,b.mem]); }); let items=[];
      if((n.kind==='ecke' || n.kind==='first') && !n.gelenk) items=ends.map(([i,k,m])=>`<a role="menuitem" href="${u('stahl.schweiss',pof(m),i+'-'+k)}">${esc(t('kn_weld', i+'–'+k, nm(m)))}</a>`);
      else if(n.kind==='sup' && (n.sup==='pin' || n.sup==='roller') && ends.length===1){ const [i,k,m]=ends[0]; if(m!=='rafter') items=[`<a role="menuitem" href="${u('stahl.fuss','stiel',i+'-'+k)}">${esc(t('kn_fuss', i+'–'+k))}</a>`]; }
      if(items.length) kn+=`<div class="morem-g">${t('kn_node')} ${n.nr} · ${esc(n.kind==='ecke' ? t(n.lab==='L'?'kn_eL':'kn_eR') : n.kind==='first' ? t('kn_first') : t('kn_sup')+' '+(n.lab||''))}</div>`+items.join(''); }); }
  const g=(ZIELE[sysT]||[]).map(x=>kn ? {...x, items:x.items.filter(z=>z[1]!=='stahl.schweiss' && z[1]!=='stahl.fuss')} : x);
  if(!g.length && !kn) return '';
  return `<div class="more chk"><button type="button" class="btn" aria-haspopup="menu" aria-expanded="false" onclick="menu(this)">${t('addChk')}</button><div class="morem" role="menu" hidden><div class="morem-h">${t('withForces')}</div>`
    + g.map(x=>(x.head?`<div class="morem-g">${t(x.head)}</div>`:'')+x.items.map(z=>`<a role="menuitem" href="${u(z[1], x.part)}">${esc(zl(z[0]))}</a>`).join('')).join('') + kn + `</div></div>`; }
// ── Liste ────────────────────────────────────────
let FIL=(()=>{ try{ return localStorage.getItem(FILT)||'all'; }catch(e){ return 'all'; } })(), armed=null;
const ICON_SIZE='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="4" x2="18" y2="4" stroke-width="2.4"/><line x1="6" y1="20" x2="18" y2="20" stroke-width="2.4"/><line x1="12" y1="4" x2="12" y2="20" stroke-width="2"/></svg>';
let _uid=0; function uniq(svg){ const p='b'+(++_uid)+'_'; return String(svg||'').replace(/id="([^"]+)"/g,(m,a)=>'id="'+p+a+'"').replace(/url\(#([^)]+)\)/g,(m,a)=>'url(#'+p+a+')').replace(/href="#([^"]+)"/g,(m,a)=>'href="#'+p+a+'"'); }
function card(it){
  const id=esc(it.id), A=`<button class="btn p" onclick="report('${id}')">${t('report')}</button>`;
  let fig, meta, res, open='', extra='';
  if(it.kind==='c'){ const s=it.o.sdf, r=s.results||{};
    fig = s.system?.svgSnapshot ? uniq(s.system.svgSnapshot) : '';
    meta = `<span class="tag">${esc(M('calc'))}</span><span>${esc(tTyp(s.system?.type))}</span><span>${dShort(it.ts)}</span>`;
    res = [r.Mmax!=null?`M<sub>max</sub> = ${nf(r.Mmax,2)} kNm`:'', r.Qmax!=null?`Q<sub>max</sub> = ${nf(r.Qmax,2)} kN`:''].filter(Boolean).join(' · ');
    open = it.o.draft ? `<a class="btn" href="calc.html#blatt=${encodeURIComponent(it.key)}">${t('open')}</a>` : `<span class="bl-meta">${t('noDraft')}</span>`;
    extra = chkMenu(it);
  } else { const p=it.p, eta=isFinite(p.eta) && p.eta!=null ? ` · η = ${Math.round(p.eta*100)} %` : '';
    fig = ICON_SIZE;
    meta = `<span class="tag size">${esc(M('size'))}</span><span>${esc(p.label||'')}</span><span>${dShort(it.ts)}</span>`;
    res = `<span class="tag ${p.ok?'s':'b'}">${t(p.ok?'ok':'notOk')}${eta}</span>`;
    open = `<a class="btn" href="size.html#blatt=${encodeURIComponent(p.name)}">${t('open')}</a>`; }
  return `<article class="bl" data-id="${id}"><div class="bl-fig">${fig}</div><div class="bl-main"><div class="bl-name">${esc(it.name)}</div><div class="bl-meta">${meta}</div><div class="bl-res">${res}</div>
    <div class="bl-acts">${A}${open}${it.kind==='c'?extra:''}<div class="more"><button class="btn more-b" aria-haspopup="true" aria-expanded="false" title="${esc(t('more'))}" aria-label="${esc(t('more'))}" onclick="menu(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    <div class="morem" hidden role="menu"><button onclick="renameStart('${id}')">${t('rename')}</button><button class="danger${armed===it.id?' armed':''}" onclick="del('${id}', this)">${t(armed===it.id?'delAsk':'del')}</button></div></div></div></div></article>`; }
function render(){
  const all=allItems(), nC=all.filter(x=>x.kind==='c').length, nS=all.length-nC;
  if(!['all','c','s'].includes(FIL)) FIL='all';
  document.getElementById('sum').textContent = all.length===1 ? t('n1') : t('n', all.length);
  const f=document.getElementById('filt');
  f.hidden = !all.length;
  f.innerHTML=[['all',t('all'),all.length],['c',M('calc'),nC],['s',M('size'),nS]].map(([k,l,n])=>`<button type="button" data-f="${k}" aria-pressed="${FIL===k}" onclick="setFil('${k}')">${esc(l)}<span class="n">${n}</span></button>`).join('');
  const L=all.filter(x=>FIL==='all' || x.kind===FIL);
  document.getElementById('list').innerHTML = !all.length
    ? `<div class="empty">${t('none', esc(M('calc')), esc(M('size')))}<div class="acts"><a class="btn p" href="calc.html">${esc(M('calc'))}</a><a class="btn" href="size.html">${esc(M('size'))}</a></div></div>`
    : L.length ? L.map(card).join('') : `<div class="empty">${t('noneF')}</div>`;
}
function setFil(k){ FIL=k; try{ localStorage.setItem(FILT, k); }catch(e){} render(); }
function byId(id){ return allItems().find(x=>x.id===id); }
function menu(b, open){ const m=b.nextElementSibling, o=open ?? (b.getAttribute('aria-expanded')!=='true');
  document.querySelectorAll('.more > button[aria-expanded="true"]').forEach(x=>{ if(x!==b){ x.setAttribute('aria-expanded','false'); x.nextElementSibling.hidden=true; } });
  b.setAttribute('aria-expanded', String(o)); m.hidden=!o; }
document.addEventListener('click', e=>{ if(!e.target.closest('.more')) document.querySelectorAll('.more > button[aria-expanded="true"]').forEach(b=>menu(b,false)); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ document.querySelectorAll('.more-b[aria-expanded="true"]').forEach(b=>{ menu(b,false); b.focus(); }); if(document.body.classList.contains('show-report')) hideReport(); } });

// ── Aktionen ─────────────────────────────────────
function del(id, btn){
  if(armed!==id){ armed=id; btn.textContent=t('delAsk'); btn.classList.add('armed'); setTimeout(()=>{ if(armed===id){ armed=null; render(); } }, 3000); return; }
  const it=byId(id); armed=null; if(!it) return;
  try{ if(it.kind==='c') localStorage.removeItem(it.key);
    else { lsSet(POS_STORE, (lsGet(POS_STORE, [])||[]).filter(p=>p.name!==it.name)); localStorage.removeItem(REP+it.name); } }catch(e){}
  render(); toast(t('deleted', it.name)); }
function renameStart(id){
  const el=document.querySelector(`.bl[data-id="${CSS.escape(id)}"] .bl-name`), it=byId(id); if(!el || !it) return;
  document.querySelectorAll('.more-b[aria-expanded="true"]').forEach(b=>menu(b,false));
  el.innerHTML=`<input value="${esc(it.name)}" aria-label="${esc(t('rename'))}" maxlength="80">`; const inp=el.firstChild; inp.focus(); inp.select();
  let done=false; const fin=ok=>{ if(done) return; done=true; const n=inp.value.trim(); if(ok && n && n!==it.name) rename(it, n); render(); };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); fin(true); } else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); fin(false); } });
  inp.addEventListener('blur', ()=>fin(true)); }
function rename(it, n){
  if(it.kind==='c'){ const o=lsGet(it.key, null); if(o){ o.name=n; lsSet(it.key, o); } return; }
  const L=lsGet(POS_STORE, [])||[]; let base=n, k=2; while(L.some(p=>p.name===n && p.name!==it.name)) n=base+' ('+(k++)+')';
  const p=L.find(x=>x.name===it.name); if(!p) return; const old=p.name; p.name=n;
  // Bezeichnung in den gespeicherten Eingaben mitziehen, damit „Öffnen“ und erneutes Speichern denselben Namen tragen
  if(p.data && typeof p.data==='object') (function walk(o){ Object.keys(o).forEach(k=>{ if(o[k]===old) o[k]=n; else if(o[k] && typeof o[k]==='object') walk(o[k]); }); })(p.data);
  lsSet(POS_STORE, L); try{ const r=localStorage.getItem(REP+old); if(r!=null){ localStorage.setItem(REP+n, r); localStorage.removeItem(REP+old); } }catch(e){} }
function report(id){ const it=byId(id); if(!it) return;
  if(it.kind==='c'){ location.href='calc.html#report='+encodeURIComponent(it.key); return; }
  let r=null; try{ r=localStorage.getItem(REP+it.name); }catch(e){}
  document.getElementById('rep-title').textContent=it.name;
  document.getElementById('report').innerHTML = (r || `<h3>${esc(it.name)}</h3><p class="meta">${t('noRep', esc(M('size')))}</p>`)
    + (typeof statiqDisclaimer==='function' ? '<div class="rep-disc" style="margin-top:18px;padding-top:8px;border-top:1px solid #ddd;font-size:10.5px;color:#666">'+statiqDisclaimer()+'</div>' : '');
  document.body.classList.add('show-report'); window.scrollTo(0,0); }
function hideReport(){ document.body.classList.remove('show-report'); }
function toast(m){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }

// ── Datei ────────────────────────────────────────
function exportFile(){
  const calc={}, reps={}, size=sizeItems().map(s=>s.p);
  calcItems().forEach(c=>calc[c.key]=c.o);
  size.forEach(p=>{ try{ const r=localStorage.getItem(REP+p.name); if(r) reps[p.name]=r; }catch(e){} });
  const data={ kragr:'rechenblaetter', version:PROJ_VERSION, saved:new Date().toISOString(), calc, size, reports:reps };
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
  a.download='kragr-rechenblaetter-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast(t('exported'));
}
function importData(d){
  // auch ältere Projektdateien (statiq:'projekt'): nur Berechnungen und Nachweise, keine Positionen
  if(!d || (d.kragr!=='rechenblaetter' && d.statiq!=='projekt')) { toast(t('badFile')); return 0; }
  let n=0; Object.entries(d.calc||{}).forEach(([k,v])=>{ if(String(k).startsWith('statiq_sdf_pos_')) return; if(v && v.sdf && lsSet(k, v)) n++; });
  const cur=lsGet(POS_STORE, [])||[]; (d.size||[]).forEach(s=>{ if(!s || !s.name) return; const i=cur.findIndex(x=>x.name===s.name); if(i>=0) cur[i]=s; else cur.push(s); n++; }); lsSet(POS_STORE, cur);
  Object.entries(d.reports||{}).forEach(([k,v])=>{ try{ localStorage.setItem(REP+k, v); }catch(e){} });
  render(); toast(t('imported', n)); return n;
}
function importFile(inp){ const f=inp.files && inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ importData(JSON.parse(r.result)); }catch(e){ toast(t('badFile')); } inp.value=''; }; r.readAsText(f); }
// ── Sprache ──────────────────────────────────────
function setLang(l){ try{ localStorage.setItem('statiq-lang', l); }catch(e){} location.reload(); }
function applyLang(){ try{ kmodApply(); }catch(e){} document.documentElement.lang=LANG; document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent=t(e.dataset.t); });
  const s=document.getElementById('lang-sel'); if(s) s.value=LANG; document.title=M('proj')+' — kragr'; }
document.getElementById('ver').textContent='v'+PROJ_VERSION;
applyLang(); render();
window.addEventListener('storage', render); window.addEventListener('focus', ()=>{ if(!document.querySelector('.bl-name input')) render(); });
</script>

    es:['Herramienta de aprendizaje para estudiantes — no sustituye un cálculo estructural revisado. Valores según las normas citadas, sin garantía.','Aviso legal · Privacidad · Exención']};
  window.statiqDisclaimer=()=>{ const l=(document.documentElement.lang||'de').slice(0,2); return (TX[l]||TX.de)[0]; };

    d.innerHTML='<span>'+t[0]+'</span><a href="rechtliches.html" style="color:inherit">'+t[1]+'</a>'; };

  if(typeof MutationObserver!=='undefined') new MutationObserver(upd).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
})();

// Offline-Nutzung und Installation als App (Service Worker, nur über http/https)
if(typeof navigator!=='undefined' && navigator.serviceWorker && typeof location!=='undefined' && /^https?:$/.test(location.protocol||'')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
